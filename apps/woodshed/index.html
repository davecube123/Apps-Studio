<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#12100e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Woodshed">
  <meta name="description" content="A practice recorder for guitar and voice: record takes, see your level, count in with a metronome, read your lyrics and chords, tune up, and listen back slowly.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Woodshed</title>
  <style>
    :root {
      --bg: #12100e; --card: #1c1916; --card2: #25211d; --ink: #f2ebe1; --ink2: #c4b8a8; --muted: #8a7f72;
      --line: rgba(255,240,220,.08); --line2: rgba(255,240,220,.15);
      --rec: #ef4b4b; --rec-soft: rgba(239,75,75,.14); --amber: #f2b45a; --amber-soft: rgba(242,180,90,.13); --green: #86cf8f;
      --r: 20px; --spring: cubic-bezier(.2,.9,.25,1.15); --ease: cubic-bezier(.2,.7,.2,1);
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); }
    body { margin: 0; min-height: 100vh; color: var(--ink); font: 16px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip;
           background: radial-gradient(110% 50% at 50% -8%, rgba(242,180,90,.08), transparent 60%) no-repeat, var(--bg); }
    main { max-width: 600px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 112px); }
    a { color: inherit; }
    h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.02em; }
    h1 { font-size: 30px; line-height: 1.1; } h2 { font-size: 22px; } h3 { font-size: 17px; }
    p { margin: .4em 0; }
    .muted { color: var(--muted); } .small { font-size: 13.5px; } .num { font-variant-numeric: tabular-nums; }
    .eyebrow { font: 700 11px/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
    .btn { appearance: none; border: 1px solid var(--line2); background: var(--card2); color: var(--ink); border-radius: 999px; min-height: 42px; padding: 9px 16px;
           font: 600 14.5px var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
           transition: transform .25s var(--spring), background .2s; }
    .btn:active { transform: scale(.95); transition-duration: .08s; }
    .btn.sm { min-height: 34px; padding: 6px 13px; font-size: 13px; }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--ink2); }
    .btn.amber { background: var(--amber); color: #1d1408; border-color: transparent; }
    .btn.on { background: var(--amber-soft); color: var(--amber); border-color: rgba(242,180,90,.35); }
    .btn.danger { color: var(--rec); }
    .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .seg { display: inline-flex; background: rgba(255,255,255,.05); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
    .seg button { border: 0; background: transparent; color: var(--ink2); border-radius: 999px; padding: 7px 13px; font: 600 13px var(--sans); cursor: pointer; }
    .seg button.on { background: var(--card2); color: var(--ink); box-shadow: 0 0 0 1px var(--line2); }
    input[type=text], input[type=number], textarea { width: 100%; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 12px; color: var(--ink);
           font: 16px var(--sans); padding: 10px 12px; outline: 0; }
    input:focus, textarea:focus { border-color: rgba(242,180,90,.45); }
    textarea.chords { font: 15px/1.5 var(--mono); min-height: 260px; resize: vertical; white-space: pre; overflow-x: auto; }
    label.f { display: block; } label.f > span { display: block; font: 600 12px var(--sans); color: var(--muted); margin: 0 0 5px 2px; letter-spacing: .04em; }
    .view.enter > * { animation: rise .4s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* Record */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .songchip { display: inline-flex; align-items: center; gap: 8px; max-width: 70%; background: var(--card); border: 1px solid var(--line2); border-radius: 999px;
                padding: 8px 14px 8px 12px; color: var(--ink); font: 600 14.5px var(--sans); cursor: pointer; }
    .songchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .songchip svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--amber); stroke-width: 2; }
    .today { text-align: right; font: 600 12.5px var(--sans); color: var(--muted); }
    .today b { display: block; color: var(--ink); font-size: 17px; font-variant-numeric: tabular-nums; }
    .stage { position: relative; margin-top: 16px; padding: 18px 16px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 26px; overflow: hidden; }
    .stage.recording { border-color: rgba(239,75,75,.4); box-shadow: 0 0 0 4px var(--rec-soft); }
    .timer { font: 300 58px/1 var(--sans); letter-spacing: -.03em; text-align: center; font-variant-numeric: tabular-nums; }
    .timer small { font-size: 26px; color: var(--muted); }
    .state { text-align: center; font: 700 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 6px; height: 14px; }
    .state.rec { color: var(--rec); } .state.rec::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); margin-right: 7px; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    #wave { display: block; width: 100%; height: 92px; margin-top: 12px; }
    .meter { position: relative; height: 8px; border-radius: 6px; background: rgba(255,255,255,.06); overflow: hidden; margin-top: 10px; }
    .meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #6fbf7a 0%, #6fbf7a 62%, var(--amber) 80%, var(--rec) 96%); background-size: 100% 100%; }
    .meter .fillmask { position: absolute; inset: 0; background: linear-gradient(90deg, #6fbf7a 0%, #a9c968 60%, var(--amber) 80%, var(--rec) 97%); clip-path: inset(0 100% 0 0); transition: clip-path .05s linear; }
    .meter .pk { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); left: 0; opacity: .8; }
    .meter .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,.5); }
    .lvl { display: flex; justify-content: space-between; font: 600 11.5px var(--sans); color: var(--muted); margin-top: 6px; min-height: 16px; }
    .lvl .warn { color: var(--rec); } .lvl .ok { color: var(--green); }
    .micgate { text-align: center; padding: 20px 6px 8px; }
    .countdown { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(18,16,14,.86); font: 200 110px/1 var(--sans); color: var(--amber); animation: fade .2s both; }
    .countdown small { display: block; font: 700 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); text-align: center; margin-top: 10px; }
    .ctrls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 22px 0 6px; }
    .ctrls > :first-child { justify-self: start; } .ctrls > :last-child { justify-self: end; }
    .recbtn { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--ink); background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0;
              transition: transform .25s var(--spring); }
    .recbtn:active { transform: scale(.92); }
    .recbtn i { display: block; width: 62px; height: 62px; border-radius: 50%; background: var(--rec); transition: all .3s var(--spring); }
    .recbtn.stop i { width: 30px; height: 30px; border-radius: 7px; }
    .side { display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: 0; color: var(--ink2); font: 600 11.5px var(--sans); cursor: pointer; min-width: 74px; }
    .side .ic { width: 50px; height: 50px; border-radius: 50%; background: var(--card); border: 1px solid var(--line2); display: grid; place-items: center; }
    .side.on .ic { background: var(--amber-soft); border-color: rgba(242,180,90,.4); color: var(--amber); }
    .side svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
    .chip { border: 1px solid var(--line2); background: transparent; color: var(--ink2); border-radius: 999px; padding: 7px 12px; font: 600 12.5px var(--sans); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
    .chip b { color: var(--ink); font-weight: 700; } a.chip, a.side { text-decoration: none; }
    .dots { display: flex; gap: 6px; justify-content: center; height: 8px; margin-top: 10px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.12); transition: background .05s; }
    .dots i.hit { background: var(--amber); } .dots i.hit.acc { background: var(--rec); }
    .review { margin-top: 18px; display: flex; gap: 12px; align-items: center; animation: rise .35s var(--spring) both; }
    .lyrics { margin-top: 18px; }
    .lyrics pre { margin: 10px 0 0; white-space: pre-wrap; font: calc(15px * var(--lz, 1))/1.55 var(--mono); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; overflow-wrap: anywhere; }
    .lyrics pre .ch { color: var(--amber); font-weight: 700; }

    /* Takes */
    .stats { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: end; }
    .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 70px; }
    .bars div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .bars i { width: 100%; max-width: 26px; border-radius: 5px; background: var(--amber); min-height: 3px; opacity: .85; }
    .bars i.zero { background: rgba(255,255,255,.08); }
    .bars span { font: 700 10px var(--sans); color: var(--muted); }
    .bars div.today span { color: var(--amber); }
    .big { font: 300 34px/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .day { margin: 22px 2px 6px; }
    .take { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 10px 6px 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
    .take .pb { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line2); background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
    .take .pb svg { width: 18px; height: 18px; fill: currentColor; }
    .take .pb.playing { background: var(--amber); color: #1d1408; border-color: transparent; }
    .take .nm { font: 600 15.5px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .take .meta { font: 500 12.5px var(--sans); color: var(--muted); display: flex; gap: 8px; align-items: center; }
    .take canvas { display: block; width: 100%; height: 26px; margin-top: 4px; }
    .stars { color: var(--amber); letter-spacing: 1px; font-size: 12px; }
    .empty { text-align: center; padding: 50px 16px; color: var(--muted); }

    /* Player */
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); text-decoration: none; font: 500 15px var(--sans); margin: -4px 0 14px -4px;
            padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
    .pwave { position: relative; margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 14px 12px 10px; }
    #pw { display: block; width: 100%; height: 120px; touch-action: none; cursor: pointer; }
    .ptime { display: flex; justify-content: space-between; font: 600 12.5px var(--sans); color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
    .pctrls { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 18px 0 8px; }
    .play { width: 76px; height: 76px; border-radius: 50%; background: var(--ink); color: var(--bg); border: 0; display: grid; place-items: center; cursor: pointer; transition: transform .25s var(--spring); }
    .play:active { transform: scale(.92); }
    .play svg { width: 30px; height: 30px; fill: currentColor; }
    .skip { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line2); background: var(--card); color: var(--ink); font: 700 13px var(--sans); cursor: pointer; }
    .srow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
    .starbtns button { background: none; border: 0; font-size: 26px; color: rgba(255,255,255,.18); cursor: pointer; padding: 0 2px; }
    .starbtns button.on { color: var(--amber); }

    /* Tools */
    .tuner { text-align: center; padding: 22px 16px 18px; }
    .note { font: 300 96px/1 var(--sans); letter-spacing: -.04em; }
    .note sub { font-size: 28px; color: var(--muted); vertical-align: baseline; margin-left: 2px; }
    .note.in { color: var(--green); }
    .gauge { position: relative; height: 54px; margin: 16px 6px 4px; }
    .gauge .scale { position: absolute; left: 0; right: 0; top: 26px; height: 1px; background: var(--line2); }
    .gauge .mid { position: absolute; left: 50%; top: 8px; height: 38px; width: 2px; margin-left: -1px; background: var(--green); opacity: .7; border-radius: 2px; }
    .gauge .tk { position: absolute; top: 20px; height: 13px; width: 1px; background: var(--line2); }
    .gauge .needle { position: absolute; top: 4px; left: 50%; width: 4px; height: 46px; margin-left: -2px; border-radius: 3px; background: var(--amber); transition: left .12s linear, background .2s; }
    .gauge .needle.in { background: var(--green); }
    .cents { font: 600 14px var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; min-height: 20px; }
    .strings { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 16px; }
    .strings button { border: 1px solid var(--line2); background: var(--card2); color: var(--ink2); border-radius: 12px; padding: 9px 0 7px; font: 700 15px var(--sans); cursor: pointer; }
    .strings button small { display: block; font: 600 10px var(--sans); color: var(--muted); }
    .strings button.near { border-color: rgba(134,207,143,.6); color: var(--green); }
    .bpm { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 10px 0; }
    .bpm .v { font: 300 64px/1 var(--sans); font-variant-numeric: tabular-nums; min-width: 120px; text-align: center; }
    .bpm .v small { display: block; font: 700 11px var(--sans); letter-spacing: .14em; color: var(--muted); margin-top: 4px; }
    .round { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line2); background: var(--card2); color: var(--ink); font: 400 26px var(--sans); cursor: pointer; }
    input[type=range] { width: 100%; accent-color: var(--amber); }
    .sec { margin-top: 26px; }
    .sec > .eyebrow { margin: 0 2px 10px; }

    nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 20; width: min(420px, calc(100% - 24px));
               padding: 6px; border-radius: 28px; background: rgba(36,32,28,.82); backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6);
               border: 1px solid var(--line2); box-shadow: 0 16px 40px rgba(0,0,0,.5); display: flex; }
    nav.tabs a { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; border-radius: 22px; color: var(--muted);
                 font: 600 10.5px var(--sans); padding: 7px 0 6px; }
    nav.tabs a svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    nav.tabs a.on { color: var(--ink); background: rgba(255,255,255,.07); }
    nav.tabs a.live::after { content: ""; position: absolute; top: 6px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--rec); animation: blink 1s steps(2) infinite; }
    .toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: 90vw; text-align: center; bottom: calc(env(safe-area-inset-bottom) + 96px);
             background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 18px; font: 600 14px var(--sans); z-index: 60; animation: rise .3s var(--spring) both; }
    .update { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; top: calc(env(safe-area-inset-top) + 12px); z-index: 55; border: 0; cursor: pointer;
              background: var(--amber); color: #1d1408; padding: 11px 20px; border-radius: 999px; font: 700 14px var(--sans); }
    .sheet-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s both; }
    .sheet { width: min(520px, 100%); background: var(--card); border-radius: 26px 26px 0 0; padding: 12px 20px calc(env(safe-area-inset-bottom) + 18px); max-height: 85vh; overflow-y: auto;
             animation: up .4s var(--spring) both; border-top: 1px solid var(--line2); }
    .sheet .grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line2); margin: 0 auto 16px; }
    @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
    .pick { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
            color: var(--ink); padding: 14px 4px; font: 600 16px var(--sans); cursor: pointer; }
    .pick small { color: var(--muted); font-weight: 500; font-size: 12.5px; }
    .pick.on { color: var(--amber); }
    .steps { margin: 0 0 8px; padding: 0; list-style: none; counter-reset: s; }
    .steps li { counter-increment: s; display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 8px; background: var(--amber-soft); color: var(--amber); font: 700 12.5px/24px var(--sans); text-align: center; }
    .focus { margin-top: 18px; }
    .focus label { display: block; font: 700 11px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 2px 6px; }
    .focusline { margin: 10px 2px 0; font-size: 14px; color: var(--ink2); } .focusline b { color: var(--amber); font-weight: 600; }
    .starbtns.sm button { font-size: 19px; }
    .fbgrid { display: grid; gap: 10px; }
    .fbc { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 13px 16px 12px; }
    .fbsub { font: 600 12px var(--sans); color: var(--muted); text-align: right; }
    .fbbig { font: 300 30px/1.1 var(--sans); letter-spacing: -.02em; margin-top: 4px; }
    .fbbig.good { color: var(--green); }
    .fbtip { margin: 6px 0 0; font-size: 14.5px; line-height: 1.45; color: var(--ink2); }
    .keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .keys button { border: 1px solid var(--line2); background: var(--card2); color: var(--ink2); border-radius: 12px; padding: 9px 0; font: 700 14px var(--sans); cursor: pointer; }
    .keys button.on { background: var(--amber-soft); color: var(--amber); border-color: rgba(242,180,90,.45); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <a href="#/" data-tab="rec"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>Record</a>
    <a href="#/takes" data-tab="takes"><svg viewBox="0 0 24 24"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"/></svg>Takes</a>
    <a href="#/songs" data-tab="songs"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Songs</a>
    <a href="#/tools" data-tab="tools"><svg viewBox="0 0 24 24"><path d="M12 3v9M8 21l4-9 4 9M6 21h12"/><path d="M15 7l3-2"/></svg>Tune</a>
  </nav>
  <script>
  "use strict";
  const APP_VERSION = "2", APP_DATE = "8 Nov 2026";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const DAY = 864e5;
  const haptic = (p = 8) => { try { navigator.vibrate?.(p); } catch (e) {} };

  /* Takes */

    const secs = days.map(d => TAKES.filter(t => dayKey(t.at) === dayKey(d)).reduce((a, t) => a + t.dur, 0)), mx = Math.max(60, ...secs);

  }
  const dayLabel = t => { const k = dayKey(t); if (k === dayKey(Date.now())) return "Today"; if (k === dayKey(Date.now() - DAY)) return "Yesterday"; return new Date(t).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" }); };

  /* Quick play from a list */
  const quick = { id: null, a: null, url: null, prog: -1 };

  function quickStop() { if (quick.a) { quick.a.pause(); URL.revokeObjectURL(quick.url); } const old = quick.id; quick.id = null; quick.a = null; quick.prog = -1; if (old) { const c = document.querySelector(`canvas[data-mini="${old}"]`), t = take(old); if (c && t) drawTake(c, t); } syncQuick(); }

  async function loadAudio(t) {
    const rec = await idb.get("blobs", t.id); if (!rec) return null;
    const url = URL.createObjectURL(rec.blob), a = new Audio(url); a.preload = "auto"; a.preservesPitch = true;

  async function mountPlayer(id) {
    const t = take(id); P.t = P.ta = t; P.A = P.B = null; P.b = null; P.side = "a";
    const m = await loadAudio(t); if (P.t !== t) { if (m) URL.revokeObjectURL(m.url); return; } if (!m) { toast("This recording is missing"); return; }

    cv.addEventListener("pointermove", e => { if (P.drag) seekTo(e); });

    const tick = () => { if (!P.a) return; P.raf = requestAnimationFrame(tick);

      <div class="sec"><div class="eyebrow">Drone · sing against it</div><div class="card">

        <div class="row between wrap" style="margin-top:12px;gap:8px"><div class="seg">${[[1, "Low"], [2, "Mid"]].map(([v, l]) => `<button class="${S.droneOct === v ? "on" : ""}" data-act="doct" data-v="${v}">${l}</button>`).join("")}</div>
          <div class="seg"><button class="${!S.droneFifth ? "on" : ""}" data-act="dfifth" data-v="0">Root</button><button class="${S.droneFifth ? "on" : ""}" data-act="dfifth" data-v="1">Root + fifth</button></div></div>
        <button class="btn block ${drone.on ? "on" : "amber"}" data-act="drone" id="dronebtn" style="width:100%;margin-top:14px;min-height:50px">${drone.on ? "Stop the drone" : `Start the drone · ${NOTES[S.droneKey]}`}</button>
        <div class="srow" style="margin-top:12px"><span>Drone volume</span><input type="range" id="dvol" min="0.1" max="1" step="0.05" value="${S.droneVol}" style="width:46%"></div>
        <p class="small muted">Choose the song’s key. Hold a long note on the root and listen: when you’re out of tune you hear a slow wobble (beating); when it stops, you’re there. Then sing the scale up and down, slowly, against it.</p></div></div>
      <div class="sec"><div class="eyebrow">Metronome</div><div class="card">
        <div class="bpm"><button class="round" data-act="bpm" data-v="-1">−</button><div class="v num" id="bpmv">${S.bpm}<small>BPM</small></div><button class="round" data-act="bpm" data-v="1">+</button></div>
        <input type="range" id="bpmr" min="30" max="240" value="${S.bpm}" aria-label="Tempo">
        ${dotsHTML()}
        <div class="row between" style="margin-top:14px"><div class="seg">${[2, 3, 4, 6].map(b => `<button class="${S.beats === b ? "on" : ""}" data-act="beats" data-v="${b}">${b}/4</button>`).join("")}</div>
          <button class="btn sm" data-act="tap">Tap</button></div>
        <button class="btn block amber" data-act="metro" style="width:100%;margin-top:14px;min-height:50px"><span id="metrobig">${metro.on ? "Stop" : "Start"}</span></button>
        <div class="srow" style="margin-top:12px"><span>Click volume</span><input type="range" id="cvol" min="0.05" max="1" step="0.05" value="${S.clickVol}" style="width:46%"></div>
        <p class="small muted">With headphones the click stays out of your recording. Through the speaker, the microphone will hear it.</p></div></div>
      <div class="sec"><div class="eyebrow">Recording</div><div class="card">
        <div class="srow" style="border:0;padding-top:0"><span>Input boost</span><div class="seg">${[0, 6, 12].map(v => `<button class="${S.boost === v ? "on" : ""}" data-act="boost" data-v="${v}">${v ? `+${v} dB` : "Off"}</button>`).join("")}</div></div>
        <div class="srow"><span>Microphone<br><span class="small muted">${S.voice ? "Phone’s voice clean-up on" : "Raw: best for guitar"}</span></span><div class="seg"><button class="${!S.voice ? "on" : ""}" data-act="voice" data-v="0">Music</button><button class="${S.voice ? "on" : ""}" data-act="voice" data-v="1">Voice</button></div></div>
        <div class="srow"><span>Tuning reference</span><div class="row" style="gap:6px"><button class="round" style="width:36px;height:36px;font-size:18px" data-act="a4" data-v="-1">−</button><span class="num" id="a4v">A = ${S.a4} Hz</span><button class="round" style="width:36px;height:36px;font-size:18px" data-act="a4" data-v="1">+</button></div></div>
        <div class="srow"><span>Storage</span><span class="small muted" id="storage">…</span></div>
        ${isStandalone() ? "" : `<div class="srow"><span>Install on this phone</span><button class="btn sm" data-act="installsheet">Install</button></div>`}
      </div></div>
      <p class="small muted" style="text-align:center;margin-top:24px">Woodshed · version ${APP_VERSION} · ${APP_DATE}<br>Your recordings stay on this phone.</p>`;
  }
  async function showStorage() { const el = $("#storage"); if (!el) return; const bytes = TAKES.reduce((a, t) => a + (t.size || 0), 0); let txt = `${TAKES.length} takes · ${(bytes / 1048576).toFixed(1)} MB`;
    try { const p = await navigator.storage?.persisted?.(); if (p) txt += " · kept safe"; } catch (e) {} el.textContent = txt; }

  /* ---------- Install prompt ---------- */
  let deferredInstall = null;
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(navigator.userAgent);
  const SNOOZE = "woodshed-install-snooze";
  const snoozed = () => { try { return Date.now() < +(localStorage.getItem(SNOOZE) || 0); } catch (e) { return false; } };
  function installBody() {
    if (deferredInstall) return `<button class="btn amber block" data-act="install" style="width:100%;min-height:52px">Install Woodshed</button>`;
    if (isIOS) return `<ol class="steps"><li><span>Tap <b>Share</b> in Safari’s toolbar.</span></li><li><span>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</span></li></ol>`;
    if (isAndroid) return `<ol class="steps"><li><span>Tap the <b>⋮</b> menu at the top right of Chrome.</span></li><li><span>Tap <b>Install app</b> (or <b>Add to Home screen</b>).</span></li></ol><p class="small muted">Opened inside another app? Open this page in Chrome first.</p>`;
    return `<ol class="steps"><li><span>Click the <b>install</b> icon in the address bar,</span></li><li><span>or choose <b>Install Woodshed</b> in the browser menu.</span></li></ol>`;
  }
  function showInstall(force) {
    if (isStandalone() || $(".sheet-back") || recState !== "idle" || (!force && snoozed())) return;
    const back = document.createElement("div"); back.className = "sheet-back";
    back.innerHTML = `<div class="sheet"><div class="grab"></div>
      <div class="row" style="gap:16px"><img src="icons/icon-192.png" alt="" width="62" height="62" style="border-radius:15px">
        <div><div class="eyebrow">Free · works offline</div><h2>Keep Woodshed handy</h2></div></div>
      <p class="muted" style="margin:14px 0 16px">Open it from your home screen like any app, full screen, with your takes saved on the phone.</p>
      <div id="sheet-body">${installBody()}</div><button class="btn ghost" data-act="installlater" style="width:100%;margin-top:6px">Not now</button></div>`;
    back.addEventListener("click", e => { if (e.target === back) closeInstall(true); });
    document.body.appendChild(back);
  }
  function closeInstall(later) { $(".sheet-back")?.remove(); if (later) try { localStorage.setItem(SNOOZE, String(Date.now() + 3 * DAY)); } catch (e) {} }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; const b = $("#sheet-body"); if (b) b.innerHTML = installBody(); });
  addEventListener("appinstalled", () => { deferredInstall = null; closeInstall(false); toast("Installed. Open it from your home screen."); });

  /* ---------- Actions ---------- */
  let micAllowed = false, navCount = 0;
  addEventListener("hashchange", () => { navCount++; });
  document.addEventListener("click", async e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const a = el.dataset.act, d = el.dataset;
    if (el.tagName === "BUTTON") { e.preventDefault(); haptic(6); }
    ensureAC();
    if (a === "mic") { if (await openMic()) { micAllowed = true; clearTimeout(levelT); levelT = setTimeout(() => { if (recState === "idle" && !tunerOn) closeMic(true); }, 30000); } }
    else if (a === "rec") startRec();
    else if (a === "stop") stopRec();
    else if (a === "pause") pauseRec();
    else if (a === "cancelcount") cancelCount();
    else if (a === "mark") { if (recState === "rec") { marks.push(elapsed()); haptic([6, 30, 6]); toast(`Marked at ${fmt(elapsed())}`, 1200); } }
    else if (a === "metro") { metro.on ? metro.stop() : metro.start(); refreshCtrls(); }
    else if (a === "countin") { S.countIn = (S.countIn + 1) % 3; saveS(); el.innerHTML = `Count-in <b>${["off", "1 bar", "2 bars"][S.countIn]}</b>`; }
    else if (a === "clickduring") { S.clickDuring = !S.clickDuring; saveS(); el.innerHTML = `Click in take <b>${S.clickDuring ? "on" : "off"}</b>`; if (S.clickDuring) toast("Use headphones, or the microphone will hear the click", 3200); }
    else if (a === "lyrics") { S.lyrics = !S.lyrics; saveS(); render(); }
    else if (a === "lz") { S.lz = Math.max(.8, Math.min(1.6, +(S.lz + .1 * +d.v).toFixed(1))); saveS(); const l = $(".lyrics"); if (l) l.style.setProperty("--lz", S.lz); }
    else if (a === "pick") songPicker();
    else if (a === "choose") chooseSong(d.id);
    else if (a === "newsong") newSong();
    else if (a === "practise") chooseSong(d.id);
    else if (a === "qplay") { e.stopPropagation(); quickPlay(d.id); }
    else if (a === "back") { if (navCount > 0) history.back(); else location.hash = "#/takes"; }
    else if (a === "pmode") { P.mode = d.v; document.querySelectorAll("#pmode button").forEach(b => b.classList.toggle("on", b === el)); drawP(); }
    else if (a === "cmp") cmpPicker();
    else if (a === "cmpset") setCompare(d.id);
    else if (a === "ab") switchSide(d.v);
    else if (a === "cmpoff") cmpOff();
    else if (a === "rstar") { const t = take(d.id); if (!t) return; t.stars = t.stars === +d.v ? 0 : +d.v; putTake(t); el.parentElement.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i < t.stars)); }
    else if (a === "drone") { drone.on ? drone.stop() : drone.start(); }
    else if (a === "dkey") { S.droneKey = +d.v; saveS(); el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); if (drone.on) drone.start(); else syncDrone(); }
    else if (a === "doct") { S.droneOct = +d.v; saveS(); el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); if (drone.on) drone.start(); }
    else if (a === "dfifth") { S.droneFifth = d.v === "1"; saveS(); el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); if (drone.on) drone.start(); }
    else if (a === "pplay") { if (!P.a) return; P.a.paused ? P.a.play().catch(() => {}) : P.a.pause(); }
    else if (a === "seekby") { if (P.a) P.a.currentTime = Math.max(0, Math.min(P.ta.dur, P.a.currentTime + +d.v)); }
    else if (a === "tomark") { if (P.a) { P.a.currentTime = Math.max(0, +d.v - 2); if (P.a.paused) P.a.play().catch(() => {}); } }
    else if (a === "speed") { if (P.a) { P.a.playbackRate = +d.v; P.a.preservesPitch = true; } el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); }
    else if (a === "loop") { if (!P.a) return; const c = P.a.currentTime; if (P.A == null) P.A = c; else if (P.B == null) { if (c <= P.A + .3) { toast("Play on a little, then set the end"); return; } P.B = c; P.a.currentTime = P.A; if (P.a.paused) P.a.play().catch(() => {}); } syncLoop(); }
    else if (a === "loopclear") { P.A = P.B = null; syncLoop(); }
    else if (a === "star") { const t = P.t; if (!t) return; t.stars = t.stars === +d.v ? 0 : +d.v; putTake(t); el.parentElement.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i < t.stars)); }
    else if (a === "share") { if (P.t) shareTake(P.t); }
    else if (a === "tosong") { if (P.t) takeSongPicker(P.t); }
    else if (a === "settake") { const t = take(d.t); if (t) { t.songId = d.id || null; putTake(t); } $(".sheet-back")?.remove(); render(); }
    else if (a === "deltake") { const t = P.t; if (!t || !confirm(`Delete “${t.name}”?`)) return; TAKES = TAKES.filter(x => x.id !== t.id); await idb.del("takes", t.id); await idb.del("blobs", t.id); if (lastTakeId === t.id) lastTakeId = null; history.length > 1 && navCount ? history.back() : (location.hash = "#/takes"); }
    else if (a === "delsong") { const s = song(d.id); if (!s || !confirm(`Delete “${s.title}”? Its takes are kept as free practice.`)) return; SONGS = SONGS.filter(x => x.id !== s.id); await idb.del("songs", s.id);
      for (const t of TAKES.filter(t => t.songId === s.id)) { t.songId = null; putTake(t); } if (S.curSong === s.id) { S.curSong = null; saveS(); } location.hash = "#/songs"; }
    else if (a === "tuner") { if (tunerOn) stopTuner(); else { await startTuner(); if (mic) micAllowed = true; } }
    else if (a === "ref") refTone(+d.v);
    else if (a === "bpm") setBpm(S.bpm + +d.v);
    else if (a === "tap") tapTempo();
    else if (a === "beats") { S.beats = +d.v; saveS(); render(); }
    else if (a === "boost") { S.boost = +d.v; saveS(); if (gainN) gainN.gain.setTargetAtTime(dbGain(S.boost), AC.currentTime, .05); el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); }
    else if (a === "voice") { S.voice = d.v === "1"; saveS(); if (mic && recState === "idle") { const t = tunerOn; closeMic(true); tunerOn = false; await openMic(); if (t) startTuner(); } render(); }
    else if (a === "a4") { S.a4 = Math.max(415, Math.min(466, S.a4 + +d.v)); saveS(); $("#a4v").textContent = `A = ${S.a4} Hz`; }
    else if (a === "installsheet") showInstall(true);
    else if (a === "installlater") closeInstall(true);
    else if (a === "install" && deferredInstall) { const ev = deferredInstall; deferredInstall = null; ev.prompt(); ev.userChoice.then(() => closeInstall(false)).catch(() => {}); }
  });
  function takeSongPicker(t) {
    const back = document.createElement("div"); back.className = "sheet-back";
    back.innerHTML = `<div class="sheet"><div class="grab"></div><h2 style="margin-bottom:6px">Which song?</h2>
      <button class="pick${!t.songId ? " on" : ""}" data-act="settake" data-t="${t.id}" data-id="">Free practice</button>
      ${SONGS.map(s => `<button class="pick${t.songId === s.id ? " on" : ""}" data-act="settake" data-t="${t.id}" data-id="${s.id}">${esc(s.title)}</button>`).join("")}</div>`;
    back.addEventListener("click", e => { if (e.target === back) back.remove(); });
    document.body.appendChild(back);
  }
  let saveT;
  document.addEventListener("input", e => {
    const el = e.target;
    if (el.id === "tname" && P.t) { P.t.name = el.value.trim() || P.t.name; clearTimeout(saveT); saveT = setTimeout(() => putTake(P.t), 400); }
    if (el.id === "tnote" && P.t) { P.t.note = el.value; clearTimeout(saveT); saveT = setTimeout(() => putTake(P.t), 400); }
    if (el.dataset.f) { const s = song(route()[1]); if (!s) return; s[el.dataset.f] = el.dataset.f === "bpm" ? (el.value ? Math.max(30, Math.min(260, +el.value)) : "") : el.value; s.touched = Date.now(); clearTimeout(saveT); saveT = setTimeout(() => putSong(s), 400); }
    if (el.id === "bpmr") setBpm(+el.value);
    if (el.id === "cvol") { S.clickVol = +el.value; saveS(); }
    if (el.id === "dvol") { S.droneVol = +el.value; saveS(); if (drone.g) drone.g.gain.setTargetAtTime(S.droneVol, AC.currentTime, .1); }
    if (el.id === "focus") { const s = song(S.curSong); if (s) { s.focus = el.value; clearTimeout(saveT); saveT = setTimeout(() => putSong(s), 400); } else { S.focus = el.value; saveS(); } }
  });
  addEventListener("keydown", e => { if (e.target.closest?.("input,textarea")) return; if (e.code === "Space" && route()[0] === "rec") { e.preventDefault(); recState === "idle" ? startRec() : recState === "count" ? cancelCount() : stopRec(); } });
  addEventListener("beforeunload", e => { if (recState === "rec" || recState === "paused") { e.preventDefault(); e.returnValue = ""; } });

  /* ---------- Start ---------- */
  (async () => {
    try { [TAKES, SONGS] = await Promise.all([idb.all("takes"), idb.all("songs")]); } catch (e) { toast("Couldn’t open your saved takes"); }
    try { const p = await navigator.permissions?.query({ name: "microphone" }); micAllowed = p?.state === "granted"; p && (p.onchange = () => { micAllowed = p.state === "granted"; }); } catch (e) {}
    render(); loop(); showStorage();
    addEventListener("hashchange", showStorage);
    setTimeout(() => showInstall(false), 20000);
  })();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!had || $(".update") || recState !== "idle") return; const u = document.createElement("button"); u.className = "update"; u.textContent = "A new version is ready · Reload"; u.onclick = () => location.reload(); document.body.appendChild(u); });
  }
  window.__ws = { S, get mic() { return !!mic; }, analyse, feedback, get TAKES() { return TAKES; }, get SONGS() { return SONGS; }, get recState() { return recState; }, detectPitch, metro };
  </script>
</body>
