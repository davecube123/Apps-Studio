<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunzi</title>
<meta name="description" content="Sunzi's Art of War in an original rendering, with tales from history and legend and what each principle means for daily living.">
<meta name="theme-color" content="#ece2c6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sunzi">
<style>
  @font-face { font-family: "Cinzel"; src: url(fonts/cinzel-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url(fonts/cormorant-garamond-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url(fonts/cormorant-garamond-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url(fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  /* Colours chosen for contrast: body text ≥ 10:1, secondary text ≥ 5.5:1 on the page and card backgrounds. */
  :root { --bg: #ece2c6; --card: #f7f0dc; --ink: #24180c; --ink2: #3f2f1c; --muted: #5e4a30; --line: rgba(70, 45, 15, .16);
    --seal: #9a2318; --seal-ink: #fff4e6; --accent-bg: #f1e3cf; --shadow: 0 6px 20px rgba(70, 45, 10, .12);
    --serif: "Cormorant", Georgia, serif; --caps: "Cinzel", Georgia, serif; --size: 21px; color-scheme: light; }
  :root[data-theme="night"] { --bg: #15100c; --card: #1f1813; --ink: #f2e6cc; --ink2: #dccbab; --muted: #bba887; --line: rgba(240, 215, 170, .14);
    --seal: #e0614f; --seal-ink: #1a0c08; --accent-bg: #2a1a14; --shadow: 0 6px 20px rgba(0, 0, 0, .4); color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 var(--size)/1.6 var(--serif); min-height: 100vh; }
  a { color: inherit; text-decoration: none; } button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  main { max-width: 660px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 64px) 20px calc(env(safe-area-inset-bottom) + 96px); }
  .bar { position: fixed; z-index: 20; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 10px) 12px 8px; display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-bottom: 1px solid var(--line); }
  .brand { font: 700 16px var(--caps); letter-spacing: .3em; padding-left: .3em; }
  .ib { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); }
  .ib svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font: 700 28px/1.2 var(--caps); letter-spacing: .02em; margin: 6px 0 4px; }
  h2 { font: 700 15px var(--caps); letter-spacing: .14em; text-transform: uppercase; color: var(--seal); margin: 28px 0 10px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); } .sub { color: var(--ink2); font-size: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px 18px; margin-top: 12px; }
  .seal { flex: none; width: 54px; height: 54px; border-radius: 8px; background: var(--seal); color: var(--seal-ink); display: grid; place-items: center; font: 700 19px var(--caps); }

  /* chapter list */
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .n { font: 700 15px var(--caps); color: var(--seal); width: 38px; flex: none; text-align: center; }
  .row b { font: 600 20px/1.25 var(--serif); display: block; } .row .meta { font-size: 15px; color: var(--muted); }
  .chev { margin-left: auto; color: var(--muted); font-size: 22px; }

  /* verses */
  .verse { padding: 20px 0 18px; border-top: 1px solid var(--line); }
  .verse:first-child { border-top: 0; }
  .vn { font: 700 11px var(--caps); letter-spacing: .14em; color: var(--muted); margin-bottom: 6px; }
  .en { font-size: var(--size); line-height: 1.62; color: var(--ink); }
  .en .ln { display: block; padding-left: 1.1em; text-indent: -1.1em; }
  .living { margin-top: 12px; padding: 12px 14px; border-left: 3px solid var(--seal); background: var(--accent-bg); border-radius: 0 8px 8px 0; font-size: 18px; line-height: 1.5; color: var(--ink2); }
  .living b { display: block; font: 700 11px var(--caps); letter-spacing: .14em; color: var(--seal); margin-bottom: 3px; }
  .tlink { display: flex; gap: 8px; align-items: baseline; margin-top: 10px; font: 600 17px var(--serif); color: var(--seal); }
  .navch { display: flex; gap: 10px; margin-top: 22px; }
  .btn { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font: 600 16px var(--serif); padding: 11px 14px; border-radius: 999px; border: 1px solid var(--ink2); color: var(--ink); }
  .btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* tales */
  .story p { font-size: var(--size); line-height: 1.68; margin: 0 0 14px; color: var(--ink); }
  .story { padding: 18px 18px 6px; }
  details.teach { margin-top: 14px; } details.teach summary { cursor: pointer; list-style: none; font: 600 18px var(--serif); color: var(--seal); padding: 14px 0; }
  details.teach summary::-webkit-details-marker { display: none; }
  details.teach .lesson { font: italic 21px/1.45 var(--serif); color: var(--ink); margin: 0 0 14px; }

  nav.tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 40px; padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); background: var(--bg); border-top: 1px solid var(--line); }
  nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 16px; font: 600 13px system-ui, sans-serif; color: var(--muted); }
  nav.tabs a.on { color: var(--seal); }
  nav.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .back { position: fixed; inset: 0; z-index: 60; background: rgba(20, 10, 4, .5); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: min(600px, 100%); background: var(--card); color: var(--ink); border-radius: 18px 18px 0 0; padding: 22px 18px calc(env(safe-area-inset-bottom) + 18px); }
  .sheet h3 { font: 700 13px var(--caps); letter-spacing: .14em; color: var(--seal); margin: 16px 0 8px; text-transform: uppercase; }
  .seg { display: flex; gap: 6px; } .seg button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 17px; } .seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  input[type=range] { width: 100%; accent-color: var(--seal); }
  ol.isteps { padding-left: 22px; margin: 6px 0; } ol.isteps li { margin: 7px 0; font-size: 18px; }
  .ic { display: inline-block; width: 20px; height: 20px; vertical-align: -4px; fill: none; stroke: var(--seal); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .dots3 { display: inline-block; padding: 0 6px; border-radius: 999px; background: var(--line); font: 600 11px/20px sans-serif; letter-spacing: 1px; }
  .ver { text-align: center; color: var(--muted); font: 700 11px var(--caps); letter-spacing: .14em; margin-top: 22px; }
</style>
</head>
<body>
<header class="bar">
  <a class="ib" href="#/" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/></svg></a>
  <div class="brand">Sunzi</div>
  <button class="ib" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</header>
<main id="app"></main>
<nav class="tabs">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Chapters</a>
  <a href="#/tales" data-tab="tales"><svg viewBox="0 0 24 24"><path d="M4 6c3-1.5 5.5-1.5 8 0v13c-2.5-1.5-5-1.5-8 0z"/><path d="M12 6c2.5-1.5 5-1.5 8 0v13c-3-1.5-5.5-1.5-8 0"/></svg>Tales</a>
</nav>
<script>
(() => {
  "use strict";
  const VER = "6";
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  /* the rendition never shows Chinese characters (a few slipped into the English as glosses) */
  const clean = s => String(s ?? "").replace(/[㐀-鿿豈-﫿　-〿（），：；！？]+/g, "").replace(/\(\s*\)/g, "").replace(/ {2,}/g, " ").replace(/ ([,.;:])/g, "$1");
  const tx = s => esc(clean(s));
  const lines = s => tx(s).split("\n").map(l => `<span class="ln">${l || "&nbsp;"}</span>`).join("");
  const KEY = "sunzi";
  let S; try { S = Object.assign({ last: 1, theme: "", size: 0 }, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { S = { last: 1, theme: "", size: 0 }; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
  const ROM = [[10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]], roman = n => { let r = ""; for (const [v, x] of ROM) while (n >= v) { r += x; n -= v; } return r; };
  let D = null, T = [];
  const ch = n => D.chapters.find(c => c.n === n);
  const talesFor = id => T.filter(t => t.verses.includes(id));

  function viewHome() {
    const last = ch(S.last) || D.chapters[0];
    return `<h1>The Art of War</h1><p class="sub">Sunzi, rendered for daily living, with tales from history and legend.</p>
      <a class="card" href="#/c/${last.n}" style="display:flex;gap:14px;align-items:center;padding:14px 18px"><div class="seal">${roman(last.n)}</div><div><div class="muted" style="font-size:15px">Continue reading</div><b style="font:600 20px var(--serif)">${tx(last.title_en)}</b></div></a>
      <h2>The thirteen chapters</h2>
      <div class="card">${D.chapters.map(c => `<a class="row" href="#/c/${c.n}"><span class="n">${roman(c.n)}</span><div><b>${tx(c.title_en)}</b><div class="meta">${c.verses.length} verses · ${T.filter(t => t.ch === c.n).length} tales</div></div><span class="chev">›</span></a>`).join("")}</div>
      <div class="ver">Sunzi v${VER}</div>`;
  }
  function viewChapter(n) {
    const c = ch(n); if (!c) return viewHome(); S.last = n; save();
    const chTales = T.filter(t => t.ch === n);
    return `<div style="display:flex;gap:16px;align-items:center;margin-top:4px"><div class="seal">${roman(n)}</div><div><div class="muted" style="font-size:15px">Chapter ${n} of 13</div><h1 style="margin:0">${tx(c.title_en)}</h1></div></div>
      <div class="card">${c.verses.map((v, i) => { const id = `${n}.${i + 1}`;
        return `<div class="verse" id="v${id}"><div class="vn">${roman(n)} · ${i + 1}</div><div class="en">${lines(v.en)}</div>
          <div class="living"><b>For daily living</b>${tx(v.living)}</div>
          ${talesFor(id).map(t => `<a class="tlink" href="#/tale/${t.id}"><span>📖</span><span>${tx(t.title)}</span></a>`).join("")}</div>`; }).join("")}</div>
      ${chTales.length ? `<h2>Tales for this chapter</h2><div class="card">${chTales.map(t => `<a class="row" href="#/tale/${t.id}"><div><b>${tx(t.title)}</b><div class="meta">${tx(t.source)}</div></div><span class="chev">›</span></a>`).join("")}</div>` : ""}
      <div class="navch">${ch(n - 1) ? `<a class="btn" href="#/c/${n - 1}">‹ ${roman(n - 1)}</a>` : ""}${ch(n + 1) ? `<a class="btn solid" href="#/c/${n + 1}">Chapter ${roman(n + 1)} ›</a>` : ""}</div>`;
  }
  function viewTales() {
    return `<h1>Tales</h1><p class="sub">${T.length} stories, five for each chapter. Read the tale, then see what it teaches.</p>
      ${D.chapters.map(c => { const ts = T.filter(t => t.ch === c.n); return ts.length ? `<h2>${roman(c.n)} · ${tx(c.title_en)}</h2><div class="card" style="margin-top:0">${ts.map(t => `<a class="row" href="#/tale/${t.id}"><div><b>${tx(t.title)}</b><div class="meta">${tx(t.source)}</div></div><span class="chev">›</span></a>`).join("")}</div>` : ""; }).join("")}`;
  }
  function viewTale(id) {
    const t = T.find(x => x.id === id); if (!t) return viewTales(); const c = ch(t.ch);
    const same = T.filter(x => x.ch === t.ch), i = same.indexOf(t), nx = same[i + 1] || T[(T.indexOf(t) + 1) % T.length];
    return `<a href="#/c/${c.n}" class="muted" style="font-size:16px">‹ Chapter ${roman(c.n)}: ${tx(c.title_en)}</a>
      <h1 style="margin-top:10px">${tx(t.title)}</h1><div class="muted" style="font-size:16px">${tx(t.source)}</div>
      <div class="card story">${clean(t.tale).split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join("")}</div>
      <details class="teach"><summary>What it teaches ›</summary><p class="lesson">${tx(t.lesson)}</p><div class="living"><b>For your life</b>${tx(t.living)}</div></details>
      <div class="navch"><a class="btn" href="#/c/${c.n}">Read chapter ${roman(c.n)}</a><a class="btn solid" href="#/tale/${nx.id}">Next tale ›</a></div>`;
  }

  function route() { const h = location.hash.replace(/^#\/?/, "").split("/"); return { v: h[0] || "home", a: h[1] || "" }; }
  function render() { if (!D) return; const { v, a } = route();
    $("#app").innerHTML = ({ home: viewHome, c: () => viewChapter(+a), tales: viewTales, tale: () => viewTale(a) }[v] || viewHome)();
    $$("nav.tabs a").forEach(x => x.classList.toggle("on", x.dataset.tab === (v === "tale" || v === "tales" ? "tales" : "home"))); }
  addEventListener("hashchange", () => { close(); render(); scrollTo(0, 0); });

  function sheet(html) { close(); const b = document.createElement("div"); b.className = "back"; b.innerHTML = `<div class="sheet">${html}</div>`; b.addEventListener("click", e => { if (e.target === b) b.remove(); }); document.body.appendChild(b); }
  function close() { $$(".back").forEach(b => b.remove()); }
  function settingsSheet() {
    const th = document.documentElement.dataset.theme;
    sheet(`<h3>Look</h3><div class="seg"><button class="${th === "day" ? "on" : ""}" data-act="theme" data-v="day">Day</button><button class="${th === "night" ? "on" : ""}" data-act="theme" data-v="night">Night</button></div>
      <h3>Text size</h3><input type="range" id="size" min="17" max="28" value="${S.size || 21}">
      ${isStandalone() ? "" : `<h3>App</h3><button class="btn" data-act="install" style="width:100%">Install Sunzi</button>`}
      <div class="ver">Sunzi v${VER}</div>`);
    $("#size").addEventListener("input", e => { S.size = +e.target.value; document.documentElement.style.setProperty("--size", S.size + "px"); save(); });
  }

  /* install prompt */
  let deferred = null; const UA = navigator.userAgent, isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(UA), isAndroid = /android/i.test(UA), inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Twitter|LinkedInApp|TikTok|musical_ly|Snapchat|Pinterest|GSA\//i.test(UA), iosBrowser = /CriOS/.test(UA) ? "Chrome" : /EdgiOS/.test(UA) ? "Edge" : /FxiOS/.test(UA) ? "Firefox" : "";
  const IC = { share: `<svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>`, add: `<svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>`, more: `<span class="dots3">•••</span>` };
  const installBody = () => deferred ? `<button class="btn solid" data-act="doinstall" style="width:100%">Install Sunzi</button>`
    : inApp ? `<p style="font-size:18px">You're inside another app's browser, which can't install apps. Tap ${IC.more} or the menu and choose <b>Open in ${isIOS ? "Safari" : "browser"}</b>.</p>`
    : isIOS && iosBrowser ? `<ol class="isteps"><li>Tap <b>Share</b> ${IC.share} in ${iosBrowser}'s address bar.</li><li>Tap <b>Add to Home Screen</b> ${IC.add}.</li><li>Tap <b>Add</b>.</li></ol>`
    : isIOS ? `<ol class="isteps"><li>Tap <b>Share</b> ${IC.share} at the bottom of Safari (on newer iPhones, tap ${IC.more} first).</li><li>Tap <b>Add to Home Screen</b> ${IC.add}.</li><li>Tap <b>Add</b>.</li></ol>`
    : isAndroid ? `<ol class="isteps"><li>Tap the <b>⋮</b> menu in Chrome.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>`
    : `<ol class="isteps"><li>Use the install icon in the address bar, or the browser menu's <b>Install</b>.</li></ol>`;
  function showInstall(force) { if (isStandalone() || (!force && $(".back"))) return; if (!force) { try { if (Date.now() - (+localStorage.getItem("sunzi-install-snooze") || 0) < 5 * 864e5) return; } catch {} }
    sheet(`<div style="display:flex;gap:14px;align-items:center"><img src="icons/icon-192.png" width="56" height="56" style="border-radius:12px" alt=""><div><b style="font:600 21px var(--serif)">Install Sunzi</b><div class="muted" style="font-size:16px">Read offline, one tap away.</div></div></div><div id="ib" style="margin-top:12px">${installBody()}</div><button class="btn" data-act="notnow" style="width:100%;margin-top:8px;border:0">Not now</button>`); }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; const b = $("#ib"); if (b) b.innerHTML = installBody(); });

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act, v = el.dataset.v;
    if (a === "settings") settingsSheet();
    else if (a === "theme") { S.theme = v; save(); applyTheme(); settingsSheet(); }
    else if (a === "install") showInstall(true);
    else if (a === "notnow") { try { localStorage.setItem("sunzi-install-snooze", Date.now()); } catch {} close(); }
    else if (a === "doinstall" && deferred) { const ev = deferred; deferred = null; ev.prompt(); ev.userChoice.finally(close); }
  });
  addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  function applyTheme() { const th = S.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day"); document.documentElement.dataset.theme = th; $("meta[name=theme-color]").content = th === "night" ? "#15100c" : "#ece2c6"; }
  applyTheme(); if (S.size) document.documentElement.style.setProperty("--size", S.size + "px");
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  Promise.all([fetch("data/sunzi.json").then(r => r.json()), fetch("data/tales.json").then(r => r.json()).catch(() => ({ tales: [] }))])
    .then(([d, t]) => { D = d; T = t.tales || []; render(); setTimeout(() => showInstall(false), 5000); })
    .catch(() => { $("#app").innerHTML = `<p style="margin-top:40vh;text-align:center">Couldn't load the text. Check your connection and reload.</p>`; });
})();
</script>
</body>
</html>
