<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tao Reader</title>
<meta name="description" content="The Tao Te Ching, chapter by chapter: the Chinese original, Richard Wilhelm, and your own copies of Feng & English, Ch'u Ta-Kao, Le Guin, Heider and Bynner. Offline.">
<meta name="theme-color" content="#efe6d2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tao">
<style>
  @font-face { font-family: "Cinzel"; src: url(fonts/cinzel-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Cinzel"; src: url(fonts/cinzel-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url(fonts/cormorant-garamond-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url(fonts/cormorant-garamond-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url(fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "WenKai"; src: url(fonts/wenkai-tao.woff2) format("woff2"); font-display: swap; }

  :root {
    --bg: #ece2cc; --paper: #f5eedd; --ink: #2b241c; --ink2: #554a3d; --muted: #8a7d69; --line: rgba(70, 50, 25, .16);
    --seal: #a3322a; --seal-ink: #fbefe4; --gold: #96773a; --shadow: 0 10px 30px rgba(70, 45, 15, .12);
    --serif: "Cormorant", "Iowan Old Style", Georgia, serif; --caps: "Cinzel", "Trajan Pro", Georgia, serif; --brush: "WenKai", "Kaiti TC", "STKaiti", "KaiTi", serif;
    --size: 21px;
    color-scheme: light;
  }
  :root[data-theme="night"] { --bg: #13100c; --paper: #1b1712; --ink: #eadfc6; --ink2: #c3b598; --muted: #8b7f69; --line: rgba(230, 210, 170, .14); --seal: #bf463b; --seal-ink: #fff2e6; --gold: #c9a96a; --shadow: 0 10px 30px rgba(0, 0, 0, .4); color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 400 var(--size)/1.55 var(--serif); -webkit-font-smoothing: antialiased; }
  /* aged paper: fibres + a soft vignette */
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
    background: radial-gradient(120% 90% at 50% 30%, transparent 55%, rgba(90, 60, 20, .16)),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .1  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  :root[data-theme="night"] body::before { opacity: .35; background: radial-gradient(120% 90% at 50% 30%, transparent 50%, rgba(0, 0, 0, .5)), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .9  0 0 0 0 .8  0 0 0 0 .6  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  main { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 64px) 20px calc(env(safe-area-inset-bottom) + 110px); }

  /* top bar */
  .bar { position: fixed; z-index: 20; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(var(--bg) 60%, transparent); }
  .ib { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); }
  .ib svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ib:active { background: var(--line); }
  .brand { font: 22px var(--brush); letter-spacing: .3em; color: var(--ink); padding-left: .3em; }

  /* chapter head */
  .head { display: flex; align-items: center; gap: 18px; margin: 8px 0 6px; }
  .seal { flex: none; width: 58px; min-height: 58px; padding: 6px 4px; background: var(--seal); color: var(--seal-ink); border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font: 19px/1.08 var(--brush); writing-mode: vertical-rl; text-orientation: upright; letter-spacing: .02em; box-shadow: inset 0 0 0 3px rgba(255, 240, 225, .25), inset 0 0 12px rgba(80, 0, 0, .35); transform: rotate(-2deg); }
  .numeral { font: 700 54px/1 var(--caps); letter-spacing: .04em; color: var(--ink); }
  .opening { font: 22px var(--brush); color: var(--seal); letter-spacing: .12em; margin-top: 6px; }
  .rule { height: 12px; margin: 14px 0 16px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='340' height='12'><path d='M0 6h150M190 6h150' stroke='%2396773a' stroke-width='.8'/><circle cx='170' cy='6' r='4.5' fill='none' stroke='%2396773a' stroke-width='.9'/><circle cx='170' cy='6' r='1.4' fill='%2396773a'/></svg>") center/contain no-repeat; opacity: .8; }

  /* translation tabs */
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 2px 20px 8px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; font: 600 15px var(--serif); letter-spacing: .02em; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink2); background: color-mix(in srgb, var(--paper) 70%, transparent); }
  .tab.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tab.empty { opacity: .55; font-style: italic; } .tab.empty::before { content: "+ "; }

  /* the text */
  .leaf { position: relative; background: var(--paper); border-radius: 4px; padding: 26px 24px 22px; box-shadow: var(--shadow); border: 1px solid var(--line); margin-top: 6px; }
  .leaf::before, .leaf::after { content: ""; position: absolute; left: 10px; right: 10px; height: 1px; background: var(--line); }
  .leaf::before { top: 8px; } .leaf::after { bottom: 8px; }
  .verse { white-space: pre-wrap; font-size: var(--size); line-height: 1.62; }
  .verse .ln { display: block; padding-left: 1.1em; text-indent: -1.1em; }
  .who { font: 500 12px var(--caps); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 0 0 12px; }
  .ctitle { font: italic 400 1.05em var(--serif); color: var(--ink2); margin: -4px 0 10px; }
  .note { font-size: 15px; color: var(--muted); font-style: italic; margin-top: 14px; }
  .missing { text-align: center; padding: 10px 4px; }
  .missing p { font-size: 18px; color: var(--ink2); margin: 0 0 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 16px var(--serif); padding: 11px 20px; border-radius: 999px; border: 1px solid var(--ink); color: var(--ink); background: transparent; }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn.seal { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
  .btn.block { display: flex; width: 100%; } .btn.sm { padding: 7px 14px; font-size: 15px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* original Chinese, written top to bottom, right to left */
  .orig { margin-top: 18px; }
  .orig summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--ink2); font: 600 16px var(--serif); }
  .orig summary::-webkit-details-marker { display: none; }
  .orig summary b { font: 20px var(--brush); color: var(--seal); letter-spacing: .1em; }
  .vert { margin-top: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 18px 14px; overflow-x: auto; direction: rtl; }
  .vert .cols { direction: ltr; writing-mode: vertical-rl; font: 26px/1.9 var(--brush); letter-spacing: .14em; height: min(64vh, 520px); color: var(--ink); margin-left: auto;
    background-image: linear-gradient(to left, var(--line) 1px, transparent 1px); background-size: 1.9em 100%; }
  .vert .cols span { display: block; }

  /* compare */
  .cmp .leaf { margin-top: 14px; }

  /* bottom nav */
  .nav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); display: flex; align-items: center; gap: 10px; justify-content: space-between;
    background: linear-gradient(transparent, var(--bg) 40%); }
  .nav .go { font: 700 16px var(--caps); letter-spacing: .06em; color: var(--ink2); padding: 10px 12px; min-width: 92px; }
  .nav .go:disabled { opacity: .25; }
  .nav .mid { flex: 1; display: flex; gap: 6px; justify-content: center; }
  .pill { font: 600 14px var(--serif); padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink2); }
  .pill.on { background: var(--seal); color: var(--seal-ink); border-color: var(--seal); }
  .progress { position: fixed; z-index: 21; left: 0; top: 0; height: 2px; background: var(--seal); transition: width .3s; }

  /* sheets */
  .back { position: fixed; inset: 0; z-index: 50; background: rgba(20, 12, 4, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
  .sheet { position: relative; width: min(620px, 100%); max-height: 90vh; overflow-y: auto; background: var(--paper); color: var(--ink); border-radius: 18px 18px 0 0; padding: 22px 20px calc(env(safe-area-inset-bottom) + 20px); animation: up .25s cubic-bezier(.2, .9, .3, 1); }
  .sheet h2 { font: 700 22px var(--caps); letter-spacing: .06em; margin: 0 0 4px; }
  .sheet .sub { color: var(--muted); font-size: 16px; margin: 0 0 14px; }
  .sheet h3 { font: 600 13px var(--caps); letter-spacing: .14em; color: var(--gold); margin: 18px 0 8px; text-transform: uppercase; }
  @keyframes fade { from { opacity: 0; } } @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
  .cell { border: 1px solid var(--line); border-radius: 6px; padding: 8px 2px 6px; text-align: center; position: relative; background: var(--bg); }
  .cell b { display: block; font: 700 13.5px var(--caps); letter-spacing: .02em; }
  .cell span { font: 13px var(--brush); color: var(--muted); }
  .cell.cur { background: var(--ink); color: var(--paper); } .cell.cur span { color: var(--paper); opacity: .7; }
  .cell.read::after { content: ""; position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--seal); }
  .slot { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .slot:first-of-type { border-top: 0; }
  .slot .t { flex: 1; min-width: 0; } .slot .t b { display: block; font-size: 18px; } .slot .t span { font-size: 14.5px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; } .dot.on { background: var(--seal); border-color: var(--seal); }
  .seg { display: flex; gap: 6px; } .seg button { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--line); font-size: 16px; } .seg button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  input[type=range] { width: 100%; accent-color: var(--seal); }
  textarea { width: 100%; min-height: 160px; font: 16px/1.4 var(--serif); padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .found { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 16px; }
  .found .pv { font-style: italic; color: var(--ink2); white-space: pre-wrap; font-size: 15px; margin-top: 6px; }
  .small { font-size: 15px; } .muted { color: var(--muted); }
  ol.steps { padding-left: 22px; margin: 6px 0; } ol.steps li { margin: 7px 0; font-size: 17px; }
  .ic { display: inline-block; width: 20px; height: 20px; vertical-align: -4px; fill: none; stroke: var(--seal); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .dots3 { display: inline-block; padding: 0 6px; border-radius: 999px; background: var(--line); font: 600 11px/20px sans-serif; letter-spacing: 1px; }

  /* draw a verse */
  .card { text-align: center; padding: 30px 22px 24px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); position: relative; }
  .card .seal { position: absolute; top: -16px; right: 18px; width: 42px; min-height: 42px; font-size: 14px; }
  .card .v { font: italic 400 23px/1.5 var(--serif); white-space: pre-wrap; }
  .card .src { font: 500 12px var(--caps); letter-spacing: .14em; color: var(--gold); margin-top: 14px; }
  .toast { position: fixed; z-index: 80; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 86px); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 16px; max-width: 90vw; text-align: center; }
  .ver { text-align: center; color: var(--muted); font: 500 12px var(--caps); letter-spacing: .14em; margin-top: 22px; }
  .page { animation: page .35s ease both; } @keyframes page { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="bar">
  <button class="ib" data-act="toc" aria-label="Contents"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
  <div class="brand">道德經</div>
  <div class="row" style="gap:2px">
    <button class="ib" data-act="draw" aria-label="Draw a verse"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a4.25 4.25 0 0 1 0 8.5 4.25 4.25 0 0 0 0 8.5"/><circle cx="12" cy="7.8" r="1"/><circle cx="12" cy="16.2" r="1"/></svg></button>
    <button class="ib" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
</header>
<main id="app"></main>
<nav class="nav">
  <button class="go" id="prev" data-act="prev" aria-label="Previous chapter">‹ I</button>
  <div class="mid"><button class="pill" id="cmpBtn" data-act="compare">對照 Compare</button><button class="pill" id="sayBtn" data-act="say" aria-label="Read aloud">♪</button></div>
  <button class="go" id="next" data-act="next" aria-label="Next chapter" style="text-align:right">II ›</button>
</nav>
<script>
(() => {
  "use strict";
  const VER = "5";
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toast = (m, ms = 2400) => { $$(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms); };
  const prefs = { get(k, d) { try { const v = localStorage.getItem("tao:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("tao:" + k, JSON.stringify(v)); } catch {} } };

  /* ---------- numerals ---------- */
  const ROM = [[50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
  const roman = n => { let s = ""; for (const [v, r] of ROM) while (n >= v) { s += r; n -= v; } return s; };
  const fromRoman = s => { s = s.toUpperCase(); const V = { I: 1, V: 5, X: 10, L: 50, C: 100 }; let t = 0; for (let i = 0; i < s.length; i++) { const a = V[s[i]], b = V[s[i + 1]] || 0; if (!a) return 0; t += a < b ? -a : a; } return t; };
  const ZD = "〇一二三四五六七八九";
  const zhNum = n => n <= 10 ? (n === 10 ? "十" : ZD[n]) : n < 20 ? "十" + ZD[n % 10] : ZD[Math.floor(n / 10)] + "十" + (n % 10 ? ZD[n % 10] : "");

  /* ---------- storage for your own copies (IndexedDB, on this device only) ---------- */
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open("tao-reader", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const dbGet = async k => { try { const d = await idb(); return await new Promise(r => { const q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(undefined); }); } catch { return undefined; } };
  const dbSet = async (k, v) => { try { const d = await idb(); await new Promise(r => { const t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = r; t.onerror = r; }); } catch {} };
  const dbDel = async k => { try { const d = await idb(); await new Promise(r => { const t = d.transaction("kv", "readwrite"); t.objectStore("kv").delete(k); t.oncomplete = r; t.onerror = r; }); } catch {} };

  /* ---------- translations ---------- */
  const TR = [
    { id: "wilhelm", name: "Wilhelm", full: "Richard Wilhelm, 1911", note: "An English rendering of Wilhelm's German, made for this app.", lang: "en", builtin: "en" },
    { id: "wilhelm-de", name: "Wilhelm · Deutsch", full: "Richard Wilhelm, Laotse: Tao te king, 1911", lang: "de", builtin: "de" },
    { id: "feng", name: "Feng & English", full: "Gia-Fu Feng & Jane English, 1972", lang: "en" },
    { id: "chu", name: "Ch'u Ta-Kao", full: "Ch'u Ta-Kao, 1937", lang: "en" },
    { id: "leguin", name: "Le Guin", full: "Ursula K. Le Guin, 1997, a rendition", lang: "en" },
    { id: "heider", name: "Heider", full: "John Heider, The Tao of Leadership, 1985", lang: "en" },
    { id: "bynner", name: "Bynner", full: "Witter Bynner, The Way of Life, 1944", lang: "en" },
  ];
  const trOf = id => TR.find(t => t.id === id);
  let BOOK = null; const OWN = {}; /* id -> { file, chapters: {n: {t, text}} } */
  const has = id => { const t = trOf(id); return t.builtin ? !!BOOK : !!OWN[id]; };
  const textOf = (id, n) => { const t = trOf(id); if (t.builtin) { const c = BOOK.chapters[n - 1]; return { text: t.builtin === "de" ? c.de : c.en }; } const c = OWN[id] && OWN[id].chapters[n]; return c ? { text: c.text, title: c.t } : null; };

  let n = Math.min(81, Math.max(1, prefs.get("n", 1))), cur = prefs.get("tr", "wilhelm"), compare = prefs.get("compare", false), showZh = prefs.get("zh", true);
  const read = new Set(prefs.get("read", []));
  if (!trOf(cur)) cur = "wilhelm";

  /* ---------- reading view ---------- */
  const lines = s => esc(s).split("\n").map(l => l.trim() ? `<span class="ln">${l}</span>` : `<span class="ln">&nbsp;</span>`).join("");
  const opening = zh => zh.split(/[、，。；：！？,.]/)[0].slice(0, 6);
  function leafFor(id, withWho) {
    const t = trOf(id), x = has(id) ? textOf(id, n) : null;
    if (!has(id)) return `<div class="leaf missing"><div class="who">${esc(t.full)}</div><p>Add your own copy of ${esc(t.name)} and it appears here, chapter by chapter. It stays on this phone.</p><button class="btn seal" data-act="import" data-v="${id}">Add my copy</button></div>`;
    if (!x) return `<div class="leaf missing"><div class="who">${esc(t.full)}</div><p>Chapter ${roman(n)} wasn't found in your copy.</p><button class="btn sm" data-act="import" data-v="${id}">Re-import</button></div>`;
    return `<div class="leaf">${withWho ? `<div class="who">${esc(t.name)}</div>` : ""}${x.title ? `<div class="ctitle">${esc(x.title)}</div>` : ""}<div class="verse" lang="${t.lang}">${lines(x.text)}</div>${!withWho ? `<div class="note">${esc(t.full)}${t.note ? `. ${esc(t.note)}` : ""}</div>` : ""}</div>`;
  }
  function render(animate = true) {
    if (!BOOK) return; const c = BOOK.chapters[n - 1];
    const tabs = TR.map(t => `<button class="tab${t.id === cur && !compare ? " on" : ""}${has(t.id) ? "" : " empty"}" data-act="tr" data-v="${t.id}">${esc(t.name)}</button>`).join("");
    const body = compare ? `<div class="cmp">${TR.filter(t => has(t.id)).map(t => leafFor(t.id, true)).join("")}${TR.some(t => !has(t.id)) ? `<p class="note" style="text-align:center">${TR.filter(t => !has(t.id)).length} more translations appear here once you add your copies (Settings → Library).</p>` : ""}</div>` : leafFor(cur, false);
    const zhCols = c.zh.split(/(?<=[。；！？])/).filter(Boolean).map(s => `<span>${esc(s)}</span>`).join("");
    $("#app").innerHTML = `<div class="${animate ? "page" : ""}">
      <div class="head"><div class="seal" aria-hidden="true">第${zhNum(n)}章</div><div><div class="numeral" aria-label="Chapter ${n}">${roman(n)}</div><div class="opening" lang="zh-Hant">${esc(opening(c.zh))}</div></div></div>

    BOOK = b; TR.filter(t => !t.builtin).forEach((t, i) => { if (own[i] && own[i].chapters) OWN[t.id] = own[i]; });
    /* carry over a book imported in the previous version (e.g. The Tao of Leadership) */
    const old = await dbGet("book"); if (old && old.chapters && old.chapters.length) { legacy = old;
      if (!OWN.heider && /leadership|heider/i.test(old.title || "")) { const ch = {}; old.chapters.forEach(c => { if (c.n >= 1 && c.n <= 81) ch[c.n] = { t: c.title || "", text: (c.paras || []).join("\n") }; }); OWN.heider = { file: old.title, chapters: ch, at: Date.now() }; await dbSet("own:heider", OWN.heider); } }
    if (!has(cur)) cur = "wilhelm";
    if (!BOOK) { $("#app").innerHTML = `<p style="text-align:center;margin-top:30vh">Couldn't load the text. Check your connection and reload.</p>`; return; }
    render(false);
    setTimeout(() => showInstall(false), 4000);
  })();
})();
</script>
</body>
</html>
