<html lang="en">
<head>

  <title>Daily Way</title>
  <style>
    @font-face { font-family: "Newsreader"; src: url(fonts/newsreader.woff2) format("woff2"); font-weight: 200 800; font-style: normal; font-display: swap; }
    @font-face { font-family: "Newsreader"; src: url(fonts/newsreader-italic.woff2) format("woff2"); font-weight: 200 800; font-style: italic; font-display: swap; }
    :root {
      --bg: #f2f2f7; --card: #ffffff; --card2: #f2f2f7; --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
      --sep: rgba(60,60,67,.18); --fill: rgba(120,120,128,.12); --tint: #1f8a70; --tint-soft: rgba(31,138,112,.12);
      --learn: #30b08f; --practice: #e2a528; --reflect: #5e5ce6;
      --ttc: #30b08f; --iching: #5e5ce6; --gf: #e2a528; --zz: #32ade6;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      --round: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
      --serif: "New York", ui-serif, "Newsreader", Georgia, serif;
      --cjk: "PingFang TC", "Noto Sans CJK TC", "Hiragino Sans", sans-serif;
      --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.3,1.3,.5,1);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.6); --fill: rgba(120,120,128,.24); --tint: #3cc49f; --tint-soft: rgba(60,196,159,.16); color-scheme: dark; } }
    :root[data-theme="dark"] {
      --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.6); --fill: rgba(120,120,128,.24); --tint: #3cc49f; --tint-soft: rgba(60,196,159,.16); color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--label); font: 17px/1.42 var(--sans); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
    main { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 108px); }
    a { color: var(--tint); text-decoration: none; }
    h1 { font: 700 34px/1.12 var(--sans); letter-spacing: .01em; margin: 6px 0 2px; }
    h2 { font: 700 22px/1.2 var(--sans); letter-spacing: .01em; margin: 0; }
    h3 { font: 600 17px/1.3 var(--sans); margin: 0; }
    p { margin: .35em 0; }
    .sub { color: var(--label2); }
    .fine { font-size: 13px; color: var(--label2); }
    .caps { font: 600 13px var(--sans); text-transform: uppercase; letter-spacing: .02em; color: var(--label2); }
    .serif { font-family: var(--serif); letter-spacing: 0; }
    .cjk { font-family: var(--cjk); }
    .row { display: flex; align-items: center; gap: 12px; }
    .between { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    .center { text-align: center; }
    .hide { display: none !important; }
    .stack > * + * { margin-top: 12px; }
    .view.enter > * { animation: rise .45s var(--ease) both; }
    .view.enter > *:nth-child(2) { animation-delay: 30ms; } .view.enter > *:nth-child(3) { animation-delay: 60ms; } .view.enter > *:nth-child(n+4) { animation-delay: 90ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* Navigation bar that condenses on scroll */
    #navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; padding: calc(env(safe-area-inset-top) + 11px) 16px 11px; text-align: center;
              font: 600 17px var(--sans); background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: saturate(1.8) blur(20px);
              -webkit-backdrop-filter: saturate(1.8) blur(20px); border-bottom: .5px solid var(--sep); opacity: 0; transition: opacity .2s; pointer-events: none; }
    #navbar.on { opacity: 1; }

    /* Grouped lists (iOS inset grouped) */
    .group { background: var(--card); border-radius: 12px; overflow: hidden; }
    .ghead { margin: 26px 16px 7px; }
    .gfoot { margin: 7px 16px 0; font-size: 13px; color: var(--label2); }
    .cell { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 16px; color: var(--label); position: relative; background: var(--card); width: 100%;
            border: 0; text-align: left; font: inherit; cursor: pointer; transition: background .15s; }
    .cell:active { background: var(--fill); }
    .cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); border-top: .5px solid var(--sep); }
    .cell.static { cursor: default; } .cell.static:active { background: var(--card); }
    .cell .chev { color: var(--label3); font-size: 20px; line-height: 1; }
    .cell .detail { color: var(--label2); }
    .icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
    .icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .check { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--label3); display: grid; place-items: center; flex: none; }
    .check.on { background: var(--tint); border-color: var(--tint); }
    .check.on::after { content: ""; width: 10px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

    /* Cards & controls */
    .card { background: var(--card); border-radius: 16px; padding: 18px; }
    .card.tap { display: block; color: inherit; cursor: pointer; transition: transform .25s var(--spring); }
    .card.tap:active { transform: scale(.98); }
    .btn { appearance: none; border: 0; border-radius: 14px; min-height: 50px; padding: 14px 20px; font: 600 17px var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
           background: var(--tint); color: #fff; transition: transform .2s var(--spring), opacity .2s; width: 100%; }
    .btn:active { transform: scale(.97); opacity: .9; }
    .btn.gray { background: var(--fill); color: var(--tint); }
    .btn.plain { background: none; color: var(--tint); min-height: 44px; padding: 10px; font-weight: 400; }
    .btn.sm { width: auto; min-height: 34px; padding: 7px 14px; font-size: 15px; border-radius: 999px; }
    .btn:disabled { opacity: .35; pointer-events: none; }
    .seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; }
    .seg button { flex: 1; border: 0; background: none; color: var(--label); font: 500 13px var(--sans); padding: 7px 4px; border-radius: 7px; cursor: pointer; }
    .seg button.on { background: var(--card); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); font-weight: 600; }
    .chip { border: 0; background: var(--fill); color: var(--label); border-radius: 999px; padding: 7px 13px; font: 500 15px var(--sans); cursor: pointer; transition: all .2s var(--ease); }
    .chip.on { background: var(--tint); color: #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    textarea, input[type=text], input[type=time], input[type=number], input[type=search], select {
      width: 100%; border: 0; outline: 0; background: transparent; color: var(--label); font: 17px/1.45 var(--sans); padding: 0; resize: none; }
    textarea.write { font: 19px/1.55 var(--serif); min-height: 52px; }
    textarea::placeholder, input::placeholder { color: var(--label3); }
    .field { background: var(--card); border-radius: 12px; padding: 12px 16px; }
    .field + .field { margin-top: 10px; }
    .field label { display: block; font: 600 13px var(--sans); color: var(--label2); margin-bottom: 4px; }
    .field:focus-within label { color: var(--tint); }
    .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 999px; padding: 4px 10px; font: 600 13px var(--sans); }

    /* Rings */
    .rings { position: relative; flex: none; }
    .rings svg { transform: rotate(-90deg); display: block; }
    .rings circle { fill: none; stroke-linecap: round; }
    .rings .pr { transition: stroke-dashoffset 1.2s var(--ease); }
    .legend .v { font: 600 20px var(--round); }
    .legend .v small { font: 500 13px var(--sans); color: var(--label2); }

    /* Tab bar */
    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding: 6px 8px calc(env(safe-area-inset-bottom) + 4px);
               background: color-mix(in srgb, var(--card) 80%, transparent); backdrop-filter: saturate(1.8) blur(20px); -webkit-backdrop-filter: saturate(1.8) blur(20px); border-top: .5px solid var(--sep); }
    nav.tabs .inner { display: flex; width: 100%; max-width: 520px; }
    nav.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--label2); font: 500 10px var(--sans); padding: 3px 0; }
    nav.tabs a svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    nav.tabs a.on { color: var(--tint); }
    body.immersive nav.tabs, body.immersive #navbar { display: none; }

    /* Session (full screen steps) */
    .shead { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .segs { flex: 1; display: flex; gap: 4px; }
    .segs i { flex: 1; height: 4px; border-radius: 4px; background: var(--fill); overflow: hidden; }
    .segs i.done { background: var(--tint); } .segs i.now { background: color-mix(in srgb, var(--tint) 45%, var(--fill)); }
    .xbtn { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--fill); color: var(--label2); font: 600 15px var(--sans); cursor: pointer; display: grid; place-items: center; flex: none; }
    .stitle { font: 700 30px/1.15 var(--sans); margin: 4px 0 6px; }
    .sfoot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 12px 16px calc(env(safe-area-inset-bottom) + 14px); background: linear-gradient(transparent, var(--bg) 28%); }
    .sfoot .inner { max-width: 608px; margin: 0 auto; display: grid; gap: 4px; }
    body.immersive main { padding-bottom: calc(env(safe-area-inset-bottom) + 150px); }
    .breath { width: 180px; height: 180px; margin: 30px auto; border-radius: 50%; position: relative; display: grid; place-items: center; }
    .breath::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--practice) 55%, transparent), color-mix(in srgb, var(--practice) 8%, transparent) 70%);
                      transform: scale(.55); animation: breathe 10s ease-in-out infinite; }
    .breath span { position: relative; font: 500 15px var(--sans); color: var(--label2); }
    @keyframes breathe { 0% { transform: scale(.55); } 40% { transform: scale(1); } 100% { transform: scale(.55); } }
    .timer { font: 300 64px/1 var(--round); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .quote { font: 400 21px/1.55 var(--serif); }
    .passage p { font: 400 19px/1.65 var(--serif); margin: 0 0 14px; white-space: pre-wrap; }
    .passage p.pick { cursor: pointer; border-radius: 8px; margin-left: -8px; margin-right: -8px; padding: 2px 8px; transition: background .2s; }
    .passage p.pick.on { background: var(--tint-soft); box-shadow: inset 3px 0 0 var(--tint); }
    .flash { min-height: 260px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    .grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .grade .btn { padding: 8px 4px; min-height: 56px; flex-direction: column; gap: 0; font-size: 15px; }
    .grade .btn small { font: 400 12px var(--sans); opacity: .8; }
    .hexfig { color: var(--label); }
    .heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; }
    .heat i { width: 100%; aspect-ratio: 1; border-radius: 3px; background: var(--fill); }
    .heat i.l1 { background: color-mix(in srgb, var(--tint) 35%, var(--fill)); } .heat i.l2 { background: color-mix(in srgb, var(--tint) 65%, var(--fill)); } .heat i.l3 { background: var(--tint); }
    .bar { height: 6px; border-radius: 6px; background: var(--fill); overflow: hidden; } .bar i { display: block; height: 100%; border-radius: 6px; }
    .badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font: 500 12px/1.25 var(--sans); }
    .badge .medal { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: var(--fill); filter: grayscale(1); opacity: .45; }
    .badge.got .medal { filter: none; opacity: 1; background: linear-gradient(145deg, color-mix(in srgb, var(--practice) 40%, var(--card)), color-mix(in srgb, var(--tint) 30%, var(--card))); box-shadow: 0 4px 14px rgba(0,0,0,.12); }
    .badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; }
    .units { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
    .units a { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; background: var(--fill); color: var(--label); font: 600 14px var(--round); }
    .units a.read { color: #fff; } .units a.next { box-shadow: inset 0 0 0 2px var(--tint); }
    .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translateX(-50%); background: color-mix(in srgb, var(--label) 88%, transparent); color: var(--bg);
             padding: 11px 18px; border-radius: 999px; font: 600 15px var(--sans); z-index: 60; animation: rise .3s var(--ease) both; white-space: nowrap; backdrop-filter: blur(10px); }
    .sheet-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; animation: fade .25s both; }
    .sheet { width: min(560px, 100%); background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px 16px calc(env(safe-area-inset-bottom) + 18px); max-height: 88vh; overflow: auto; animation: sheetup .4s var(--ease) both; }
    .sheet .grab { width: 36px; height: 5px; border-radius: 5px; background: var(--label3); margin: 0 auto 12px; }
    @keyframes sheetup { from { transform: translateY(100%); } to { transform: none; } }
    .update { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 10px); transform: translateX(-50%); z-index: 80; border: 0; background: var(--tint); color: #fff; padding: 10px 18px;
              border-radius: 999px; font: 600 15px var(--sans); box-shadow: 0 8px 24px rgba(0,0,0,.2); cursor: pointer; }
    .celebrate { text-align: center; padding-top: 30px; }
    .science dt { font: 600 17px var(--sans); margin-top: 18px; } .science dd { margin: 4px 0 0; color: var(--label2); } .science cite { display: block; font-style: normal; font-size: 13px; color: var(--label3); margin-top: 4px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div id="navbar" aria-hidden="true"></div>
  <main id="main"></main>
  <nav class="tabs" id="tabs"><div class="inner">
    <a href="#/" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Today</a>
    <a href="#/library" data-tab="library"><svg viewBox="0 0 24 24"><path d="M4 4.5h4v15H4zM10 4.5h4v15h-4zM16.2 5.2l3.8-1 3 14.6-3.8 1z" transform="translate(-1 0)"/></svg>Library</a>
    <a href="#/threads" data-tab="threads"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.3 8.2l2.6 7.6M15.7 8.2l-2.6 7.6M8.5 7h7"/></svg>Threads</a>

  <script>
  "use strict";
  /* =====================================================================
     Daily Way: a 20-minute daily practice towards mastery of the
     Tao Te Ching, the I Ching, The Secret of the Golden Flower and
     the Chuang Tzu, and towards living their shared teaching.
     Texts other than Legge's public-domain Tao Te Ching are your own
     editions: the app tells you where to read and keeps what you
     capture, privately, on this device.
     ===================================================================== */
  const APP_VERSION = "4", APP_DATE = "26 Oct 2026";
  const DAY = 864e5, $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today0 = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const dkey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const words = s => (String(s || "").trim().match(/\S+/g) || []).length;
  function toast(m) { document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
  const haptic = (ms = 8) => { if (navigator.vibrate && navigator.userActivation?.hasBeenActive) try { navigator.vibrate(ms); } catch (e) {} };

  /* ---------- The four books ---------- */
  const BOOKS0 = [
    { id: "ttc", title: "Tao Te Ching", author: "Lao Tzu", unit: "Chapter", units: 81, edition: "Legge (built in)", lenses: ["The Tao of Leadership (Heider)"], builtin: true },
    { id: "iching", title: "I Ching", author: "Book of Changes", unit: "Hexagram", units: 64, edition: "Wilhelm", lenses: ["Minford"] },
    { id: "gf", title: "The Secret of the Golden Flower", author: "Lü Dongbin (attrib.)", unit: "Chapter", units: 13, edition: "Cleary", lenses: ["Wilhelm"] },
    { id: "zz", title: "Chuang Tzu", author: "Zhuangzi", unit: "Chapter", units: 33, edition: "Burton Watson", lenses: [] },
  ];
  const BOOK_HINT = { gf: "Cleary's translation has 13 chapters; Wilhelm's has 8. The chapters don't line up, so with a lens you look for the matching passage.", zz: "The Complete Works has all 33 chapters (Inner Chapters 1–7). If yours is a selection, list its chapters, e.g. 1–7, 17–20; check them against your contents page.", iching: "64 hexagrams in every translation.", ttc: "81 chapters in every translation, so a lens always lines up." };
  const PRESETS = { gf: [["Cleary · 13 chapters", "1-13"], ["Wilhelm · 8 chapters", "1-8"]], zz: [["Complete Works · 1–33", "1-33"], ["Basic Writings · 1–7, 17–20", "1-7, 17-20"]] };
  // Chapter lists: a book can follow a selection (e.g. 1–7, 17–20) instead of 1…N.
  const seq = b => b.list?.length ? b.list : Array.from({ length: b.units }, (_, i) => i + 1);
  const total = b => seq(b).length;
  const nextUnit = (b, n) => { const s = seq(b), i = s.indexOf(n); return s[(i + 1) % s.length] ?? s[0]; };
  function parseList(t) { const out = new Set(); for (const part of String(t).split(/[,;]+/)) { const m = part.trim().match(/^(\d+)\s*(?:[-–—]\s*(\d+))?$/); if (!m) continue; const a = +m[1], z = +(m[2] || m[1]); for (let n = Math.min(a, z); n <= Math.max(a, z) && n <= 300; n++) out.add(n); } return [...out].sort((x, y) => x - y); }
  function fmtList(l) { const r = []; for (let i = 0; i < l.length; i++) { let j = i; while (j + 1 < l.length && l[j + 1] === l[j] + 1) j++; r.push(i === j ? `${l[i]}` : `${l[i]}–${l[j]}`); i = j; } return r.join(", "); }
  function setChapters(b, text) {
    const l = parseList(text); if (!l.length) return false;
    const contiguous = l[0] === 1 && l[l.length - 1] === l.length;
    b.list = contiguous ? null : l; b.units = contiguous ? l.length : l.length;
    if (!seq(b).includes(b.pos)) b.pos = seq(b).find(n => !b.read.includes(n)) ?? seq(b)[0];
    return true;
  }

  /* ---------- Threads: the ideas that run through all four ---------- */
  // Short descriptions are original to this app, to be replaced by your own understanding over time.
  const THREADS = [
    ["tao", "Tao 道", "The Way", "The nameless source and the course of all things; not a thing among things, but how things go."],
    ["de", "De 德", "Virtue, power", "The quiet potency that comes from being in accord with the Way: character as a natural force."],
    ["wuwei", "Wu wei 無為", "Non-forcing", "Acting without strain or contrivance, so that what needs doing gets done without being pushed."],

        <p class="fine" style="margin-top:10px">${esc(line.src)}</p>${line.mine ? `<p class="sub" style="margin-top:6px">In your words: ${esc(line.mine)}</p>` : ""}</div>` : ""}

      ${db.settings.why ? `<div class="ghead caps">Why I walk this path</div><div class="card"><p class="serif" style="font-size:18px;font-style:italic;margin:0">${esc(db.settings.why)}</p></div>` : ""}
      <p class="fine center" style="margin-top:28px">Daily Way · version ${APP_VERSION} · ${APP_DATE}</p>`;
  }

  /* ---------- Welcome (first run) ---------- */
  let welcomeStep = 0;
  function viewWelcome() {
    const pages = [
      `<div style="padding-top:8vh" class="center"><img src="icons/icon-192.png" width="96" height="96" style="border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.18)" alt="">
        <h1 style="margin-top:22px">Daily Way</h1><p class="sub" style="font-size:19px">Twenty minutes a day with the Tao Te Ching, the I Ching, the Golden Flower and the Chuang Tzu, until their one teaching becomes the way you live.</p></div>
       <div class="ghead caps">What should we call you?</div><div class="field"><input type="text" data-bind="settings.name" value="${esc(db.settings.name)}" placeholder="Your first name"></div>
       <div class="ghead caps">Why are you walking this path?</div><div class="field">${bound("settings.why", "In a sentence or two. You'll see it on hard days.", "write", 3)}</div>
       <p class="gfoot">Writing your own reason makes a goal yours, and people persist far longer with goals they own.</p>`,
      `<h1>Your books</h1><p class="sub">For each book, one <b>primary</b> translation you follow chapter by chapter, and <b>lenses</b>: the other translations you bring in to compare. Legge's Tao Te Ching is built in.</p>
       ${db.books.map((b, i) => `<div class="ghead caps row" style="gap:8px">${bookIcon(b, 22)} ${esc(b.title)}</div>${translationsEditor(b, i)}<p class="gfoot">${BOOK_HINT[b.id]}</p>`).join("")}`,
      `<h1>Your daily time</h1><p class="sub">The same time and place each day, anchored to something you already do, is how a practice becomes automatic.</p>
       <div class="ghead caps">When</div><div class="group">
         <div class="cell static"><span class="grow">Practice time</span><input type="time" data-bind="settings.time" value="${db.settings.time}" style="width:auto;color:var(--tint)"></div>
         <button class="cell" data-act="ics"><span class="grow" style="color:var(--tint)">Add a daily reminder to my calendar</span></button></div>
       <p class="gfoot">Tip: "After my morning tea, I open Daily Way."</p>
       <div class="ghead caps">Sitting practice</div><div class="seg">${[3, 4, 5, 8, 10].map(m => `<button class="${db.settings.sitMin === m ? "on" : ""}" data-act="sitmin" data-m="${m}">${m} min</button>`).join("")}</div>
       <p class="gfoot">Start small; you can lengthen it as the habit grows.</p>`,
    ];
    return `<div class="row between" style="margin-bottom:8px"><span class="fine">${welcomeStep + 1} of 3</span>${welcomeStep ? `<button class="btn plain sm" data-act="wback">Back</button>` : ""}</div>
      ${pages[welcomeStep]}
      <div style="margin-top:28px"><button class="btn" data-act="wnext">${welcomeStep < 2 ? "Continue" : "Begin"}</button></div>`;
  }

  /* ---------- Session steps ---------- */
  let sess = { picks: new Set(), recall: null, timer: null, connectSeed: 0 };
  function stopTimers() { if (sess.timer) { clearInterval(sess.timer); sess.timer = null; } releaseWake(); }
  function stepFrame(id, body, foot) {
    const i = STEPS.findIndex(s => s.id === id), d = day();
    return `<div class="shead"><a class="xbtn" href="#/" aria-label="Close">✕</a><div class="segs">${STEPS.map((s, j) => `<i class="${d.done[s.id] ? "done" : j === i ? "now" : ""}"></i>`).join("")}</div>
      ${i >= 0 && i < STEPS.length - 1 ? `<button class="btn plain sm" data-act="skip" data-s="${id}" style="padding:4px 2px">Skip</button>` : ""}</div>
      ${body}<div class="sfoot"><div class="inner">${foot}</div></div>`;
  }
  const nextOf = id => { const i = STEPS.findIndex(s => s.id === id); return i < STEPS.length - 1 ? "#/s/" + STEPS[i + 1].id : "#/s/done"; };
  function viewStep(id) {
    const f = { arrive: stArrive, recall: stRecall, read: stRead, capture: stCapture, connect: stConnect, sit: stSit, carry: stCarry, done: stDone, evening: stEvening, mini: stMini }[id];
    return f ? f() : (location.hash = "#/", null);
  }
  const eyebrow = (s, c) => `<div class="caps" style="color:${c}">${s}</div>`;

  function stArrive() {
    const th = threadOfDay();
    return stepFrame("arrive", `${eyebrow("Arrive · 1 min", "var(--practice)")}<div class="stitle">Settle</div>
      <p class="sub">Let the breath slow down. In through the nose for four, out for six. Three breaths.</p>
      <div class="breath"><span id="bcue">breathe in</span></div>
      <div class="card"><div class="caps">Today's thread</div><h2 style="margin-top:6px">${th.name}</h2><p class="sub" style="margin:2px 0 8px">${th.gloss}</p>
        <p class="serif" style="font-size:18px;margin:0">${esc(db.threadNotes[th.id] || th.desc)}</p>
        ${db.threadNotes[th.id] ? `<p class="fine" style="margin-top:6px">Your own words, from Threads.</p>` : ""}</div>
      <p class="fine center" style="margin-top:14px">Carry it lightly through the session. Where does it appear in today's reading?</p>`,
      `<button class="btn" data-act="next" data-s="arrive">I've arrived</button>`);
  }

  function recallCard(id, shown) {
    const [k, key] = [id.slice(0, 1), id.slice(2)];
    if (k === "t") { const t = TH[key]; const caps = db.cards.filter(c => c.th?.includes(key)).slice(-2);
      return { tag: "Thread", color: "var(--tint)", front: `<h2 class="serif" style="font-size:30px;font-weight:500">${t.name}</h2><p class="sub">What does it mean? Recall one passage where you've met it.</p>`,
        back: `<h3>${t.gloss}</h3><p class="serif" style="font-size:18px">${esc(db.threadNotes[key] || t.desc)}</p>${caps.map(c => `<p class="fine">${esc(book(c.book).title)} ${c.unit}: “${esc((c.quote || c.mine).slice(0, 140))}”</p>`).join("")}` }; }
    if (k === "h") { const h = HEXN[+key - 1];
      return { tag: "I Ching", color: "var(--iching)", front: `<div style="margin:6px 0">${hexSVG(+key, 70)}</div><p class="sub">Which hexagram is this? Its name, and what it asks of you.</p>`,
        back: `<h2>${h.n} · ${h.name} <span class="cjk sub">${h.zh}</span></h2>${(() => { const m = myIChing(h.n); return m?.judgment ? `<p class="serif">${esc(m.judgment)}</p><p class="fine">From your My I Ching book</p>` : ""; })()}` }; }
    const c = db.cards.find(x => x.id === key); if (!c) return null; const b = book(c.book), s = db.srs[id];
    const dirA = c.quote && (!c.mine || !s || s.reps % 2 === 0);
    return { tag: `${b.title} · ${unitLabel(b, c.unit)}${c.ed ? ` · ${c.ed}` : ""}`, color: `var(--${b.id}, var(--tint))`,
      front: dirA ? `<p class="quote">“${esc(c.quote)}”</p><p class="sub">What does this mean, in your own words? How would you live it?</p>`
                  : `<p class="serif" style="font-size:19px">${esc(c.mine)}</p><p class="sub">That's your paraphrase. Recall the original passage it came from.</p>`,
      back: dirA ? `${c.mine ? `<div class="caps">In your words</div><p class="serif" style="font-size:18px">${esc(c.mine)}</p>` : ""}${c.lens?.text ? `<p class="fine"><b>${esc(c.lens.name)}</b> shows: ${esc(c.lens.text)}</p>` : ""}${c.q ? `<p class="fine">Your question: ${esc(c.q)}</p>` : ""}`
                 : `<div class="caps">The passage</div><p class="quote">“${esc(c.quote)}”</p>` };
  }
  function stRecall() {
    if (!sess.recall) sess.recall = { q: dueIds(), i: 0, shown: false, n: 0 };
    const R = sess.recall, id = R.q[R.i];
    if (!id) {
      return stepFrame("recall", `${eyebrow("Recall · 4 min", "var(--learn)")}<div class="stitle">${R.n ? "All caught up" : "Nothing due yet"}</div>
        <p class="sub">${R.n ? `${R.n} card${R.n === 1 ? "" : "s"} reviewed. Each will return just before you'd forget it.` : "Your cards will appear here as you capture passages. Tomorrow they start coming back."}</p>
        <div class="card center" style="margin-top:20px"><div style="font-size:44px">🍃</div><p class="sub">Remembering, not rereading, is what makes knowledge stay.</p></div>`,
        `<button class="btn" data-act="next" data-s="recall">Continue</button>`);
    }
    const c = recallCard(id); if (!c) { R.i++; return stRecall(); }
    return stepFrame("recall", `${eyebrow(`Recall · ${R.i + 1} of ${R.q.length}`, "var(--learn)")}
      <div class="card flash" style="margin-top:12px"><span class="pill" style="align-self:flex-start;color:${c.color}"><span class="dot" style="background:${c.color}"></span>${esc(c.tag)}</span>
        ${c.front}${R.shown ? `<hr style="border:0;border-top:.5px solid var(--sep);width:100%;margin:6px 0">${c.back}` : ""}</div>
      <p class="fine center" style="margin-top:10px">${R.shown ? "How well did you remember?" : "Try to recall first, even roughly. The effort is what builds memory."}</p>`,
      R.shown ? `<div class="grade">${["Again", "Hard", "Good", "Easy"].map((g, i) => `<button class="btn ${i === 2 ? "" : "gray"}" data-act="grade" data-g="${i}">${g}<small>${ivlLabel(nextIvl(id, i))}</small></button>`).join("")}</div>`
               : `<button class="btn" data-act="reveal">Show</button>`);
  }

  function stRead() {
    const { b, n } = assignment(), d = day();
    let body = "";
    const lens = lensToday(b), lensCard = lens ? `<div class="card" style="margin-top:14px;box-shadow:inset 3px 0 0 var(--${b.id})"><div class="caps" style="color:var(--${b.id})">Lens · ${esc(lens)}</div>
        <p style="margin:6px 0 0">Then open <b>${esc(lens)}</b> at ${b.id === "gf" ? "the passage that matches" : `the same ${b.unit.toLowerCase()}`} and read it once. Notice <b>one thing</b> it shows that ${esc(b.edition || "your primary")} doesn't.</p>
        ${/heider|leadership/i.test(lens) ? `<p class="fine" style="margin-top:6px">Heider's modern reading turns the chapter into practice. Let it shape today's intention.</p>` : ""}</div>` : "";
    sess.lens = lens;
    const legge = b.id === "ttc" && TTC ? TTC.chapters[n - 1] : null, leggePrimary = b.id === "ttc" && /legge/i.test(b.edition || "Legge");
    const leggeText = legge ? `<div class="passage">${legge.paras.map((p, i) => `<p class="pick ${sess.picks.has(i) ? "on" : ""}" data-act="pick" data-i="${i}">${esc(p)}</p>`).join("")}</div>` : "";
    if (b.id === "ttc" && !TTC) { loadTTC().then(() => location.hash === "#/s/read" && rerender()); body = `<p class="sub">Opening the text…</p>`; }
    else if (leggePrimary) {
      body = `<h2 class="serif" style="font-weight:500;font-size:26px;margin:8px 0 14px">${esc(legge.title)}</h2>${leggeText}
        <p class="fine">Legge's translation (1891). Read it twice, slowly; the second time, aloud. Tap a line that strikes you to carry it into Capture.</p>${lensCard}`;
    } else if (b.id === "ttc") {
      body = `<div class="card" style="margin-top:12px"><p style="margin:0">Open <b>${esc(b.edition)}</b> at <b>Chapter ${n}</b>. Read it twice, slowly; the second time, aloud.</p></div>${lensCard}
        <details style="margin-top:12px"><summary class="fine" style="cursor:pointer">Legge's translation, built in</summary><h3 class="serif" style="margin:12px 0 8px;font-weight:500">${esc(legge.title)}</h3>${leggeText}</details>`;
    } else {
      const ic = b.id === "iching" ? `<div class="center" style="margin:10px 0 6px">${hexSVG(n, 84)}</div><h2 class="center">${n} · ${HEXN[n - 1].name} <span class="cjk sub">${HEXN[n - 1].zh}</span></h2>` : "";
      const mine = b.id === "iching" ? myIChing(n) : null;
      body = `${ic}<div class="card" style="margin-top:12px"><p style="margin:0">Open <b>${esc(b.title)}</b>${b.edition ? ` (${esc(b.edition)})` : ""} at <b>${unitLabel(b, n)}</b>.</p>
          <p class="sub">${b.id === "iching" ? "A hexagram is not read in one sitting. Perhaps the Judgment and the Image today, the lines on another day. Stop where it asks you to stay." : b.id === "gf" ? "Read slowly. When a passage asks you to stay with it, stop there. The rest will wait for you." : "Read slowly, as far as feels right. Stop at a story or image that stays with you."}</p></div>${lensCard}
        ${mine && (mine.judgment || mine.image) ? `<div class="ghead caps">From your My I Ching book</div><div class="card">${mine.judgment ? `<p class="serif">${esc(mine.judgment)}</p>` : ""}${mine.image ? `<p class="serif sub">${esc(mine.image)}</p>` : ""}</div>` : ""}`;
    }
    const mark = b.mark?.n === n ? `<div class="card" style="margin:12px 0 0;background:var(--tint-soft)"><div class="caps" style="color:var(--tint)">Continuing</div><p style="margin:4px 0 0">You paused ${b.mark.where ? `at <b>${esc(b.mark.where)}</b>` : "partway"} on ${new Date(b.mark.at).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}. Pick up the thread there.</p></div>` : "";
    const already = d.done.read && d.readUnitDone && d.readUnitDone !== n ? `<div class="card" style="margin-bottom:12px;background:var(--tint-soft)"><b>✓ You read ${unitLabel(b, d.readUnitDone)} today.</b><div class="fine">Here's the next one, if you'd like to keep going.</div></div>` : "";
    return stepFrame("read", `${already}${eyebrow("Read · unhurried", "var(--learn)")}<div class="row between"><div class="stitle">${esc(b.title)}</div></div>
      <div class="row" style="gap:8px">${bookIcon(b, 22)}<span class="sub">${unitLabel(b, n)}${b.edition ? ` · ${esc(b.edition)}` : ""}</span>
      <button class="btn plain sm" data-act="switchbook" style="margin-left:auto;white-space:nowrap;flex:none">Another book</button></div>${mark}${body}
      <p class="fine center" style="margin-top:18px">There is no clock here. Reading a little, deeply, is the whole practice.</p>`,
      `<button class="btn" data-act="readdone">Finished ${b.id === "iching" ? "the hexagram" : `${b.unit.toLowerCase()} ${n}`}</button>
       <button class="btn gray" data-act="readpause">Pause here, continue later</button>`);
  }
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.max(0, s % 60)).padStart(2, "0")}`;

  function captureForm(bk, unit, pre = {}) {
    const b = book(bk), eds = [b.edition, ...(b.lenses || [])].filter(Boolean);
    const C = sess.cap ||= { quote: pre.quote || "", mine: "", q: "", th: new Set([threadOfDay().id]), ed: pre.ed || eds[0] || "", lensNote: "" };
    const lens = pre.lens;
    return `<div class="row" style="gap:8px;margin:4px 0 12px">${bookIcon(b, 22)}<span class="sub">${esc(b.title)} · ${unitLabel(b, unit)}</span></div>
      <div class="field"><label>The passage that struck you</label><textarea class="write" rows="2" data-cap="quote" placeholder="Copy the line or two from your book">${esc(C.quote)}</textarea>
        ${eds.length > 1 ? `<div class="chips" style="margin-top:8px">${eds.map(e => `<button class="chip ${C.ed === e ? "on" : ""}" data-act="caped" data-v="${esc(e)}" style="font-size:13px;padding:5px 11px">${esc(e)}</button>`).join("")}</div>` : ""}</div>
      <div class="field"><label>In my own words</label><textarea class="write" rows="2" data-cap="mine" placeholder="What it says, as you'd say it to a friend">${esc(C.mine)}</textarea></div>
      ${lens ? `<div class="field" style="box-shadow:inset 3px 0 0 var(--${b.id})"><label>What ${esc(lens)} shows differently</label><textarea class="write" rows="2" data-cap="lensNote" placeholder="One word, image or emphasis that changes the meaning">${esc(C.lensNote)}</textarea></div>` : ""}
      <div class="field"><label>A question it raises (optional)</label><textarea class="write" rows="1" data-cap="q" placeholder="Why…? What if…? Where in my life…?">${esc(C.q)}</textarea></div>
      <div class="ghead caps">Threads it touches</div><div class="chips">${THREADS.map(t => `<button class="chip ${C.th.has(t.id) ? "on" : ""}" data-act="capth" data-t="${t.id}">${t.gloss}</button>`).join("")}</div>
      <p class="gfoot">Putting it in your own words is the single most effective way to remember and understand it.</p>`;
  }
  document.addEventListener("input", e => { const k = e.target.dataset.cap; if (k && sess.cap) sess.cap[k] = e.target.value; });
  function saveCapture(bk, unit) {
    const C = sess.cap; if (!C || !(C.quote.trim() || C.mine.trim() || C.lensNote?.trim())) return null;
    const c = { id: uid(), book: bk, unit: +unit, quote: C.quote.trim(), mine: C.mine.trim(), q: C.q.trim(), th: [...C.th], at: Date.now(), ed: C.ed || "" };
    if (C.lensNote.trim() && C.lensName) c.lens = { name: C.lensName, text: C.lensNote.trim() };
    db.cards.push(c); db.srs["c:" + c.id] = { ivl: 0, ease: 2.5, reps: 0, due: today0() + DAY }; sess.cap = null; save(); return c;
  }
  function stCapture() {
    const d = day(), { b, n } = assignment(), unit = d.readUnitDone || n;
    const pre = b.id === "ttc" && TTC && sess.picks.size ? { quote: [...sess.picks].sort((x, y) => x - y).map(i => TTC.chapters[unit - 1]?.paras[i]).filter(Boolean).join("\n"), ed: "Legge (built in)" } : {};
    pre.lens = sess.lens; if (sess.cap) sess.cap.lensName = sess.lens; else { captureForm(b.id, unit, pre); sess.cap.lensName = sess.lens; }
    return stepFrame("capture", `${eyebrow("Capture · 3 min", "var(--learn)")}<div class="stitle">Make it yours</div>${captureForm(b.id, unit, pre)}`,
      `<button class="btn" data-act="capsave">Save and continue</button>`);
  }

  function pairFor(a) {
    const others = db.cards.filter(c => c.id !== a.id && c.book !== a.book);
    const shared = others.filter(c => c.th?.some(t => a.th?.includes(t)));
    const pool = shared.length ? shared : others;
    return pool.length ? pool[sess.connectSeed % pool.length] : null;
  }
  function stConnect() {
    const d = day(), a = db.cards.find(c => c.id === d.capture) || db.cards[db.cards.length - 1];
    const bCard = a ? pairFor(a) : null, th = threadOfDay();
    const show = c => { const bk = book(c.book); return `<div class="card"><span class="pill" style="color:var(--${bk.id})"><span class="dot" style="background:var(--${bk.id})"></span>${esc(bk.title)} · ${c.unit}</span>
      <p class="serif" style="font-size:18px;margin:10px 0 0">${esc(c.quote || c.mine)}</p></div>`; };
    const other = bCard ? show(bCard) : `<div class="card"><span class="pill">Thread</span><h3 style="margin-top:10px">${th.name} · ${th.gloss}</h3><p class="serif" style="font-size:18px;margin:6px 0 0">${esc(db.threadNotes[th.id] || th.desc)}</p></div>`;
    sess.connect = { a: a?.id, b: bCard ? bCard.id : "t:" + th.id };
    return stepFrame("connect", `${eyebrow("Connect · 2 min", "var(--reflect)")}<div class="stitle">Two voices</div>
      <p class="sub">${a ? "Put today's passage beside another. How do they speak to each other? Where do they agree, and where do they pull apart?" : "Capture a passage first; then it can meet the others."}</p>
      <div class="stack" style="margin-top:12px">${a ? show(a) : ""}<div class="center sub" style="font-size:22px">⇅</div>${other}</div>
      ${bCard ? `<p class="center"><button class="btn plain sm" data-act="reshuffle">Another pairing</button></p>` : ""}
      <div class="field" style="margin-top:12px"><label>What I see between them</label><textarea class="write" rows="3" id="linktext" placeholder="Both point to… / One says… while the other…"></textarea></div>`,
      `<button class="btn" data-act="linksave">Save and continue</button>`);
  }

  let wake = null;
  async function holdWake() { try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {} }
  function releaseWake() { try { wake?.release(); } catch (e) {} wake = null; }
  function bell() {
    try { const ac = new (window.AudioContext || window.webkitAudioContext)(), t = ac.currentTime;
      [[432, .5], [864, .18], [1296, .08], [1729, .04]].forEach(([f, g]) => { const o = ac.createOscillator(), v = ac.createGain(); o.frequency.value = f; o.type = "sine";
        v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g * .5, t + .02); v.gain.exponentialRampToValueAtTime(.0001, t + 6); o.connect(v).connect(ac.destination); o.start(t); o.stop(t + 6.2); }); } catch (e) {}
  }
  function stSit() {
    const total = db.settings.sitMin * 60; sess.sitLeft ??= total;
    return stepFrame("sit", `${eyebrow(`Sit · ${db.settings.sitMin} min`, "var(--practice)")}<div class="stitle">Circulate the light</div>
      <p class="sub">Sit upright and at ease. Let the eyes half close, resting along the line of the nose. Gather attention softly between the eyes and let it turn back inward, as if light were circling back to its source. Let the breath grow slow, fine and quiet. When thoughts scatter, notice, and return.</p>
      <div class="breath" style="${db.settings.breathGuide ? "" : "visibility:hidden"}"><span class="timer" id="stimer" style="font-size:44px;color:var(--label)">${fmt(sess.sitLeft)}</span></div>
      <div class="row" style="justify-content:center;gap:10px"><button class="chip ${db.settings.breathGuide ? "on" : ""}" data-act="breathguide">Breathing guide</button></div>`,
      `<button class="btn" data-act="sit" style="background:var(--practice)">${sess.timer ? "Pause" : sess.sitLeft < total ? "Resume" : "Begin sitting"}</button>
       <button class="btn plain" data-act="sitend">${sess.sitLeft < total ? "Finish and continue" : "Skip for today"}</button>`);
  }

  function stCarry() {
    const d = day(), th = threadOfDay(), I = d.intent ||= { when: "", will: "" };
    const cap = db.cards.find(c => c.id === d.capture);
    return stepFrame("carry", `${eyebrow("Carry · 1 min", "var(--reflect)")}<div class="stitle">Into the day</div>
      <p class="sub">Choose one moment today to live what you read. A specific "when" makes it far more likely to happen.</p>

        <div class="cell static"><span class="grow">Practice time</span><input type="time" data-bind="settings.time" value="${S.time}" style="width:auto;color:var(--tint)"></div>
        <button class="cell" data-act="ics"><span class="grow" style="color:var(--tint)">Add a daily reminder to my calendar</span></button></div>
      <div class="ghead caps">Sitting</div><div class="seg">${[3, 4, 5, 8, 10, 15].map(m => `<button class="${S.sitMin === m ? "on" : ""}" data-act="sitmin" data-m="${m}">${m}</button>`).join("")}</div>
      <p class="gfoot">Minutes of sitting in each session.</p>
      <div class="ghead caps">Weekly rhythm</div><div class="group">${[1, 2, 3, 4, 5, 6, 0].map(d => `<div class="cell static"><span class="grow">${DOW[d]}</span>
        <select data-act="weekday" data-d="${d}" style="width:auto;color:var(--label2);text-align:right">${db.books.map(b => `<option value="${b.id}" ${S.week[d] === b.id ? "selected" : ""}>${esc(b.title)}</option>`).join("")}</select></div>`).join("")}</div>
      <p class="gfoot">Which book you read each day. Moving between them (interleaving) helps you see what they share.</p>
      <div class="ghead caps">Appearance</div><div class="seg">${["auto", "light", "dark"].map(t => `<button class="${S.theme === t ? "on" : ""}" data-act="theme" data-t="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div>
      <div class="ghead caps">Your data</div><div class="group">
        <button class="cell" data-act="backup"><span class="grow" style="color:var(--tint)">Back up everything (.json)</span></button>
        <label class="cell"><span class="grow" style="color:var(--tint)">Restore from a backup…</span><input type="file" id="restore" accept=".json,application/json" hidden></label>
        ${isStandalone() ? "" : `<button class="cell" data-act="installsheet"><span class="grow" style="color:var(--tint)">Install the app</span></button>`}</div>
      <p class="gfoot">Everything stays on this device. Back up now and then, and use the file to move to a new phone.</p>
      <div class="group" style="margin-top:22px"><button class="cell" data-act="wipe"><span class="grow" style="color:#ff3b30">Erase everything</span></button></div>
      <p class="fine center" style="margin-top:22px">Daily Way · version ${APP_VERSION} · ${APP_DATE}<br>Tao Te Ching: James Legge (1891), public domain. Thread notes and prompts are original.</p>`;
  }
  const SCIENCE = [
    ["One short session, every day", "Daily practice at a consistent time and place turns effort into habit; automaticity grows over about two months, and missing a single day barely matters.", "Lally et al., 2010; Wood & Neal, 2007"],
    ["Recall before you read", "Retrieving what you learned strengthens memory far more than rereading it.", "Roediger & Karpicke, 2006; Karpicke & Blunt, 2011"],
    ["Cards return at growing intervals", "Spacing reviews just before you'd forget gives the most durable learning for the least time.", "Cepeda et al., 2006; Ebbinghaus, 1885"],
    ["Four books, interleaved", "Mixing related subjects helps you discriminate and connect them, rather than learning each in isolation.", "Rohrer & Taylor, 2007; Kornell & Bjork, 2008"],
    ["In your own words", "Generating an explanation yourself is remembered and understood better than reading one.", "Slamecka & Graf, 1978; Bertsch et al., 2007"],
    ["A question for each passage", "Asking why and how invites deeper processing and links new ideas to what you know.", "Pressley et al., 1987; Dunlosky et al., 2013"],
    ["Connect two books", "Integrating ideas across sources builds a coherent understanding instead of scattered facts.", "Wiley & Voss, 1999; Chi, 2009"],
    ["One primary translation, others as lenses", "Comparing two versions of the same passage (contrasting cases) shows what each one emphasises and leaves out, and deepens understanding more than reading either alone. Depth in one, comparison with the rest.", "Schwartz & Bransford, 1998; Marton & Booth, 1997; Ericsson et al., 1993"],
    ["Threads in your own understanding", "Revising your own definition of a concept over time is elaborative rehearsal and deepens comprehension.", "Craik & Lockhart, 1972"],
    ["Teach it back", "Explaining to someone else exposes gaps and consolidates learning (the protégé effect).", "Fiorella & Mayer, 2013; Chase et al., 2009"],
    ["Sitting practice", "Brief daily meditation improves attention and emotional regulation, even in beginners.", "Zeidan et al., 2010; Tang et al., 2015"],
    ["\"When ___, I will ___\"", "If-then plans more than double the chance an intention becomes action.", "Gollwitzer & Sheeran, 2006"],
    ["Evening look back", "Reflecting on experience improves what you learn from it; stepping back as if advising a friend makes reflection wiser.", "Di Stefano et al., 2014; Kross & Ayduk, 2011"],
    ["Rings, streaks and milestones", "Visible progress and small completions sustain motivation (goal gradient); a forgiving streak avoids the all-or-nothing trap.", "Kivetz et al., 2006; Polivy & Herman, 1985"],
    ["Your own why", "Goals that express your own values are pursued with more persistence and well-being.", "Sheldon & Elliot, 1999; Deci & Ryan, 2000"],
    ["Just two minutes", "Making the smallest version easy keeps the habit alive on hard days.", "Fogg, 2019"],
  ];
  function viewScience() {
    return `<a href="#/progress" class="btn plain sm" style="padding-left:0">‹ Progress</a><h1>Why it works</h1>
      <p class="sub">Every part of the daily session comes from research on learning, memory and habits.</p>
      <dl class="science">${SCIENCE.map(([a, b, c]) => `<dt>${a}</dt><dd>${b}<cite>${c}</cite></dd>`).join("")}</dl>`;
  }

  /* ---------- Install prompt ---------- */
  let deferredInstall = null;
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const SNOOZE = "daily-way-install-snooze";
  const snoozed = () => { try { return Date.now() < +(localStorage.getItem(SNOOZE) || 0); } catch (e) { return false; } };
  function sheetBody() {
    if (deferredInstall) return `<button class="btn" data-act="install">Install Daily Way</button>`;
    const share = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--tint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/></svg>`;
    const step = (n, t) => `<div class="cell static" style="--inset:52px"><span class="icon" style="background:var(--tint-soft);color:var(--tint);font:700 14px var(--sans);width:26px;height:26px">${n}</span><span>${t}</span></div>`;
    if (isIOS) return `<div class="group">${step(1, `Tap <b>Share</b> ${share} in Safari's toolbar`)}${step(2, `Tap <b>Add to Home Screen</b>, then <b>Add</b>`)}</div>`;
    if (/android/i.test(navigator.userAgent)) return `<div class="group">${step(1, `Tap the <b>⋮</b> menu at the top right of Chrome`)}${step(2, `Tap <b>Install app</b> (or <b>Add to Home screen</b>)`)}</div>`;
    return `<div class="group">${step(1, `Click the <b>install</b> icon at the right of the address bar`)}${step(2, `or choose <b>Install Daily Way</b> in the browser menu`)}</div>`;
  }
  function showSheet(force) {
    if (isStandalone() || $(".sheet-back") || (!force && snoozed())) return;
    const back = document.createElement("div"); back.className = "sheet-back";
    back.innerHTML = `<div class="sheet"><div class="grab"></div><div class="row" style="gap:14px;margin-bottom:12px"><img src="icons/icon-192.png" width="60" height="60" style="border-radius:14px" alt="">
      <div><div class="fine">Free · works offline · private</div><h2>Install Daily Way</h2></div></div>
      <p class="sub">Put it on your home screen so your daily practice is one tap away, full screen, like any app. Everything you write stays on this phone.</p><div id="sheetbody" style="margin-top:12px">${sheetBody()}</div>
      <button class="btn plain" data-act="later">Not now</button></div>`;
    back.addEventListener("click", e => { if (e.target === back) closeSheet(true); }); document.body.appendChild(back);
  }
  function closeSheet(later) { $(".sheet-back")?.remove(); if (later) try { localStorage.setItem(SNOOZE, String(Date.now() + 3 * DAY)); } catch (e) {} }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; const b = $("#sheetbody"); if (b) b.innerHTML = sheetBody(); });
  addEventListener("appinstalled", () => { closeSheet(false); toast("Installed. Open it from your home screen."); });
  setTimeout(() => showSheet(false), 1800);

  /* ---------- Book choice sheet (Read step) ---------- */
  function chooseBook() {
    const back = document.createElement("div"); back.className = "sheet-back";
    back.innerHTML = `<div class="sheet"><div class="grab"></div><h2 style="margin-bottom:12px">Read another book today</h2><div class="group">${db.books.map(b => `<button class="cell" data-act="pickbook" data-b="${b.id}" style="--inset:58px">${bookIcon(b)}<span class="grow">${esc(b.title)}<div class="fine">${unitLabel(b, b.pos)}</div></span></button>`).join("")}</div>
      <button class="btn plain" data-act="closesheet">Cancel</button></div>`;
    back.addEventListener("click", e => { if (e.target === back) back.remove(); }); document.body.appendChild(back);
  }

  // Pausing in the middle of a hexagram or chapter: note where, choose when to return.
  function pauseSheet() {
    const { b, n } = assignment(), here = b.id === "iching" ? ["Judgment", "Image", "Line 1", "Line 2", "Line 3", "Line 4", "Line 5", "Line 6", "Commentary"] : [];
    const back = document.createElement("div"); back.className = "sheet-back";
    back.innerHTML = `<div class="sheet"><div class="grab"></div><h2>Pause here</h2><p class="sub">Note where you stopped; next time begins there.</p>
      ${here.length ? `<div class="chips" style="margin:12px 0">${here.map(h => `<button class="chip" data-act="pausewhere" data-v="${h}">${h}</button>`).join("")}</div>` : ""}
      <div class="field" style="margin-top:10px"><label>Where I stopped</label><input type="text" id="pausewhere" placeholder="${b.id === "iching" ? "e.g. after the Image" : "e.g. page 34, the butterfly dream"}" value="${esc(b.mark?.n === n ? b.mark.where : "")}"></div>
      <div class="ghead caps">Continue</div><div class="group">
        <button class="cell" data-act="pausego" data-when="tomorrow"><span class="grow">Tomorrow<div class="fine">Keep the thread unbroken</div></span><span class="chev">›</span></button>
        <button class="cell" data-act="pausego" data-when="rhythm"><span class="grow">On its usual day<div class="fine">${DOW[db.settings.week.findIndex((x, i) => x === b.id && i !== new Date().getDay())] || "In the weekly rhythm"}</div></span><span class="chev">›</span></button></div>
      <button class="btn plain" data-act="closesheet">Cancel</button></div>`;
    back.addEventListener("click", e => { if (e.target === back) back.remove(); }); document.body.appendChild(back);
  }

  /* ---------- Actions ---------- */
  function applyTheme() { const t = db.settings.theme; t === "auto" ? document.documentElement.removeAttribute("data-theme") : (document.documentElement.dataset.theme = t); }
  applyTheme();
  function ics() {
    const [h, m] = (db.settings.time || "07:00").split(":"), d = new Date(); d.setHours(+h, +m, 0, 0);
    const p = n => String(n).padStart(2, "0"), dt = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
    const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Apps Studio//Daily Way//EN", "BEGIN:VEVENT", `UID:daily-way-${Date.now()}@apps-studio`, `DTSTAMP:${dt}`, `DTSTART:${dt}`, "DURATION:PT20M",
      "RRULE:FREQ=DAILY", "SUMMARY:Daily Way · 20 minutes", "DESCRIPTION:Arrive · Recall · Read · Capture · Connect · Sit · Carry", "BEGIN:VALARM", "TRIGGER:PT0M", "ACTION:DISPLAY", "DESCRIPTION:Daily Way", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    download("daily-way.ics", body, "text/calendar");
  }
  function download(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  function go(h) { location.hash = h; }
  function tick(id, key, onEnd) {
    sess.timer = setInterval(() => {
      sess[key]--; const el = $(id); if (el) el.textContent = fmt(sess[key]);
      if (key === "sitLeft") { day().sitSec = (day().sitSec || 0) + 1; if (sess[key] % 15 === 0) save(); }
      if (sess[key] <= 0) { clearInterval(sess.timer); sess.timer = null; releaseWake(); bell(); haptic([20, 80, 20]); onEnd(); }
    }, 1000);
  }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const a = el.dataset.act, d = el.dataset; if (el.tagName === "BUTTON") haptic(6);
    if (a === "wnext") { if (welcomeStep < 2) { welcomeStep++; rerender(); scrollTo(0, 0); } else { db.onboarded = true; db.start = dkey(); save(true); go("#/"); } }
    else if (a === "wback") { welcomeStep--; rerender(); }
    else if (a === "sitmin") { db.settings.sitMin = +d.m; sess.sitLeft = null; save(); rerender(); }
    else if (a === "ics") ics();
    else if (a === "next") { markDone(d.s); go(nextOf(d.s)); }
    else if (a === "skip") go(nextOf(d.s));
    else if (a === "reveal") { sess.recall.shown = true; rerender(); }
    else if (a === "grade") { const R = sess.recall, id = R.q[R.i]; grade(id, +d.g); if (+d.g === 0) R.q.push(id); R.i++; R.n++; R.shown = false; day().reviewed = (day().reviewed || 0) + 1; if (R.i >= R.q.length || R.n >= 10) markDone("recall"); rerender(); }
    else if (a === "pick") { const i = +d.i; sess.picks.has(i) ? sess.picks.delete(i) : sess.picks.add(i); el.classList.toggle("on"); sess.cap = null; }
    else if (a === "switchbook") chooseBook();
    else if (a === "pickbook") { const b = book(d.b), dd = day(); dd.readBook = b.id; dd.readUnit = b.pos; sess.picks.clear(); sess.cap = null; save(); el.closest(".sheet-back").remove(); rerender(); }
    else if (a === "closesheet") el.closest(".sheet-back").remove();
    else if (a === "readdone") {
      const dd = day(), { b, n } = assignment();
      if (!b.read.includes(n)) b.read.push(n); dd.readUnitDone = n; b.pos = nextUnit(b, n); dd.readUnit = b.pos; b.mark = null;
      if (b.id === "iching" && !db.hexCards.includes(n)) db.hexCards.push(n);
      markDone("read"); go("#/s/capture");
    }
    else if (a === "readpause") pauseSheet();
    else if (a === "pausewhere") { $("#pausewhere").value = d.v; el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === el)); }
    else if (a === "pausego") {
      const dd = day(), { b, n } = assignment();
      b.mark = { n, where: ($("#pausewhere")?.value || "").trim(), at: Date.now() }; dd.readUnitDone = n;
      db.carry = d.when === "tomorrow" ? { book: b.id, day: dkey(today0() + DAY + 3600e3) } : null;
      el.closest(".sheet-back").remove(); markDone("read"); save(); toast(d.when === "tomorrow" ? "Tomorrow you'll continue here." : "It will be waiting on its day."); go("#/s/capture");
    }
    else if (a === "caped") { sess.cap.ed = d.v; el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === el)); }
    else if (a === "addlens") { const inp = $("#lens-" + d.b), v = inp?.value.trim(); if (!v) return; const b = book(d.b); if (!b.lenses.includes(v)) b.lenses.push(v); save(); rerender(); }
    else if (a === "dellens") { const b = book(d.b); b.lenses.splice(+d.j, 1); save(); rerender(); }
    else if (a === "preset") { const b = book(d.b); setChapters(b, d.v); save(); rerender(); toast(`${total(b)} ${b.unit.toLowerCase()}s: ${fmtList(seq(b))}`); }
    else if (a === "capth") { const C = sess.cap; C.th.has(d.t) ? C.th.delete(d.t) : C.th.add(d.t); el.classList.toggle("on"); }
    else if (a === "capsave") { const { b, n } = assignment(), c = saveCapture(b.id, day().readUnitDone || n); if (c) { day().capture = c.id; toast("Captured. It will return for recall."); } markDone("capture"); sess.picks.clear(); go("#/s/connect"); }
    else if (a === "capsave2") { const c = saveCapture(d.b, +d.u); if (c) { toast("Captured"); go("#/book/" + d.b); } else toast("Write the passage or your own words first"); }
    else if (a === "reshuffle") { sess.connectSeed++; rerender(); }
    else if (a === "linksave") { const t = ($("#linktext")?.value || "").trim(); if (t && sess.connect?.a) db.links.push({ a: sess.connect.a, b: sess.connect.b, text: t, at: Date.now() }); markDone("connect"); save(); go("#/s/sit"); }
    else if (a === "breathguide") { db.settings.breathGuide = !db.settings.breathGuide; save(); rerender(); }
    else if (a === "sit") {
      if (sess.timer) { clearInterval(sess.timer); sess.timer = null; releaseWake(); save(); el.textContent = "Resume"; return; }
      sess.sitLeft ??= db.settings.sitMin * 60; holdWake(); bell(); el.textContent = "Pause";
      tick("#stimer", "sitLeft", () => { markDone("sit"); save(); toast("Rest a moment before you rise."); setTimeout(() => location.hash === "#/s/sit" && go("#/s/carry"), 2500); });
    }
    else if (a === "sitend") { if (sess.sitLeft < db.settings.sitMin * 60) markDone("sit"); sess.sitLeft = null; save(); go("#/s/carry"); }
    else if (a === "did") { day().evening ||= {}; day().evening.did = d.v; save(); el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === el)); }
    else if (a === "evedone") { markDone("evening"); toast("Day closed. Rest well."); go("#/"); }
    else if (a === "minidone") { markDone("mini"); toast("Showed up. That counts."); go("#/"); }
    else if (a === "teachsave") { const t = ($("#teachtext")?.value || "").trim(); if (!t) return toast("Write your explanation first"); db.teach.push({ th: d.t, text: t, at: Date.now() }); save(); toast("Saved to the thread"); go("#/thread/" + d.t); }
    else if (a === "cardth") { const c = db.cards.find(x => x.id === d.c); c.th ||= []; c.th.includes(d.t) ? c.th.splice(c.th.indexOf(d.t), 1) : c.th.push(d.t); el.classList.toggle("on"); save(); }
    else if (a === "delcard") { if (confirm("Delete this capture?")) { db.cards = db.cards.filter(c => c.id !== d.c); delete db.srs["c:" + d.c]; save(); history.back(); } }
    else if (a === "theme") { db.settings.theme = d.t; applyTheme(); save(); rerender(); }
    else if (a === "backup") download(`daily-way-${dkey()}.json`, JSON.stringify(db, null, 1), "application/json");
    else if (a === "wipe") { if (confirm("Erase everything on this device? Back up first.") && confirm("Really erase?")) { localStorage.removeItem(KEY); location.reload(); } }
    else if (a === "installsheet") showSheet(true);
    else if (a === "later") closeSheet(true);
    else if (a === "install" && deferredInstall) { const ev = deferredInstall; deferredInstall = null; ev.prompt(); ev.userChoice.then(r => closeSheet(r.outcome !== "accepted")).catch(() => closeSheet(true)); }
  });
  document.addEventListener("change", async e => {
    const el = e.target;
    if (el.dataset.act === "weekday") { db.settings.week[+el.dataset.d] = el.value; save(); }
    if (el.dataset.bind?.startsWith("books.")) { db.books.forEach(b => { b.units = Math.max(1, b.units | 0); if (!seq(b).includes(b.pos | 0)) b.pos = seq(b)[0]; }); save(); }
    if (el.dataset.chlist) { const b = book(el.dataset.chlist); if (setChapters(b, el.value)) { save(); toast(`${total(b)} ${b.unit.toLowerCase()}s: ${fmtList(seq(b))}`); setTimeout(rerender, 0); /* after the blur or tap that fired this */ } else toast("Use numbers like 1-7, 17-20"); }
    if (el.id === "restore" && el.files[0]) {
      try { const d = JSON.parse(await el.files[0].text()); if (!d || d.v !== 1 || !d.books) throw 0;
        if (confirm("Replace everything on this device with this backup?")) { db = Object.assign(fresh(), d); save(true); applyTheme(); toast("Restored"); go("#/"); rerender(); } }
      catch (err) { toast("That isn't a Daily Way backup"); }
    }
  });
  // The breathing cue in Arrive follows the 10-second circle: 4 in, 6 out.
  const arriveCue = () => { const el = $("#bcue"); if (!el) return; let t = 0; sess.timer = setInterval(() => { t = (t + 1) % 10; el.textContent = t < 4 ? "breathe in" : "breathe out"; }, 1000); };
  const _stArrive = stArrive; stArrive = function () { mounts.push(arriveCue); return _stArrive(); };

  route();
  if (!TTC) loadTTC().catch(() => {});
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!had || $(".update")) return; const u = document.createElement("button"); u.className = "update"; u.textContent = "A new version is ready · Reload"; u.onclick = () => location.reload(); document.body.appendChild(u); });
  }
</script>
</body>
</html>
