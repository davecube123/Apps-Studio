<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stride</title>
<meta name="description" content="A GPS running tracker: live speed and pace, distance, splits, voice cues, your route and run history. Works offline.">
<meta name="theme-color" content="#0d100f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stride">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
  :root { --bg: #0d100f; --card: #171b19; --ink: #f2f5f3; --muted: #93a09a; --line: rgba(220, 255, 230, .09);
    --lime: #c8f560; --amber: #ffb547; --red: #ff6b5b; --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--ui); }
  body { padding: env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom)); min-height: 100vh; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px 24px; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; }
  .brand { font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--lime); }
  .muted { color: var(--muted); } .small { font-size: 14px; } .tiny { font-size: 12.5px; }
  .num { font-variant-numeric: tabular-nums; }
  .chip { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .chip.good i { background: var(--lime); } .chip.ok i { background: var(--amber); } .chip.bad i { background: var(--red); }
  .gear { background: none; border: 0; padding: 6px; color: var(--muted); }
  .big { text-align: center; margin: 22px 0 6px; user-select: none; cursor: pointer; }
  .big .v { font-size: clamp(72px, 24vw, 112px); font-weight: 800; line-height: 1; letter-spacing: -.03em; }
  .big .l { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .sub { text-align: center; font-size: 22px; font-weight: 700; color: var(--lime); }
  .state { text-align: center; min-height: 22px; font-size: 14px; color: var(--amber); margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .tile .v { font-size: 28px; font-weight: 750; margin-top: 2px; }
  .tile .v small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 3px; }
  .mapwrap { position: relative; margin-top: 12px; }
  .map { height: 220px; border-radius: 16px; overflow: hidden; background: #1a1f1d; border: 1px solid var(--line); z-index: 0; }
  .map.tall { height: 300px; }
  .leaflet-container { background: #1a1f1d; font: 12px var(--ui); }
  .leaflet-control-attribution { background: rgba(13, 16, 15, .72) !important; color: #93a09a !important; font-size: 10px; }
  .leaflet-control-attribution a { color: #b8c4be !important; }
  .recenter { position: absolute; right: 10px; bottom: 26px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(23, 27, 25, .92); color: var(--lime); font-size: 20px; line-height: 1; display: none; }
  .recenter.show { display: block; }
  .nomap { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
  canvas.route { width: 100%; height: 170px; display: block; background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-top: 12px; }
  .ctl { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
  .go { width: 100%; max-width: 360px; height: 72px; border-radius: 99px; border: 0; font-size: 22px; font-weight: 800; letter-spacing: .04em; }
  .go.start, .go.resume { background: var(--lime); color: #12180a; }
  .go.pause { background: var(--card); border: 2px solid var(--amber); color: var(--amber); }
  .go.finish { background: var(--card); border: 2px solid var(--red); color: var(--red); }
  .go.half { max-width: 200px; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 10px; font-size: 14px; }
  .tip { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; color: var(--muted); margin-top: 16px; }
  .tip b { color: var(--ink); }
  h1 { font-size: 28px; margin: 4px 0 12px; } h2 { font-size: 21px; margin: 0 0 8px; } h3 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px; }
  .run { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .run:last-child { border-bottom: 0; }
  .run .d { font-size: 24px; font-weight: 800; min-width: 84px; } .run .d small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .run .chev { margin-left: auto; color: var(--muted); font-size: 22px; }
  .tot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tot .tile .v { font-size: 22px; }
  .split { display: grid; grid-template-columns: 34px 1fr 64px 58px; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .split:last-child { border-bottom: 0; }
  .split .bar { height: 10px; border-radius: 6px; background: var(--lime); opacity: .85; }
  .split.best .bar { background: var(--lime); opacity: 1; box-shadow: 0 0 0 2px rgba(200, 245, 96, .3); }
  .split.part .bar { background: var(--muted); }
  canvas.chart { width: 100%; height: 160px; display: block; }
  .note { width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 12px; padding: 10px 12px; font: inherit; }
  .btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-weight: 600; }
  .btn.pri { background: var(--lime); color: #12180a; border: 0; } .btn.danger { color: var(--red); } .btn.block { width: 100%; margin-top: 8px; }
  .legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend span.g { flex: 1; height: 6px; border-radius: 4px; background: linear-gradient(90deg, hsl(4 90% 62%), hsl(40 95% 60%), hsl(80 88% 62%)); }
  .tabsbar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: rgba(13, 16, 15, .96); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(8px); z-index: 5; }
  .tabsbar a { flex: 1; text-align: center; padding: 9px 0 8px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  .tabsbar a.on { color: var(--lime); }
  .tabsbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabsbar a .dot { position: absolute; top: 6px; right: calc(50% - 20px); width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 9px; color: var(--muted); font-weight: 600; }
  .seg button.on { background: var(--lime); color: #12180a; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .sw { width: 50px; height: 30px; border-radius: 99px; background: #39413d; border: 0; position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
  .sw.on { background: var(--lime); } .sw.on::after { left: 23px; }
  .back { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { background: #151917; border: 1px solid var(--line); border-radius: 22px 22px 0 0; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  .isteps { padding-left: 20px; margin: 8px 0; } .isteps li { margin: 6px 0; }
  .ic2 { width: 18px; height: 18px; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .dots3 { font-weight: 800; letter-spacing: 1px; }
  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2b322e; color: var(--ink); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: 90vw; text-align: center; }
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabsbar">
  <a href="#/" data-tab="run"><svg viewBox="0 0 24 24"><circle cx="13.5" cy="4" r="2"/><path d="M8 21l3-6 3 2v5M6 12l3-4 4 1 3 4 3 1M11 15l1-6"/></svg>Run</a>
  <a href="#/history" data-tab="history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>History</a>
</nav>
<script src="lib/leaflet.js"></script>
<script>
(() => {
  "use strict";
  const VER = "2";
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toast = (m, ms = 2600) => { $$(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms); };
  const ld = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast("Storage is full. Export and delete some old runs."); return false; } };

  let runs = ld("stride-runs", []);
  const set = Object.assign({ unit: "km", primary: "pace", voice: true, autoPause: false }, ld("stride-set", {}));
  const saveSet = () => sv("stride-set", set);
  let live = ld("stride-live", null);

  /* ---------- units and formatting ---------- */
  const GOODACC = 25, MAXACC = 40, MAXSPD = 12; // metres, metres, m/s (43 km/h)
  const R = 6371008.8, rad = x => x * Math.PI / 180;
  const hav = (a, b) => { const dLa = rad(b[0] - a[0]), dLo = rad(b[1] - a[1]); const h = Math.sin(dLa / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.min(1, Math.sqrt(h))); };
  const U = () => set.unit === "mi" ? 1609.344 : 1000, UL = () => set.unit, SL = () => set.unit === "mi" ? "mph" : "km/h";
  const p2 = n => String(n).padStart(2, "0");
  const fmtDist = m => { const x = m / U(); return x.toFixed(x < 100 ? 2 : 1); };
  const fmtTime = ms => { let s = Math.floor(Math.max(0, ms) / 1000); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); s %= 60; return h ? `${h}:${p2(m)}:${p2(s)}` : `${m}:${p2(s)}`; };
  const fmtPace = mps => { if (!mps || mps < 0.3) return "–:–"; const s = Math.round(U() / mps); return s >= 6000 ? "–:–" : `${Math.floor(s / 60)}:${p2(s % 60)}`; };
  const fmtSpd = mps => mps == null ? "–" : (mps * 3600 / U()).toFixed(1);
  const spoken = ms => { let s = Math.round(ms / 1000); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); s %= 60; return [h && `${h} hour${h > 1 ? "s" : ""}`, m && `${m} minute${m > 1 ? "s" : ""}`, `${s} second${s === 1 ? "" : "s"}`].filter(Boolean).join(" "); };
  const unitWord = (k, n) => k === "mi" ? (n === 1 ? "mile" : "miles") : (n === 1 ? "kilometre" : "kilometres");
  const fmtDate = t => new Date(t).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });

  /* ---------- voice ---------- */
  const say = text => { if (!set.voice || !("speechSynthesis" in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1; speechSynthesis.speak(u); } catch {} };
  const primeVoice = () => { try { if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch {} };

  /* ---------- wake lock ---------- */
  let wake = null;
  const wakeOn = async () => { try { if ("wakeLock" in navigator && !wake && document.visibilityState === "visible") { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch {} };
  const wakeOff = () => { try { wake && wake.release(); } catch {} wake = null; };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (live || acquiring)) { wakeOn(); paint(true); } else if (live) persist(true); });

  /* ---------- GPS ---------- */
  let watchId = null, fix = null, acquiring = false, gpsMsg = "", saveAt = 0;
  function startWatch() {
    if (watchId != null) return;
    if (!("geolocation" in navigator)) { gpsMsg = "This browser can't use GPS."; paint(); return; }
    gpsMsg = "";
    watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  }
  const stopWatch = () => { if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; fix = null; };
  function onErr(e) {
    if (e.code === 1) { gpsMsg = "Location is blocked. Allow location for this site (and Precise location on iPhone) in your settings, then tap Start again."; stopWatch(); acquiring = false; }
    else if (e.code === 2) gpsMsg = "No GPS signal yet. Step outside, away from tall buildings.";
    paint(true);
  }
  const persist = force => { if (!live) return; if (force || Date.now() - saveAt > 4000) { saveAt = Date.now(); sv("stride-live", live); } };
  const elapsed = (at = Date.now()) => !live ? 0 : live.acc + (live.state === "running" ? Math.max(0, at - live.resumedAt) : 0);

  function begin() {
    const now = Date.now(); acquiring = false;
    live = { id: String(now), start: now, segs: [[]], acc: 0, resumedAt: now, state: "running", dist: 0, cum: { km: [], mi: [] }, max: 0, lastE: 0, lastMoveAt: now, rej: 0 };
    persist(true); say("Go"); paint(true);
  }

  function onPos(p) {
    const c = p.coords, wall = Date.now(); gpsMsg = "";
    fix = { acc: c.accuracy, at: wall, lat: c.latitude, lon: c.longitude };
    if (acquiring && c.accuracy <= GOODACC) begin();
    if (!live || live.state === "paused" || c.accuracy > MAXACC) { paint(); return; }
    const pt = [+c.latitude.toFixed(6), +c.longitude.toFixed(6), wall - live.start, Math.round(c.accuracy)];
    const seg = live.segs[live.segs.length - 1], last = seg[seg.length - 1];
    if (live.state === "auto") {
      if (last && hav(last, pt) > Math.max(10, c.accuracy)) { live.state = "running"; live.resumedAt = wall; live.segs.push([pt]); live.lastE = elapsed(wall); live.lastMoveAt = wall; say("Resumed"); persist(true); }
      paint(); return;
    }
    if (!last) { seg.push(pt); live.lastE = elapsed(wall); live.lastMoveAt = wall; persist(); paint(); return; }
    const d = hav(last, pt), dt = (pt[2] - last[2]) / 1000;
    if (dt <= 0) return;
    if (d / dt > MAXSPD) { // a jump: ignore it, unless the GPS keeps insisting (then start fresh from here)
      if (++live.rej >= 5) { live.rej = 0; live.segs.push([pt]); live.lastE = elapsed(wall); }
      paint(); return;
    }
    live.rej = 0;
    if (d < Math.max(3, c.accuracy * 0.4)) { paint(); return; } // GPS wobble while standing: don't count it
    seg.push(pt); live.lastMoveAt = wall;
    const D0 = live.dist, D1 = D0 + d, e0 = live.lastE, e1 = elapsed(wall);
    for (const [k, L] of [["km", 1000], ["mi", 1609.344]]) {
      let n = live.cum[k].length;
      while ((n + 1) * L <= D1) { live.cum[k].push(Math.round(e0 + (e1 - e0) * (((n + 1) * L - D0) / d))); n++; if (k === set.unit) announce(k, n); }
    }
    live.dist = D1; live.lastE = e1;
    const v = curSpeed(); if (v && v.span >= 5 && v.mps > live.max && v.mps < MAXSPD) live.max = v.mps;
    persist(); paint();
  }

  function announce(k, n) {
    const cum = live.cum[k], split = cum[n - 1] - (cum[n - 2] || 0);
    say(`${n} ${unitWord(k, n)}. Time, ${spoken(cum[n - 1])}. Last ${k === "mi" ? "mile" : "kilometre"}, ${spoken(split)}.`);
  }

  // Speed over the last ~10 seconds of the current stretch; it falls to zero when you stop.
  function curSpeed() {
    if (!live || live.state !== "running") return null;
    const seg = live.segs[live.segs.length - 1]; if (seg.length < 2) return null;
    const nowRel = Date.now() - live.start, last = seg[seg.length - 1], end = nowRel - last[2] < 3000 ? last[2] : nowRel;
    let i = seg.length - 1, d = 0;
    while (i > 0 && seg[i][2] > end - 10000) { d += hav(seg[i - 1], seg[i]); i--; }
    const span = (end - seg[i][2]) / 1000; if (span < 2) return null;
    return { mps: d / span, span };
  }

  function pause() { if (!live) return; const now = Date.now(); if (live.state === "running") live.acc += now - live.resumedAt; live.state = "paused"; say("Paused"); persist(true); paint(true); }
  function resume() { if (!live) return; live.state = "running"; live.resumedAt = Date.now(); live.segs.push([]); live.lastE = elapsed(); live.lastMoveAt = Date.now(); say("Resumed"); persist(true); paint(true); }
  const thin = seg => { const o = []; for (const p of seg) if (!o.length || hav(o[o.length - 1], p) >= 5) o.push(p.slice(0, 3)); const l = seg[seg.length - 1]; if (l && o.length && o[o.length - 1][2] !== l[2]) o.push(l.slice(0, 3)); return o; };
  function finish(save) {
    if (!live) return;
    if (live.state === "running") live.acc += Date.now() - live.resumedAt;
    const r = { id: live.id, start: live.start, dur: Math.round(live.acc), dist: Math.round(live.dist * 10) / 10, max: live.max, cum: live.cum, segs: live.segs.map(thin).filter(s => s.length), note: "" };
    live = null; try { localStorage.removeItem("stride-live"); } catch {}
    stopWatch(); wakeOff(); close();
    if (save) { runs.unshift(r); sv("stride-runs", runs); say(`Run saved. ${fmtDist(r.dist)} ${unitWord(set.unit, 2)} in ${spoken(r.dur)}.`); location.hash = `#/r/${r.id}`; }
    else { toast("Run discarded"); render(); }
  }
  // Auto-pause and screen refresh
  setInterval(() => {
    if (live && set.autoPause && live.state === "running") {
      const now = Date.now();
      if (now - live.lastMoveAt > 10000 && now - live.resumedAt > 10000) { live.acc += Math.max(0, live.lastMoveAt - live.resumedAt); live.state = "auto"; say("Auto paused"); persist(true); paint(true); }
    }
    if (live || acquiring) paint();
  }, 500);

  /* ---------- drawing ---------- */
  function canv(c) { const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1; c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr); const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0); return [x, r.width, r.height]; }
  const pairSpeeds = segs => segs.map(s => s.map((p, i) => i ? hav(s[i - 1], p) / Math.max(0.5, (p[2] - s[i - 1][2]) / 1000) : null));
  const speedHue = (v, lo, hi) => 4 + 76 * Math.max(0, Math.min(1, hi > lo ? (v - lo) / (hi - lo) : .5));
  function drawRoute(c, segs, opts = {}) {
    const [x, W, H] = canv(c); x.clearRect(0, 0, W, H);
    const pts = segs.flat();
    if (pts.length < 2) { x.fillStyle = "#93a09a"; x.font = "14px system-ui"; x.textAlign = "center"; x.fillText(opts.empty || "Your route will appear here", W / 2, H / 2 + 5); return; }
    let a = Infinity, b = -Infinity, cc = Infinity, d = -Infinity; for (const p of pts) { a = Math.min(a, p[0]); b = Math.max(b, p[0]); cc = Math.min(cc, p[1]); d = Math.max(d, p[1]); }
    const k = Math.cos(rad((a + b) / 2)), pad = 16, sx = (d - cc) * k || 1e-9, sy = (b - a) || 1e-9, s = Math.min((W - pad * 2) / sx, (H - pad * 2) / sy);
    const ox = (W - sx * s) / 2, oy = (H - sy * s) / 2, X = p => ox + (p[1] - cc) * k * s, Y = p => H - oy - (p[0] - a) * s;

  const IC = { share: `<svg class="ic2" viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>`, add: `<svg class="ic2" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>`, more: `<span class="dots3">•••</span>` };
  const installBody = () => deferred ? `<button class="btn pri block" data-act="doinstall">Install Stride</button>`
    : inApp ? `<p class="small">You're inside another app's browser, which can't install apps or track runs well. Tap ${IC.more} or the menu and choose <b>Open in ${isIOS ? "Safari" : "browser"}</b>.</p><button class="btn block" data-act="copylink">Copy the link</button>`
    : isIOS && iosBrowser ? `<ol class="isteps"><li>Tap <b>Share</b> ${IC.share} in ${iosBrowser}'s address bar.</li><li>Tap <b>Add to Home Screen</b> ${IC.add} (you may need <b>More</b>).</li><li>Tap <b>Add</b>.</li></ol>`
    : isIOS ? `<ol class="isteps"><li>Tap <b>Share</b> ${IC.share} at the bottom of Safari. On newer iPhones, tap ${IC.more} first, then <b>Share</b>.</li><li>Scroll down and tap <b>Add to Home Screen</b> ${IC.add}.</li><li>Leave <b>Open as Web App</b> on and tap <b>Add</b>.</li></ol>`
    : isAndroid ? `<ol class="isteps"><li>Tap the <b>⋮</b> menu in Chrome.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>`
    : `<ol class="isteps"><li>Use the install icon in the address bar, or the browser menu's <b>Install</b>.</li></ol>`;
  function showInstall(force) {
    if (isStandalone() || (!force && ($(".back") || live || acquiring))) return;
    if (!force) { try { if (Date.now() - (+localStorage.getItem("stride-install-snooze") || 0) < 5 * 864e5) return; } catch {} }
    sheet(`<div class="row" style="gap:14px"><img src="icons/icon-192.png" width="56" height="56" style="border-radius:14px" alt=""><div><h2 style="margin:0">Install Stride</h2><p class="small muted" style="margin:0">Opens full screen from your home screen and works offline.</p></div></div><div id="ib" style="margin-top:12px">${installBody()}</div><button class="btn block" data-act="notnow" style="background:none;border:0">Not now</button>`);
  }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; const b = $("#ib"); if (b) b.innerHTML = installBody(); });

  /* ---------- actions ---------- */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act;
    if (a === "start") { primeVoice(); acquiring = true; startWatch(); wakeOn(); if (fix && fix.acc <= GOODACC && Date.now() - fix.at < 5000) begin(); else paint(true); }
    else if (a === "begin") { begin(); }
    else if (a === "cancel") { acquiring = false; stopWatch(); wakeOff(); paint(true); }
    else if (a === "recenter") { follow = true; el.classList.remove("show"); if (fix && liveMap) liveMap.setView([fix.lat, fix.lon], Math.max(liveMap.getZoom(), 16)); }
    else if (a === "pause") pause();
    else if (a === "resume") resume();
    else if (a === "finish") finishSheet();
    else if (a === "save") finish(true);
    else if (a === "keep") close();
    else if (a === "discard") { if (confirm("Discard this run? It can't be undone.")) finish(false); }
    else if (a === "swap") { set.primary = set.primary === "pace" ? "speed" : "pace"; saveSet(); paint(true); }
    else if (a === "settings") settingsSheet();
    else if (a === "unit" || a === "prim") { set[a === "unit" ? "unit" : "primary"] = el.dataset.v; saveSet(); settingsSheet(); render(); }
    else if (a === "tog") { set[el.dataset.k] = !set[el.dataset.k]; saveSet(); el.classList.toggle("on", set[el.dataset.k]); }
    else if (a === "gpx") { const r = runs.find(x => x.id === el.dataset.id); if (r) download(`stride-${new Date(r.start).toISOString().slice(0, 10)}.gpx`, gpx(r), "application/gpx+xml"); }
    else if (a === "del") { if (confirm("Delete this run?")) { runs = runs.filter(x => x.id !== el.dataset.id); sv("stride-runs", runs); location.hash = "#/history"; } }
    else if (a === "export") download(`stride-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: "stride", v: 1, runs }), "application/json");
    else if (a === "import") { const i = document.createElement("input"); i.type = "file"; i.accept = ".json,application/json"; i.onchange = async () => { try { const d = JSON.parse(await i.files[0].text()); if (d.app !== "stride" || !Array.isArray(d.runs)) throw 0; const have = new Set(runs.map(r => r.id)); let n = 0; d.runs.forEach(r => { if (r && r.id && !have.has(r.id) && Array.isArray(r.segs)) { runs.push(r); n++; } }); runs.sort((x, y) => y.start - x.start); sv("stride-runs", runs); close(); render(); toast(`Restored ${n} run${n === 1 ? "" : "s"}`); } catch { toast("That isn't a Stride backup"); } }; i.click(); }
    else if (a === "install") showInstall(true);
    else if (a === "doinstall" && deferred) { const ev = deferred; deferred = null; ev.prompt(); ev.userChoice.finally(close); }
    else if (a === "notnow") { try { localStorage.setItem("stride-install-snooze", String(Date.now())); } catch {} close(); }
    else if (a === "copylink") { navigator.clipboard?.writeText(location.href.split("#")[0]).then(() => toast("Link copied")); }
  });

  /* ---------- start ---------- */
  if (live) { if (live.state === "acquiring") live = null; else { startWatch(); wakeOn(); setTimeout(() => toast("Your run is still going"), 300); } }
  render();
  setTimeout(() => showInstall(false), 6000);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
