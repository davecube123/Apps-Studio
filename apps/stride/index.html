    box-shadow: 0 0 0 10px rgba(212, 250, 74, .10), 0 0 0 22px rgba(212, 250, 74, .04), 0 20px 60px rgba(212, 250, 74, .28); animation: glow 2.6s ease-in-out infinite; }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }

  /* run detail */

  canvas.chart { width: 100%; height: 170px; display: block; }
  canvas.route { width: 100%; height: 100%; display: block; }
  .note { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); padding: 8px 0; font: inherit; font-size: 15px; outline: none; }
  .note:focus { border-color: var(--lime); }
  .btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 15px 16px; border-radius: 16px; border: 0; background: var(--s1); font-weight: 700; font-size: 15.5px; }

    background: rgba(22, 24, 25, .84); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); border: 1px solid rgba(255, 255, 255, .07); box-shadow: 0 12px 40px rgba(0, 0, 0, .55); }

<script>
(() => {
  "use strict";
  const VER = "6";

      <div class="minis"><div class="mini"><div class="v num">${fmtDist(moD)}<small>${UL()}</small></div><div class="k">This month</div></div><div class="mini"><div class="v num">${fmtDist(allD)}<small>${UL()}</small></div><div class="k">All time</div></div><div class="mini"><div class="v num">${fmtDist(longest)}<small>${UL()}</small></div><div class="k">Longest</div></div></div>
      <h3>Runs</h3>
      ${runs.length ? runs.map(r => `<a class="rcard" href="#/r/${r.id}"><canvas data-thumb="${r.id}"></canvas><div style="min-width:0;flex:1"><div class="t">${esc(titleOf(r))}</div><div class="d">${esc(fmtDate(r.start))}</div>
          <div class="m num"><div><b>${fmtDist(r.dist)}</b><span>${UL()}</span></div><div><b>${fmtPace(avgOf(r))}</b><span>/${UL()}</span></div><div><b>${fmtTime(r.dur)}</b><span>time</span></div></div></div></a>`).join("")
        : `<div class="empty">${I.run}<p>No runs yet. Tap <b>Run</b>, then <b>Start</b>, and your runs will gather here.</p></div>`}`;
  }
  function detailView(r) {
    const cum = r.cum[set.unit] || [], splits = cum.map((t, i) => t - (cum[i - 1] || 0)), restD = r.dist - cum.length * U(), restT = r.dur - (cum[cum.length - 1] || 0);
    const best = splits.length ? Math.min(...splits) : null;
    const avg = avgOf(r);
    return `<div class="hero">${HAS_MAP ? `<div class="map" id="map"></div>` : `<div class="map"><canvas class="route" id="route"></canvas></div>`}<div class="fade"></div>
        <div class="topbar"><a class="iconb glass" href="#/history" aria-label="Back">${I.back}</a></div></div>
      <div class="pad">
        <div class="eyebrow" style="margin-top:6px">${esc(fmtDate(r.start))}</div>
        <h1 style="margin:4px 0 2px">${esc(titleOf(r))}</h1>
        <input class="note" id="note" placeholder="Rename this run" value="${esc(r.note)}">
        <div class="dstats num">
          <div><div class="v">${fmtDist(r.dist)}<small>${UL()}</small></div><div class="k">Distance</div></div>
          <div><div class="v">${fmtTime(r.dur)}</div><div class="k">Time</div></div>
          <div><div class="v">${fmtPace(avg)}<small>/${UL()}</small></div><div class="k">Avg pace</div></div>
          <div><div class="v">${fmtSpd(avg)}<small>${SL()}</small></div><div class="k">Avg speed</div></div>
          <div><div class="v">${r.max ? fmtSpd(r.max) : "–"}<small>${SL()}</small></div><div class="k">Top speed</div></div>
          <div><div class="v">${best ? fmtTime(best) : "–"}</div><div class="k">Best ${UL()}</div></div>
        </div>
        <div class="legend"><span>Slower</span><span class="g"></span><span>Faster</span></div>
        ${r.wo && r.wo.laps.length ? `<h3>Workout · ${esc(r.wo.name)}</h3><div class="card">${r.wo.laps.map(l => `<div class="lap num" style="--kc:${kCol(l.k)}"><span class="k"><i></i>${kName(l.k)}${l.part ? " (part)" : l.skip ? " (skipped)" : ""}</span><span>${fmtTime(l.t)}</span><span>${l.d >= 1000 ? (l.d / 1000).toFixed(2) + " km" : l.d + " m"}</span><span class="muted">${fmtPace(l.t > 0 ? l.d / (l.t / 1000) : 0)}</span></div>`).join("")}</div><div class="tiny muted" style="margin-top:8px">Each step: time, distance and pace per ${UL()}.</div>` : ""}
        <h3>Splits</h3>
        ${splits.length || restD > 1 ? `<div class="card">${splits.map((s, i) => `<div class="split num${s === best && splits.length > 1 ? " best" : ""}"><span class="muted">${i + 1}</span><div class="bar" style="width:${Math.max(8, 100 * (best / s))}%"></div><span>${fmtTime(s)}</span><span class="muted tiny">${fmtSpd(U() / (s / 1000))}</span></div>`).join("")}
          ${restD > 1 ? `<div class="split part num"><span class="muted tiny">${(restD / U()).toFixed(2)}</span><div class="bar" style="width:${Math.max(8, 100 * ((best || restT / (restD / U())) / (restT / (restD / U()))))}%"></div><span>${fmtTime(restT)}</span><span class="muted tiny">${fmtSpd(restD / Math.max(1, restT / 1000))}</span></div>` : ""}</div>
          <div class="tiny muted" style="margin-top:8px">Time for each ${set.unit === "mi" ? "mile" : "kilometre"}, with speed in ${SL()}. Your best is in lime.</div>` : `<p class="muted small">Splits appear after your first ${set.unit === "mi" ? "mile" : "kilometre"}.</p>`}
        <h3>Speed · ${SL()}</h3>
        <div class="card" style="padding:14px"><canvas class="chart" id="chart"></canvas></div>
        <button class="btn block" data-act="gpx" data-id="${r.id}">Export GPX (Strava and others)</button>
        <button class="btn block danger" data-act="del" data-id="${r.id}">Delete this run</button>
      </div>`;
  }

  /* ---------- router ---------- */
  let view = "run";
  function render() {
    const h = location.hash.replace(/^#\/?/, "").split("/"), app = $("#app");
    view = h[0] === "history" ? "history" : h[0] === "r" ? "detail" : h[0] === "workouts" ? "workouts" : h[0] === "w" ? "editor" : "run";
    $$(".tabsbar a").forEach(a => a.classList.toggle("on", a.dataset.tab === (view === "detail" ? "history" : view === "editor" ? "workouts" : view)));
    editing = null; woKey = "";
    dropLiveMap(); document.body.classList.remove("running");
    app.className = view === "run" || view === "detail" ? "flush" : "";
    if (view === "run") { app.innerHTML = runView(); lastState = ""; initLiveMap(); paint(true); }
    else if (view === "history") { app.innerHTML = historyView(); tabDot(); $$("canvas[data-thumb]").forEach(c => { const r = runs.find(x => x.id === c.dataset.thumb); if (r) drawRoute(c, r.segs, { mono: true, thumb: true, empty: " " }); }); }
    else if (view === "workouts") { app.innerHTML = workoutsView(); tabDot(); }
    else if (view === "editor") {
      const w = workouts.find(x => x.id === h[1]); if (!w) { location.replace("#/workouts"); return; }
      editing = w; app.innerHTML = editorView(w); tabDot();
      $("#wname").addEventListener("change", e => { w.name = e.target.value.trim().slice(0, 60) || "Workout"; saveW(); });
    }
    else {
      const r = runs.find(x => x.id === h[1]); if (!r) { location.replace("#/history"); return; }
      app.innerHTML = detailView(r); tabDot();
      if (HAS_MAP) detailMap(r); else drawRoute($("#route"), r.segs, { empty: "No GPS route was recorded" }); drawChart($("#chart"), r.segs);
      $("#note").addEventListener("change", e => { r.note = e.target.value.trim().slice(0, 80); sv("stride-runs", runs); toast("Saved"); });
    }
    scrollTo(0, 0);
  }
  addEventListener("hashchange", render);
  let rsT; addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { if (view === "run") { liveMap?.invalidateSize(); paint(true); } else if (view === "detail") drawChart($("#chart"), (runs.find(x => location.hash.endsWith(x.id)) || { segs: [] }).segs); }, 200); });

  /* ---------- sheets ---------- */
  const close = () => $$(".back").forEach(b => b.remove());
  function sheet(html) { close(); const b = document.createElement("div"); b.className = "back"; b.innerHTML = `<div class="sheet">${html}</div>`; b.addEventListener("click", e => { if (e.target === b) b.remove(); }); document.body.appendChild(b); return b; }
  function settingsSheet() {
    sheet(`<h2>Settings</h2>
      <div class="opt"><span>Units</span><div class="seg" style="width:160px"><button data-act="unit" data-v="km" class="${set.unit === "km" ? "on" : ""}">km</button><button data-act="unit" data-v="mi" class="${set.unit === "mi" ? "on" : ""}">miles</button></div></div>
      <div class="opt"><span>Big number shows</span><div class="seg" style="width:160px"><button data-act="prim" data-v="pace" class="${set.primary === "pace" ? "on" : ""}">pace</button><button data-act="prim" data-v="speed" class="${set.primary === "speed" ? "on" : ""}">speed</button></div></div>
      <div class="opt"><div><div>Voice cues</div><div class="tiny muted">Time and split every ${set.unit === "mi" ? "mile" : "kilometre"}, plus pause and resume</div></div><button class="sw ${set.voice ? "on" : ""}" data-act="tog" data-k="voice" aria-label="Voice cues"></button></div>
      <h3 style="margin-top:20px">Vibration</h3>
      <div class="opt"><div><div>Vibrate on step changes</div><div class="tiny muted">Each kind of step has its own pattern, so you can feel what's next</div></div><button class="sw ${set.vibe !== false ? "on" : ""}" data-act="tog" data-k="vibe" aria-label="Vibrate on step changes"></button></div>
      <div class="opt"><div><div>Countdown ticks</div><div class="tiny muted">A short tick at 3, 2 and 1 seconds before a timed step ends</div></div><button class="sw ${set.ticks ? "on" : ""}" data-act="tog" data-k="ticks" aria-label="Countdown ticks"></button></div>
      ${Object.keys(KINDS).map(k => `<div class="opt"><span style="display:flex;align-items:center;gap:10px;font-weight:650"><i style="width:10px;height:10px;border-radius:3px;background:${kCol(k)};display:inline-block"></i>${kName(k)}</span><span class="row" style="gap:8px"><select class="vsel" data-vk="${k}">${Object.entries(VIBES).map(([id, [nm]]) => `<option value="${id}"${((set.vib || {})[k] || VIBE_DEFAULT[k]) === id ? " selected" : ""}>${nm}</option>`).join("")}</select><button class="btn" data-act="tryvib" data-k="${k}" style="padding:9px 12px">Try</button></span></div>`).join("")}
      <div class="opt"><span style="font-weight:650">Workout complete</span><button class="btn" data-act="tryvib" data-k="done" style="padding:9px 12px">Try</button></div>
      <h3 style="margin-top:20px">Run</h3>
      <div class="opt"><div><div>Auto-pause</div><div class="tiny muted">Pauses the clock when you stop (traffic lights), resumes when you move</div></div><button class="sw ${set.autoPause ? "on" : ""}" data-act="tog" data-k="autoPause" aria-label="Auto-pause"></button></div>
      <button class="btn block" data-act="export">Back up my runs</button>
      <button class="btn block" data-act="import">Restore a backup</button>
      ${CAP || isStandalone() ? "" : `<button class="btn pri block" data-act="install">Install Stride</button>`}
      ${CAP ? "" : `<a class="btn block" href="${APK}">Get the Android app (runs with the screen locked)</a>`}
      <p class="tiny muted" style="text-align:center;margin-top:16px">Stride v${VER}${CAP ? " (Android app)" : ""} · your runs stay on this phone</p>`);
  }
  function finishSheet() {
    const el = elapsed(), avg = el > 1000 ? live.dist / (el / 1000) : 0;
    sheet(`<h2>Finish this run?</h2><p class="muted num">${fmtDist(live.dist)} ${UL()} · ${fmtTime(el)} · ${fmtPace(avg)} /${UL()}</p>
      <button class="btn pri block" data-act="save">Save run</button>
      <button class="btn block" data-act="keep">Keep going</button>
      <button class="btn block danger" data-act="discard">Discard</button>`);
  }
  async function download(name, text, type) {
    if (CAP && NP.Filesystem && NP.Share) {
      try { const f = await NP.Filesystem.writeFile({ path: name, data: text, directory: "CACHE", encoding: "utf8" }); await NP.Share.share({ title: name, url: f.uri, dialogTitle: "Save or send " + name }); } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast("Couldn't share the file"); }
      return;
    }
    const file = new File([text], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iphone|ipad|android/i.test(navigator.userAgent)) { navigator.share({ files: [file] }).catch(() => {}); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function gpx(r) {
    const name = r.note || `Run ${new Date(r.start).toISOString().slice(0, 10)}`;
    return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Stride" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><time>${new Date(r.start).toISOString()}</time></metadata>\n<trk><name>${esc(name)}</name><type>running</type>\n${r.segs.map(s => `<trkseg>\n${s.map(p => `<trkpt lat="${p[0]}" lon="${p[1]}"><time>${new Date(r.start + p[2]).toISOString()}</time></trkpt>`).join("\n")}\n</trkseg>`).join("\n")}\n</trk>\n</gpx>\n`;
  }

  /* ---------- install prompt ---------- */
  let deferred = null; const UA = navigator.userAgent, isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1), isAndroid = /android/i.test(UA), inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Twitter|LinkedInApp|TikTok|musical_ly|Snapchat|Pinterest|GSA\//i.test(UA), iosBrowser = /CriOS/.test(UA) ? "Chrome" : /EdgiOS/.test(UA) ? "Edge" : /FxiOS/.test(UA) ? "Firefox" : "";
  const IC = { share: `<svg class="ic2" viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>`, add: `<svg class="ic2" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>`, more: `<span class="dots3">•••</span>` };
  const installBody = () => deferred ? `<button class="btn pri block" data-act="doinstall">Install Stride</button>`
    : inApp ? `<p class="small">You're inside another app's browser, which can't install apps or track runs well. Tap ${IC.more} or the menu and choose <b>Open in ${isIOS ? "Safari" : "browser"}</b>.</p><button class="btn block" data-act="copylink">Copy the link</button>`
    : isIOS && iosBrowser ? `<ol class="isteps"><li>Tap <b>Share</b> ${IC.share} in ${iosBrowser}'s address bar.</li><li>Tap <b>Add to Home Screen</b> ${IC.add} (you may need <b>More</b>).</li><li>Tap <b>Add</b>.</li></ol>`
    : isIOS ? `<ol class="isteps"><li>Tap <b>Share</b> ${IC.share} at the bottom of Safari. On newer iPhones, tap ${IC.more} first, then <b>Share</b>.</li><li>Scroll down and tap <b>Add to Home Screen</b> ${IC.add}.</li><li>Leave <b>Open as Web App</b> on and tap <b>Add</b>.</li></ol>`
    : isAndroid ? `<ol class="isteps"><li>Tap the <b>⋮</b> menu in Chrome.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>`
    : `<ol class="isteps"><li>Use the install icon in the address bar, or the browser menu's <b>Install</b>.</li></ol>`;
  function showInstall(force) {
    if (isStandalone() || (!force && ($(".back") || live || acquiring))) return;
    if (!force) { try { if (Date.now() - (+localStorage.getItem("stride-install-snooze") || 0) < 5 * 864e5) return; } catch {} }
    sheet(`<div class="row" style="gap:14px"><img src="icons/icon-192.png" width="56" height="56" style="border-radius:14px" alt=""><div><h2 style="margin:0">Install Stride</h2><p class="small muted" style="margin:0">Opens full screen from your home screen and works offline.</p></div></div><div id="ib" style="margin-top:12px">${installBody()}</div><button class="btn block" data-act="notnow" style="background:none;border:0">Not now</button>`);
  }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; const b = $("#ib"); if (b) b.innerHTML = installBody(); });

  /* ---------- actions ---------- */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act;
    if (a === "start") { primeVoice(); acquiring = true; startWatch(); wakeOn(); if (fix && fix.acc <= GOODACC && Date.now() - fix.at < 5000) begin(); else paint(true); }
    else if (a === "begin") { begin(); }
    else if (a === "cancel") { acquiring = false; stopWatch(); wakeOff(); paint(true); }
    else if (a === "recenter") { follow = true; el.classList.remove("show"); if (fix && liveMap) liveMap.setView([fix.lat, fix.lon], Math.max(liveMap.getZoom(), 16)); }
    else if (a === "pickwo") sheet(`<h2>Choose a workout</h2>
        <button class="btn block" data-act="choose" data-id="">${!chosen ? "✓ " : ""}Free run (no workout)</button>
        ${workouts.map(w => `<button class="btn block" data-act="choose" data-id="${w.id}" style="flex-direction:column;align-items:stretch;text-align:left"><span>${w.id === chosen ? "✓ " : ""}${esc(w.name)}</span><span class="tiny muted" style="font-weight:400">${esc(wSummary(w))}</span>${strip(w)}</button>`).join("")}
        <a class="btn block" href="#/workouts" style="background:none">Edit or create workouts ›</a>`);
    else if (a === "choose") { chosen = el.dataset.id; sv("stride-chosen", chosen); close(); woKey = ""; paint(true); }
    else if (a === "skipstep") { if (live && live.wo && !live.wo.done) { nextStep(true); woKey = ""; paint(true); } }
    else if (a === "neww") { const w = { id: "w-" + Date.now().toString(36), name: "My workout", steps: [S("warm", 5, "min"), REP(4, [S("fast", 1, "min"), S("easy", 2, "min")]), S("cool", 5, "min")] }; workouts.push(w); saveW(); location.hash = `#/w/${w.id}`; }
    else if (a === "addstep") { const p = el.dataset.path; (p === "" ? editing.steps : editing.steps[+p].steps).push(S("easy", 1, "min")); saveW(); const y = scrollY; render(); scrollTo(0, y); }
    else if (a === "addrep") { editing.steps.push(REP(4, [S("fast", 30, "sec"), S("easy", 1, "min")])); saveW(); const y = scrollY; render(); scrollTo(0, y); }
    else if (a === "upstep") { const [arr, k] = at(editing, el.dataset.path); if (k > 0) { [arr[k - 1], arr[k]] = [arr[k], arr[k - 1]]; saveW(); const y = scrollY; render(); scrollTo(0, y); } }
    else if (a === "delstep") { const [arr, k] = at(editing, el.dataset.path); arr.splice(k, 1); editing.steps = editing.steps.filter(x => !x.rep || x.steps.length); saveW(); const y = scrollY; render(); scrollTo(0, y); }
    else if (a === "usew") { chosen = el.dataset.id; sv("stride-chosen", chosen); location.hash = "#/"; if (!live) toast("Workout selected. Tap Start when you're ready."); }
    else if (a === "dupw") { const w = workouts.find(x => x.id === el.dataset.id); if (w) { const c = JSON.parse(JSON.stringify(w)); c.id = "w-" + Date.now().toString(36); c.name = w.name + " (copy)"; workouts.push(c); saveW(); location.hash = `#/w/${c.id}`; } }
    else if (a === "delw") { if (confirm("Delete this workout?")) { workouts = workouts.filter(x => x.id !== el.dataset.id); if (chosen === el.dataset.id) { chosen = ""; sv("stride-chosen", ""); } saveW(); location.hash = "#/workouts"; } }
    else if (a === "tryvib") buzz(el.dataset.k === "done" ? DONE_VIBE : vibeFor(el.dataset.k), true);
    else if (a === "pause") pause();
    else if (a === "resume") resume();
    else if (a === "finish") finishSheet();
    else if (a === "save") finish(true);
    else if (a === "keep") close();
    else if (a === "discard") { if (confirm("Discard this run? It can't be undone.")) finish(false); }
    else if (a === "swap") { set.primary = set.primary === "pace" ? "speed" : "pace"; saveSet(); paint(true); }
    else if (a === "settings") settingsSheet();
    else if (a === "unit" || a === "prim") { set[a === "unit" ? "unit" : "primary"] = el.dataset.v; saveSet(); settingsSheet(); render(); }
    else if (a === "tog") { set[el.dataset.k] = !set[el.dataset.k]; saveSet(); el.classList.toggle("on", set[el.dataset.k]); }
    else if (a === "gpx") { const r = runs.find(x => x.id === el.dataset.id); if (r) download(`stride-${new Date(r.start).toISOString().slice(0, 10)}.gpx`, gpx(r), "application/gpx+xml"); }
    else if (a === "del") { if (confirm("Delete this run?")) { runs = runs.filter(x => x.id !== el.dataset.id); sv("stride-runs", runs); location.hash = "#/history"; } }
    else if (a === "export") download(`stride-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: "stride", v: 2, runs, workouts }), "application/json");
    else if (a === "import") { const i = document.createElement("input"); i.type = "file"; i.accept = ".json,application/json"; i.onchange = async () => { try { const d = JSON.parse(await i.files[0].text()); if (d.app !== "stride" || !Array.isArray(d.runs)) throw 0; const have = new Set(runs.map(r => r.id)); let n = 0; d.runs.forEach(r => { if (r && r.id && !have.has(r.id) && Array.isArray(r.segs)) { runs.push(r); n++; } });
          if (Array.isArray(d.workouts)) { const hw = new Set(workouts.map(w => w.id)); d.workouts.forEach(w => { if (w && w.id && !hw.has(w.id) && Array.isArray(w.steps)) workouts.push(w); }); saveW(); } runs.sort((x, y) => y.start - x.start); sv("stride-runs", runs); close(); render(); toast(`Restored ${n} run${n === 1 ? "" : "s"}`); } catch { toast("That isn't a Stride backup"); } }; i.click(); }
    else if (a === "install") showInstall(true);
    else if (a === "doinstall" && deferred) { const ev = deferred; deferred = null; ev.prompt(); ev.userChoice.finally(close); }
    else if (a === "notnow") { try { localStorage.setItem("stride-install-snooze", String(Date.now())); } catch {} close(); }
    else if (a === "copylink") { navigator.clipboard?.writeText(location.href.split("#")[0]).then(() => toast("Link copied")); }
  });

  /* ---------- start ---------- */
  if (live) { if (live.state === "acquiring") live = null; else { startWatch(); wakeOn(); setTimeout(() => toast("Your run is still going"), 300); } }
  render();
  if (!CAP) {
    setTimeout(() => showInstall(false), 6000);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
