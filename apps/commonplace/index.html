<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Commonplace">
  <link rel="preload" href="fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Commonplace</title>
  <style>
    @font-face { font-family: "Newsreader"; src: url(fonts/newsreader.woff2) format("woff2"); font-weight: 200 800; font-style: normal; font-display: swap; }
    @font-face { font-family: "Newsreader"; src: url(fonts/newsreader-italic.woff2) format("woff2"); font-weight: 200 800; font-style: italic; font-display: swap; }
    :root {
      --bg: #f5f2ec; --card: #fffdf9; --label: #1b1a17; --label2: rgba(40,35,25,.6); --label3: rgba(40,35,25,.32);
      --sep: rgba(40,35,25,.12); --fill: rgba(40,35,25,.06); --tint: #b5652d; --tint-soft: rgba(181,101,45,.12);
      --page: #fbf8f2; --ink: #22201b;
      --c1: rgba(233,180,60,.38); --c2: rgba(232,120,130,.32); --c3: rgba(110,180,130,.34); --c4: rgba(100,160,230,.32);
      --c1s: #d9a227; --c2s: #d9707c; --c3s: #5fa877; --c4s: #5b97d8;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      --serif: "Newsreader", "New York", ui-serif, Georgia, serif;
      --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.3,1.3,.5,1);
      --shadow: 0 1px 2px rgba(40,30,10,.06), 0 8px 24px rgba(40,30,10,.07);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-theme="sepia"]) {
      --bg: #121318; --card: #1c1d23; --label: #f1ede6; --label2: rgba(241,237,230,.62); --label3: rgba(241,237,230,.3); --sep: rgba(241,237,230,.1);
      --fill: rgba(241,237,230,.07); --tint: #e0955a; --tint-soft: rgba(224,149,90,.15); --page: #16171c; --ink: #e9e4da;
      --c1: rgba(233,180,60,.3); --c2: rgba(232,120,130,.28); --c3: rgba(110,180,130,.28); --c4: rgba(100,160,230,.28); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
    :root[data-theme="dark"] {
      --bg: #121318; --card: #1c1d23; --label: #f1ede6; --label2: rgba(241,237,230,.62); --label3: rgba(241,237,230,.3); --sep: rgba(241,237,230,.1);
      --fill: rgba(241,237,230,.07); --tint: #e0955a; --tint-soft: rgba(224,149,90,.15); --page: #16171c; --ink: #e9e4da;
      --c1: rgba(233,180,60,.3); --c2: rgba(232,120,130,.28); --c3: rgba(110,180,130,.28); --c4: rgba(100,160,230,.28); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }
    :root[data-theme="sepia"] { --bg: #efe5d2; --card: #f7efdf; --page: #f4ead6; --ink: #3b2f22; --label: #3b2f22; --sep: rgba(80,60,30,.15); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    html, body { overflow-x: clip; } /* nothing may ever stick out sideways: on phones that makes the browser zoom out */
    body { margin: 0; background: var(--bg); color: var(--label); font: 17px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
    main { max-width: 760px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 100px); }
    h1 { font: 700 34px/1.12 var(--sans); letter-spacing: .005em; margin: 6px 0 4px; }
    h2 { font: 700 22px/1.2 var(--sans); margin: 0; }
    h3 { font: 600 17px/1.3 var(--sans); margin: 0; }
    p { margin: .35em 0; }
    a { color: var(--tint); text-decoration: none; }
    .sub { color: var(--label2); } .fine { font-size: 13px; color: var(--label2); }
    .caps { font: 600 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--label2); }
    .serif { font-family: var(--serif); }
    .row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
    .hide { display: none !important; }
    .view.enter > * { animation: rise .4s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .btn { appearance: none; border: 0; border-radius: 12px; min-height: 46px; padding: 12px 18px; font: 600 16px var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
           background: var(--tint); color: #fff; transition: transform .2s var(--spring); }
    .btn:active { transform: scale(.96); }
    .btn.gray { background: var(--fill); color: var(--label); } .btn.plain { background: none; color: var(--tint); }
    .btn.sm { min-height: 34px; padding: 7px 14px; font-size: 14px; border-radius: 999px; }
    .btn.block { width: 100%; }
    .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--fill); color: var(--label); display: grid; place-items: center; cursor: pointer; flex: none; }
    .icon-btn svg, .tb svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .chip { border: 0; background: var(--fill); color: var(--label); border-radius: 999px; padding: 6px 12px; font: 500 14px var(--sans); cursor: pointer; white-space: nowrap; transition: all .2s var(--ease); }
    .chip.on { background: var(--label); color: var(--bg); }
    .chips { display: flex; gap: 7px; flex-wrap: wrap; }
    .chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 2px 18px; } .chips.scroll::-webkit-scrollbar { display: none; }
    .seg { display: flex; background: var(--fill); border-radius: 10px; padding: 3px; }
    .seg button { flex: 1; border: 0; background: none; color: var(--label); font: 500 14px var(--sans); padding: 8px 4px; border-radius: 8px; cursor: pointer; }
    .seg button.on { background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,.1); font-weight: 600; }
    input[type=text], input[type=search], input[type=number], textarea { width: 100%; border: 0; outline: 0; background: transparent; color: var(--label); font: 17px/1.45 var(--sans); resize: none; padding: 0; }
    .field { background: var(--card); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
    .field label { display: block; font: 600 12px var(--sans); color: var(--label2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .search { background: var(--fill); border-radius: 12px; padding: 10px 14px; display: flex; gap: 8px; align-items: center; }
    .search svg { width: 18px; height: 18px; stroke: var(--label3); fill: none; stroke-width: 2; flex: none; }

    /* Library */
    .shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 14px; margin-top: 16px; align-items: start; }
    @media (min-width: 700px) { .shelf { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px 20px; } }
    .book { cursor: pointer; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; display: flex; flex-direction: column; gap: 8px; }
    .cover { container-type: inline-size; aspect-ratio: 2 / 3; width: 100%; height: auto; border-radius: 4px 9px 9px 4px; overflow: hidden; position: relative; box-shadow: 0 2px 4px rgba(0,0,0,.12), 0 12px 28px rgba(0,0,0,.16);
             transition: transform .3s var(--spring); background: #444; }
    .book:active .cover { transform: scale(.97); }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .cover img.wide { object-fit: contain; object-position: center; background: #fff; }
    .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.18), rgba(255,255,255,.08) 4%, transparent 9%); pointer-events: none; }
    .gen { position: absolute; inset: 0; padding: 16% 11% 11%; display: flex; flex-direction: column; justify-content: space-between; color: #fbf6ec; }
    .gen b { font: 600 13cqw/1.15 var(--serif); letter-spacing: -.005em; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .gen i { font: italic 8.5cqw var(--serif); opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gen hr { border: 0; border-top: 1px solid rgba(255,255,255,.4); width: 30%; margin: 7cqw 0; }
    .book .t { font: 600 13px/1.25 var(--sans); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .book .m { font-size: 11.5px; color: var(--label2); }
    .book .bar { height: 3px; border-radius: 3px; background: var(--fill); overflow: hidden; } .book .bar i { display: block; height: 100%; background: var(--tint); }
    .add { aspect-ratio: 2 / 3; border-radius: 9px; border: 1.5px dashed var(--label3); display: grid; place-items: center; text-align: center; color: var(--label2); cursor: pointer; font-size: 13px; padding: 6px; }
    .empty { text-align: center; padding: 50px 20px; }

    /* Quotes */
    .qcard { background: var(--card); border-radius: 16px; padding: 18px 18px 14px; box-shadow: var(--shadow); position: relative; cursor: pointer; transition: transform .25s var(--spring); border-left: 4px solid var(--c1s); }
    .qcard:active { transform: scale(.985); }
    .qcard + .qcard { margin-top: 12px; }
    .qcard .qt { font: 400 19px/1.5 var(--serif); color: var(--label); white-space: pre-wrap; padding-right: 26px; }
    .qcard .qt::before { content: "“"; } .qcard .qt::after { content: "”"; }
    .qcard .note { margin-top: 10px; color: var(--label2); font-size: 15px; white-space: pre-wrap; }
    .qcard .meta { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--label2); }
    .qcard .meta .go { margin-left: auto; color: var(--tint); font-weight: 600; white-space: nowrap; }
    .tag { background: var(--fill); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; color: var(--label); }
    .qcard .edit { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--label3); cursor: pointer; font-size: 18px; }

    /* Tab bar */
    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding: 6px 8px calc(env(safe-area-inset-bottom) + 4px);
               background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.6) blur(20px); -webkit-backdrop-filter: saturate(1.6) blur(20px); border-top: .5px solid var(--sep); }
    nav.tabs .inner { display: flex; width: 100%; max-width: 420px; }
    nav.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--label2); font: 500 10.5px var(--sans); padding: 3px 0; }
    nav.tabs a svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    nav.tabs a.on { color: var(--tint); }
    body.reading nav.tabs, body.reading main { display: none; }

    /* Reader (shared) */
    #reader { display: none; min-height: 100vh; background: var(--page); color: var(--ink); }
    body.reading #reader { display: block; } body.reading { background: var(--page); }
    .rbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; padding: calc(env(safe-area-inset-top) + 6px) 8px 6px; display: flex; align-items: center; gap: 2px;
            background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5);
            border-bottom: .5px solid var(--sep); transition: transform .3s var(--ease), opacity .25s; }
    .rbar .ttl { flex: 1; min-width: 0; text-align: center; font: 600 15px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); padding: 0 4px; }
    .tb { width: 42px; height: 42px; border: 0; background: none; color: var(--ink); border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
    .tb:active { background: var(--fill); } .tb.on svg { fill: var(--tint); stroke: var(--tint); }
    body.calm .rbar { transform: translateY(-100%); opacity: 0; pointer-events: none; }
    .rfoot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 20px calc(env(safe-area-inset-bottom) + 10px);
             background: color-mix(in srgb, var(--page) 90%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: .5px solid var(--sep);
             transition: transform .3s var(--ease), opacity .25s; }
    body.calm .rfoot { transform: translateY(100%); opacity: 0; pointer-events: none; }
    .rfoot .lbl { display: flex; justify-content: space-between; font: 500 12.5px var(--sans); color: var(--label2); margin-top: 4px; gap: 10px; }
    .rfoot .lbl span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rfoot .lbl span:last-child { text-align: right; flex: none; white-space: nowrap; }
    input[type=range].scrub { width: 100%; -webkit-appearance: none; appearance: none; background: transparent; height: 26px; margin: 0; }
    input[type=range].scrub::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(var(--tint), var(--tint)) 0 / var(--pct, 0%) 100% no-repeat, var(--sep); }
    input[type=range].scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.3); margin-top: -7.5px; }
    input[type=range].scrub::-moz-range-track { height: 3px; border-radius: 3px; background: var(--sep); } input[type=range].scrub::-moz-range-progress { height: 3px; background: var(--tint); }
    input[type=range].scrub::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    #pnum { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 8px); z-index: 25; text-align: center; font: 500 11.5px var(--sans); color: var(--label3);
            pointer-events: none; opacity: 0; transition: opacity .3s; font-variant-numeric: tabular-nums; }
    body.calm #pnum { opacity: 1; }
    .banner { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 62px); z-index: 29; background: var(--card); color: var(--label); border-radius: 12px; padding: 10px 14px;
              font-size: 14px; box-shadow: var(--shadow); max-width: 600px; margin: 0 auto; }

    /* Reflowable text: shared typography */
    #text { font-family: var(--rfont, var(--serif)); font-size: var(--rsize, 20px); line-height: var(--rline, 1.62); color: var(--ink); }
    #text h2.ch { font: 500 1.45em/1.2 var(--serif); text-align: center; margin: .4em 0 1.4em; letter-spacing: -.005em; break-after: avoid; }
    #text p { margin: 0 0 .85em; text-align: var(--ralign, left); hyphens: auto; -webkit-hyphens: auto; orphans: 2; widows: 2; }
    #text p.k-h { font: 600 1.08em/1.3 var(--sans); margin: 1.4em 0 .6em; break-after: avoid; text-align: left; }
    #text p.k-b { margin-left: 1.2em; font-style: italic; } #text p.k-l { margin-left: 1em; text-indent: -.8em; padding-left: .8em; }
    #text p.k-l::before { content: "•"; display: inline-block; width: .8em; }
    #text .pg { display: flex; align-items: center; gap: 12px; margin: 1.4em 0 1.2em; font: 500 11px var(--sans); letter-spacing: .1em; color: var(--label3); user-select: none; -webkit-user-select: none; }
    #text .pg::before, #text .pg::after { content: ""; flex: 1; border-top: .5px solid var(--sep); }
    #text mark { color: inherit; background: var(--c1); border-radius: 3px; padding: .05em 0; cursor: pointer; }
    #text mark.c2 { background: var(--c2); } #text mark.c3 { background: var(--c3); } #text mark.c4 { background: var(--c4); }
    #text mark.note { text-decoration: underline dotted var(--label3); text-underline-offset: 4px; }
    #text .find { background: var(--tint-soft); box-shadow: 0 0 0 2px var(--tint-soft); border-radius: 3px; }
    .pulse { animation: pulse 1.8s ease 2; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 40% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--tint) 35%, transparent); } }
    #text ::selection, .textLayer ::selection { background: color-mix(in srgb, var(--tint) 28%, transparent); }
    .endch { text-align: center; padding-top: 1.5em; break-inside: avoid; }

    /* Paragraph styles */
    #text.indent p:not(.k-h):not(.k-l):not(.k-b) { text-indent: 1.5em; margin-bottom: .3em; }
    #text.indent h2.ch + p, #text.indent p.k-h + p, #text.indent .pg + p { text-indent: 0; }
    #text p.brk { margin-bottom: 0 !important; } #text.just p.brk { text-align-last: justify; }
    #text p.cont { text-indent: 0 !important; } #text p.hy::after { content: "-"; }
    /* Vertical pages (ReadEra): the chapter cut into real pages, one under the other */
    #flow.vpages #text { padding: 0; }
    #flow.vpages .vpage { contain: layout paint; position: relative; border-bottom: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); overflow: hidden; }
    #flow.vpages .vpage .in { margin: 0 auto; height: 100%; overflow: hidden; box-sizing: border-box; }
    #flow.vpages .vpage .vno { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font: 500 10.5px var(--sans); color: var(--label3); }
    #flow.vpages #text .pg { display: none; }
    #flow.vpages .endch { padding-top: .6em; }
    /* Scroll mode */
    #flow.scroll #text { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 76px) var(--m, 26px) calc(env(safe-area-inset-bottom) + 110px); }
    /* Page mode: the chapter is laid out in screen-sized columns and slid sideways */
    #flow.paged { position: fixed; top: calc(env(safe-area-inset-top) + 62px); bottom: calc(env(safe-area-inset-bottom) + 40px); left: 0; right: 0; overflow: hidden; touch-action: pinch-zoom; }
    #flow.paged #frame { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); overflow: hidden; }
    #flow.paged #text { height: 100%; column-fill: auto; will-change: transform; }
    #flow.paged #text.anim { transition: transform .32s cubic-bezier(.25,.8,.25,1); }
    #flow.paged #text .pg { display: none; }
    #flow.paged #text img { max-height: 100%; }

    /* PDF: the original pages */
    #pdfv { padding: calc(env(safe-area-inset-top) + 64px) 0 calc(env(safe-area-inset-bottom) + 90px); }
    .ppage { position: relative; width: min(calc(100% - 12px), 920px); margin: 0 auto 14px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.1); }
    :root[data-theme="dark"] .ppage canvas { filter: invert(.92) hue-rotate(180deg); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-theme="sepia"]) .ppage canvas { filter: invert(.92) hue-rotate(180deg); } }
    :root[data-theme="sepia"] .ppage canvas { filter: sepia(.35) brightness(.97); }
    .ppage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hls { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .hls i { position: absolute; border-radius: 2px; background: var(--c1); mix-blend-mode: multiply; } .hls i.c2 { background: var(--c2); } .hls i.c3 { background: var(--c3); } .hls i.c4 { background: var(--c4); }
    .hls i.find { background: color-mix(in srgb, var(--tint) 30%, transparent); }
    .textLayer { position: absolute; inset: 0; overflow: hidden; opacity: 1; line-height: 1; text-align: initial; -webkit-text-size-adjust: none; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; z-index: 2; }
    .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
    .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: -1; cursor: default; user-select: none; }

    #qbar { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 70px); z-index: 40; display: flex; gap: 2px; padding: 5px;
            background: #1d1c1a; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.3); visibility: hidden; transform: translateX(-50%) translateY(calc(100% + 90px)); transition: transform .3s var(--spring), visibility 0s .3s; }
    #qbar.on { transform: translateX(-50%) translateY(0); visibility: visible; transition: transform .3s var(--spring); }
    body:not(.reading) #qbar { display: none; }
    #qbar button { border: 0; background: none; color: #fff; font: 600 14.5px var(--sans); padding: 10px 14px; border-radius: 999px; cursor: pointer; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
    #qbar button.main { background: var(--tint); }

    /* Sheets */
    .sheet-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s both; }
    .sheet { width: min(600px, 100%); background: var(--bg); color: var(--label); border-radius: 16px 16px 0 0; padding: 8px 18px calc(env(safe-area-inset-bottom) + 18px); max-height: 90vh; overflow: auto; animation: sheetup .38s var(--ease) both; }
    .sheet .grab { width: 36px; height: 5px; border-radius: 5px; background: var(--label3); margin: 0 auto 14px; }
    @keyframes sheetup { from { transform: translateY(100%); } to { transform: none; } }
    /* A panel that drops down from the top (the contents) */

    else if (a === "reimport") { replaceId = d.id; $("#file").click(); closeSheet(); } // the file picker must open within the tap
    else if (a === "sample") addSample().catch(() => toast("Couldn't load the sample"));
    else if (a === "open") closeSheet(() => { location.hash = "#/read/" + d.id; });
    else if (a === "close") { getSelection().removeAllRanges(); location.hash = "#/"; }
    else if (a === "nextch") { renderChapter(R.ch + 1); goTo({ p: 0 }); }
    else if (a === "toc") { panelTab = "toc"; contentsSheet(); }
    else if (a === "ptab") { panelTab = d.v; contentsSheet(); }
    else if (a === "closepanel") closeSheet();
    else if (a === "toctog" || a === "tocall") {
      const { toc, cur, pageOf } = R.tocView;
      if (a === "toctog") { const i = +d.i; R.tocOpen.has(i) ? R.tocOpen.delete(i) : R.tocOpen.add(i); }
      else if (allOpen(toc)) R.tocOpen.clear(); else toc.forEach((x, i) => tocKids(toc, i) && R.tocOpen.add(i));
      $("#toclist").innerHTML = tocRows(toc, cur, pageOf); const all = $("[data-act=tocall]"); if (all) all.textContent = allOpen(toc) ? "Collapse all" : "Expand all";
    }
    else if (a === "tocgo") { e.preventDefault(); const m = R.meta, t = (m.toc?.length ? m.toc : R.content.map((c, i) => ({ ch: i, p: 0 })))[+d.i]; goLoc(R.mode === "pdf" ? { page: t.page } : { ch: t.ch, p: t.p }); }
    else if (a === "gopage") { const v = +$("#gopage").value; if (v) { closeSheet(); goToPage(v); } }
    else if (a === "bmgo") { e.preventDefault(); if (e.target.closest("[data-act=bmdel]")) return; const b = R.meta.bookmarks[+d.i]; goLoc(R.mode === "pdf" ? { page: b.page } : { ch: b.ch, p: b.p, s: b.s || 0, pin: b.page }); }
    else if (a === "bmdel") { e.preventDefault(); e.stopPropagation(); R.meta.bookmarks.splice(+d.i, 1); saveLib(); markBookmark(); contentsSheet(); }
    else if (a === "bookmark") { const h = bmHere(), i = bmFind(h); if (i >= 0) { R.meta.bookmarks.splice(i, 1); toast("Bookmark removed"); } else { R.meta.bookmarks.push({ ...h, at: Date.now() }); toast(`Bookmarked p. ${h.page}`); } saveLib(); markBookmark(); }
    else if (a === "qgo") { e.preventDefault(); const q = quotes.find(x => x.id === d.q); if (q) goLoc(quoteAt(q)); }
    else if (a === "search") searchSheet();
    else if (a === "resgo") { e.preventDefault(); const h = R.hits[+d.k]; goLoc(R.mode === "pdf" ? { page: pageAt(R.meta, h.ch, h.p), term: h.t.slice(h.s, h.e) } : { ch: h.ch, p: h.p, s: h.s, e: h.e, find: true }); }
    else if (a === "type") typeSheet();
    else if (a === "size") relayout(() => { settings.size = Math.max(14, Math.min(32, settings.size + +d.v)); saveSettings(); });
    else if (["font", "line", "margin", "align", "flow", "indent"].includes(a)) {
      const v = a === "line" || a === "margin" ? +d.v : a === "indent" ? d.v === "1" : d.v; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el));
      if (reading()) relayout(() => { settings[a] = v; saveSettings(); }); else { settings[a] = v; saveSettings(); }
    }
    else if (a === "theme") { settings.theme = d.v; saveSettings(); applyTheme(); el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); }
    else if (a === "quote") { const i = selInfo(); if (!i) return; quoteSheet({ ...i, book: R.meta.id, page: i.kind === "pdf" ? i.page : pageAt(R.meta, i.ch, i.p, i.s), color: settings.lastColor || 1, tags: [], note: "" }); }
    else if (a === "copysel") { try { await navigator.clipboard.writeText(getSelection().toString()); toast("Copied"); } catch (err) { toast("Couldn't copy"); } }
    else if (a === "lookup") { const t = clean(getSelection().toString()).slice(0, 80); if (t) window.open("https://en.wiktionary.org/wiki/Special:Search?search=" + encodeURIComponent(t), "_blank", "noopener"); }
    else if (a === "qcolor") { draft.color = +d.v; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); $("#qprev").style.borderLeftColor = `var(--c${draft.color}s)`; }
    else if (a === "qtag") { const t = d.v; draft.tags.includes(t) ? draft.tags.splice(draft.tags.indexOf(t), 1) : draft.tags.push(t); el.classList.toggle("on"); }
    else if (a === "saveq") {
      addTag($("#newtag").value); draft.note = $("#qnote").value.trim(); const isNew = !draft.id;
      if (isNew) { draft.id = uid("q"); draft.at = Date.now(); quotes.push(draft); settings.lastColor = draft.color; saveSettings(); getSelection().removeAllRanges(); hideQbar(); }
      else Object.assign(quotes.find(q => q.id === draft.id), draft, { edited: Date.now() });
      await saveQuotes(); closeSheet(); toast(isNew ? "Quoted" : "Saved");
      if (reading()) refreshMarks(); else render();
    }
    else if (a === "delq") { if (!confirm("Delete this quote and its note?")) return; quotes = quotes.filter(q => q.id !== draft.id); await saveQuotes(); closeSheet(); if (reading()) refreshMarks(); else render(); }
    else if (a === "goto" || a === "gotoq") {
      if (a === "goto" && e.target.closest(".edit")) return;
      const q = quotes.find(x => x.id === (d.q || draft?.id)); if (!q || !library.some(b => b.id === q.book)) return toast("That book is no longer in your library");
      const h = `#/read/${q.book}/q/${q.id}`; closeSheet(() => { if (location.hash === h) openFromHash(h); else location.hash = h; });
    }
    else if (a === "editq") { e.stopPropagation(); const q = quotes.find(x => x.id === d.q); if (q) quoteSheet(q); }
    else if (a === "fbook") { qFilter.book = d.v; render(); } else if (a === "ftag") { qFilter.tag = qFilter.tag === d.v ? "" : d.v; render(); } else if (a === "sort") { qFilter.sort = d.v; render(); }
    else if (a === "gofilter") { qFilter = { book: d.id, tag: "", q: "", sort: "book" }; closeSheet(() => { location.hash = "#/quotes"; render(); }); }
    else if (a === "delbook") { const b = library.find(x => x.id === d.id), n = quotes.filter(q => q.book === d.id).length;
      if (!confirm(`Remove “${b.title}”?${n ? ` Its ${n} quote${n === 1 ? "" : "s"} stay in your collection.` : ""}`)) return;
      library = library.filter(x => x.id !== d.id); await saveLib(); await dbDel("content:" + d.id); await dbDel("file:" + d.id); closeSheet(); render(); }
    else if (a === "export") exportMd();
    else if (a === "backup") download(`commonplace-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: "commonplace", v: 2, quotes, books: library.map(b => ({ id: b.id, title: b.title, author: b.author, bookmarks: b.bookmarks || [] })) }, null, 1), "application/json");
    else if (a === "installsheet") showInstall(true);
    else if (a === "later") { closeSheet(); try { localStorage.setItem(SNOOZE, String(Date.now() + 3 * DAY)); } catch (err) {} }
    else if (a === "install" && deferredInstall) { const ev = deferredInstall; deferredInstall = null; ev.prompt(); ev.userChoice.then(() => closeSheet()).catch(() => {}); }
  });
  // Long-press (or right-click) a book for its options.
  let pressT;
  document.addEventListener("contextmenu", e => { const b = e.target.closest(".book[data-id]"); if (b) { e.preventDefault(); if (e.pointerType !== "touch" && !e.sourceCapabilities?.firesTouchEvents) bookSheet(b.dataset.id); } });
  let pressXY = null;
  const cancelPress = () => { if (pressT !== "fired") clearTimeout(pressT); pressXY = null; };
  document.addEventListener("pointerdown", e => { const b = e.target.closest(".book[data-id]"); if (!b) return; clearTimeout(pressT); pressXY = [e.clientX, e.clientY]; pressT = setTimeout(() => { pressT = "fired"; pressXY = null; bookSheet(b.dataset.id); }, 550); });
  /* Scrolling is not a long-press: cancel on movement, pointercancel (Android sends it when a scroll starts) and scroll. */
  document.addEventListener("pointermove", e => { if (pressXY && Math.hypot(e.clientX - pressXY[0], e.clientY - pressXY[1]) > 10) cancelPress(); }, true);
  document.addEventListener("pointercancel", cancelPress, true);
  addEventListener("scroll", () => { if (pressXY) cancelPress(); }, { capture: true, passive: true });
  document.addEventListener("pointerup", () => { if (pressT !== "fired") clearTimeout(pressT); setTimeout(() => { if (pressT === "fired") pressT = null; }, 0); }, true);
  document.addEventListener("click", e => { if (pressT === "fired" && e.target.closest(".book")) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  document.addEventListener("keydown", e => {
    if (e.target.id === "newtag" && (e.key === "Enter" || e.key === ",")) { e.preventDefault(); addTag(e.target.value); return; }
    if (e.target.id === "gopage" && e.key === "Enter") { e.preventDefault(); $("[data-act=gopage]").click(); return; }
    if (e.key === "Escape") { if (document.querySelector(".sheet-back")) closeSheet(); else if (reading()) location.hash = "#/"; return; }
    if (!reading() || document.querySelector(".sheet-back") || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); turn(1); } else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); turn(-1); }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "libsearch") { libQ = e.target.value; $("#shelf").innerHTML = shelfHTML(); }
    if (e.target.id === "qsearch") { qFilter.q = e.target.value; $("#qlist").innerHTML = filtered().map(qcard).join("") || `<p class="sub" style="text-align:center;margin-top:30px">Nothing matches.</p>`; }
    if (e.target.id === "bsearch") { clearTimeout(searchT); const v = e.target.value; searchT = setTimeout(() => runSearch(v), 220); }
    if (e.target.id === "scrub") { const v = +e.target.value; e.target.style.setProperty("--pct", (v - 1) / Math.max(1, +e.target.max - 1) * 100 + "%"); $("#lbl2").textContent = `Go to page ${v} of ${e.target.max}`; }
  });
  document.addEventListener("change", async e => {
    if (e.target.id === "scrub") { goToPage(+e.target.value); return; }
    if (e.target.id === "file" && e.target.files.length) { await importFiles(e.target.files, replaceId); replaceId = null; e.target.value = ""; }
    if (e.target.id === "restore" && e.target.files[0]) {
      try { const j = JSON.parse(await e.target.files[0].text()); if (j.app !== "commonplace" || !Array.isArray(j.quotes)) throw 0;
        const map = {}; for (const ob of j.books || []) { const nb = library.find(b => b.id === ob.id) || library.find(b => b.title === ob.title); if (nb) { map[ob.id] = nb.id; if (ob.bookmarks?.length && !nb.bookmarks?.length) nb.bookmarks = ob.bookmarks; } }
        let added = 0; for (const q of j.quotes) { if (quotes.some(x => x.id === q.id)) continue; quotes.push({ ...q, book: map[q.book] || q.book }); added++; }
        await saveQuotes(); await saveLib(); toast(`Restored ${added} quote${added === 1 ? "" : "s"}`); render();
      } catch (err) { toast("That isn't a Commonplace backup"); }
      e.target.value = "";
    }
  });
  // In scroll and PDF views, scrolling down tucks the controls away.
  let lastY = 0;
  addEventListener("scroll", () => { if (!reading() || paged()) return; const y = scrollY; if (Date.now() < (R?.quietUntil || 0)) { lastY = y; return; } if (Math.abs(y - lastY) > 14) { document.body.classList.toggle("calm", y > lastY && y > 140); lastY = y; } }, { passive: true });

  /* ---------- Start ---------- */
  (async () => {
    library = (await dbGet("library")) || []; quotes = (await dbGet("quotes")) || [];
    library.forEach(b => { b.bookmarks ||= []; if (b.kind === "pdf" && b.hasFile == null) b.hasFile = false; });
    render(); setTimeout(() => showInstall(false), 1800);
  })();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!had || $(".update")) return; const u = document.createElement("button"); u.className = "update"; u.textContent = "A new version is ready · Reload"; u.onclick = () => location.reload(); document.body.appendChild(u); });
  }
  </script>
</body>
