  <style>
    @font-face { font-family: "Fraunces"; src: url(fonts/fraunces-latin-soft-normal.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Inter"; src: url(fonts/inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
    :root { --bg: #f6f2ea; --card: #fffdf9; --ink: #1f1d1a; --ink2: #5b564e; --muted: #8f897f; --line: rgba(31,29,26,.09); --accent: #e25e3e; --accent2: #fbe3da; --green: #2f8f6a;

<script src="lib/leaflet.js"></script>
<script>
(() => {

  const DEF = () => ({ trip: [], been: [], notes: {}, country: "thailand", plan: { travelers: 2, style: "mid", cur: "both", nights: {}, leg: {}, extras: {}, flight: 0, start: "" }, moments: [], packed: {}, here: null });
  let db; try { db = Object.assign(DEF(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { db = DEF(); }
  db.plan = Object.assign(DEF().plan, db.plan || {});
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
  let D = null; /* country data */
  const TYPE = { temple: "🛕", history: "🏛", city: "🏙", nature: "🌿", beach: "🏖", island: "🏝", food: "🍜" };
  const place = id => D.places.find(p => p.id === id);
  const city = id => (D.cities || []).find(c => c.id === id);
  const fmtTHB = n => `฿${Math.round(n).toLocaleString()}`;
  const fx = () => (D.fx && D.fx.PHP) || 0;
  const money = (n, cur = db.plan.cur) => cur === "PHP" && fx() ? `₱${Math.round(n * fx()).toLocaleString()}` : cur === "both" && fx() ? `${fmtTHB(n)} <span class="muted">· ₱${Math.round(n * fx()).toLocaleString()}</span>` : fmtTHB(n);
  const range = (a, cur) => Array.isArray(a) ? (a[0] === a[1] ? money(a[0], cur) : `${money(a[0], cur === "both" ? "THB" : cur)} to ${money(a[1], cur === "both" ? "THB" : cur)}`) : money(a || 0, cur);
  const mid = a => Array.isArray(a) ? (a[0] + a[1]) / 2 : (+a || 0);
  const directLegs = (a, b) => { const L = (D.legs || []).find(l => (l.a === a && l.b === b) || (l.a === b && l.b === a)); return L ? L.options : null; };
  /* Direct options, or the cheapest two-hop routes through a hub when there's no direct one. */
  /* Car and taxi fares in the data are per car: split them across the party (up to 4 per car) to get a per-person fare. */
  const pp = o => o.mode === "car" ? o.thb.map(x => Math.round(x / Math.min(4, Math.max(1, +db.plan.travelers || 2)))) : o.thb;
  const legCache = {};
  function legsBetween(a, b) {
    if (a === b) return null; const k = a + ">" + b + ":" + db.plan.travelers; if (k in legCache) return legCache[k];
    let o = directLegs(a, b);
    if (!o) { const combos = []; (D.cities || []).forEach(c => { if (c.id === a || c.id === b) return; const x = directLegs(a, c.id), y = directLegs(c.id, b); if (!x || !y) return;
        x.forEach(o1 => y.forEach(o2 => combos.push({ mode: `${o1.mode} + ${o2.mode}`, duration: `${o1.duration} + ${o2.duration}`, thb: [pp(o1)[0] + pp(o2)[0], pp(o1)[1] + pp(o2)[1]], note: `Via ${c.name}: ${o1.mode} to ${c.name}, then ${o2.mode}.`, via: c.name }))); });
      combos.sort((p, q) => (p.thb[0] + p.thb[1]) - (q.thb[0] + q.thb[1])); const seen = new Set(); o = combos.filter(c => { const key = c.mode + c.via; if (seen.has(key)) return false; seen.add(key); return true; }).slice(0, 4); if (!o.length) o = null; }
    return (legCache[k] = o);
  }
  const gmaps = (lat, lng, q) => lat ? `https://www.google.com/maps/search/?api=1&query=${lat},${lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q + ", Thailand")}`;
  const MODE = { "": "", flight: "✈️", train: "🚆", "sleeper train": "🛏", bus: "🚌", minivan: "🚐", ferry: "⛴", speedboat: "🚤", "boat+bus": "⛴", car: "🚗", boat: "🛶" };
  const inTrip = id => db.trip.includes(id);
  let region = "", sel = null;

  /* ---------- Map ---------- */
  let map = null, markers = {}, route = null;
  function initMap() {
    if (map || !window.L) return;
    const B = D.bounds || [[4.8, 96.0], [21.2, 106.6]];
    map = L.map("map", { zoomControl: false, attributionControl: true, minZoom: 5, maxZoom: 11, maxBounds: B, maxBoundsViscosity: 1.0, worldCopyJump: false }).setView(D.center, D.zoom);
    /* Our own simple map: country shapes (Natural Earth) + English labels. No tiles, works offline. */
    map.attributionControl.addAttribution("Map: Natural Earth, © OpenStreetMap contributors");
    const base = L.featureGroup().addTo(map);
    Promise.all([fetch("data/geo.json").then(r => r.json()), fetch("data/provinces.json").then(r => r.json()).catch(() => null)]).then(([g, P]) => {
      L.geoJSON(g, { interactive: false, style: f => f.properties.id === "th" ? (P ? { stroke: false, fillOpacity: 0 } : { color: "#c9b99f", weight: 1.2, fillColor: "#fbf6ec", fillOpacity: 1 }) : { color: "#d6cfc4", weight: 1, fillColor: "#ebe6dd", fillOpacity: 1 } }).addTo(base);

      const TINT = { n: "#e4eed6", ne: "#f8ead0", c: "#fcf4e6", e: "#f7e3d6", w: "#ebecd8", s: "#dff0e5" };
      P.provinces.forEach(q => L.polygon(q.g.map(ring), { interactive: false, color: "#cdbb9c", weight: .8, fillColor: TINT[q.r] || "#fbf6ec", fillOpacity: 1 }).addTo(base));
      const tn = P.towns.map(t => t[0].toLowerCase().replace(/ /g, ""));
      P.provinces.forEach(q => { const k = q.n.toLowerCase().replace(/ /g, ""); if (tn.some(t => k.includes(t) || t.includes(k)) || (D.cities || []).some(c => c.name.toLowerCase().replace(/ /g, "").includes(k))) return; lab(q.la, q.lo, esc(q.n), "prov", -2000); });
      TOWNS = P.towns || []; PROVS = (P.provinces || []).map(q => ({ n: q.n, la: q.la, lo: q.lo })); SIDX = null;
      const taken = cityLabels.map(c => [c.la, c.lo, c.n.toLowerCase()]);
      P.towns.forEach(([n, la, lo, t]) => { if (taken.some(([a, b, nm]) => Math.abs(a - la) < .12 && Math.abs(b - lo) < .12 || nm === n.toLowerCase())) return;
        lab(la, lo, `<span>${esc(n)}</span>`, `town t${t}`, -1000); });
    }).catch(() => {});
    const lab = (lat, lng, html, cls, z = 0) => L.marker([lat, lng], { interactive: false, keyboard: false, zIndexOffset: z, icon: L.divIcon({ className: "lbl " + cls, html, iconSize: null }) }).addTo(map);
    const cityLabels = [];
    [["MYANMAR", 19.2, 96.6], ["LAOS", 19.6, 102.6], ["CAMBODIA", 12.9, 104.8], ["VIETNAM", 15.8, 107.6], ["MALAYSIA", 5.0, 101.6]].forEach(([n, la, lo]) => lab(la, lo, n, "country"));
    [["Andaman Sea", 9.6, 96.9], ["Gulf of Thailand", 10.6, 101.7]].forEach(([n, la, lo]) => lab(la, lo, n, "sea"));
    const MAJOR = ["bangkok", "chiang-mai", "phuket", "krabi", "samui", "pattaya"];
    (D.cities || []).forEach(c => { const ps = D.places.filter(p => p.city === c.id); if (!ps.length) return; const la = ps.reduce((a, p) => a + p.lat, 0) / ps.length, lo = ps.reduce((a, p) => a + p.lng, 0) / ps.length;
      cityLabels.push({ la, lo, n: c.name.split(" (")[0] }); lab(la, lo, `<span>${esc(c.name.split(" (")[0])}</span>`, "city" + (c.id === "bangkok" ? " capital" : "") + (MAJOR.includes(c.id) ? "" : " minor")); });
    const zc = () => { const z = map.getZoom(), el = map.getContainer(); el.classList.toggle("far", z < 7); el.dataset.z = z; cluster(); }; map.on("zoomend", zc); zc();
    D.places.forEach(p => {
      const m = L.marker([p.lat, p.lng], { icon: pinIcon(p) }).addTo(map);
      m.on("click", () => { sel = p.id; refreshPins(); peek(p); map.panTo([p.lat, p.lng], { animate: true }); });
      markers[p.id] = m;
    });
    map.on("click", () => { sel = null; refreshPins(); $(".peek")?.remove(); clearHit(); const r = $("#mres"); if (r) r.hidden = true; });
  }
  const pinIcon = p => L.divIcon({ className: "", html: `<div class="pin sm${sel === p.id ? " sel" : ""}${inTrip(p.id) ? " saved" : ""}" style="background-image:url('${p.thumb}')"></div>`, iconSize: [34, 34], iconAnchor: [17, 17] });
  function refreshPins() {
    if (!map) return;
    D.places.forEach(p => markers[p.id].setIcon(pinIcon(p))); cluster();

    (window.__mm || []).forEach(m => map.removeLayer(m)); window.__mm = (db.moments || []).filter(m => m.lat).map(m => L.marker([m.lat, m.lng], { icon: L.divIcon({ className: "", html: `<div class="mpin">${m.mood || "♥"}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }) }).bindPopup(esc(m.text).slice(0, 140)).addTo(map));
  }

  let clusters = [];
  function cluster() {
    if (!map || !markers[D.places[0].id]) return; clusters.forEach(c => map.removeLayer(c)); clusters = [];
    const z = map.getZoom(), groups = [];
    D.places.filter(p => !region || p.region === region).sort((a, b) => (b.id === sel) - (a.id === sel) || inTrip(b.id) - inTrip(a.id))
      .forEach(p => { const pt = map.project([p.lat, p.lng], z), g = p.id !== sel && groups.find(g => g.pt.distanceTo(pt) < 38 && g.ps[0].id !== sel); if (g) g.ps.push(p); else groups.push({ pt, ps: [p] }); });

      const cm = L.marker([la, lo], { zIndexOffset: 400, icon: L.divIcon({ className: "", html: `<div class="pin clus${g.ps.some(p => inTrip(p.id)) ? " saved" : ""}" style="background-image:url('${lead.thumb}')"><b>${g.ps.length}</b></div>`, iconSize: [40, 40], iconAnchor: [20, 20] }) }).addTo(map);

  }

  function peek(p) {

    a.innerHTML = `<img src="${p.thumb}" alt=""><div style="min-width:0"><div class="eyebrow">${TYPE[p.type] || ""} ${esc(D.regions[p.region])}</div><b>${esc(p.name)}</b><div class="small ink2">${esc(vibeOf(p) ? vibeOf(p).line : p.line)}</div>${crowdAt(p) ? `<div class="small muted" style="margin-top:4px">${dots(crowdAt(p))} ${CROWD[crowdAt(p)]} now</div>` : ""}</div>`;

  function mapChips() { $("#mapchips").innerHTML = [["", "All"], ...Object.entries(D.regions)].map(([k, n]) => `<button class="chip${region === k ? " on" : ""}" data-act="region" data-v="${k}">${esc(n)}</button>`).join(""); }

  /* ---------- Views ---------- */
  function route_() { const h = location.hash.replace(/^#\/?/, ""); const [v = "", a = ""] = h.split("/"); return { v: v || "map", a }; }
  function render() {

    if (v === "import") { const code = a; history.replaceState(null, "", "#/trip"); setTimeout(() => importSheet(code), 50); return render(); }
    $(".sheet-back:not(.keep)")?.remove();

    else $("#app").innerHTML = `<div class="view">${({ places: viewPlaces, p: () => viewPlace(a), trip: viewTrip, today: viewToday, moments: viewMoments, events: viewEvents, basics: viewBasics }[v] || viewPlaces)()}</div>`;

  }

  /* ---------- Search: places, towns, provinces and the spots inside each place ---------- */
  let SIDX = null, TOWNS = [], PROVS = [], hitMarker = null;
  function searchIndex() {
    if (SIDX) return SIDX; const out = [], seen = new Set(), add = o => { const k = fold(o.name) + "|" + (o.lat ? o.lat.toFixed(2) : o.place || ""); if (seen.has(k)) return; seen.add(k); o.k = fold(o.name); o.k2 = fold((o.alt || "") + " " + (o.what || "")); out.push(o); };
    D.places.forEach(p => add({ kind: "place", name: p.name, sub: `${TYPE[p.type] || ""} ${D.regions[p.region]}`, lat: p.lat, lng: p.lng, place: p.id, thumb: p.thumb, alt: cname(p.city) + " " + ((vibeOf(p) || {}).tags || []).join(" ") }));
    (D.cities || []).forEach(c => { const p = D.places.find(x => x.city === c.id); if (p && !D.places.some(x => fold(x.name).startsWith(fold(c.name.split(" (")[0])))) add({ kind: "town", name: c.name.split(" (")[0], sub: "Town · " + D.regions[p.region], lat: c.lat || p.lat, lng: c.lng || p.lng, place: p.id, alt: c.name }); });
    D.places.forEach(p => [["popular", "⭐"], ["gems", "💎"], ["localFavs", "🍜"]].forEach(([k, ic]) => (p[k] || []).forEach(x => x.name && add({ kind: "spot", ic, name: x.name, sub: `${ic === "🍜" ? "Local favourite" : ic === "💎" ? "Hidden gem" : "Popular"} · ${p.name}`, lat: x.lat, lng: x.lng, place: p.id, what: x.what, thb: x.thb }))));

    TOWNS.forEach(([n, la, lo]) => add({ kind: "map", ic: "•", name: n, sub: "Town on the map", lat: la, lng: lo }));

  function findAll(q, n = 8) {

  function clearHit() { if (hitMarker && map) { map.removeLayer(hitMarker); hitMarker = null; } }

      <div class="row" style="gap:8px;margin-top:4px;flex-wrap:wrap"><a class="btn sm" href="${gmaps(o.lat, o.lng, o.name)}" target="_blank" rel="noopener">Google Maps ↗</a>${o.place ? `<a class="btn sm" href="#/p/${o.place}">Open ${esc(place(o.place).name.split(" (")[0])}</a>` : ""}</div>`;

  });
  document.addEventListener("input", e => { const n = e.target.dataset.note; if (n) { db.notes[n] = e.target.value; save(); } });
  document.addEventListener("input", e => { if (e.target.id === "mq") mapSearchShow(); if (e.target.id === "pq") { plQ = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#pq"); if (i) { i.focus(); i.setSelectionRange(pos, pos); } } });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "mq") { e.preventDefault(); if (mHits[0]) { $("#mq").value = mHits[0].name; showOnMap(mHits[0]); } } if (e.key === "Escape" && e.target.id === "mq") { e.target.value = ""; mapSearchShow(); } });
  document.addEventListener("input", e => { if (e.target.id === "addq") { const r = $("#addres"); if (r) r.innerHTML = addRows(e.target.value); } });
  document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.abq; if (k) { const r = $("#abres"); if (r) r.innerHTML = abRows(k, e.target.value); } });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "abq") { e.preventDefault(); $("#abres .abrow")?.click(); } if (e.key === "Enter" && e.target.id === "addq") { e.preventDefault(); $("#addres .addrow")?.click(); } });
  document.addEventListener("change", e => { const el = e.target;
    if (el.dataset.leg) { db.plan.leg[el.dataset.leg] = +el.value; save(); render(); }
    else if (el.dataset.extra) { db.plan.extras[el.dataset.extra] = el.checked; save(); render(); }
    else if (el.hasAttribute("data-flight")) { db.plan.flight = +el.value || 0; save(); render(); }
    else if (el.hasAttribute("data-here")) { db.here = +el.value; db.plan.start = ""; save(); render(); }
    else if (el.hasAttribute("data-start")) { db.plan.start = el.value; save(); render(); }
    else if (el.dataset.pack) { db.packed[el.dataset.pack] = el.checked; save(); render(); } });
  document.addEventListener("input", e => { if (e.target.id === "cv") { const o = $("#cvout"); if (o) o.textContent = `₱${Math.round((+e.target.value || 0) * fx()).toLocaleString()}`; } });
  addEventListener("hashchange", render);
  fetch(`data/${db.country}.json`).then(r => r.json()).then(d => { D = d; render(); setTimeout(() => showInstall(false), 4000); })
    .catch(() => { $("#app").innerHTML = `<p style="margin-top:40vh;text-align:center">Couldn't load. Check your connection and reload.</p>`; });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
