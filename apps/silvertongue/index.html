<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Silvertongue</title>
<meta name="description" content="Techniques of the spoken word with many examples, and a private notebook page for every lesson.">
<meta name="theme-color" content="#121216">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Silvertongue">
<style>
  @font-face { font-family: "Cormorant"; src: url(fonts/cormorant-garamond-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url(fonts/cormorant-garamond-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url(fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  :root { --bg: #121216; --card: #1b1b21; --card2: #24242c; --ink: #ecebf0; --ink2: #c4c2ce; --muted: #9a97a8; --line: rgba(255, 255, 255, .09);
    --silver: #d3d6de; --gold: #dcb96f; --paper: #f4efe4; --paper-ink: #22201c; --paper-line: rgba(70, 90, 140, .22); --paper-margin: rgba(200, 80, 80, .35);
    --display: "Cormorant", Georgia, serif; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  body { background: radial-gradient(120% 60% at 50% -10%, #23233a 0%, var(--bg) 60%) fixed; min-height: 100vh; }
  a { color: inherit; text-decoration: none; } button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  main { max-width: 660px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px); }
  h1 { font: 600 32px/1.1 var(--display); margin: 4px 0 6px; }
  h3 { font: 650 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); } .ink2 { color: var(--ink2); } .small { font-size: 14px; }
  .eyebrow { font: 700 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; margin-top: 12px; }
  .row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--card2); font-weight: 650; font-size: 15px; }
  .btn.pri { background: linear-gradient(135deg, #ecdcb2, var(--gold)); color: #1a1408; border: 0; } .btn.block { display: flex; width: 100%; }
  .search { width: 100%; font: 16px var(--sans); padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); outline: none; margin: 8px 0 4px; }
  .search:focus { border-color: var(--silver); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; } .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink2); font-size: 13.5px; font-weight: 600; }
  .chip.on { background: var(--silver); color: #15151a; border-color: var(--silver); }
  .tag18 { font: 700 10.5px var(--sans); color: #f08a98; border: 1px solid rgba(240, 138, 152, .5); border-radius: 999px; padding: 1px 6px; vertical-align: 3px; margin-left: 4px; }

  /* lists */
  .mod { display: flex; gap: 14px; align-items: center; padding: 13px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin-top: 10px; }
  .mod .ic { font-size: 24px; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: var(--card2); flex: none; }
  .mod b { font: 600 20px/1.15 var(--display); display: block; }
  .li { display: flex; gap: 10px; align-items: center; padding: 13px 0; border-top: 1px solid var(--line); }
  .li:first-child { border-top: 0; }
  .li b { font: 600 19px/1.2 var(--display); display: block; } .li .s { font-size: 14px; color: var(--ink2); margin-top: 2px; }
  .li .pen { margin-left: auto; flex: none; font-size: 15px; color: var(--gold); }
  .chev { margin-left: auto; flex: none; color: var(--muted); font-size: 20px; }

  /* lesson */
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .dots { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 4px; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--card2); } .dots i.on { background: var(--gold); }
  .lead { font: 500 21px/1.4 var(--display); margin: 14px 0 0; }
  ol.steps { padding-left: 22px; margin: 6px 0; } ol.steps li { margin: 7px 0; color: var(--ink2); }
  .ex { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-top: 10px; }
  .ex .ctx { font: 700 10.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .ex .flat { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(224, 122, 138, .55); margin-top: 6px; font-size: 15px; }
  .ex .better { font: 500 21px/1.35 var(--display); font-style: italic; margin-top: 4px; }
  .ex .why { font-size: 13.5px; color: var(--ink2); margin-top: 6px; }
  em.mk { font-style: normal; color: var(--gold); border-bottom: 1px dotted var(--gold); }
  .say { font-size: 13px; color: var(--muted); margin-left: auto; }
  details.more { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
  details.more summary { cursor: pointer; list-style: none; padding: 10px 0; font-weight: 650; color: var(--ink2); } details.more summary::-webkit-details-marker { display: none; }
  details.more p, details.more li { color: var(--ink2); font-size: 15px; }
  /* floating note button on every lesson */
  .fab { position: fixed; z-index: 25; right: max(16px, calc(50% - 314px)); bottom: calc(env(safe-area-inset-bottom) + 76px); display: flex; align-items: center; gap: 8px; padding: 13px 18px 13px 15px; border-radius: 999px;
    background: linear-gradient(135deg, #ecdcb2, var(--gold)); color: #1a1408; font-weight: 700; font-size: 15px; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); }
  .fab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fab .has { width: 7px; height: 7px; border-radius: 50%; background: #1a1408; }
  /* the note editor: a plain notes-app page */
  .editor { position: fixed; left: 0; right: 0; top: 0; height: 100%; z-index: 70; background: var(--bg); display: flex; flex-direction: column; animation: up .2s ease; }
  .ed-top { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 12px 8px; max-width: 660px; width: 100%; margin: 0 auto; }
  .ed-top .done { color: var(--gold); font-weight: 700; font-size: 16px; padding: 6px 8px; }
  /* the format bar sits at the bottom of the note, so it rides just above the keyboard */
  .ed-tools { order: 3; flex: none; display: flex; gap: 6px; padding: 8px max(12px, calc(50% - 318px)) calc(8px + var(--kb-safe, env(safe-area-inset-bottom))); width: 100%; border-top: 1px solid var(--line); background: #17171d; }
  .ed-tools button { min-width: 44px; height: 38px; padding: 0 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--ink2); display: grid; place-items: center; font-weight: 700; }
  .ed-tools button.on { background: var(--silver); color: #15151a; border-color: var(--silver); }
  .ed-tools svg { width: 20px; height: 20px; fill: currentColor; }
  .ed-scroll { flex: 1; min-height: 0; overflow-y: auto; order: 2; }
  .ed-wrap { max-width: 660px; margin: 0 auto; padding: 16px 18px 40px; }
  .ed-title { font: 600 28px/1.15 var(--display); margin: 0; }
  .ed-when { font-size: 12.5px; color: var(--muted); margin: 4px 0 14px; }
  .ed { outline: none; min-height: 50vh; font: 17px/1.55 var(--sans); color: var(--ink); word-wrap: break-word; caret-color: var(--gold); }
  .ed { position: relative; } .ed.blank::before { content: attr(data-ph); position: absolute; left: 0; right: 0; top: 0; color: var(--muted); pointer-events: none; }
  .ed ul, .ed ol { margin: 4px 0; padding-left: 26px; } .ed li { margin: 3px 0; } .ed ul li::marker { color: var(--gold); } .ed ol li::marker { color: var(--gold); font-weight: 700; }
  .ed b, .ed strong { color: #fff; }
  .snippet { font: italic 17px/1.4 var(--display); color: var(--ink2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  nav.tabsbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 48px; padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); background: rgba(18, 18, 22, .94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  nav.tabsbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 16px; font: 650 12px var(--sans); color: var(--muted); }
  nav.tabsbar a.on { color: var(--ink); } nav.tabsbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .back { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: min(600px, 100%); max-height: 90vh; overflow-y: auto; background: var(--card); border-radius: 22px 22px 0 0; padding: 22px 18px calc(env(safe-area-inset-bottom) + 18px); animation: up .25s ease; }
  .sheet h2 { font: 600 24px var(--display); margin: 0 0 8px; }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } }
  .toast { position: fixed; z-index: 90; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); transform: translateX(-50%); background: var(--silver); color: #15151a; padding: 10px 16px; border-radius: 999px; font-weight: 650; font-size: 14px; max-width: 90vw; text-align: center; }
  .ic2 { display: inline-block; width: 20px; height: 20px; vertical-align: -5px; fill: none; stroke: var(--gold); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .dots3 { display: inline-block; padding: 0 6px; border-radius: 999px; background: var(--card2); font: 600 11px/20px sans-serif; letter-spacing: 1px; }
  ol.isteps li { margin: 7px 0; }
  .ver { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabsbar">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 5h11a5 5 0 0 1 5 5v9H9a5 5 0 0 1-5-5z"/><path d="M8 10h8M8 14h5"/></svg>Lessons</a>
  <a href="#/notebook" data-tab="notebook"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M10 8h6M10 12h6M10 16h4"/></svg>Notebook</a>
</nav>
<script src="lib/vault.js"></script>
<script>
(() => {
  "use strict";
  const VER = "11";
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  /* *word* in a line = spoken emphasis: shown highlighted, never read as asterisks */
  const fx = s => esc(s).replace(/\*([^*\n]{1,80})\*/g, '<em class="mk">$1</em>');
  const toast = (m, ms = 2200) => { $$(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms); };
  const KEY = "silvertongue";
  const DEF = () => ({ pages: {}, adult: false });
  let S; try { S = Object.assign(DEF(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { S = DEF(); }
  S.pages = S.pages || {};
  /* Notes are kept as a small, safe subset of HTML: paragraphs, lists, bold, italic. */
  const OK_TAGS = new Set(["DIV", "P", "BR", "UL", "OL", "LI", "B", "STRONG", "I", "EM", "U"]);
  function clean(html) {
    const t = document.createElement("template"); t.innerHTML = html || "";
    (function walk(node) { [...node.childNodes].forEach(c => { if (c.nodeType === 3) return; if (c.nodeType !== 1) return c.remove();
      if (/^(SCRIPT|STYLE|IFRAME|OBJECT|SVG|IMG|VIDEO|AUDIO|TEMPLATE)$/.test(c.tagName)) return c.remove(); walk(c);
      if (!OK_TAGS.has(c.tagName)) { c.replaceWith(...c.childNodes); return; } [...c.attributes].forEach(x => c.removeAttribute(x.name)); }); })(t.content);
    return t.innerHTML;
  }
  const plain = html => { const t = document.createElement("template"); t.innerHTML = String(html || "").replace(/<\/(li|div|p)>|<br\s*\/?>/gi, "$&\n"); return t.content.textContent.replace(/\u00a0/g, " ").replace(/\n{2,}/g, "\n").trim(); };
  const toHtml = text => String(text || "").split("\n").map(l => `<div>${l.trim() ? esc(l) : "<br>"}</div>`).join("");
  /* carry old field notes from the previous version onto each lesson's notebook page */
  if (Array.isArray(S.notes) && S.notes.length) {
    S.notes.forEach(n => { if (!n.t) return; const d = new Date(n.at).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
      const add = `${d}${n.r ? " " + "★".repeat(n.r) : ""}\n${n.said ? `Said: ${n.said}\n` : ""}${n.what ? `${n.what}\n` : ""}`; const p = S.pages[n.t] || { text: "", at: n.at };
      p.text = (p.text ? p.text.replace(/\s+$/, "") + "\n\n" : "") + add.trim(); p.at = Math.max(p.at || 0, n.at); S.pages[n.t] = p; });
  }
  /* v5 pages were plain text: turn them into note HTML */
  for (const p of Object.values(S.pages)) if (p.text != null && p.html == null) { p.html = toHtml(p.text); delete p.text; }
  for (const k of ["notes", "m", "xp", "quiz", "day", "streak", "last", "drafts"]) delete S[k];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
  save();
  let D = null, ALL = [], BY = {};
  const CTX = { work: "Work", negotiation: "Negotiation", dating: "Dating", partner: "Partner", friends: "Friends", text: "Text", family: "Family" };
  const dots = n => `<span class="dots">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
  const hasNote = id => !!(S.pages[id] && plain(S.pages[id].html));
  const modOf = t => D.modules.find(m => m.id === t._mod);
  const when = at => new Date(at).toLocaleDateString(undefined, { day: "numeric", month: "short" });

  /* ---------- views ---------- */
  let q = "";
  const lessonRow = t => `<a class="li" href="#/t/${t.id}"><div style="min-width:0"><b>${esc(t.name)}</b><div class="s">${esc(t.summary)}</div></div>${hasNote(t.id) ? `<span class="pen" title="Has notes">✎</span>` : `<span class="chev">›</span>`}</a>`;
  function viewHome() {
    const f = q.trim().toLowerCase(), hits = f ? ALL.filter(t => (t.name + " " + t.aka + " " + t.summary).toLowerCase().includes(f)) : [];
    return `<div class="row between"><div class="eyebrow">Silvertongue</div><button class="small muted" data-act="settings" style="font-size:12px">v${VER} · Settings</button></div><h1>Lessons</h1>
      <input class="search" id="q" type="search" placeholder="Find a technique: pause, tease, story…" value="${esc(q)}" autocomplete="off">
      ${f ? `<div class="card">${hits.map(lessonRow).join("") || `<p class="muted" style="padding:12px 0;margin:0">Nothing matches.</p>`}</div>`
        : D.modules.map(m => `<a class="mod" href="#/m/${m.id}"><div class="ic">${m.icon}</div><div style="flex:1;min-width:0"><b>${esc(m.title)}${m.adult ? `<span class="tag18">18+</span>` : ""}</b><div class="small muted">${m.techniques.length} lessons${m.techniques.some(t => hasNote(t.id)) ? ` · ${m.techniques.filter(t => hasNote(t.id)).length} with notes` : ""}</div></div><span class="chev">›</span></a>`).join("")}
      <div class="ver">Silvertongue v${VER}</div>`;
  }
  function viewModule(id) {
    const m = D.modules.find(x => x.id === id); if (!m) return viewHome();
    return `<a href="#/" class="small muted">‹ Lessons</a><div class="row" style="margin-top:10px"><div class="mod" style="padding:0;border:0;background:none;margin:0"><div class="ic">${m.icon}</div></div><h1 style="margin:0">${esc(m.title)}</h1></div>
      <p class="ink2" style="margin-top:10px">${esc(m.intro)}</p><div class="card">${m.techniques.map(lessonRow).join("")}</div>`;
  }
  let exCtx = "";
  function viewLesson(id, toNotes) {
    const t = BY[id]; if (!t) return viewHome(); const m = modOf(t);
    const ctxs = [...new Set(t.examples.map(e => e.ctx))], exs = t.examples.filter(e => !exCtx || e.ctx === exCtx);
    const i = m.techniques.indexOf(t), nx = m.techniques[i + 1];
    return `<a href="#/m/${m.id}" class="small muted">‹ ${esc(m.title)}</a>
      <h1 style="margin-top:10px">${esc(t.name)}</h1>
      <div class="meta"><span>Difficulty${dots(t.difficulty)}</span><span>Effect${dots(t.effect)}</span></div>
      <p class="lead">${fx(t.summary)}</p>
      <h3>How to do it</h3><ol class="steps">${t.steps.map(s => `<li>${fx(s)}</li>`).join("")}</ol>
      <h3>Examples</h3>
      ${ctxs.length > 1 ? `<div class="chips"><button class="chip${exCtx ? "" : " on"}" data-act="exctx" data-v="">All</button>${ctxs.map(c => `<button class="chip${exCtx === c ? " on" : ""}" data-act="exctx" data-v="${c}">${esc(CTX[c] || c)}</button>`).join("")}</div>` : ""}
      ${exs.map(e => `<div class="ex"><div class="row"><span class="ctx">${esc(CTX[e.ctx] || e.ctx)}</span><button class="say" data-act="speak" data-v="${esc(e.better.replace(/\*/g, ""))}">▶ hear it</button></div>${t._mod === "defence" ? `${e.flat ? `<div class="small muted" style="margin-top:6px">They say</div><div style="font-size:15px;color:#f08a98">“${fx(e.flat)}”</div>` : ""}<div class="small muted" style="margin-top:8px">You say</div><div class="better" style="margin-top:0">“${fx(e.better)}”</div>` : `${e.flat ? `<div class="flat">${fx(e.flat)}</div>` : ""}<div class="better">“${fx(e.better)}”</div>`}${e.note ? `<div class="why">${fx(e.note)}</div>` : ""}</div>`).join("")}
      <details class="more"><summary>Why it works, mistakes and sources ›</summary><p>${fx(t.why)}</p><h3 style="margin-top:12px">Common mistakes</h3><ul style="padding-left:20px;margin:6px 0">${t.mistakes.map(s => `<li>${fx(s)}</li>`).join("")}</ul><h3 style="margin-top:12px">Use it well</h3><p>${fx(t.ethics)}</p>${(t.sources || []).length ? `<p class="small muted">${t.sources.map(esc).join(" · ")}</p>` : ""}</details>
      ${nx ? `<a class="card" href="#/t/${nx.id}" style="display:block;padding:12px 16px"><div class="small muted">Next lesson</div><b style="font:600 19px var(--display)">${esc(nx.name)} ›</b></a>` : ""}
      <div style="height:72px"></div>
      <a class="fab" href="#/t/${id}/notes" aria-label="Notes for this lesson"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>${hasNote(id) ? "My note" : "Note"}${hasNote(id) ? `<span class="has"></span>` : ""}</a>`;
  }
  let nq = "";
  function viewNotebook() {
    const f = nq.trim().toLowerCase();
    const all = Object.entries(S.pages).map(([id, p]) => [id, p, plain(p.html)]).filter(([id, , tx]) => BY[id] && tx);
    const L = all.filter(([id, , tx]) => !f || (BY[id].name + " " + tx).toLowerCase().includes(f)).sort((a, b) => (b[1].at || 0) - (a[1].at || 0)), total = all.length;
    return `<div class="eyebrow">Silvertongue</div><h1>Notebook</h1>
      ${total ? `<input class="search" id="nq" type="search" placeholder="Search your notes" value="${esc(nq)}" autocomplete="off">
        <div class="card">${L.map(([id, p, tx]) => `<a class="li" href="#/t/${id}/notes" style="align-items:flex-start"><div style="min-width:0;flex:1"><div class="row between"><b>${esc(BY[id].name)}</b><span class="small muted" style="flex:none">${when(p.at)}</span></div><div class="small muted">${esc(modOf(BY[id]).title)}</div><div class="snippet">${esc(tx.split("\n").slice(0, 3).join(" · "))}</div></div></a>`).join("") || `<p class="muted" style="padding:12px 0;margin:0">No notes match.</p>`}</div>`
      : `<div class="card" style="padding:16px"><p class="ink2" style="margin:0">Every lesson has its own notebook page. Open a lesson and tap the <b>✎ Note</b> button at the bottom to start writing: your own lines, what worked, what to try next.</p></div>`}`;
  }

  /* ---------- router ---------- */
  function route() { const h = location.hash.replace(/^#\/?/, "").split("/"); return { v: h[0] || "home", a: h[1] || "", b: h[2] || "" }; }
  let lastLesson = "";
  function render() {

    $$("nav.tabsbar a").forEach(x => x.classList.toggle("on", x.dataset.tab === (v === "notebook" ? "notebook" : "home")));
    if (v === "t" && b === "notes" && BY[a]) openEditor(a); else closeEditor();
  }
  let prevHash = location.hash, lessonY = 0, cameIn = false;
  addEventListener("hashchange", () => {
    close(); const { v, a, b } = route(), was = prevHash.replace(/^#\/?/, "").split("/"); prevHash = location.hash;
    const opening = v === "t" && b === "notes", leaving = was[0] === "t" && was[2] === "notes" && v === "t" && was[1] === a && !b;

  });

  /* ---------- note editor ---------- */
  const ICO = { ul: `<svg viewBox="0 0 24 24"><circle cx="5" cy="7" r="1.8"/><circle cx="5" cy="12" r="1.8"/><circle cx="5" cy="17" r="1.8"/><rect x="9" y="6" width="12" height="2" rx="1"/><rect x="9" y="11" width="12" height="2" rx="1"/><rect x="9" y="16" width="12" height="2" rx="1"/></svg>`,
    ol: `<svg viewBox="0 0 24 24"><text x="2" y="9" font-size="7" font-weight="700" font-family="sans-serif">1</text><text x="2" y="14.5" font-size="7" font-weight="700" font-family="sans-serif">2</text><text x="2" y="20" font-size="7" font-weight="700" font-family="sans-serif">3</text><rect x="9" y="6" width="12" height="2" rx="1"/><rect x="9" y="11" width="12" height="2" rx="1"/><rect x="9" y="16" width="12" height="2" rx="1"/></svg>` };
  let edId = "";
  function openEditor(id) {
    if (edId === id && $(".editor")) return; closeEditor(); edId = id; const t = BY[id], p = S.pages[id] || {};
    const E = document.createElement("div"); E.className = "editor";

      <div class="ed-tools"><button data-cmd="bold" aria-label="Bold">B</button><button data-cmd="italic" aria-label="Italic" style="font-style:italic;font-family:Georgia,serif">I</button><button data-cmd="insertUnorderedList" aria-label="Bullet list">${ICO.ul}</button><button data-cmd="insertOrderedList" aria-label="Numbered list">${ICO.ol}</button><button data-cmd="outdent" aria-label="Outdent" style="margin-left:auto">⇤</button><button data-cmd="indent" aria-label="Indent">⇥</button></div>

    document.body.appendChild(E); document.body.style.overflow = "hidden"; fitEditor();
    try { document.execCommand("defaultParagraphSeparator", false, "div"); } catch {}
    const ed = $("#ed"); seed(ed);
    setTimeout(() => { ed.focus(); let n = ed; while (n.lastChild && n.lastChild.nodeType === 1 && n.lastChild.tagName !== "BR") n = n.lastChild;
      const r = document.createRange(); if (n.lastChild && n.lastChild.tagName === "BR") r.setStartBefore(n.lastChild); else { r.selectNodeContents(n); r.collapse(false); }
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); tools(); }, 220);
  }
  /* always keep at least one paragraph in the note, so lists and lines behave */
  function seed(ed) { [...ed.childNodes].forEach(c => { if (c.nodeType === 3 && c.textContent.trim()) { const d = document.createElement("div"); c.replaceWith(d); d.appendChild(c); } });
    if (!ed.firstElementChild) ed.innerHTML = "<div><br></div>"; ed.classList.toggle("blank", !plain(ed.innerHTML) && !ed.querySelector("li")); }
  function fitEditor() {

    const sel = getSelection(); if (sel.rangeCount && $("#ed").contains(sel.anchorNode)) { let r = sel.getRangeAt(0).getBoundingClientRect(); if (!r.bottom) { const n = sel.anchorNode; r = (n.nodeType === 1 ? n : n.parentElement).getBoundingClientRect(); } const sc = $(".ed-scroll"), box = sc.getBoundingClientRect();
      if (r.bottom && r.bottom > box.bottom - 12) sc.scrollTop += r.bottom - box.bottom + 24; }
  }
  if (window.visualViewport) { visualViewport.addEventListener("resize", fitEditor); visualViewport.addEventListener("scroll", fitEditor); }
  function saveEditor() { const ed = $("#ed"); if (!ed || !edId) return; const html = clean(ed.innerHTML), had = S.pages[edId];
    if (!plain(html)) { if (had) delete S.pages[edId]; } else if (!had || had.html !== html) S.pages[edId] = { html, at: Date.now() }; save(); }
  function closeEditor() { if (!$(".editor")) { edId = ""; return; } clearTimeout(saveT); saveEditor(); $$(".editor").forEach(x => x.remove()); document.body.style.overflow = ""; edId = ""; }
  const tools = () => $$(".ed-tools [data-cmd]").forEach(b => { let on = false; try { on = /bold|italic|List/.test(b.dataset.cmd) && document.queryCommandState(b.dataset.cmd); } catch {} b.classList.toggle("on", on); });
  document.addEventListener("selectionchange", () => { if ($(".editor")) tools(); });
  /* keep the caret in the note when a toolbar button is pressed */
  document.addEventListener("pointerdown", e => { if (e.target.closest(".ed-tools [data-cmd]")) e.preventDefault(); });
  document.addEventListener("click", e => { const b = e.target.closest(".ed-tools [data-cmd]"); if (!b) return; $("#ed").focus(); document.execCommand(b.dataset.cmd, false, null); tools(); noteChanged(); });
  function noteChanged() { const w = $("#edwhen"), ed = $("#ed"); if (ed && !ed.firstElementChild) seed(ed); else if (ed) ed.classList.toggle("blank", !plain(ed.innerHTML) && !ed.querySelector("li")); clearTimeout(saveT); saveT = setTimeout(() => { saveEditor(); if (w) w.textContent = "Saved"; }, 400); }
  /* "- " or "* " starts a bullet list, "1. " a numbered one, like most notes apps */
  function autoList(e) {
    if (e.inputType !== "insertText" || e.data !== " ") return; const sel = getSelection(), n = sel.anchorNode;
    if (!n || n.nodeType !== 3 || n.previousSibling || n.parentNode.closest("li")) return;
    const m = n.textContent.slice(0, sel.anchorOffset).replace(/\u00a0/g, " ").match(/^([-*•]|1[.)]) $/); if (!m) return;
    const rest = n.textContent.slice(sel.anchorOffset), r = document.createRange();
    if (rest) { n.textContent = rest; r.setStart(n, 0); } else { const br = document.createElement("br"); n.replaceWith(br); r.setStartBefore(br); }
    r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
    document.execCommand(/^1/.test(m[1]) ? "insertOrderedList" : "insertUnorderedList", false, null); tools();
  }

  /* ---------- sheets ---------- */
  function sheet(html) { $$(".back").forEach(b => b.remove()); const b = document.createElement("div"); b.className = "back"; b.innerHTML = `<div class="sheet">${html}</div>`; b.addEventListener("click", e => { if (e.target === b) b.remove(); }); document.body.appendChild(b); return b; }
  const close = () => $$(".back").forEach(b => b.remove());
  function settingsSheet() {
    sheet(`<h2>Settings</h2>
      <button class="btn block" data-act="lock">🔒 Lock now</button>
      <button class="btn block" data-act="quickpin" style="margin-top:8px">🔢 Quick PIN for this phone</button>
      <button class="btn block" data-act="adult" style="margin-top:8px;${S.adult ? "" : "color:#f08a98"}">${S.adult ? "Hide adult modules" : "Show adult modules (18+)"}</button>
      <button class="btn block" data-act="export" style="margin-top:8px">Back up my notebook</button>
      <label class="btn block" style="margin-top:8px;cursor:pointer">Restore a backup<input type="file" id="imp" accept="application/json" hidden></label>
      ${isStandalone() ? "" : `<button class="btn pri block" data-act="install" style="margin-top:8px">Install Silvertongue</button>`}

      <div class="ver">Silvertongue v${VER}</div>`);
    $("#imp").addEventListener("change", async e => { try { const d = JSON.parse(await e.target.files[0].text()); if (!d.pages && !d.notes) throw 0;
      for (const [id, p0] of Object.entries(d.pages || {})) { const p = { html: clean(p0.html != null ? p0.html : toHtml(p0.text)), at: +p0.at || Date.now() }, cur = S.pages[id]; if (!plain(p.html)) continue;
        if (!cur || !plain(cur.html)) S.pages[id] = p; else if (!plain(cur.html).includes(plain(p.html))) S.pages[id] = { html: cur.html + "<div><br></div>" + p.html, at: Math.max(cur.at || 0, p.at) }; }
      save(); close(); render(); toast("Notebook restored"); } catch { toast("That isn't a Silvertongue backup"); } });
  }

  /* ---------- install prompt ---------- */
  let deferred = null; const UA = navigator.userAgent, isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(UA), isAndroid = /android/i.test(UA), inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Twitter|LinkedInApp|TikTok|musical_ly|Snapchat|Pinterest|GSA\//i.test(UA), iosBrowser = /CriOS/.test(UA) ? "Chrome" : /EdgiOS/.test(UA) ? "Edge" : /FxiOS/.test(UA) ? "Firefox" : "";
  const IC = { share: `<svg class="ic2" viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>`, add: `<svg class="ic2" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>`, more: `<span class="dots3">•••</span>` };
  const installBody = () => deferred ? `<button class="btn pri block" data-act="doinstall">Install Silvertongue</button>`
    : inApp ? `<p class="small ink2">You're inside another app's browser, which can't install apps. Tap ${IC.more} or the menu and choose <b>Open in ${isIOS ? "Safari" : "browser"}</b>.</p><button class="btn block" data-act="copylink">Copy the link</button>`
    : isIOS && iosBrowser ? `<ol class="isteps"><li>Tap <b>Share</b> ${IC.share} in ${iosBrowser}'s address bar.</li><li>Tap <b>Add to Home Screen</b> ${IC.add} (you may need <b>More</b>).</li><li>Tap <b>Add</b>.</li></ol>`
    : isIOS ? `<ol class="isteps"><li>Tap <b>Share</b> ${IC.share} at the bottom of Safari. On newer iPhones, tap ${IC.more} first, then <b>Share</b>.</li><li>Scroll down and tap <b>Add to Home Screen</b> ${IC.add}.</li><li>Leave <b>Open as Web App</b> on and tap <b>Add</b>.</li></ol>`
    : isAndroid ? `<ol class="isteps"><li>Tap the <b>⋮</b> menu in Chrome.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>`
    : `<ol class="isteps"><li>Use the install icon in the address bar, or the browser menu's <b>Install</b>.</li></ol>`;
  function showInstall(force) {
    if (isStandalone() || (!force && $(".back"))) return; if (!force) { try { if (Date.now() - (+localStorage.getItem("silvertongue-install-snooze") || 0) < 5 * 864e5) return; } catch {} }
    sheet(`<div class="row" style="gap:14px"><img src="icons/icon-192.png" width="56" height="56" style="border-radius:14px" alt=""><div><h2 style="margin:0">Install Silvertongue</h2><p class="small muted" style="margin:0">Lessons and notebook, offline, one tap away.</p></div></div><div id="ib" style="margin-top:12px">${installBody()}</div><button class="btn block" data-act="notnow" style="margin-top:8px;background:none;border:0">Not now</button>`);
  }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; const b = $("#ib"); if (b) b.innerHTML = installBody(); });

  /* ---------- actions ---------- */
  const speak = t => { try { const u = new SpeechSynthesisUtterance(t); u.rate = .92; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch { toast("Read-aloud isn't available here"); } };
  document.addEventListener("click", async e => {
    const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act, v = el.dataset.v;
    if (a === "exctx") { exCtx = v; const y = scrollY; render(); scrollTo(0, y); }
    else if (a === "speak") speak(v);

    else if (a === "lock") Vault.lock();
    else if (a === "quickpin") { close(); Vault.managePin(); }
    else if (a === "adult") {
      if (!S.adult) { if (!confirm("Show the adult modules?\n\nThey are frank lessons on sex talk, dirty talk and leading in bed, for consenting adults. Confirm you are 18 or older.")) return;

  let saveT = 0;

    if (e.target.id === "ed") { autoList(e); noteChanged(); fitEditor(); return; }

    if (e.target.id === "nq") keep("#nq", x => nq = x);

  /* ---------- Vault: the content is encrypted with your passcode (lib/vault.js) ---------- */
  let unlocked = false;
  try { localStorage.removeItem("silvertongue-pin"); } catch {}
  Vault.setup({ title: "Silvertongue", icon: "icons/icon-192.png", footer: `Silvertongue v${VER}`, theme: { bg: "#121216", ink: "#ecebf0", muted: "#9a97a8", accent: "#d3d6de", key: "#24242c", display: "Cormorant, Georgia, serif" },
    onHide: () => { clearTimeout(saveT); saveEditor(); save(); },
    onLock: () => { closeEditor(); clearTimeout(saveT); save(); unlocked = false; close(); $("#app").innerHTML = ""; },
    onUnlock: () => { unlocked = true; render(); } });
  addEventListener("pagehide", () => { clearTimeout(saveT); saveEditor(); save(); });
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  /* Adult modules live in their own file, fetched only after the 18+ switch is turned on. */
  let BASE = null, ADULT = null;
  function setData() {
    const mods = [...BASE.modules]; if (S.adult && ADULT) { const at = Math.max(0, mods.findIndex(m => m.id === "anticipation") + 1); mods.splice(at, 0, ...ADULT.modules); }
    D = { modules: mods }; ALL = mods.flatMap(m => m.techniques.map(t => (t._mod = m.id, t))); BY = {}; ALL.forEach(t => BY[t.id] = t);
  }

  Vault.unlock().then(() => Vault.load("data/lessons.enc.json")).then(async d => { BASE = d; if (S.adult) await loadAdult().catch(() => {}); setData(); unlocked = true; render(); setTimeout(() => showInstall(false), 4000); })
    .catch(() => { $("#app").innerHTML = `<p style="margin-top:40vh;text-align:center">Couldn't load the lessons. Check your connection and reload.</p>`; });
})();
