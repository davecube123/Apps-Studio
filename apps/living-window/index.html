<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#151218">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Living Window">
  <meta name="description" content="A quiet window onto a generated landscape that follows your real day and weather, with a soft generated soundscape.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Living Window</title>
  <style>
    :root { --ink: #f2ece2; --muted: rgba(242,236,226,.6); --line: rgba(242,236,226,.16); --gold: #f0c27a; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #151218; color: var(--ink); overflow: hidden; overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; font-family: var(--sans); }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; transition: opacity 1.4s ease; z-index: 5; }
    .overlay.hide { opacity: 0; pointer-events: none; }
    #open { background: radial-gradient(70% 45% at 50% 55%, rgba(240,170,110,.18), transparent 70%), rgba(21,18,24,.82); cursor: pointer; }
    #open h1 { font: 400 42px/1.05 var(--serif); margin: 0; }
    #open h1 em { color: var(--gold); }
    #open p { font: italic 16px/1.5 var(--serif); color: var(--muted); max-width: 300px; margin: 14px 0 0; }
    #open .tap { margin-top: 40px; font: 500 13px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .35; } }
    /* the quiet panel, shown on tap */
    #panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 18px 20px calc(env(safe-area-inset-bottom) + 20px); background: linear-gradient(to top, rgba(14,12,18,.9), rgba(14,12,18,.72) 70%, rgba(14,12,18,0));
             transform: translateY(0); transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .5s; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    #panel.hide { transform: translateY(105%); opacity: 0; pointer-events: none; }
    .wrap { max-width: 520px; margin: 0 auto; }
    .now { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .now .time { font: 300 38px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .now .sky { font: italic 16px var(--serif); color: var(--muted); text-align: right; }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .grow { flex: 1; min-width: 0; }
    .lbl { font: 600 10.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); width: 66px; flex: none; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chips button { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 7px 12px; font: 500 13px var(--sans); cursor: pointer; }
    .chips button.on { color: #1b1720; background: var(--ink); border-color: transparent; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: none; margin: 0; }
    input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: rgba(242,236,226,.25); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); margin-top: -8.5px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
    input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: rgba(242,236,226,.25); }
    input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); border: 0; }
    .btn { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 500 13px var(--sans); cursor: pointer; white-space: nowrap; }
    .btn.gold { border-color: transparent; background: var(--gold); color: #241a10; }
    .fine { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
    .ver { text-align: center; font-size: 11px; color: rgba(242,236,226,.35); margin-top: 10px; }
    .update { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; top: calc(env(safe-area-inset-top) + 14px); z-index: 20; border: 0; background: var(--gold); color: #241a10; padding: 11px 20px; border-radius: 999px; font: 600 14px var(--sans); cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { #panel { transition: none; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="open" class="overlay">
    <h1>Living <em>Window</em></h1>
    <p>A quiet view that follows your day and your weather. Leave it open while you read, work or rest.</p>
    <div class="tap">Tap to open the window</div>
  </div>
  <div id="panel" class="hide"><div class="wrap">
    <div class="now"><div class="time" id="ptime"></div><div class="sky" id="psky"></div></div>
    <div class="row"><span class="lbl">Day</span><input type="range" id="scrub" min="0" max="1439" step="1" class="grow" aria-label="Look at another time of day"><button class="btn" id="nowbtn">Now</button></div>
    <div class="row"><span class="lbl">Weather</span><div class="chips grow" id="wx"></div></div>
    <div class="row"><span class="lbl">Sky</span><div class="grow" id="skysrc"></div></div>
    <div class="row"><span class="lbl">Music</span><input type="range" id="vmus" min="0" max="1" step=".01" class="grow" aria-label="Music volume"></div>
    <div class="row"><span class="lbl">Nature</span><input type="range" id="vnat" min="0" max="1" step=".01" class="grow" aria-label="Nature sounds volume"></div>
    <div class="row"><span class="lbl">Fade out</span><div class="chips grow" id="timer"></div></div>
    <div class="row"><span class="lbl">Screen</span><div class="chips grow" id="awake"></div></div>
    <div class="ver" id="ver"></div>
  </div></div>
  <script>
  "use strict";
  /* Living Window. Every pixel and every sound is generated here: an original landscape whose light
     follows the real sun (computed from the clock, and from your location if you share it), and
     whose weather follows Open-Meteo's current conditions if you allow it. */
  const APP_VERSION = "2";
  const $ = s => document.querySelector(s);
  const cv = $("#c"), ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const hash1 = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const S = Object.assign({ lat: null, lon: null, useSky: false, wx: "auto", mus: .55, nat: .7, timer: 0, awake: true }, (() => { try { return JSON.parse(localStorage.getItem("living-window")) || {}; } catch (e) { return {}; } })());
  const store = () => { try { localStorage.setItem("living-window", JSON.stringify(S)); } catch (e) {} };

  /* ---------- The sun and the moon, from the clock ---------- */
  const RAD = Math.PI / 180;
  function sunPos(date, lat, lon) {
    const d = (date.getTime() - Date.UTC(2000, 0, 1, 12)) / 864e5;
    const g = (357.529 + .98560028 * d) * RAD, q = 280.459 + .98564736 * d, L = (q + 1.915 * Math.sin(g) + .02 * Math.sin(2 * g)) * RAD, e = (23.439 - .00000036 * d) * RAD;
    const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));
    const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24, ha = (gmst * 15 + lon) * RAD - ra;
    const el = Math.asin(Math.sin(lat * RAD) * Math.sin(dec) + Math.cos(lat * RAD) * Math.cos(dec) * Math.cos(ha));
    const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(lat * RAD) - Math.sin(lat * RAD) * Math.cos(ha));
    return { el: el / RAD, az: ((az / RAD) + 360) % 360 };
  }
  const moonPhase = date => { const p = ((date.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 864e5 / 29.530588) % 1; return p < 0 ? p + 1 : p; };
  /* without a shared location: guess from the time zone (longitude) and a mid latitude */
  const place = () => S.useSky && S.lat != null ? { lat: S.lat, lon: S.lon } : { lat: 30, lon: -new Date().getTimezoneOffset() / 4 };
  /* across the window: east on the left, west on the right (facing the equator) */
  function skyX(az, lat) { const a = lat >= 0 ? az : (az + 180) % 360, f = (a - 90) / 180; return lat >= 0 ? f : 1 - f; }

  /* ---------- Weather: real (Open-Meteo, no account) or chosen ---------- */
  const WX = { clear: { cloud: .05, rain: 0, snow: 0, fog: 0, wind: .2, storm: 0 }, cloudy: { cloud: .75, rain: 0, snow: 0, fog: 0, wind: .35, storm: 0 },
               rain: { cloud: .9, rain: .7, snow: 0, fog: .1, wind: .45, storm: 0 }, storm: { cloud: 1, rain: 1, snow: 0, fog: .1, wind: .8, storm: 1 },
               fog: { cloud: .5, rain: 0, snow: 0, fog: .85, wind: .05, storm: 0 }, snow: { cloud: .85, rain: 0, snow: .7, fog: .2, wind: .25, storm: 0 } };
  const WX_NAMES = { clear: "Clear", cloudy: "Cloudy", rain: "Rain", storm: "Storm", fog: "Fog", snow: "Snow" };
  let live = null; /* { kind, temp, cloud, wind, at } from the network */
  function kindOf(code) { if (code >= 95) return "storm"; if (code >= 71 && code <= 77 || code === 85 || code === 86) return "snow"; if (code >= 51 && code <= 82) return "rain"; if (code === 45 || code === 48) return "fog"; if (code >= 2) return "cloudy"; return "clear"; }
  async function fetchWeather() {
    if (!S.useSky || S.lat == null) return;
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${S.lat.toFixed(2)}&longitude=${S.lon.toFixed(2)}&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m,precipitation`);
      const j = await r.json(), c = j.current; if (!c) return;
      live = { kind: kindOf(c.weather_code), temp: Math.round(c.temperature_2m), cloud: c.cloud_cover / 100, wind: clamp(c.wind_speed_10m / 40, 0, 1), rainAmt: clamp((c.precipitation || 0) / 4, 0, 1), at: Date.now() };
      renderPanel();
    } catch (e) { live = null; }
  }
  setInterval(fetchWeather, 15 * 60e3);
  function wantedWeather() {
    if (S.wx !== "auto") return { ...WX[S.wx], kind: S.wx };
    if (live) { const b = WX[live.kind]; return { ...b, cloud: Math.max(b.cloud * .6, live.cloud), wind: Math.max(.1, live.wind), rain: b.rain ? lerp(.35, 1, live.rainAmt) : 0, kind: live.kind }; }
    return { ...WX.clear, cloud: .3, kind: "clear" };
  }
  /* weather eases in over about a minute, never snaps */
  const cur = { cloud: .3, rain: 0, snow: 0, fog: 0, wind: .2, storm: 0 };
  function easeWeather(dt) { const w = wantedWeather(); for (const k in cur) cur[k] = lerp(cur[k], w[k], clamp(dt * .12, 0, 1)); }

  /* ---------- Time: now, or a scrubbed moment ---------- */
  let scrubMin = null; /* minutes since midnight when previewing */
  function viewDate() { const d = new Date(); if (scrubMin == null) return d; const v = new Date(d); v.setHours(0, 0, 0, 0); v.setMinutes(scrubMin); return v; }

  /* ---------- Colour by the sun's height ---------- */
  const SKY = [ /* elevation, top, horizon */
    [-18, [8, 10, 24], [16, 22, 46]], [-9, [14, 20, 48], [44, 48, 92]], [-4, [34, 42, 88], [190, 116, 104]], [0, [66, 84, 140], [240, 150, 104]],
    [5, [78, 114, 170], [246, 192, 140]], [14, [84, 138, 204], [206, 222, 236]], [40, [70, 130, 210], [190, 216, 240]] ];
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  function skyAt(el) { if (el <= SKY[0][0]) return [SKY[0][1], SKY[0][2]]; for (let i = 1; i < SKY.length; i++) if (el <= SKY[i][0]) { const t = (el - SKY[i - 1][0]) / (SKY[i][0] - SKY[i - 1][0]); return [mix(SKY[i - 1][1], SKY[i][1], t), mix(SKY[i - 1][2], SKY[i][2], t)]; } return [SKY[SKY.length - 1][1], SKY[SKY.length - 1][2]]; }
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  function glow(x, y, r, c, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgb(c, a)); g.addColorStop(1, rgb(c, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

  /* ---------- The scene ---------- */
  let T = 0;
  const clouds = Array.from({ length: 9 }, (_, i) => ({ x: hash1(i) * 1.6 - .3, y: .06 + hash1(i + 7) * .3, w: .25 + hash1(i + 3) * .35, s: .004 + hash1(i + 5) * .006, puffs: 5 + Math.floor(hash1(i + 9) * 5) }));
  const stars = Array.from({ length: 140 }, (_, i) => ({ x: hash1(i * 3), y: hash1(i * 3 + 1) * .62, r: .4 + hash1(i * 3 + 2) * 1.1, p: hash1(i + 400) * 6 }));
  const houses = Array.from({ length: 11 }, (_, i) => ({ x: .06 + i * .085 + (hash1(i + 30) - .5) * .03, w: .045 + hash1(i + 40) * .03, h: .03 + hash1(i + 50) * .025, lightAt: -2 - hash1(i + 60) * 6, offAt: -12 - hash1(i + 70) * 6, win: hash1(i + 80) }));
  let drops = [], streaks = [], flakes = [], birds = [], flash = 0, nextBird = 6, nextBolt = 12;
  function hills(base, amp, seed, color) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
    for (let i = 0; i <= 60; i++) { const x = i / 60 * W, u = i / 60; ctx.lineTo(x, base - amp * (.55 * Math.sin(u * 4.1 + seed) + .3 * Math.sin(u * 9.3 + seed * 2) + .15 * Math.sin(u * 19 + seed * 3))); }
    ctx.lineTo(W, H); ctx.fill();
  }
  function tree(x, y, s, sway, col) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(sway); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = "round";
    ctx.lineWidth = 3 * s; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -40 * s); ctx.stroke();
    for (let k = 0; k < 7; k++) { const a = hash1(x + k) * Math.PI * 2, r = 9 + hash1(k + x * 3) * 12; ctx.beginPath(); ctx.arc(Math.cos(a) * r * .8 * s, (-52 + Math.sin(a) * r * .7) * s, (10 + hash1(k * 7 + x) * 7) * s, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  function draw(dt) {
    const date = viewDate(), pl = place(), sun = sunPos(date, pl.lat, pl.lon), el = sun.el;
    const day = smooth(-6, 10, el), night = 1 - smooth(-14, -4, el), dusk = Math.max(0, 1 - Math.abs(el - 1) / 9) * smooth(-8, -2, el);
    const grey = clamp(cur.cloud * .55 + cur.rain * .3 + cur.fog * .35, 0, .95);
    /* sky */
    let [top, hor] = skyAt(el); const greyC = mix([120, 124, 132], [36, 38, 46], 1 - day);
    top = mix(top, greyC, grey); hor = mix(hor, mix(greyC, [200, 200, 205], day * .5), grey * .9);
    const hz = H * .62, sk = ctx.createLinearGradient(0, 0, 0, hz); sk.addColorStop(0, rgb(top)); sk.addColorStop(1, rgb(hor)); ctx.fillStyle = sk; ctx.fillRect(0, 0, W, H); /* the whole screen, every frame */
    /* stars */
    const starA = night * (1 - cur.cloud * .9) * (1 - cur.fog); if (starA > .02) stars.forEach(s => { ctx.fillStyle = `rgba(240,240,255,${starA * (.4 + .6 * (.5 + .5 * Math.sin(T * 1.2 + s.p)))})`; ctx.beginPath(); ctx.arc(s.x * W, s.y * hz, s.r, 0, Math.PI * 2); ctx.fill(); });
    /* the sun */
    const sx = skyX(sun.az, pl.lat) * W, sy = hz - (el / 55) * hz * .95;
    if (el > -4) { const a = smooth(-4, 1, el) * (1 - cur.cloud * .8); glow(sx, sy, W * .55, el < 8 ? [255, 190, 120] : [255, 240, 210], .4 * a); if (sy < hz + 10) { ctx.fillStyle = rgb(el < 6 ? [255, 214, 160] : [255, 248, 230], a); ctx.beginPath(); ctx.arc(sx, sy, Math.min(W, H) * .045, 0, Math.PI * 2); ctx.fill(); } }
    /* the moon, in its phase */
    const ph = moonPhase(date), mp = sunPos(new Date(date.getTime() - ph * 24 * 3600e3 * 1.035), pl.lat, pl.lon), mx = skyX(mp.az, pl.lat) * W, my = hz - (mp.el / 55) * hz * .95;
    if (mp.el > -2 && ph > .04 && ph < .96) { const a = (1 - day * .75) * (1 - cur.cloud * .85), r = Math.min(W, H) * .032; glow(mx, my, r * 6, [220, 225, 240], .25 * a);
      /* the lit disc, with a shadow disc sliding across it: from the right as it waxes, leaving to the left as it wanes */
      ctx.save(); ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.clip(); ctx.fillStyle = rgb([236, 236, 226], a); ctx.fillRect(mx - r, my - r, r * 2, r * 2);
      const off = ph < .5 ? -2 * r * (ph * 2) : 2 * r * (1 - (ph - .5) * 2); ctx.fillStyle = rgb(top, a * .9); ctx.beginPath(); ctx.arc(mx + off, my, r * 1.02, 0, Math.PI * 2); ctx.fill();
      ctx.restore(); }
    /* clouds */
    const cAmt = cur.cloud, cCol = mix(mix([250, 246, 240], [90, 92, 104], 1 - day), [255, 196, 150], dusk * .6), cDark = mix(cCol, [60, 62, 72], cur.rain * .6 + cur.storm * .3);
    clouds.forEach((c, i) => { c.x += c.s * (.4 + cur.wind * 2) * dt; if (c.x > 1.35) c.x = -.45; const show = clamp(cAmt * 9 - i, 0, 1); if (show <= 0) return;
      const cx = c.x * W, cy = c.y * hz, cw = c.w * W * (.8 + cAmt * .5);
      for (let k = 0; k < c.puffs; k++) { const u = k / (c.puffs - 1) - .5, r = cw * (.16 + .1 * Math.cos(u * Math.PI)) * (.8 + hash1(i * 10 + k) * .4);
        ctx.fillStyle = rgb(k % 2 ? cCol : cDark, .5 * show + .25 * cAmt * show); ctx.beginPath(); ctx.ellipse(cx + u * cw, cy - Math.cos(u * Math.PI) * r * .35, r, r * .55, 0, 0, Math.PI * 2); ctx.fill(); } });
    if (flash > 0) { ctx.fillStyle = `rgba(230,235,255,${flash * .5})`; ctx.fillRect(0, 0, W, hz); }
    /* land: far hills, the village, near hills, trees, the meadow */
    const lightL = .15 + .85 * day, land = (c) => rgb(mix(mix(c, [20, 22, 34], (1 - lightL) * .9), hor, .18 + cur.fog * .45));
    hills(hz + 4, H * .05, 1.3, land([118, 136, 160]));
    hills(hz + H * .05, H * .035, 4.1, land([96, 116, 120]));
    /* the village: lights come on at dusk, go out late */
    const vy = hz + H * .075; houses.forEach((h, i) => { const x = h.x * W, w = h.w * W, hh = h.h * H; ctx.fillStyle = land([84, 88, 98]); ctx.fillRect(x, vy - hh, w, hh + 6);
      ctx.beginPath(); ctx.moveTo(x - 3, vy - hh); ctx.lineTo(x + w / 2, vy - hh - w * .45); ctx.lineTo(x + w + 3, vy - hh); ctx.fill();
      const hr = date.getHours() + date.getMinutes() / 60, on = el < h.lightAt && ((hr >= 12 && hr < 21 + h.win * 3) || (hr < 12 && hr > 5.2 + h.win * 1.5)); if (on) { const wx = x + w * (.25 + h.win * .35), wy = vy - hh * .65; glow(wx + 3, wy + 3, 14, [255, 200, 120], .35); ctx.fillStyle = "rgba(255,212,140,.95)"; ctx.fillRect(wx, wy, 5, 6); } });
    hills(hz + H * .1, H * .03, 7.7, land([70, 96, 72]));
    for (let i = 0; i < 8; i++) { const x = (i / 7) * W * 1.08 - W * .04 + hash1(i + 90) * 20, y = hz + H * .1 + Math.sin(i * 1.3) * H * .01, s = .9 + hash1(i + 99) * .6;
      tree(x, y + 4, s * Math.min(W, 520) / 390, Math.sin(T * (.8 + cur.wind * 1.5) + i) * (.01 + cur.wind * .05), land([46, 66, 52])); }
    const mg = ctx.createLinearGradient(0, hz + H * .1, 0, H); mg.addColorStop(0, land([64, 90, 60])); mg.addColorStop(1, land([34, 48, 34])); ctx.fillStyle = mg; ctx.fillRect(0, hz + H * .12, W, H);
    ctx.strokeStyle = land([40, 58, 40]); ctx.lineWidth = 1.4; for (let i = 0; i < 70; i++) { const gx = hash1(i + 200) * W, gy = hz + H * .14 + hash1(i + 300) * H * .28, hh = 8 + hash1(i) * 12, sw = Math.sin(T * (1 + cur.wind * 2) + i) * (2 + cur.wind * 7);
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.quadraticCurveTo(gx + sw * .4, gy - hh * .6, gx + sw, gy - hh); ctx.stroke(); }
    /* birds, by day */
    nextBird -= dt; if (nextBird < 0 && day > .4 && cur.rain < .2 && !cur.storm) { const n = 3 + Math.floor(Math.random() * 5), y = hz * (.2 + Math.random() * .4), dir = Math.random() < .5 ? 1 : -1;
      birds.push({ x: dir > 0 ? -60 : W + 60, y, dir, n, v: 28 + Math.random() * 18, ph: Math.random() * 6 }); nextBird = 18 + Math.random() * 30; if (Math.random() < .6) chirpSoon(); }
    birds.forEach(b => { b.x += b.dir * b.v * dt; b.ph += dt * 7; ctx.strokeStyle = rgb(mix([40, 40, 50], [20, 20, 30], 1 - day), .8); ctx.lineWidth = 1.5;
