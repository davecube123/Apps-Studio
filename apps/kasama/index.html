  <title>Kasama</title>
  <style>
    :root {
      --bg: #f6f1e9; --card: #fffdf9; --ink: #1f2a2c; --ink2: #4d5b5d; --muted: #8a9597; --line: rgba(31,42,44,.09); --line2: rgba(31,42,44,.16);
      --teal: #2f7f78; --teal-soft: rgba(47,127,120,.1); --coral: #d9714f; --coral-soft: rgba(217,113,79,.12); --sun: #e3a93b; --red: #c2453b; --red-soft: rgba(194,69,59,.1);
      --r: 20px; --ease: cubic-bezier(.2,.7,.2,1); --spring: cubic-bezier(.2,.9,.25,1.15);
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --e1: 0 1px 2px rgba(31,42,44,.05), 0 4px 14px rgba(31,42,44,.05); color-scheme: light;
    }
    @media (prefers-color-scheme: dark) { :root {
      --bg: #16191a; --card: #1f2425; --ink: #e9eeec; --ink2: #b6c1bf; --muted: #7f8a89; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.15);
      --teal: #6cc3b9; --teal-soft: rgba(108,195,185,.13); --coral: #ef9271; --coral-soft: rgba(239,146,113,.14); --sun: #f0c062; --red: #ef7b70; --red-soft: rgba(239,123,112,.13); --e1: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); }
    body { margin: 0; color: var(--ink); font: 16.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip; }
    main { max-width: 620px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 110px); }
    a { color: var(--teal); }
    h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.015em; line-height: 1.2; text-wrap: balance; }
    h1 { font-size: 30px; } h2 { font-size: 22px; } h3 { font-size: 17.5px; }
    p { margin: .5em 0; text-wrap: pretty; }
    .muted { color: var(--muted); } .small { font-size: 14px; } .center { text-align: center; }
    .eyebrow { font: 700 11.5px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--e1); }
    .card + .card, .card + .list, .list + .card { margin-top: 12px; }
    .sec { margin-top: 26px; } .sec > .eyebrow { margin: 0 2px 10px; }
    .btn { appearance: none; border: 1px solid var(--line2); background: var(--card); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 10px 18px;
           font: 600 15px var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: transform .25s var(--spring); }
    .btn:active { transform: scale(.96); }
    .btn.teal { background: var(--teal); color: #fff; border-color: transparent; } .btn.red { background: var(--red); color: #fff; border-color: transparent; }
    .btn.sm { min-height: 36px; padding: 6px 14px; font-size: 14px; } .btn.block { display: flex; width: 100%; }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--ink2); }
    .view.enter > * { animation: rise .4s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .hello { font: 600 28px/1.2 var(--serif); letter-spacing: -.01em; }
    .list a, .list button.li { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
           color: var(--ink); text-decoration: none; font: 600 16px/1.35 var(--sans); cursor: pointer; }
    .list a + a, .list button + button, .list a + button, .list button + a { margin-top: 8px; }
    .list small { display: block; font-weight: 500; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
    .list .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; flex: none; font-size: 18px; }
    .list .done .ic, .ic.done { background: var(--teal); color: #fff; }
    .chev { margin-left: auto; color: var(--muted); }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); font: 500 15px var(--sans); margin: -4px 0 14px -4px; padding: 6px 12px 6px 8px; border-radius: 999px;
            background: var(--card); border: 1px solid var(--line); cursor: pointer; text-decoration: none; }
    .prose p { font-size: 17px; line-height: 1.62; }
    .key { background: var(--teal-soft); border-radius: 16px; padding: 12px 16px; margin: 14px 0; font-weight: 600; color: var(--ink); }
    .warn { background: var(--red-soft); border-radius: 16px; padding: 12px 16px; margin: 14px 0; }
    .say { border-left: 3px solid var(--teal); padding: 4px 0 4px 14px; margin: 8px 0; font: italic 17px/1.5 var(--serif); }
    .avoid { border-left: 3px solid var(--coral); padding: 4px 0 4px 14px; margin: 8px 0; font: 16px/1.5 var(--sans); color: var(--ink2); }
    ul.tight { margin: 6px 0; padding-left: 20px; } ul.tight li { margin: 4px 0; }
    .opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line2); background: var(--card); color: var(--ink); border-radius: 14px; padding: 12px 14px; margin-top: 8px; font: 16px/1.45 var(--sans); cursor: pointer; }
    .opt.good { border-color: var(--teal); background: var(--teal-soft); } .opt.bad { border-color: var(--coral); background: var(--coral-soft); }
    .fb { margin-top: 10px; font-size: 15.5px; color: var(--ink2); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--line2); background: var(--card); color: var(--ink2); border-radius: 999px; padding: 6px 12px; font: 600 13.5px var(--sans); cursor: pointer; }
    .chip.on { background: var(--teal); color: #fff; border-color: transparent; }
    textarea, input[type=text], input[type=tel], input[type=time] { width: 100%; border: 1px solid var(--line2); background: var(--card); color: var(--ink); border-radius: 14px; padding: 11px 13px; font: 16px var(--sans); outline: 0; }
    textarea { resize: vertical; min-height: 90px; } textarea:focus, input:focus { border-color: var(--teal); }
    label.f { display: block; margin-top: 12px; } label.f > span { display: block; font: 600 13px var(--sans); color: var(--muted); margin: 0 2px 5px; }
    .note { padding: 12px 0; border-bottom: 1px solid var(--line); } .note .d { font: 600 12.5px var(--sans); color: var(--muted); }
    .crisis { background: var(--red-soft); border: 1px solid rgba(194,69,59,.25); border-radius: var(--r); padding: 16px 18px; }
    .crisis a.call { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 11px 0; border-top: 1px solid rgba(194,69,59,.18); text-decoration: none; color: var(--ink); font-weight: 600; }
    .crisis a.call:first-of-type { border-top: 0; } .crisis a.call b { color: var(--red); white-space: nowrap; }
    /* His space */
    .things .thing { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); cursor: pointer; text-align: left; color: var(--ink); font: 600 16.5px var(--sans); }
    .things .thing + .thing { margin-top: 8px; }
    .tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line2); flex: none; display: grid; place-items: center; color: #fff; transition: all .25s var(--spring); }
    .thing.done .tick { background: var(--teal); border-color: var(--teal); } .thing.done { color: var(--ink2); }
    .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 90px; margin-top: 10px; }
    .bars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; }
    .bars i { width: 100%; max-width: 30px; border-radius: 6px; background: var(--teal); opacity: .85; min-height: 4px; } .bars i.zero { background: var(--line2); }
    .bars span { font: 700 10.5px var(--sans); color: var(--muted); }
    .timer { font: 300 64px/1 var(--sans); text-align: center; font-variant-numeric: tabular-nums; margin: 10px 0; }
    .breath { width: 180px; height: 180px; margin: 20px auto; border-radius: 50%; background: radial-gradient(circle, var(--teal-soft), transparent 70%); border: 2px solid var(--teal); display: grid; place-items: center;
              font: 600 18px var(--sans); color: var(--teal); transform: scale(.7); transition: transform 4s ease-in-out; }
    .breath.in { transform: scale(1); transition-duration: 4s; } .breath.out { transform: scale(.7); transition-duration: 6s; }
    .moods { display: flex; justify-content: space-between; gap: 6px; } .moods button { flex: 1; font-size: 26px; padding: 8px 0; border-radius: 14px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
    .moods button.on { background: var(--teal-soft); border-color: var(--teal); }
    nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 20; width: min(460px, calc(100% - 20px)); padding: 6px; border-radius: 28px;
               background: color-mix(in srgb, var(--card) 85%, transparent); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); border: 1px solid var(--line2);
               box-shadow: 0 10px 30px rgba(0,0,0,.12); display: flex; }
    nav.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; border-radius: 22px; color: var(--muted); font: 600 10.5px var(--sans); padding: 7px 0 6px; }
    nav.tabs a svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    nav.tabs a.on { color: var(--teal); background: var(--teal-soft); }
    .toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: 90vw; text-align: center; bottom: calc(env(safe-area-inset-bottom) + 96px); background: var(--ink); color: var(--bg);
             padding: 11px 18px; border-radius: 18px; font: 600 14px var(--sans); z-index: 60; animation: rise .3s var(--spring) both; }
    .update { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; top: calc(env(safe-area-inset-top) + 12px); z-index: 55; border: 0; background: var(--teal); color: #fff; padding: 11px 20px; border-radius: 999px; font: 700 14px var(--sans); cursor: pointer; }
    .choose { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; }
    .choose button { text-align: left; width: 100%; border: 1px solid var(--line2); background: var(--card); border-radius: 22px; padding: 18px 20px; margin-top: 12px; cursor: pointer; color: var(--ink); box-shadow: var(--e1); }
    .choose button b { display: block; font-size: 19px; } .choose button span { color: var(--ink2); font-size: 15px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>

<body>
  <main id="main"></main>
  <nav class="tabs" id="tabs" hidden></nav>
  <script>
  "use strict";
  const APP_VERSION = "1", APP_DATE = "12 Nov 2026";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const DAY = 864e5, uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const dstr = t => new Date(t).toLocaleDateString("en-PH", { weekday: "short", day: "numeric", month: "short" });
  function toast(m, ms = 2600) { document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
  const haptic = (p = 8) => { try { navigator.vibrate?.(p); } catch (e) {} };

  /* Everything stays on this phone (localStorage). Nothing is sent anywhere. */
  const KEY = "kasama";
  const db = Object.assign({ space: null, names: { him: "", me: "" }, steps: {}, notes: [], lessons: {}, practice: {}, care: [], contacts: [], today: {}, things: null, sleep: {}, music: [], moods: {} },
    (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })());
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };
  const him = () => db.names.him || "siya";

  /* ---------- Verified Philippine numbers (November 2026). NCMH Crisis Hotline: free, 24/7. ---------- */
  const CRISIS = [
    ["Emergency (pulis, ambulansya, bumbero)", "911", "911"],
    ["NCMH Crisis Hotline · landline, toll-free", "1553", "1553"],
    ["NCMH Crisis Hotline · toll-free", "1800-1888-1553", "180018881553"],
    ["NCMH Crisis Hotline · Smart/TNT", "0919-057-1553", "09190571553"],
    ["NCMH Crisis Hotline · Globe/TM", "0917-899-8727", "09178998727"],
    ["NCMH Crisis Hotline · Globe/TM", "0966-351-4518", "09663514518"],
  ];
  const crisisHTML = (title = "Kung may panganib ngayon") => `<div class="crisis"><h3 style="color:var(--red)">${title}</h3>
    <p class="small" style="margin:6px 0 4px;color:var(--ink2)">Kung may posibilidad na masaktan niya ang sarili o ibang tao, tumawag agad sa 911 o dalhin siya sa pinakamalapit na emergency room. Ang NCMH line ay para rin sa pamilya: puwede kayong tumawag para humingi ng payo.</p>
    ${CRISIS.map(([l, n, d]) => `<a class="call" href="tel:${d}"><span class="small">${l}</span><b>${n}</b></a>`).join("")}</div>`;

  /* =================================================================
     FAMILY SPACE: understanding, talking (LEAP, low expressed emotion), getting help, caring for yourselves
     ================================================================= */
  const LESSONS = [
    { id: "what", t: "Ano ba talaga ang psychosis?", m: 3, body: [
      "Ang psychosis ay kondisyon kung saan nahihirapan ang utak na paghiwalayin kung ano ang totoo at kung ano ang galing sa sariling isip. Hindi ito kahinaan ng loob, hindi ito katamaran, at hindi niya ito pinili.",
      "Karaniwang may tatlong uri ng sintomas. Una, ang mga “dagdag”: nakakarinig ng boses na wala naman (hallucinations), o matinding paniniwala na hindi totoo, gaya ng may sumusunod o nagbabantay sa kanya (delusions). Pangalawa, ang mga “bawas”: nawawalan ng gana, lumalayo sa tao, parang walang emosyon, tumitigil sa mga dating gusto. Pangatlo, hirap mag-focus at mag-isip nang maayos.",
      "Kaya maaaring tumigil siya sa pagtugtog. Hindi dahil ayaw na niya sa musika; ang “bawas” na sintomas mismo ang kumukuha ng gana at lakas. Hindi ito masosolusyonan ng pagpilit, pero bumabalik ito sa tamang gamutan at panahon.",
      "Ang mga pagsabog ng galit, gaya ng pagtumba ng upuan o pagbasag ng cellphone, ay kadalasang galing sa takot at sobrang stress ng nararanasan niya, lalo na kung pakiramdam niya ay may banta sa kanya. Seryoso pa rin ito, pero tanda ito na kailangan na niya ng tulong, hindi ng sermon." ],
      key: "Hindi siya ang problema. Ang kondisyon ang problema, at kasama ninyo siya sa paglaban dito." },
    { id: "insight", t: "Bakit sinasabi niyang wala siyang sakit", m: 3, body: [
      "Isa sa pinakamahirap: maraming taong may psychosis ang tunay na hindi nakikitang may sakit sila. Ito ay tinatawag na anosognosia o lack of insight, at bahagi ito ng kondisyon mismo, galing sa paraan ng pagtrabaho ng utak. Sa pananaliksik, mga kalahati ng may schizophrenia ang nakakaranas nito.",
      "Ibig sabihin, hindi siya nagmamatigas. Para sa kanya, totoo ang nararanasan niya. Kaya kapag pinagtatalunan natin kung totoo o hindi, lalo lang siyang lumalayo at hindi na nagtitiwala.",
      "Ang mas gumagana: huwag pilitin siyang tanggapin na “may sakit” siya. Sa halip, hanapin ang mga bagay na gusto niyang mabago: makatulog nang maayos, mabawasan ang stress o takot, makabalik sa pagtugtog. Doon kayo magtulungan. Ito ang puso ng LEAP, na nasa “Kausapin” tab." ],
      key: "Ang layunin ay hindi manalo sa argumento. Ang layunin ay manatili siyang nagtitiwala sa inyo." },
    { id: "early", t: "Bakit ngayon na dapat magpatingin", m: 2, body: [
      "Malinaw sa pananaliksik: mas maaga ang gamutan, mas maganda ang paggaling. Ang tagal ng hindi nagagamot na psychosis (duration of untreated psychosis) ay isa sa pinakamalakas na palatandaan ng magiging takbo ng kanyang paggaling.",
      "Ang psychiatrist ang makakapagbigay ng tamang diagnosis at gamot. Ang mga antipsychotic na gamot ay napatunayang nakakatulong lalo sa mga “dagdag” na sintomas at sa pag-iwas sa pagbabalik nito. May side effects ang ilan, pero napag-uusapan at naaayos ito kasama ang doktor.",
      "Hindi kailangang hintayin na pumayag siya bago kayo kumilos. Puwedeng kayo muna, ang girlfriend o pamilya, ang kumonsulta sa psychiatrist para humingi ng gabay kung paano siya madadala. Tingnan ang “Tulong” tab." ],
      key: "Ang pinakamahalagang magagawa ninyo ngayon: tulungan siyang makarating sa psychiatrist." },
    { id: "worse", t: "Ano ang nagpapalala", m: 2, body: [
      "Kulang sa tulog: madalas ito ang unang senyales at nagpapalala rin ng hinala at boses. Ang tulog ay mahalagang bantayan.",
      "Droga at alak: ang marijuana at lalo na ang shabu (methamphetamine) ay kilalang nagti-trigger at nagpapalala ng psychosis. Pati ang sobrang alak. Kung gumagamit siya, mahalagang sabihin ito sa doktor, nang walang paninisi.",
      "Stress at gulo sa bahay: away, sigawan, sobrang daming tao o ingay, pressure na “bumalik ka na sa trabaho.” Ang kalmado at mainit na kapaligiran ay nakakatulong talaga, hindi lang “magandang pakiramdam.”",
      "Biglaang paghinto ng gamot (kapag nagsimula na siya): isa ito sa pinakamadalas na dahilan ng pagbabalik ng sintomas." ],
      key: "Tulog, walang droga, at kalmadong bahay: tatlong bagay na kayang tulungan ng pamilya araw-araw." },
    { id: "home", t: "Ang kalmadong bahay: ano ang sinasabi ng research", m: 3, body: [
      "Matagal nang pinag-aaralan ang tinatawag na “expressed emotion” sa pamilya. Paulit-ulit ang resulta: kapag maraming batikos, galit, o sobrang pakikialam ang pamilya, mas madalas bumabalik ang sintomas. Hindi ito paninisi sa pamilya; natural ang mga reaksyong ito kapag takot at pagod ka.",
      "Ang nakakatulong: mahinahong boses, maikli at malinaw na pananalita, papuri sa maliliit na hakbang, at pagbibigay ng espasyo kapag kailangan niya. Ang mga pamilyang natuto tungkol sa kondisyon at sa ganitong paraan ng pakikitungo ay may mas kaunting pagbabalik ng sintomas at pagkaka-ospital; ito ay family psychoeducation, isa sa pinakamatibay na ebidensya sa larangang ito.",
      "Hindi ibig sabihin na wala nang hangganan. Puwede kayong magsabi ng malinaw na limitasyon (“Hindi okay ang magbasag ng gamit”), nang mahinahon at walang pang-iinsulto." ],
      key: "Mahinahon, maikli, mainit, at may malinaw na limitasyon." },
    { id: "safety", t: "Tungkol sa galit at kaligtasan", m: 3, body: [
      "Karamihan ng taong may psychosis ay hindi marahas; mas madalas pa silang maging biktima. Pero tumataas ang panganib kapag hindi nagagamot, kapag may droga o alak, at kapag sobrang takot siya. Ang pagtumba ng upuan at pagbasag ng phone ay seryosong senyales na kailangan na ng tulong.",
      "Kapag galit o takot siya: bigyan siya ng espasyo, huwag harangan ang daan niya palabas, huwag hawakan o pigilan nang pisikal, magsalita nang mahina at mabagal, at huwag makipagtalo. Kayo rin: siguraduhing may daan kayo palabas.",
      "Itago ang mga bagay na maaaring makasakit (kutsilyo, gamot na marami, matutulis). Kung may banta sa buhay niya o ng iba, tumawag sa 911 o dalhin siya sa emergency room. Hindi ito pagtataksil sa kanya; ito ay pagmamahal." ],
      key: "Kaligtasan muna, ng lahat, kasama siya." },
    { id: "faith", t: "Pananampalataya, hiya, at ang sasabihin ng iba", m: 2, body: [
      "Sa ating kultura, minsan iniisip na ito ay sinapian, kulam, o kahinaan ng pananampalataya. Igalang ang paniniwala ng pamilya; ang dasal at komunidad ay malaking suporta. Pero hindi ito kapalit ng gamutan; magkasama dapat.",
      "Ang hiya (“ano ang sasabihin ng kapitbahay”) ay madalas na dahilan kung bakit naaantala ang pagpapatingin. Ang psychosis ay medikal na kondisyon tulad ng diabetes o hika. Walang dapat ikahiya sa pagpapagamot.",
      "May batas tayo, ang Mental Health Act (RA 11036), na nagbibigay ng karapatan sa maayos at makataong pangangalaga." ],

    { id: "recovery", t: "May pag-asa: ang paggaling", m: 2, body: [

  function sleepHours(e) { if (!e?.bed || !e?.wake) return null; const [bh, bm] = e.bed.split(":").map(Number), [wh, wm] = e.wake.split(":").map(Number); let m = wh * 60 + wm - (bh * 60 + bm); if (m <= 0) m += 1440; return m / 60; }

      <div class="card"><ul class="tight"><li><b>Musika sa headphones</b>, o tumugtog ng gitara.</li><li><b>Mag-hum o kumanta nang mahina.</b> Para sa ilan, nababawasan nito ang mga boses.</li><li><b>Kausapin ang taong pinagkakatiwalaan mo.</b></li><li><b>Maglakad sa labas</b>, o gumawa ng isang bagay gamit ang kamay.</li><li><b>Hindi mo kailangang sundin</b> ang anumang sinasabi ng mga boses.</li></ul></div>
      <div class="warn small">Kung may nag-uutos sa ’yo na saktan ang sarili mo o ang iba, tumawag agad sa taong pinagkakatiwalaan mo, o sa NCMH Crisis Hotline 1553 (libre, 24 oras).</div>
      <div class="list">${callsHTML()}<a href="tel:1553"><span class="ic" style="background:var(--red-soft);color:var(--red)">☎</span><span class="grow">NCMH Crisis Hotline<small>1553 · 0917-899-8727 · 0919-057-1553</small></span></a></div>`;
    if (id === "threat") return `<a class="back" href="#/calm">‹ Kalma</a><h1>Kapag pakiramdam mo may banta</h1><p class="muted">Totoo at nakakapagod ang ganitong takot. Ilang bagay na puwedeng subukan:</p>
      <div class="card"><ul class="tight"><li><b>Pumunta sa lugar na pakiramdam mo ay ligtas</b>, at huminga nang dahan-dahan.</li><li><b>Tanungin ang sarili:</b> ano pa ang posibleng paliwanag? Ano ang sasabihin ng kaibigang pinagkakatiwalaan ko?</li><li><b>Kausapin ang taong pinagkakatiwalaan mo</b> bago gumawa ng anumang hakbang.</li><li><b>Mas tumitindi ang takot kapag pagod o puyat.</b> Ang pahinga at tulog ay nakakatulong.</li><li><b>Iwasan ang alak at droga</b>; pinapalakas nila ang takot.</li></ul></div>
      <div class="list">${callsHTML()}<a href="tel:1553"><span class="ic" style="background:var(--red-soft);color:var(--red)">☎</span><span class="grow">NCMH Crisis Hotline<small>1553 · libre, 24 oras</small></span></a></div>`;
    return `<div class="eyebrow">Kalma</div><h1 style="margin-top:4px">Kapag mabigat</h1><p class="muted">Pumili ng isa. Okay lang kahit ilang beses.</p>
      <div class="list" style="margin-top:12px">${CALM.map(([t, k]) => `<a href="#/calm/${k}"><span class="ic">〰</span><span class="grow">${esc(t)}</span><span class="chev">›</span></a>`).join("")}</div>
      <div class="sec"><div class="eyebrow">Mga taong puwedeng tawagan</div><div class="list">${callsHTML() || `<a href="#/settings"><span class="ic">+</span><span class="grow">Idagdag ang mga taong pinagkakatiwalaan mo<small>Para isang pindot lang ang tawag</small></span></a>`}
        <a href="tel:1553"><span class="ic" style="background:var(--red-soft);color:var(--red)">☎</span><span class="grow">NCMH Crisis Hotline<small>1553 · libre, 24 oras</small></span></a></div></div>`;
  }

  /* ---------- Shared views ---------- */
  function viewSettings() {
    const fam = db.space === "family";
    return `<a class="back" href="#/">‹ Bumalik</a><h1>Settings</h1>
      <label class="f"><span>${fam ? "Pangalan niya (opsyonal)" : "Pangalan mo (opsyonal)"}</span><input type="text" id="nm" value="${esc(db.names.him)}" placeholder="${fam ? "Hal. Migs" : "Para sa pagbati"}"></label>
      ${fam ? "" : `<div class="sec"><div class="eyebrow">Mga taong pinagkakatiwalaan mo</div>
        ${[0, 1, 2].map(i => `<div class="row" style="gap:8px;margin-top:8px"><input type="text" data-c="name" data-i="${i}" value="${esc(db.contacts[i]?.name || "")}" placeholder="Pangalan"><input type="tel" data-c="tel" data-i="${i}" value="${esc(db.contacts[i]?.tel || "")}" placeholder="Numero"></div>`).join("")}</div>
        <div class="sec"><div class="eyebrow">Ang maliliit kong gagawin araw-araw</div>${[0, 1, 2, 3].map(i => `<input type="text" data-t="${i}" value="${esc(things()[i] || "")}" style="margin-top:8px">`).join("")}</div>`}
      <div class="sec"><div class="eyebrow">Phone na ito</div><div class="list">
        ${fam ? "" : `<button class="li" data-act="sharewk"><span class="ic">↗</span><span class="grow">Ibahagi ang linggo ko<small>Kung gusto mo lang: tulog, mga nagawa, musika</small></span></button>`}
        <button class="li" data-act="switch"><span class="ic">⇄</span><span class="grow">Palitan ang space<small>${fam ? "Gawing para sa kanya ang phone na ito" : "Gawing para sa pamilya ang phone na ito"}</small></span></button>
        <a href="#/about"><span class="ic">i</span><span class="grow">Tungkol sa Kasama<small>Saan galing ang mga gabay</small></span><span class="chev">›</span></a></div></div>
      <p class="small muted" style="margin-top:14px">Lahat ng nakasulat dito ay nasa phone na ito lang. Walang ipinapadala kahit saan.</p>`;
  }
  function viewAbout() {
    return `<a class="back" href="#/">‹ Bumalik</a><h1>Tungkol sa Kasama</h1>
      <p class="prose">Ginawa ang Kasama para sa isang kaibigan at sa mga nagmamahal sa kanya. Gabay ito, hindi kapalit ng psychiatrist o ng emergency services.</p>
      <div class="sec"><div class="eyebrow">Saan nakabatay</div><div class="card small"><ul class="tight">
        <li><b>Family psychoeducation:</b> ang pag-aaral ng pamilya tungkol sa kondisyon ay nagpapababa ng pagbabalik ng sintomas at pagkaka-ospital (Cochrane review: Pharoah et al.).</li>
        <li><b>Expressed emotion:</b> ang batikos, galit at sobrang pakikialam sa bahay ay kaugnay ng mas madalas na pagbabalik (meta-analysis: Butzlaff &amp; Hooley, 1998).</li>
        <li><b>LEAP</b> (Listen, Empathize, Agree, Partner): paraan ng pakikipag-usap sa taong hindi naniniwalang may sakit (Xavier Amador). Malawak na ginagamit; mas limitado ang ebidensya mula sa trials.</li>
        <li><b>Duration of untreated psychosis:</b> mas maagang gamutan, mas magandang paggaling (hal. Marshall et al., 2005; Penttilä et al., 2014).</li>
        <li><b>Behavioural activation:</b> maliliit at regular na gawain para sa mababang motibasyon at pag-iisa.</li>
        <li><b>Tulog:</b> ang pag-ayos ng tulog ay nagpapabawas ng paranoia (Freeman et al., 2015, 2017); mga tip mula sa CBT for insomnia.</li>
        <li><b>Music therapy:</b> nakakatulong sa pangkalahatang kalagayan, sa mga “bawas” na sintomas at sa pakikisalamuha (Cochrane: Geretsegger et al., 2017). Ang Music section ay hango rito pero hindi kapalit ng music therapist.</li>
        <li><b>Self-management apps</b> gaya ng FOCUS, Actissist at Horyzons ang nagpakita na nakakatulong ang ganitong mga tool kasama ng gamutan.</li></ul></div></div>
      <div class="sec"><div class="eyebrow">Mga numero</div><div class="card small">Ang NCMH Crisis Hotline (1553 at mobile numbers) at 911 ay na-verify noong Nobyembre 2026. Ang detalye ng NCMH outpatient ay galing sa secondary sources; tumawag muna para kumpirmahin.</div></div>
      <p class="small muted center" style="margin-top:24px">Kasama · version ${APP_VERSION} · ${APP_DATE}</p>`;
  }

  /* ---------- After render ---------- */
  let ntags = [];
  function afterRender(v) {
    if (v === "notes") ntags = [];
    if (v === "music") { const el = $("#mtime"); if (el) el.textContent = fmtT(mt.left); }
  }
  async function shareText(title, text) {
    try { if (navigator.share) { await navigator.share({ title, text }); return; } } catch (e) { if (e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(text); toast("Nakopya. I-paste sa Messenger o Viber."); } catch (e) { toast("Hindi makopya"); }
  }

  /* ---------- Actions ---------- */
  let breathT = 0;
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const a = el.dataset.act, v = el.dataset.v; if (el.tagName === "BUTTON") haptic(6);
    if (a === "space") { db.space = v; save(); location.hash = "#/"; render(); }
    else if (a === "switch") { if (!confirm("Palitan ang space ng phone na ito? Mananatili ang mga naisulat.")) return; db.space = db.space === "family" ? "him" : "family"; save(); location.hash = "#/"; render(); }
    else if (a === "step") { db.steps[v] = !db.steps[v]; save(); render(); }
    else if (a === "lessondone") { db.lessons[v] = Date.now(); if (v && Object.keys(db.lessons).length >= 3) db.steps.learn = true; save(); location.hash = el.dataset.next ? "#/lesson/" + el.dataset.next : "#/learn"; }
    else if (a === "pick") { const i = pq % PRACTICE.length; db.practice[i] = +v; save(); render(); }
    else if (a === "pqnext") { pq++; render(); scrollTo(0, 0); }
    else if (a === "pqreset") { db.practice = {}; pq = 0; save(); render(); }
    else if (a === "ntag") { const t = v; ntags.includes(t) ? ntags.splice(ntags.indexOf(t), 1) : ntags.push(t); el.classList.toggle("on"); }
    else if (a === "addnote") { const text = $("#ntext").value.trim(); if (!text && !ntags.length) { toast("Pumili ng tag o magsulat ng kaunti"); return; } db.notes.push({ id: uid(), at: Date.now(), tags: [...ntags], text }); db.steps.notes = true; save(); toast("Nai-save"); render(); }
    else if (a === "delnote") { if (!confirm("Burahin ang talang ito?")) return; db.notes = db.notes.filter(n => n.id !== v); save(); render(); }
    else if (a === "shareprep") shareText("Para sa doktor", $("#prep").value);
    else if (a === "sharecrisis") shareText("Crisis numbers", `Kung may panganib sa buhay: 911.\nNCMH Crisis Hotline (libre, 24/7): 1553 (landline) · 1800-1888-1553 · Smart/TNT 0919-057-1553 · Globe/TM 0917-899-8727 / 0966-351-4518.\nPara rin sa pamilya ang NCMH line.`);
    else if (a === "care") { db.care.push({ at: Date.now(), v: +v }); save(); render(); }
    else if (a === "thing") { const k = dayKey(Date.now()); db.today[k] ||= {}; db.today[k][v] = !db.today[k][v]; save(); if (db.today[k][v]) haptic([8, 30, 12]); render(); }
    else if (a === "mood") { db.moods[dayKey(Date.now())] = +v; save(); render(); }
    else if (a === "sq") { const k = dayKey(Date.now()); db.sleep[k] = { ...(db.sleep[k] || {}), q: +v }; save(); render(); }
    else if (a === "newidea") { const p = el.previousElementSibling; p.textContent = MUSIC_IDEAS[Math.floor(Math.random() * MUSIC_IDEAS.length)]; }
    else if (a === "mlen") { if (mt.run) return; mt.len = mt.left = +v * 60; render(); }
    else if (a === "mstart") {
      if (mt.run) { musicStop(false); return; }
      mt.run = true; mt.t0 = Date.now(); mt.left = mt.len; el.textContent = "Tapusin";
      mt.iv = setInterval(() => { mt.left = Math.max(0, mt.len - (Date.now() - mt.t0) / 1000); const t = $("#mtime"); if (t) t.textContent = fmtT(mt.left); if (mt.left <= 0) musicStop(true); }, 250);
    }
    else if (a === "breath") {
      const b = $("#breath"), btn = $("#bbtn"); if (breathT) { clearTimeout(breathT); breathT = 0; b.className = "breath"; b.textContent = "Simulan"; btn.textContent = "Simulan · 2 minuto"; return; }
      btn.textContent = "Itigil"; const end = Date.now() + 120000;
      const cycle = () => { if (Date.now() > end) { b.className = "breath"; b.textContent = "Tapos"; btn.textContent = "Ulitin"; breathT = 0; return; }
        b.className = "breath in"; b.textContent = "Hinga papasok"; breathT = setTimeout(() => { b.className = "breath out"; b.textContent = "Dahan-dahang palabas"; breathT = setTimeout(cycle, 6000); }, 4000); };
      cycle();
    }
    else if (a === "sharewk") {
      const days = [...Array(7)].map((_, i) => dayKey(Date.now() - (6 - i) * DAY)), sl = days.map(k => sleepHours(db.sleep[k])).filter(x => x != null);
      const done = days.reduce((s, k) => s + Object.values(db.today[k] || {}).filter(Boolean).length, 0), mus = db.music.filter(m => m.at > Date.now() - 7 * DAY);
      shareText("Ang linggo ko", `Ang linggo ko:\n- Tulog: ${sl.length ? `average ${(sl.reduce((a, b) => a + b, 0) / sl.length).toFixed(1)} oras` : "hindi naitala"}\n- Maliliit na nagawa: ${done}\n- Pagtugtog: ${mus.length} beses, ${Math.round(mus.reduce((a, m) => a + m.min, 0))} minuto`);
    }
  });
  document.addEventListener("input", e => {
    const el = e.target;
    if (el.id === "nm") { db.names.him = el.value.trim(); save(); }
    if (el.dataset.c) { const i = +el.dataset.i; db.contacts[i] ||= { name: "", tel: "" }; db.contacts[i][el.dataset.c] = el.value.trim(); save(); }
    if (el.dataset.t != null) { const t = [...things()]; t[+el.dataset.t] = el.value; db.things = t.map(x => x.trim()).filter(Boolean).length ? t : null; save(); }
    if (el.id === "bed" || el.id === "wake") { const k = dayKey(Date.now()); db.sleep[k] = { ...(db.sleep[k] || {}), [el.id]: el.value }; save(); }
  });
  document.addEventListener("change", e => { if (e.target.id === "bed" || e.target.id === "wake") render(); });

  render();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!had || $(".update")) return; const u = document.createElement("button"); u.className = "update"; u.textContent = "May bagong version · I-reload"; u.onclick = () => location.reload(); document.body.appendChild(u); });
  }
  </script>
</body>
</html>
