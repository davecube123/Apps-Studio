<!doctype html>
<html lang="tl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kasama">
  <meta name="description" content="Para sa pamilya at sa kanya: being there for someone you love, how to talk, getting help in the Philippines, and gentle daily routines, sleep and music.">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces-latin-soft-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Kasama</title>
  <style>
    @font-face { font-family: "Fraunces"; src: url(fonts/fraunces-latin-soft-normal.woff2) format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
    @font-face { font-family: "Fraunces"; src: url(fonts/fraunces-latin-wght-italic.woff2) format("woff2"); font-weight: 100 900; font-style: italic; font-display: swap; }
    @font-face { font-family: "Inter"; src: url(fonts/inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
    :root {
      --bg: #f8f4ef; --card: #ffffff; --ink: #1c2826; --ink2: #4b5a57; --muted: #8c9895; --line: rgba(28,40,38,.08); --line2: rgba(28,40,38,.14);
      --teal: #2a7a70; --teal2: #1e5f57; --teal-soft: #e2f0ec; --coral: #d7704f; --coral-soft: #fbe5da; --red: #b8392f; --red-soft: #fbe3e0;
      --sage: #e3f0e7; --peach: #fbe7db; --sky: #e4ecf7; --lav: #ece7f7; --sun: #fdf1d2; --rose: #fbe4e1;
      --h-home: linear-gradient(165deg, #fbeedd 0%, #f6e3cf 55%, #f8f4ef 100%);
      --h-learn: linear-gradient(165deg, #dfeee6 0%, #eaf3ed 60%, #f8f4ef 100%);
      --h-talk: linear-gradient(165deg, #fbe2d4 0%, #fbede4 60%, #f8f4ef 100%);
      --h-help: linear-gradient(165deg, #f9dcd8 0%, #fbe9e6 60%, #f8f4ef 100%);
      --h-care: linear-gradient(165deg, #e6e0f6 0%, #f0ecf9 60%, #f8f4ef 100%);
     
     
     
     
      --shadow: 0 1px 2px rgba(28,40,38,.04), 0 8px 26px rgba(28,40,38,.07); --shadow2: 0 2px 6px rgba(28,40,38,.06), 0 18px 44px rgba(28,40,38,.12);
      --r: 24px; --ease: cubic-bezier(.2,.7,.2,1); --spring: cubic-bezier(.2,.9,.25,1.2);
      --display: "Fraunces", "Iowan Old Style", Georgia, serif; --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) { :root {
      --bg: #121615; --card: #1b2120; --ink: #e9efed; --ink2: #b7c3c0; --muted: #7f8b88; --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.14);
      --teal: #6cc4b8; --teal2: #8fd6cb; --teal-soft: #1d302c; --coral: #ee9274; --coral-soft: #33251f; --red: #f07d72; --red-soft: #35201e;
      --sage: #1c2a23; --peach: #2e2420; --sky: #1c2531; --lav: #24213a; --sun: #2e2919; --rose: #33201f;
      --h-home: linear-gradient(165deg, #2f2620 0%, #1d1c19 60%, #121615 100%); --h-learn: linear-gradient(165deg, #1d2c25 0%, #161d1a 60%, #121615 100%);
      --h-talk: linear-gradient(165deg, #33241d 0%, #1d1917 60%, #121615 100%); --h-help: linear-gradient(165deg, #35201f 0%, #1e1716 60%, #121615 100%);
      --h-care: linear-gradient(165deg, #262238 0%, #18171f 60%, #121615 100%);
     
     
      --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow2: 0 10px 40px rgba(0,0,0,.5); color-scheme: dark; } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); }
    body { margin: 0; color: var(--ink); font: 16.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip; font-feature-settings: "ss01", "cv11"; }
    main { max-width: 620px; margin: 0 auto; padding: 0 20px calc(env(safe-area-inset-bottom) + 116px); }
    a { color: var(--teal); }
    h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 560; font-variation-settings: "SOFT" 100; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
    h1 { font-size: 34px; } h2 { font-size: 24px; } h3 { font-size: 19px; line-height: 1.3; }
    p { margin: .5em 0; text-wrap: pretty; }
    .muted { color: var(--muted); } .small { font-size: 14.5px; } .center { text-align: center; }
    .eyebrow { font: 650 11.5px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
    svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .view.enter > * { animation: rise .5s var(--ease) both; } .view.enter > *:nth-child(2) { animation-delay: 50ms; } .view.enter > *:nth-child(n+3) { animation-delay: 100ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* Hero: each section has its own colour world and illustration */
    .hero { position: relative; margin: 0 -20px; padding: calc(env(safe-area-inset-top) + 22px) 22px 30px; border-radius: 0 0 34px 34px; overflow: hidden; min-height: 210px; display: flex; flex-direction: column; justify-content: flex-end; }
    .hero .art { position: absolute; right: -6px; top: calc(env(safe-area-inset-top) + 6px); width: 168px; height: 150px; pointer-events: none; }
    .hero.has-top { padding-top: calc(env(safe-area-inset-top) + 78px); }
    .hero h1.long { font-size: 27px; }
    .hero .top { position: absolute; left: 22px; right: 22px; top: calc(env(safe-area-inset-top) + 16px); display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .hero h1 { position: relative; max-width: 76%; } .hero p { position: relative; color: var(--ink2); margin: 8px 0 0; max-width: 88%; font-size: 15.5px; }
    .hero .eyebrow { position: relative; margin-bottom: 6px; color: var(--ink2); opacity: .8; }
    .hero.dark { color: #f2f1fb; } .hero.dark p, .hero.dark .eyebrow { color: rgba(242,241,251,.8); }
    .iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--card) 70%, transparent); color: var(--ink2); border: 0; text-decoration: none;
               backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); cursor: pointer; }
    .hero.dark .iconbtn { background: rgba(255,255,255,.14); color: #fff; }
    .back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink2); font: 600 14.5px var(--sans); padding: 8px 14px 8px 10px; border-radius: 999px; text-decoration: none;
            background: color-mix(in srgb, var(--card) 72%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); }
    .back svg { width: 18px; height: 18px; }
    .hero.dark .back { background: rgba(255,255,255,.14); color: #fff; }

    .card { position: relative; background: var(--card); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); }
    @media (prefers-color-scheme: dark) { .card, .rowcard, .tile, .opt, .thing { border: 1px solid var(--line); } }
    .card + .card { margin-top: 12px; }
    .sec { margin-top: 28px; } .sec > .eyebrow { margin: 0 4px 12px; }
    .lift { margin-top: -22px; position: relative; z-index: 3; }
    .btn { appearance: none; border: 0; background: var(--card); color: var(--ink); border-radius: 999px; min-height: 48px; padding: 12px 22px; box-shadow: var(--shadow);
           font: 650 15.5px var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: transform .25s var(--spring); }
    .btn:active { transform: scale(.96); } .btn.teal { background: var(--teal); color: #fff; box-shadow: 0 8px 20px color-mix(in srgb, var(--teal) 30%, transparent); }
    @media (prefers-color-scheme: dark) { .btn.teal { color: #0f1a18; } }
    .btn.sm { min-height: 38px; padding: 7px 16px; font-size: 14px; } .btn.block { display: flex; width: 100%; } .btn.ghost { background: transparent; box-shadow: none; color: var(--ink2); }

    /* Rows and tiles */
    .rowcard { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 0; border-radius: 20px; padding: 14px 16px; box-shadow: var(--shadow);
               color: var(--ink); text-decoration: none; font: 600 16px/1.35 var(--sans); cursor: pointer; transition: transform .2s var(--spring); }
    .rowcard:active { transform: scale(.98); } .rowcard + .rowcard { margin-top: 10px; }
    .rowcard small { display: block; font-weight: 450; color: var(--muted); font-size: 13.5px; margin-top: 2px; line-height: 1.4; }
    .rowcard .chev { color: var(--muted); } .rowcard .chev svg { width: 18px; height: 18px; }
    .bubble { width: 44px; height: 44px; border-radius: 15px; display: grid; place-items: center; flex: none; }
    .b-teal { background: var(--teal-soft); color: var(--teal); } .b-sage { background: var(--sage); color: var(--teal); } .b-peach { background: var(--peach); color: var(--coral); }
    .b-rose { background: var(--rose); color: var(--red); } .b-lav { background: var(--lav); color: #6b5bb5; } .b-sun { background: var(--sun); color: #b9862a; } .b-sky { background: var(--sky); color: #4b6fa8; }
    @media (prefers-color-scheme: dark) { .b-lav { color: #b6a8f0; } .b-sun { color: #f0c862; } .b-sky { color: #9fbbe8; } }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tile { border-radius: 24px; padding: 16px; text-decoration: none; color: var(--ink); min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow); transition: transform .2s var(--spring); }
    .tile:active { transform: scale(.97); } .tile b { font: 600 17px/1.2 var(--display); font-variation-settings: "SOFT" 100; } .tile small { display: block; color: var(--ink2); font-size: 13px; margin-top: 3px; }
    .tile .bubble { width: 40px; height: 40px; background: color-mix(in srgb, var(--card) 70%, transparent); }

    /* Path to a psychiatrist: a gentle timeline */
    .path { position: relative; margin-top: 8px; }
    .path button { position: relative; display: flex; gap: 14px; width: 100%; text-align: left; border: 0; background: none; padding: 10px 0; cursor: pointer; color: var(--ink); font: inherit; }
    .path button::before { content: ""; position: absolute; left: 15px; top: 40px; bottom: -10px; width: 2px; background: var(--line2); }
    .path button:last-child::before { display: none; }
    .path .dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line2); background: var(--card); flex: none; display: grid; place-items: center; color: #fff; transition: all .3s var(--spring); position: relative; z-index: 1; }
    .path .done .dot { background: var(--teal); border-color: var(--teal); } .path .done::before { background: var(--teal); }
    .path b { display: block; font-weight: 650; font-size: 15.5px; } .path span.d { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.45; margin-top: 2px; }
    .path .done b { color: var(--ink2); }
    .meter { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; margin-top: 10px; } .meter i { display: block; height: 100%; background: var(--teal); border-radius: 8px; transition: width .6s var(--ease); }

    /* Reading */
    .prose p { font-size: 17.5px; line-height: 1.72; color: var(--ink); margin: 0 0 1em; }
    .key { position: relative; background: var(--teal-soft); border-radius: 22px; padding: 18px 20px 18px 52px; margin: 18px 0; font: 600 17px/1.5 var(--display); font-variation-settings: "SOFT" 100; color: var(--teal2); }
    .key::before { content: "\201C"; position: absolute; left: 16px; top: 4px; font: 700 48px var(--display); color: var(--teal); opacity: .5; }
    .warn { background: var(--rose); color: var(--ink); border-radius: 18px; padding: 13px 16px; margin: 14px 0; font-size: 15px; }
    .avoid { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; font-size: 15.5px; color: var(--ink2); }
    .avoid .x { width: 26px; height: 26px; border-radius: 50%; background: var(--coral-soft); color: var(--coral); display: grid; place-items: center; flex: none; margin-top: 1px; } .avoid .x svg { width: 14px; height: 14px; stroke-width: 2.6; }
    .say { position: relative; background: var(--teal-soft); border-radius: 22px 22px 22px 6px; padding: 14px 18px; margin: 10px 26px 10px 0; font: italic 450 17.5px/1.5 var(--display); color: var(--ink); }
    .say + .say { margin-top: 10px; }
    ul.tight { margin: 6px 0; padding-left: 20px; } ul.tight li { margin: 7px 0; line-height: 1.5; } ul.tight li::marker { color: var(--teal); }
    .steps-big .card h3 { margin-top: 2px; } .num { font: 700 12px var(--sans); letter-spacing: .1em; color: var(--teal); }
    .opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; border: 2px solid transparent; background: var(--card); color: var(--ink); border-radius: 20px; padding: 14px 16px; margin-top: 10px;
           font: 15.5px/1.5 var(--sans); cursor: pointer; box-shadow: var(--shadow); transition: transform .2s var(--spring); }
    .opt:active { transform: scale(.98); } .opt .mark { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line2); flex: none; display: grid; place-items: center; color: #fff; }
    .opt.good { border-color: var(--teal); } .opt.good .mark { background: var(--teal); border-color: var(--teal); } .opt.bad { border-color: var(--coral); opacity: .8; } .opt.bad .mark { background: var(--coral); border-color: var(--coral); }
    .opt .mark svg { width: 14px; height: 14px; stroke-width: 2.8; }
    .fb { margin-top: 14px; font-size: 15.5px; color: var(--ink2); line-height: 1.55; }
    .dots { display: flex; gap: 6px; justify-content: center; margin: 4px 0 14px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); } .dots i.on { background: var(--teal); width: 22px; border-radius: 6px; }

    /* Forms */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 0; background: var(--bg); color: var(--ink2); border-radius: 999px; padding: 8px 14px; font: 600 13.5px var(--sans); cursor: pointer; transition: all .2s var(--ease); box-shadow: inset 0 0 0 1px var(--line2); }
    .chip.on { background: var(--teal); color: #fff; box-shadow: none; }
    @media (prefers-color-scheme: dark) { .chip.on { color: #0f1a18; } }
    textarea, input[type=text], input[type=tel], input[type=time], input[type=date] { width: 100%; border: 0; background: var(--bg); color: var(--ink); border-radius: 16px; padding: 13px 15px; font: 16px var(--sans); outline: 0; box-shadow: inset 0 0 0 1px var(--line2); }
    textarea { resize: vertical; min-height: 96px; line-height: 1.5; } textarea:focus, input:focus { box-shadow: inset 0 0 0 2px var(--teal); }
    input[type=time] { font: 600 26px var(--sans); text-align: center; padding: 14px 8px; }
    label.f { display: block; margin-top: 12px; } label.f > span { display: block; font: 650 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 4px 6px; }
    .note { padding: 14px 0; border-top: 1px solid var(--line); } .note:first-child { border-top: 0; } .note .d { font: 600 12.5px var(--sans); color: var(--muted); }

    /* Crisis */
    .crisis { background: linear-gradient(160deg, var(--rose), var(--card) 85%); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
    .crisis h3 { color: var(--red); }
    .crisis a.call { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
    .crisis a.call:first-of-type { border-top: 0; margin-top: 6px; }
    .crisis a.call .bubble { width: 38px; height: 38px; border-radius: 50%; background: var(--red); color: #fff; } .crisis a.call .bubble svg { width: 18px; height: 18px; }
    .crisis a.call b { display: block; font: 650 17px var(--sans); letter-spacing: .01em; } .crisis a.call span.l { display: block; font-size: 13px; color: var(--muted); }

    /* His space */
    .thing { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border-radius: 20px; background: var(--card); border: 0; cursor: pointer; text-align: left; color: var(--ink);
             font: 600 16.5px var(--sans); box-shadow: var(--shadow); transition: transform .2s var(--spring); }
    .thing:active { transform: scale(.98); } .thing + .thing { margin-top: 10px; }
    .tick { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line2); flex: none; display: grid; place-items: center; color: #fff; transition: all .35s var(--spring); }
    .tick svg { width: 16px; height: 16px; stroke-width: 3; opacity: 0; transform: scale(.4); transition: all .35s var(--spring); }
    .thing.done .tick { background: var(--teal); border-color: var(--teal); } .thing.done .tick svg { opacity: 1; transform: none; }
    .thing.done span.grow { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line2); }
    .moods { display: flex; justify-content: space-between; gap: 8px; }
    .moods button { flex: 1; aspect-ratio: 1; max-width: 64px; border-radius: 50%; border: 0; background: none; padding: 0; cursor: pointer; transition: transform .25s var(--spring); opacity: .55; filter: saturate(.6); }
    .moods button svg { width: 100%; height: 100%; } .moods button.on { opacity: 1; filter: none; transform: scale(1.12); } .moods button:active { transform: scale(.92); }
    .idea { font: italic 450 19px/1.5 var(--display); margin: 8px 0 0; }
              background: radial-gradient(circle at 35% 30%, #ffffffaa, transparent 45%), radial-gradient(circle, color-mix(in srgb, var(--teal) 32%, transparent), color-mix(in srgb, var(--teal) 12%, transparent) 70%);
              box-shadow: 0 0 0 14px color-mix(in srgb, var(--teal) 8%, transparent), 0 0 0 30px color-mix(in srgb, var(--teal) 4%, transparent); transform: scale(.72); transition: transform 4s ease-in-out; }
    .ground li { font-size: 17.5px; margin: 10px 0; } .ground b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); margin-right: 8px; font-size: 14px; }

    nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 14px); z-index: 20; width: min(440px, calc(100% - 24px)); padding: 7px; border-radius: 30px;
               background: color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter: blur(24px) saturate(1.7); -webkit-backdrop-filter: blur(24px) saturate(1.7);
               box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, var(--shadow2); display: flex; border: 1px solid var(--line); }
    nav.tabs[hidden] { display: none; }
    nav.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; border-radius: 24px; color: var(--muted); font: 650 10.5px var(--sans); padding: 8px 0 7px; transition: all .3s var(--ease); }
    nav.tabs a svg { width: 23px; height: 23px; } nav.tabs a.on { color: var(--teal); background: var(--teal-soft); }
    .toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: 90vw; text-align: center; bottom: calc(env(safe-area-inset-bottom) + 100px); background: var(--ink); color: var(--bg);
             padding: 12px 20px; border-radius: 20px; font: 600 14px var(--sans); z-index: 80; animation: rise .35s var(--spring) both; box-shadow: var(--shadow2); }
    .update { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; top: calc(env(safe-area-inset-top) + 12px); z-index: 85; border: 0; background: var(--teal); color: #fff; padding: 12px 22px; border-radius: 999px; font: 700 14px var(--sans); cursor: pointer; box-shadow: var(--shadow2); }

    /* First screen */
    .welcome { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: calc(env(safe-area-inset-top) + 20px) 0 calc(env(safe-area-inset-bottom) + 28px); }
    .welcome .art { width: 100%; max-width: 330px; margin: 0 auto 14px; display: block; }
    .welcome h1 { font-size: 36px; } .choice { display: flex; gap: 16px; align-items: center; text-align: left; width: 100%; border: 0; background: var(--card); border-radius: 26px; padding: 18px; margin-top: 12px;
             cursor: pointer; color: var(--ink); box-shadow: var(--shadow); transition: transform .2s var(--spring); }
    .choice:active { transform: scale(.98); } .choice b { display: block; font: 600 19px var(--display); font-variation-settings: "SOFT" 100; } .choice span.t { color: var(--ink2); font-size: 14.5px; line-height: 1.45; display: block; margin-top: 2px; }
    .choice .bubble { width: 56px; height: 56px; border-radius: 18px; }

    /* Sheets (install) */
    .sheet-back { position: fixed; inset: 0; z-index: 70; background: rgba(15,22,21,.4); display: flex; align-items: flex-end; justify-content: center; animation: fade .25s both; backdrop-filter: blur(2px); }

      "Ang psychosis ay kondisyon kung saan nahihirapan ang utak na paghiwalayin kung ano ang totoo at kung ano ang galing sa sariling isip. Hindi ito kahinaan ng loob, hindi ito katamaran, at hindi niya ito pinili.",
      "Karaniwang may tatlong uri ng sintomas. Una, ang mga “dagdag”: nakakarinig ng boses na wala naman (hallucinations), o matinding paniniwala na hindi totoo, gaya ng may sumusunod o nagmamanman sa kanya (delusions). Pangalawa, ang mga “bawas”: nawawalan ng gana, lumalayo sa tao, parang walang emosyon, tumitigil sa mga dating gusto. Pangatlo, hirap mag-focus at mag-isip nang maayos.",
      "Kaya maaaring tumigil siya sa pagtugtog. Hindi dahil ayaw na niya sa musika; ang “bawas” na sintomas mismo ang kumukuha ng gana at lakas. Hindi ito masosolusyonan ng pagpilit, pero bumabalik ito sa tamang gamutan at panahon.",
      "Ang mga pagsabog ng galit, gaya ng pagtumba ng upuan o pagbasag ng cellphone, ay kadalasang galing sa takot at sobrang stress ng nararanasan niya, lalo na kung pakiramdam niya ay may banta sa kanya. Seryoso pa rin ito, pero tanda ito na kailangan na niya ng tulong, hindi ng sermon." ],
      key: "Hindi siya ang problema. Ang kondisyon ang problema, at kasama ninyo siya sa paglaban dito." },
    { id: "insight", t: "Bakit sinasabi niyang okay lang siya", m: 3, body: [
      "Isa sa pinakamahirap: maraming taong may psychosis ang talagang hindi nakakakita na may sakit sila. Ito ay tinatawag na anosognosia o lack of insight, at bahagi ito ng kondisyon mismo, dahil sa paraan ng paggana ng utak. Sa pananaliksik, mga kalahati ng may schizophrenia ang nakakaranas nito.",
      "Ibig sabihin, hindi siya nagmamatigas. Para sa kanya, totoo ang nararanasan niya. Kaya kapag pinagtatalunan natin kung totoo o hindi, lalo lang siyang lumalayo at hindi na nagtitiwala.",
      "Ang mas gumagana: huwag pilitin siyang tanggapin na “may sakit” siya. Sa halip, hanapin ang mga bagay na gusto niyang mabago: makatulog nang maayos, mabawasan ang stress o takot, makabalik sa pagtugtog. Doon kayo magtulungan. Ito ang puso ng LEAP, na nasa “Kausapin” tab." ],
      key: "Ang layunin ay hindi manalo sa argumento. Ang layunin ay manatili siyang nagtitiwala sa inyo." },
    { id: "early", t: "Bakit ngayon na dapat magpatingin", m: 2, body: [
      "Malinaw sa pananaliksik: mas maaga ang gamutan, mas maganda ang paggaling. Ang tagal ng hindi nagagamot na psychosis (duration of untreated psychosis) ay isa sa pinakamalakas na palatandaan ng magiging takbo ng kanyang paggaling.",
      "Ang psychiatrist ang makakapagbigay ng tamang diagnosis at gamot. Ang mga antipsychotic na gamot ay napatunayang nakakatulong lalo sa mga “dagdag” na sintomas at sa pag-iwas sa pagbabalik nito. May side effects ang ilan, pero napag-uusapan at naaayos ito kasama ang doktor.",
      "Hindi kailangang hintayin na pumayag siya bago kayo kumilos. Puwedeng kayo muna, ang girlfriend o pamilya, ang kumonsulta sa psychiatrist para humingi ng gabay kung paano siya madadala. Tingnan ang “Tulong” tab." ],
      key: "Ang pinakamahalagang magagawa ninyo ngayon: tulungan siyang makarating sa psychiatrist." },
    { id: "treatment", t: "Kapag nagsimula na ang gamutan", m: 3, body: [
      "Karaniwang antipsychotic na gamot ang ibibigay. Kadalasan ilang araw hanggang ilang linggo bago makita ang epekto; madalas na unang gumaganda ang tulog at pagiging kalmado, bago ang mga boses o hinala.",
      "May mga side effect na dapat sabihin sa doktor, sa halip na basta itigil ang gamot: antok, pagtaas ng gana at timbang, pagkabalisa o hindi mapakali (akathisia), paninigas o panginginig. Kadalasan naaayos ito sa pagpapalit ng dosis o ng gamot.",
      "Ang pinakamadalas na dahilan ng pagbabalik ng sintomas ay ang paghinto ng gamot. Kung nahihirapan siyang uminom araw-araw, itanong sa doktor ang long-acting injection: iniksyon kada ilang linggo, kaya hindi na kailangang tandaan araw-araw.",
      "Hindi lang gamot: nakakatulong din ang therapy (CBT for psychosis), mga session para sa pamilya, at unti-unting pagbabalik sa routine, trabaho at musika. Itanong sa doktor kung ano ang mayroon sa inyong lugar.",
      "Paano tumulong nang hindi nagbabantay: pag-usapan kung paano niya gustong maalala (alarm, pillbox), at kumustahin ang pakiramdam niya sa gamot, hindi lang kung uminom na siya." ],
      key: "Ang tanong ay hindi \u201cuminom ka na ba?\u201d kundi \u201ckumusta ang pakiramdam mo sa gamot?\u201d" },
    { id: "worse", t: "Ano ang nagpapalala", m: 2, body: [
      "Kulang sa tulog: madalas ito ang unang senyales at nagpapalala rin ng hinala at boses. Ang tulog ay mahalagang bantayan.",
      "Puyat, matinding stress, at sobrang alak: pinapabigat nila ang mga sintomas. Mahalaga ring malaman: maraming nagkakaroon nito nang walang anumang bisyo o droga. Huwag siyang akusahan o pilitin; ang hinala at akusasyon ay nagdudulot ng hiya at galit, at sinisira ang tiwala. Kung may tanong ang pamilya, ang doktor ang bahalang magtanong.",
      "Stress at gulo sa bahay: away, sigawan, sobrang daming tao o ingay, pressure na “bumalik ka na sa trabaho.” Ang kalmado at mainit na kapaligiran ay nakakatulong talaga, hindi lang “magandang pakiramdam.”",
      "Biglaang paghinto ng gamot (kapag nagsimula na siya): isa ito sa pinakamadalas na dahilan ng pagbabalik ng sintomas." ],
      key: "Tulog, mahinahong araw, at kalmadong bahay: tatlong bagay na kayang tulungan ng pamilya araw-araw." },
    { id: "home", t: "Ang kalmadong bahay: ano ang sinasabi ng research", m: 3, body: [
      "Matagal nang pinag-aaralan ang tinatawag na “expressed emotion” sa pamilya. Paulit-ulit ang resulta: kapag maraming batikos, galit, o sobrang pakikialam ang pamilya, mas madalas bumabalik ang sintomas. Sa pagsusuri ng 30 pag-aaral (2021), halos dinodoble ng madalas na batikos ang tsansang bumalik ito, at ang init at pagtanggap (warmth) ay nagpapababa nito nang malaki. Hindi ito paninisi sa pamilya; natural ang mga reaksyong ito kapag takot at pagod ka.",
      "Ang nakakatulong: mahinahong boses, maikli at malinaw na pananalita, papuri sa maliliit na hakbang, at pagbibigay ng espasyo kapag kailangan niya. Ang mga pamilyang natuto tungkol sa kondisyon at sa ganitong paraan ng pakikitungo ay may mas kaunting pagbabalik ng sintomas at pagkaka-ospital; ito ay family psychoeducation, isa sa pinakamatibay na ebidensya sa larangang ito.",
      "Hindi ibig sabihin na wala nang hangganan. Puwede kayong magsabi ng malinaw na limitasyon (“Hindi okay ang magbasag ng gamit”), nang mahinahon at walang pang-iinsulto." ],
      key: "Mahinahon, maikli, mainit, at may malinaw na limitasyon." },
    { id: "words", t: "Ang mga salitang ginagamit natin", m: 2, body: [
      "Hindi siya ang diagnosis niya. Siya pa rin ang kaibigang musikero, ang anak, ang kasintahan. Ang pananaliksik sa mga taong bagong nadiagnose ay nagpapakita na ang paraan ng pagbanggit ng label ay nakakaapekto sa tingin nila sa sarili, at ang kahihiyan sa sarili (self-stigma) ay humaharang sa paggaling.",
      "Kaya sa bahay, pag-usapan ang mga bagay na mahalaga sa kanya: tulog, pagod, stress, ang musika, ang mga plano niya. Hindi kailangang laging banggitin ang “sakit” o ang pangalan ng kondisyon. Sa doktor at sa kanya ang usapang iyon, kapag handa siya.",
      "Sa ibang tao, sapat na ang “nagpapagamot siya” o “nagpapahinga muna siya.” Kanya ang kuwento; siya ang magpapasya kung kanino ito ibabahagi. Sa mga pamilyang Pilipino, ang hiya ay isa sa pinakamalaking dahilan kung bakit naaantala ang pagpapatingin. Ang pag-iingat sa privacy niya ay paraan para hindi siya mahiyang magpagamot.",
      "Iwasan ang mga salitang tulad ng “baliw,” “sira,” o “may topak,” kahit pabiro, at pakiusapan ang iba na iwasan din ang mga ito." ],
      key: "Pag-usapan ang tao, hindi ang label. Kanya ang kuwento." },
    { id: "safety", t: "Tungkol sa galit at kaligtasan", m: 3, body: [
      "Karamihan ng taong may psychosis ay hindi marahas; mas madalas pa silang maging biktima. Pero tumataas ang panganib kapag hindi nagagamot, kapag puyat, at kapag sobrang takot siya. Ang pagtumba ng upuan at pagbasag ng phone ay seryosong senyales na kailangan na ng tulong.",
      "Kapag galit o takot siya: bigyan siya ng espasyo, huwag harangan ang daan niya palabas, huwag hawakan o pigilan nang pisikal, magsalita nang mahina at mabagal, at huwag makipagtalo. Kayo rin: siguraduhing may daan kayo palabas.",
      "Itago ang mga bagay na maaaring makasakit (kutsilyo, maraming gamot, matutulis na bagay). Kung may banta sa buhay niya o ng iba, tumawag sa 911 o dalhin siya sa emergency room. Hindi ito pagtataksil sa kanya; ito ay pagmamahal." ],
      key: "Kaligtasan muna ng lahat, pati siya." },
    { id: "suicide", t: "Kung naiisip niyang saktan ang sarili", m: 3, body: [
      "Mas mataas ang panganib ng pagpapakamatay sa mga taong may psychosis, lalo na sa mga unang taon ng sakit at pagkalabas ng ospital. Hindi ito para takutin kayo; para alam ninyo ang hahanapin.",
      "Mga senyales: pagsasalita tungkol sa kamatayan o pagiging pabigat (\u201cmas mabuti kung wala na ako\u201d), pamimigay ng mga gamit, biglang pagiging kalmado pagkatapos ng matinding lungkot, paghahanap ng paraan, mga boses na nag-uutos na saktan ang sarili, at matinding hiya o kawalan ng pag-asa.",
      "Itanong nang diretso: \u201cNaiisip mo bang patayin ang sarili mo?\u201d Ipinapakita ng pananaliksik na ang pagtatanong ay hindi nagtatanim ng ideya. Sa halip, nagbibigay ito ng ginhawa at ng daan para humingi ng tulong.",
      "Kung oo ang sagot: manatili sa tabi niya, alisin ang mga bagay na puwedeng gamitin (maraming gamot, kutsilyo, lubid, pesticide), at tumawag agad sa NCMH 1553 o 911, o dalhin siya sa emergency room. Huwag mangakong ililihim ito." ],
      key: "Ang pagtatanong nang diretso ay pag-aalaga, hindi panganib." },
    { id: "faith", t: "Pananampalataya, hiya, at ang sasabihin ng iba", m: 2, body: [
      "Sa ating kultura, minsan iniisip na ito ay sinapian, kulam, o kahinaan ng pananampalataya. Igalang ang paniniwala ng pamilya; ang dasal at komunidad ay malaking suporta. Pero hindi ito kapalit ng gamutan; magkasama dapat.",
      "Kung sasali kayo sa isang simbahan o faith community: malaking tulong ang small group, sabay na pagdarasal, at pagkanta. Puwedeng ipaalam sa isang pastor o leader na pinagkakatiwalaan ninyo, kung papayag siya. Ang pananaliksik ay nagpapakita na ang suporta ng komunidad ng pananampalataya ay nakakatulong sa paggaling, lalo na kapag sinusuportahan din nito ang gamutan.",
      "Isang paalala: kung ang mga tema ng relihiyon ay nagiging nakakatakot sa kanya (takot sa parusa o sa masasamang espiritu, o pakiramdam na may espesyal siyang misyon), banggitin ito sa doktor nang mahinahon. Hindi ito pagkontra sa pananampalataya niya; bahagi lang ito ng pag-aalaga. May mga talata sa Bibliya sa app na ito na pinili para sa kapayapaan at pahinga.",
      "Ang hiya (“ano ang sasabihin ng kapitbahay”) ay madalas na dahilan kung bakit naaantala ang pagpapatingin. Ang psychosis ay medikal na kondisyon tulad ng diabetes o hika. Walang dapat ikahiya sa pagpapagamot.",
      "May batas tayo, ang Mental Health Act (RA 11036), na nagbibigay ng karapatan sa maayos at makataong pangangalaga." ],
      key: "Pananampalataya at gamutan: magkasama, hindi magkalaban." },
    { id: "recovery", t: "May pag-asa: ang paggaling", m: 2, body: [
      "Maraming taong nagkaroon ng unang episode ng psychosis ang bumubuti nang husto, lalo na kung maaga ang gamutan at may suportadong pamilya. Marami ang nakakabalik sa trabaho, pag-aaral, at sa mga gusto nila, kasama ang musika.",
      "Hindi diretso ang daan; may magagandang linggo at mahihirap na linggo. Ang mahalaga ay ang direksyon, hindi ang bilis.",
      "Ang musika ay maaaring maging malaking bahagi ng paggaling niya. May pananaliksik (Cochrane review) na ang music therapy, kasabay ng karaniwang gamutan, ay nakakatulong sa pangkalahatang kalagayan, sa mga “bawas” na sintomas, at sa pakikisalamuha. Pero sa tamang panahon at walang pressure." ],
      key: "Hindi ito ang katapusan ng kuwento niya. Isa itong kabanata." },
    { id: "family", t: "Para sa pamilya niyang hindi pa nakakaintindi", m: 2, share: true, body: [
      "Normal na hindi agad maintindihan ng pamilya. Madalas ang unang reaksyon ay galit, hiya, o \u201cnag-iinarte lang.\u201d Ang kailangan nila ay simpleng paliwanag, hindi debate.",
      "Ibahagi ang mensahe sa ibaba sa Messenger o Viber. Maikli ito, mahinahon, at nakatuon sa kung paano sila makakatulong. Puwede itong i-edit bago ipadala.",
      "Kung may pinagkakatiwalaan silang tao, gaya ng doktor, nurse na kamag-anak, pari o pastor, hilingin na sila ang tumulong magpaliwanag.",
      "Bigyan sila ng panahon. Ang pag-unawa ay proseso; kahit isang tao lang sa pamilya ang maging kakampi, malaking tulong na." ],
      key: "Kailangan niya ang buong pamilya sa iisang panig: kasama niya, hindi laban sa kanya." },
    { id: "friends", t: "Para sa mga kaibigan", m: 2, body: [
      "Malaking bagay ang mga kaibigang nananatili. Maraming taong may psychosis ang nawawalan ng kaibigan dahil sa takot o hiya ng iba. Ang simpleng pagpapakita ay nakakatulong sa paggaling.",
      "Gawin: mag-text kahit maikli, mag-imbita sa simpleng bagay (kape, lakad, tugtugan nang walang pressure), makinig, at ituring siyang siya pa rin.",
      "Iwasan: tsismis, pagkukuwento ng nangyari sa bar sa iba, pagbibiro tungkol sa \u201cbaliw,\u201d o biglang paglayo. Igalang ang privacy niya at ng pamilya niya.",
      "Kung ikaw ang pinagkakatiwalaan niya, puwede kang maging tulay papunta sa tulong: \u201cKasama mo ako kung magpapatingin ka.\u201d Huwag ding kalimutang alagaan ang sarili mo." ],
      key: "Ang \u201cnandito lang ako\u201d ay isa sa pinakamalakas na bagay na masasabi mo." },
  ];
  const SCENES = [
    { id: "leap", t: "Ang LEAP: paraan ng pakikipag-usap", intro: "Binuo ito ni Dr. Xavier Amador, psychologist na ang kapatid ay may schizophrenia, para sa mga taong hindi naniniwalang may sakit sila. Apat na hakbang:", steps: [
      ["Listen · Makinig", "Makinig para maintindihan, hindi para kumontra. Ulitin sa sariling salita ang narinig mo: “Kung tama ang pagkaintindi ko, pakiramdam mo may nagmamanman sa ’yo.”"],
      ["Empathize · Damayan", "Damayan ang nararamdaman, kahit hindi ka sang-ayon sa paniniwala: “Nakakatakot siguro ’yon. Kung ako ’yan, matatakot din ako.”"],
      ["Agree · Sumang-ayon kung saan puwede", "Hanapin ang puwedeng pagkasunduan: “Sang-ayon ako na hindi ka nakakatulog nang maayos, at mahirap ’yon.” Kung tanungin ka kung naniniwala ka sa kanya, puwedeng: “Hindi ko alam, pero alam kong totoo ang takot mo, at nandito ako.”"],
      ["Partner · Magtulungan", "Magtulungan sa layuning gusto rin niya: “Subukan nating humingi ng tulong para makatulog ka. Sasamahan kita.”"] ],
      key: "Hindi mo kailangang sumang-ayon sa paniniwala para damayan ang nararamdaman." },
    { id: "paranoid", t: "“May sumusunod sa akin / may nagmamanman sa akin”", sit: "Naniniwala siyang may nagmamanman sa kanya, may sumusunod, o may gustong manakit sa kanya.",
      avoid: ["“Wala namang ganyan, guni-guni mo lang ’yan.” (Binabalewala nito ang takot niya.)", "“Oo, baka nga may sumusunod.” (Pinapalakas ang paniniwala.)", "Pagtawa, pagbubulungan, o pagtitinginan ninyo sa harap niya."],
      say: ["“Mukhang takot na takot ka. Ano ang makakatulong para maging mas ligtas ang pakiramdam mo ngayon?”", "“Hindi ko nakikita ang nakikita mo, pero naniniwala akong nararamdaman mo talaga ’yan. Nandito lang ako.”", "“Gusto mo bang umupo muna tayo dito, malayo sa ingay?”"],
      why: "Ang pakikipagtalo tungkol sa totoo o hindi ay halos hindi gumagana at sumisira ng tiwala. Ang pagdamay sa takot at pagtulong na maging ligtas ang pakiramdam ay nagpapanatili ng koneksyon." },
    { id: "angry", t: "Galit siya o nagwawala", sit: "Sumisigaw, nagbabato ng gamit, o mukhang malapit nang sumabog.",
      avoid: ["Sumigaw pabalik o makipagtalo.", "Paglapit nang sobra, paghawak sa kanya, o pagharang sa pinto.", "Pagbabanta (“Ipapakulong kita”) o pagsesermon habang galit pa siya."],
      say: ["(Mahina at mabagal) “Nakikita kong galit na galit ka. Nandito lang ako. Hindi kita sasaktan.”", "“Lalayo muna ako nang kaunti para may espasyo ka.”", "Pagkatapos, kapag kalmado na: “Kanina, mukhang sobrang bigat ng nararamdaman mo. Gusto mo bang pag-usapan?”"],
      why: "Sa gitna ng galit, hindi naririnig ang paliwanag. Ang layunin ay pababain ang tensyon at manatiling ligtas ang lahat. Kung may panganib, tumawag sa 911.", danger: true },
    { id: "notsick", t: "“Wala akong sakit!”", sit: "Ayaw niyang tanggapin na may problema, at nagagalit kapag binabanggit.",
      avoid: ["“May sakit ka, tanggapin mo na.”", "Pagbabasa ng listahan ng sintomas niya.", "Paulit-ulit na pagbanggit ng diagnosis."],
      say: ["“Okay, hindi natin kailangang pag-usapan ang tawag diyan. Pero napansin kong hirap kang matulog. Totoo ba?”", "“Ano ang gusto mong mabago sa buhay mo ngayon?”", "“Nami-miss mo ba ang pagtugtog? Ano sa tingin mo ang pumipigil?”"],
      why: "Ayon sa LEAP, ang pagtutok sa mga layunin niya (tulog, stress, musika) ay mas nagbubukas ng daan sa tulong kaysa sa pagpilit na tanggapin ang diagnosis." },
    { id: "refuse", t: "Ayaw magpatingin sa doktor", sit: "Tumatanggi siya sa psychiatrist o sa anumang “doktor sa utak.”",
      avoid: ["“Baliw ka kaya kailangan mo ng psychiatrist.”", "Panlilinlang (“pupunta lang tayo sa mall,” pero sa ospital pala). Sinisira nito ang tiwala sa susunod.", "Ultimatum habang nasa krisis."],
      say: ["“Mukhang pagod na pagod ka at hirap kang matulog. May doktor na makakatulong diyan. Sasamahan kita.”", "“Hindi mo kailangang magdesisyon ngayon. Pag-isipan mo lang, at sabihin mo kung handa ka na.”", "“Kahit para sa akin lang, puwede mo bang subukan kahit isang beses? Kung ayaw mo pagkatapos, pag-uusapan natin ulit.”"],
      why: "I-frame ang pagpapatingin sa paraang may saysay para sa kanya (tulog, stress, pagod) at ialok ang inyong presensya. Kung hindi pa rin, kayo muna ang kumonsulta para sa gabay. Kung may panganib, emergency na ito." },
    { id: "voices", t: "Nakakarinig siya ng boses", sit: "Kumikilos na parang may kausap, o sinasabi niyang may naririnig.",
      avoid: ["“Walang boses diyan!”", "Matakot o tumakbo palayo.", "Paulit-ulit na pagtatanong kung ano ang sinasabi ng boses."],
      say: ["“May naririnig ka ba ngayon? Ano ang pakiramdam mo?”", "“Hindi ko naririnig, pero naniniwala akong naririnig mo. Paano kita matutulungan?”", "“Minsan nakakatulong ang musika o ang pag-hum. Gusto mo bang subukan?”"],
      why: "Mahalaga ring itanong kung inuutusan siya ng boses na saktan ang sarili o iba. Kung oo, emergency ito: tumawag sa 911 o NCMH 1553." },
    { id: "withdrawn", t: "Ayaw kumilos, nasa kwarto lang", sit: "Natutulog nang matagal, hindi naliligo, ayaw lumabas o makipag-usap.",
      avoid: ["“Tamad ka lang.”", "Pagkumpara sa iba (“Tingnan mo si ganito, may trabaho na”).", "Pagpilit sa malalaking gawain."],
      say: ["“Gusto mo bang samahan kitang maglakad nang sampung minuto?”", "“Kumain ka muna kahit konti. Niluto ko ’yung paborito mo.”", "Papuri sa maliit: “Ang sarap makita kang nakalabas ngayon.”"],
      why: "Ang kawalan ng gana ay sintomas, hindi katamaran. Maliliit na imbitasyon at papuri sa maliliit na hakbang ang mas gumagana kaysa pressure." },
    { id: "suicide", t: "Nagsasalita tungkol sa kamatayan o pagpapakamatay", sit: "Sinasabi niyang pagod na siya sa buhay, pabigat siya, o mas mabuti kung wala na siya.",
      avoid: ["\u201cHuwag kang magsalita nang ganyan.\u201d (Pinapatahimik siya.)", "Pagsesermon tungkol sa kasalanan o sa pamilya.", "Pag-iwan sa kanya nang mag-isa, o pangakong ililihim mo ito."],
      say: ["\u201cSeryoso ako sa tanong na \u2019to: naiisip mo bang patayin ang sarili mo?\u201d", "\u201cSalamat at sinabi mo sa akin. Hindi kita iiwan. Hahanap tayo ng tulong ngayon.\u201d", "\u201cTatawag tayo sa NCMH ngayon, magkasama.\u201d"],
      why: "Ang diretsong tanong ay hindi nagtatanim ng ideya. Kung oo ang sagot o may plano siya: manatili sa tabi niya, alisin ang mga mapanganib na bagay, at tumawag sa NCMH 1553 o 911, o pumunta sa emergency room.", danger: true },
    { id: "after", t: "Pagkatapos ng isang insidente", sit: "Gaya ng pagtumba ng upuan sa bar o pagbasag ng cellphone. Kalmado na siya ngayon.",
      avoid: ["Pagbanggit nito sa harap ng ibang tao, o pagpapahiya.", "\u201cTingnan mo ang ginawa mo!\u201d habang sariwa pa.", "Pagpapanggap na walang nangyari."],
      say: ["\u201cKahapon, mukhang sobrang bigat ng naramdaman mo. Ano ang pinagdaanan mo noon?\u201d", "\u201cHindi kita hinuhusgahan. Gusto ko lang maintindihan para matulungan kita.\u201d", "\u201cAno ang makakatulong para hindi na umabot sa ganoon?\u201d"],

      + `<p class="prose" style="margin-top:20px">Gabay ito, hindi kapalit ng psychiatrist o ng emergency services.</p>
      <div class="sec"><div class="eyebrow">Ang paraan ng app</div><div class="card small" style="line-height:1.6">Inuuna ng app ang tao at ang relasyon, hindi ang sakit. Sa harap: maliliit na paraan para maging malapit sa kanya. Isang pindot lang ang mga aralin, ang plano at ang mga numero. Malinaw pa rin ang impormasyon sa loob ng mga aralin, dahil ang malinaw na kaalaman ang tumutulong sa pamilya. Para lang ito sa girlfriend at pamilya niya; walang bahagi ng app na para sa kanya mismo.</div></div>
      <div class="sec"><div class="eyebrow">Saan nakabatay</div><div class="card small" style="line-height:1.6"><ul class="tight">
        <li><b>Family interventions:</b> malamang na nagpapagaan ng pasanin ng pamilya, at maaaring magpababa ng pagbabalik ng sintomas (Cochrane review: Chien et al., 2024; mga naunang review ni Pharoah et al.). Ang behavioural family therapy (Falloon) ay nagtuturo ng mahinahong komunikasyon at magkasamang magagandang gawain.</li>
        <li><b>Expressed emotion at warmth:</b> sa 30 pag-aaral, ang madalas na batikos ay kaugnay ng mas madalas na pagbabalik, at ang init at pagtanggap ay nagpoprotekta (meta-analysis: Ma et al., 2021; O’Driscoll et al., 2019; Butzlaff &amp; Hooley, 1998). Dito galing ang pang-araw-araw na “paraan para maging malapit.”</li>
        <li><b>Label at self-stigma:</b> ang paraan ng pagbanggit ng diagnosis ay nakakaapekto sa tingin ng tao sa sarili; ang self-stigma ay humaharang sa paggaling (pag-aaral sa first-episode psychosis, 2023; review sa self-stigma).</li>
        <li><b>Pananampalataya:</b> ang suporta ng faith community ay kaugnay ng mas magandang paggaling; ang mga talata ay mula sa Ang Biblia (1905) at sa World English Bible, parehong public domain, pinili para sa kapayapaan at pahinga.</li>
        <li><b>Mga pamilyang Pilipino:</b> ang hiya at stigma ay malalaking hadlang sa pagpapatingin; ang suporta ng pamilya ang pinakamalaking tulong (systematic review ng Filipino help-seeking, 2020). Kaya may Private mode at mga mensaheng hindi binabanggit ang diagnosis.</li>
        <li><b>LEAP</b> (Listen, Empathize, Agree, Partner): paraan ng pakikipag-usap sa taong hindi naniniwalang may sakit (Xavier Amador). Malawak na ginagamit; mas limitado ang ebidensya mula sa trials.</li>
        <li><b>Duration of untreated psychosis:</b> mas maagang gamutan, mas magandang paggaling (hal. Marshall et al., 2005; Penttilä et al., 2014).</li>
        <li><b>Behavioural activation:</b> maliliit at regular na gawain para sa mababang motibasyon at pag-iisa.</li>
        <li><b>Tulog:</b> ang pag-ayos ng tulog ay nagpapabawas ng paranoia (Freeman et al., 2015, 2017); mga tip mula sa CBT for insomnia.</li>
        <li><b>Music therapy:</b> nakakatulong sa pangkalahatang kalagayan, sa mga “bawas” na sintomas at sa pakikisalamuha (Cochrane: Geretsegger et al., 2017). Hango rito ang Music section, pero hindi ito kapalit ng music therapist.</li>
        <li><b>Pagpapakamatay at psychosis:</b> mas mataas ang panganib lalo sa mga unang taon; ang diretsong pagtatanong ay hindi nagpapataas ng panganib (review: Dazzi et al., 2014).</li>
        <li><b>Early warning signs at relapse plans:</b> karaniwang may personal na pattern ng senyales bago lumala, madalas kasama ang tulog (Birchwood et al.).</li>
        <li><b>Gamot:</b> ang paghinto ng antipsychotic ang pinakamadalas na dahilan ng pagbabalik; ang long-acting injections ay opsyon para sa iba.</li>
        <li><b>Self-management apps</b> gaya ng FOCUS, Actissist at Horyzons: nakakatulong ang ganitong mga tool kasama ng gamutan.</li></ul></div></div>

    if (deferredInstall) return `<button class="btn teal block" data-act="install" style="min-height:52px">I-install ang Kasama</button>`;
    if (inApp && isIOS) return `<p class="small" style="margin:0 0 4px"><b>Nakabukas ito sa loob ng ibang app</b> (Messenger, Viber o Facebook). Hindi puwedeng mag-install mula dito. Buksan muna sa Safari:</p>
      <ol class="steps"><li><span>I-tap ang ${IC.dots} o ang <b>Share</b> ${IC.share} sa itaas o ibaba ng screen.</span></li><li><span>Piliin ang <b>Open in Safari</b> (o <b>Open in browser</b>).</span></li><li><span>Pagbukas sa Safari, babalik ang gabay na ito para sa susunod na hakbang.</span></li></ol>
      <button class="btn block" data-act="copylink" style="margin-top:4px">O kopyahin ang link at i-paste sa Safari</button>`;
    if (inApp) return `<p class="small" style="margin:0 0 4px"><b>Nakabukas ito sa loob ng ibang app</b> (Messenger, Viber o Facebook). Hindi puwedeng mag-install mula dito. Buksan muna sa Chrome:</p>
      <ol class="steps"><li><span>I-tap ang ${IC.vdots} sa kanang itaas.</span></li><li><span>Piliin ang <b>Open in Chrome</b> (o <b>Open in browser</b>).</span></li><li><span>Pagbukas sa Chrome, i-tap ang <b>I-install</b> dito.</span></li></ol>
      <button class="btn block" data-act="copylink" style="margin-top:4px">O kopyahin ang link at i-paste sa Chrome</button>`;
    if (isIOS) return `<ol class="steps"><li><span>${iosOtherBrowser ? "Pinakamadali sa <b>Safari</b>. Sa ibang browser, hanapin ang" : "I-tap ang"} <b>Share</b> ${IC.share} ${iosOtherBrowser ? "sa address bar o menu." : "sa ibaba ng screen (sa iPad, nasa itaas)."}</span></li>
      <li><span>Mag-scroll pababa at i-tap ang <b>Add to Home Screen</b> ${IC.plus}.</span></li><li><span>I-tap ang <b>Add</b> sa kanang itaas.</span></li>
      <li><span>Buksan ang Kasama mula sa home screen, hindi sa Safari, para gumana bilang app at offline.</span></li></ol>
      <p class="small muted" style="margin:4px 0 0">Kung walang “Add to Home Screen”, i-update ang iPhone o subukan sa Safari.</p>`;
    if (isAndroid) return `<ol class="steps"><li><span>I-tap ang ${IC.vdots} sa kanang itaas ng Chrome.</span></li><li><span>I-tap ang <b>Install app</b> o <b>Add to Home screen</b>.</span></li><li><span>I-tap ang <b>Install</b>.</span></li></ol>`;
    return `<ol class="steps"><li><span>I-click ang <b>install</b> icon sa kanan ng address bar,</span></li><li><span>o piliin ang <b>Install Kasama</b> sa menu ng browser.</span></li></ol>`;
  }
  function showInstall(force) {
    if (isStandalone() || $(".sheet-back") || (!force && snoozed())) return;
    const back = document.createElement("div"); back.className = "sheet-back";
    back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>
      <div class="row" style="gap:14px"><img src="icons/icon-192.png" alt="" width="58" height="58" style="border-radius:14px;box-shadow:var(--e1)">
        <div><div class="eyebrow">Libre · gumagana kahit offline · pribado</div><h2>Ilagay sa home screen</h2></div></div>
      <p class="muted small" style="margin:12px 0 10px">Para isang pindot lang ang pagbukas, parang ibang app. Nasa phone lang ang lahat ng isusulat mo.</p>
      <div id="install-body">${installBody()}</div>
      <button class="btn ghost block" data-act="installlater" style="margin-top:6px">Hindi muna</button></div>`;
    back.addEventListener("click", e => { if (e.target === back) closeInstall(true); });
    document.body.appendChild(back);
  }
  function closeInstall(later) { $(".sheet-back")?.remove(); if (later) try { localStorage.setItem(SNOOZE, String(Date.now() + 3 * DAY)); } catch (e) {} }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; const b = $("#install-body"); if (b) b.innerHTML = installBody(); });
  addEventListener("appinstalled", () => { deferredInstall = null; closeInstall(false); toast("Na-install na. Buksan mula sa home screen."); });

  /* ---------- Actions ---------- */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const a = el.dataset.act, v = el.dataset.v; if (el.tagName === "BUTTON") haptic(6);
    if (a === "space") { db.space = v; save(); location.hash = "#/intro/0"; render(); }
    else if (a === "installsheet") showInstall(true);
    else if (a === "aprep") { if (e.target.closest("[data-stop]")) return; const p = db.apptPrep[db.appt] ||= {}; p[v] = !p[v]; if (PREP.every(x => p[x[0]])) db.steps.prep2 = true; save(); render(); }
    else if (a === "addgift") { const amt = +($("#gamt").value || "").replace(/[^\d.]/g, ""); if (!amt) { toast("Ilagay ang halaga"); return; } db.funds.gifts.push({ id: uid(), at: Date.now(), name: $("#gname").value.trim(), amt }); db.steps.funds = true; save(); toast("Naidagdag. Salamat sa kanila!"); render(); }
    else if (a === "delgift") { if (!confirm("Burahin ito?")) return; db.funds.gifts = db.funds.gifts.filter(g => g.id !== v); save(); render(); }
    else if (a === "sharefund") shareText("Humihingi ng tulong", $("#fundmsg").value);
    else if (a === "zoom") { db.zoom = +v; save(); render(); }
    else if (a === "sharefam") shareText("Tungkol sa kanya", $("#fammsg").value);
    else if (a === "shareplan") shareText("Plano para sa mabibigat na araw", planText());
    else if (a === "psign") { const p = plan(), x = v; p.signs.includes(x) ? p.signs.splice(p.signs.indexOf(x), 1) : p.signs.push(x); el.classList.toggle("on"); save(); }
    else if (a === "installlater") closeInstall(true);
    else if (a === "install" && deferredInstall) { const ev = deferredInstall; deferredInstall = null; ev.prompt(); ev.userChoice.then(() => closeInstall(false)).catch(() => {}); }
    else if (a === "copylink") { const u = location.href.split("#")[0]; navigator.clipboard?.writeText(u).then(() => toast("Nakopya ang link. I-paste sa browser."), () => prompt("Kopyahin ang link:", u)); }
    else if (a === "connectskip") { connectSkip++; render(); }
    else if (a === "connectdone") { db.connect[dayKey(Date.now())] = { t: connectToday()[0] }; save(); haptic([8, 30, 12]); render(); }
    else if (a === "addmoment") { const text = $("#mtext").value.trim(); if (!text) { toast("Isulat kahit isang pangungusap"); return; } db.moments.push({ id: uid(), at: Date.now(), text, idea: db.connect[dayKey(Date.now())]?.t || "" }); save(); toast("Naitala. Salamat."); $("#mtext").value = ""; render(); }
    else if (a === "delmoment") { if (!confirm("Burahin ito?")) return; db.moments = db.moments.filter(m => m.id !== v); save(); render(); }
    else if (a === "pinkey") pinKey(v);
    else if (a === "pinoff") { if (!confirm("Alisin ang PIN?")) return; delete db.pin; save(); toast("Inalis ang PIN"); location.hash = "#/settings"; }
    else if (a === "pinforgot") { if (!confirm("Walang paraan para makuha ulit ang PIN. Para makapasok ulit, kailangang burahin ang LAHAT ng nasa app na ito sa phone na ito. Burahin?")) return; localStorage.removeItem(KEY); location.hash = "#/"; location.reload(); }
    else if (a === "step") { db.steps[v] = !db.steps[v]; save(); render(); }
    else if (a === "lessondone") { db.lessons[v] = Date.now(); if (v && Object.keys(db.lessons).length >= 3) db.steps.learn = true; save(); location.hash = el.dataset.next ? "#/lesson/" + el.dataset.next + "/0" : "#/learn"; }
    else if (a === "pick") { const i = pq % PRACTICE.length; db.practice[i] = +v; save(); render(); }
    else if (a === "pqnext") { pq++; render(); scrollTo(0, 0); }
    else if (a === "pqreset") { db.practice = {}; pq = 0; save(); render(); }
    else if (a === "ntag") { const t = v; ntags.includes(t) ? ntags.splice(ntags.indexOf(t), 1) : ntags.push(t); el.classList.toggle("on"); }
    else if (a === "addnote") { const text = $("#ntext").value.trim(); if (!text && !ntags.length) { toast("Pumili ng tag o magsulat ng kaunti"); return; } db.notes.push({ id: uid(), at: Date.now(), tags: [...ntags], text }); db.steps.notes = true; save(); toast("Nai-save"); render(); }
    else if (a === "delnote") { if (!confirm("Burahin ang talang ito?")) return; db.notes = db.notes.filter(n => n.id !== v); save(); render(); }
    else if (a === "shareprep") shareText("Para sa doktor", $("#prep").value);
    else if (a === "sharecrisis") shareText("Crisis numbers", `Kung may panganib sa buhay: 911.\nNCMH Crisis Hotline (libre, 24/7): 1553 (landline) · 1800-1888-1553 · Smart/TNT 0919-057-1553 · Globe/TM 0917-899-8727 / 0966-351-4518.\nPara rin sa pamilya ang NCMH line.`);
    else if (a === "care") { db.care.push({ at: Date.now(), v: +v }); save(); render(); }
  });
  document.addEventListener("input", e => {
    const el = e.target;
    if (el.id === "nm") { db.names.him = el.value.trim(); save(); }
    if (el.dataset.appt) { db.appt = el.value || null; save(); }
    if (el.dataset.fund) { db.funds[el.dataset.fund] = el.value.replace(/[^\d.]/g, ""); save(); }
    if (el.dataset.plan) { plan()[el.dataset.plan] = el.value; db.steps.plan = true; save(); }
    if (el.dataset.doc) { db.doc ||= {}; db.doc[el.dataset.doc] = el.value; save(); }
  });
  /* Re-draw after a field is left, but outside the blur itself (a button tap may be re-drawing at the same moment). */
  document.addEventListener("change", e => { if (e.target.dataset.appt || e.target.dataset.fund || e.target.dataset.doc === "tel") setTimeout(render, 0); });

  render();
  if (db.space) setTimeout(() => showInstall(false), 4000);
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!had || $(".update")) return; const u = document.createElement("button"); u.className = "update"; u.textContent = "May bagong version · I-reload"; u.onclick = () => location.reload(); document.body.appendChild(u); });
  }
  </script>
</body>
</html>
