<!doctype html>
<html lang="tl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kasama">
  <meta name="description" content="Para sa pamilya at sa kanya: understanding psychosis, how to talk, getting help in the Philippines, and gentle daily routines, sleep and music.">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces-latin-soft-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Kasama</title>
  <style>
    @font-face { font-family: "Fraunces"; src: url(fonts/fraunces-latin-soft-normal.woff2) format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
    @font-face { font-family: "Fraunces"; src: url(fonts/fraunces-latin-wght-italic.woff2) format("woff2"); font-weight: 100 900; font-style: italic; font-display: swap; }
    @font-face { font-family: "Inter"; src: url(fonts/inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
    :root {
      --bg: #f8f4ef; --card: #ffffff; --ink: #1c2826; --ink2: #4b5a57; --muted: #8c9895; --line: rgba(28,40,38,.08); --line2: rgba(28,40,38,.14);
      --teal: #2a7a70; --teal2: #1e5f57; --teal-soft: #e2f0ec; --coral: #d7704f; --coral-soft: #fbe5da; --red: #b8392f; --red-soft: #fbe3e0;
      --sage: #e3f0e7; --peach: #fbe7db; --sky: #e4ecf7; --lav: #ece7f7; --sun: #fdf1d2; --rose: #fbe4e1;
      --h-home: linear-gradient(165deg, #fbeedd 0%, #f6e3cf 55%, #f8f4ef 100%);
      --h-learn: linear-gradient(165deg, #dfeee6 0%, #eaf3ed 60%, #f8f4ef 100%);
      --h-talk: linear-gradient(165deg, #fbe2d4 0%, #fbede4 60%, #f8f4ef 100%);
      --h-help: linear-gradient(165deg, #f9dcd8 0%, #fbe9e6 60%, #f8f4ef 100%);
      --h-care: linear-gradient(165deg, #e6e0f6 0%, #f0ecf9 60%, #f8f4ef 100%);
      --h-today: linear-gradient(165deg, #fdeac0 0%, #fdf3dc 60%, #f8f4ef 100%);
      --h-sleep: linear-gradient(170deg, #26305a 0%, #3b4a7a 55%, #5b6f98 100%);
      --h-music: linear-gradient(165deg, #f9dccb 0%, #fbe9df 60%, #f8f4ef 100%);
      --h-calm: linear-gradient(165deg, #d9eaf1 0%, #e6f1ee 60%, #f8f4ef 100%);
      --shadow: 0 1px 2px rgba(28,40,38,.04), 0 8px 26px rgba(28,40,38,.07); --shadow2: 0 2px 6px rgba(28,40,38,.06), 0 18px 44px rgba(28,40,38,.12);
      --r: 24px; --ease: cubic-bezier(.2,.7,.2,1); --spring: cubic-bezier(.2,.9,.25,1.2);
      --display: "Fraunces", "Iowan Old Style", Georgia, serif; --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) { :root {
      --bg: #121615; --card: #1b2120; --ink: #e9efed; --ink2: #b7c3c0; --muted: #7f8b88; --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.14);
      --teal: #6cc4b8; --teal2: #8fd6cb; --teal-soft: #1d302c; --coral: #ee9274; --coral-soft: #33251f; --red: #f07d72; --red-soft: #35201e;
      --sage: #1c2a23; --peach: #2e2420; --sky: #1c2531; --lav: #24213a; --sun: #2e2919; --rose: #33201f;
      --h-home: linear-gradient(165deg, #2f2620 0%, #1d1c19 60%, #121615 100%); --h-learn: linear-gradient(165deg, #1d2c25 0%, #161d1a 60%, #121615 100%);
      --h-talk: linear-gradient(165deg, #33241d 0%, #1d1917 60%, #121615 100%); --h-help: linear-gradient(165deg, #35201f 0%, #1e1716 60%, #121615 100%);
      --h-care: linear-gradient(165deg, #262238 0%, #18171f 60%, #121615 100%); --h-today: linear-gradient(165deg, #322a17 0%, #1c1a14 60%, #121615 100%);
      --h-sleep: linear-gradient(170deg, #161b35 0%, #202a4c 55%, #121615 100%); --h-music: linear-gradient(165deg, #33241d 0%, #1d1917 60%, #121615 100%);
      --h-calm: linear-gradient(165deg, #182833 0%, #15201f 60%, #121615 100%);
      --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow2: 0 10px 40px rgba(0,0,0,.5); color-scheme: dark; } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); }
    body { margin: 0; color: var(--ink); font: 16.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip; font-feature-settings: "ss01", "cv11"; }
    main { max-width: 620px; margin: 0 auto; padding: 0 20px calc(env(safe-area-inset-bottom) + 116px); }
    a { color: var(--teal); }
    h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 560; font-variation-settings: "SOFT" 100; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
    h1 { font-size: 34px; } h2 { font-size: 24px; } h3 { font-size: 19px; line-height: 1.3; }
    p { margin: .5em 0; text-wrap: pretty; }
    .muted { color: var(--muted); } .small { font-size: 14.5px; } .center { text-align: center; }
    .eyebrow { font: 650 11.5px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
    svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .view.enter > * { animation: rise .5s var(--ease) both; } .view.enter > *:nth-child(2) { animation-delay: 50ms; } .view.enter > *:nth-child(n+3) { animation-delay: 100ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* Hero: each section has its own colour world and illustration */
    .hero { position: relative; margin: 0 -20px; padding: calc(env(safe-area-inset-top) + 22px) 22px 30px; border-radius: 0 0 34px 34px; overflow: hidden; min-height: 210px; display: flex; flex-direction: column; justify-content: flex-end; }
    .hero .art { position: absolute; right: -6px; top: calc(env(safe-area-inset-top) + 6px); width: 168px; height: 150px; pointer-events: none; }
    .hero.has-top { padding-top: calc(env(safe-area-inset-top) + 78px); }
    .hero h1.long { font-size: 27px; }
    .hero .top { position: absolute; left: 22px; right: 22px; top: calc(env(safe-area-inset-top) + 16px); display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .hero h1 { position: relative; max-width: 76%; } .hero p { position: relative; color: var(--ink2); margin: 8px 0 0; max-width: 88%; font-size: 15.5px; }
    .hero .eyebrow { position: relative; margin-bottom: 6px; color: var(--ink2); opacity: .8; }
    .hero.dark { color: #f2f1fb; } .hero.dark p, .hero.dark .eyebrow { color: rgba(242,241,251,.8); }
    .iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--card) 70%, transparent); color: var(--ink2); border: 0; text-decoration: none;
               backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); cursor: pointer; }
    .hero.dark .iconbtn { background: rgba(255,255,255,.14); color: #fff; }
    .back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink2); font: 600 14.5px var(--sans); padding: 8px 14px 8px 10px; border-radius: 999px; text-decoration: none;
            background: color-mix(in srgb, var(--card) 72%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); }
    .back svg { width: 18px; height: 18px; }
    .hero.dark .back { background: rgba(255,255,255,.14); color: #fff; }

    .card { position: relative; background: var(--card); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); }
    @media (prefers-color-scheme: dark) { .card, .rowcard, .tile, .opt, .thing { border: 1px solid var(--line); } }
    .card + .card { margin-top: 12px; }
    .sec { margin-top: 28px; } .sec > .eyebrow { margin: 0 4px 12px; }
    .lift { margin-top: -22px; position: relative; z-index: 3; }
    .btn { appearance: none; border: 0; background: var(--card); color: var(--ink); border-radius: 999px; min-height: 48px; padding: 12px 22px; box-shadow: var(--shadow);
           font: 650 15.5px var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: transform .25s var(--spring); }
    .btn:active { transform: scale(.96); } .btn.teal { background: var(--teal); color: #fff; box-shadow: 0 8px 20px color-mix(in srgb, var(--teal) 30%, transparent); }
    @media (prefers-color-scheme: dark) { .btn.teal { color: #0f1a18; } }
    .btn.sm { min-height: 38px; padding: 7px 16px; font-size: 14px; } .btn.block { display: flex; width: 100%; } .btn.ghost { background: transparent; box-shadow: none; color: var(--ink2); }

    /* Rows and tiles */
    .rowcard { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 0; border-radius: 20px; padding: 14px 16px; box-shadow: var(--shadow);
               color: var(--ink); text-decoration: none; font: 600 16px/1.35 var(--sans); cursor: pointer; transition: transform .2s var(--spring); }
    .rowcard:active { transform: scale(.98); } .rowcard + .rowcard { margin-top: 10px; }
    .rowcard small { display: block; font-weight: 450; color: var(--muted); font-size: 13.5px; margin-top: 2px; line-height: 1.4; }
    .rowcard .chev { color: var(--muted); } .rowcard .chev svg { width: 18px; height: 18px; }
    .bubble { width: 44px; height: 44px; border-radius: 15px; display: grid; place-items: center; flex: none; }
    .b-teal { background: var(--teal-soft); color: var(--teal); } .b-sage { background: var(--sage); color: var(--teal); } .b-peach { background: var(--peach); color: var(--coral); }
    .b-rose { background: var(--rose); color: var(--red); } .b-lav { background: var(--lav); color: #6b5bb5; } .b-sun { background: var(--sun); color: #b9862a; } .b-sky { background: var(--sky); color: #4b6fa8; }
    @media (prefers-color-scheme: dark) { .b-lav { color: #b6a8f0; } .b-sun { color: #f0c862; } .b-sky { color: #9fbbe8; } }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tile { border-radius: 24px; padding: 16px; text-decoration: none; color: var(--ink); min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow); transition: transform .2s var(--spring); }
    .tile:active { transform: scale(.97); } .tile b { font: 600 17px/1.2 var(--display); font-variation-settings: "SOFT" 100; } .tile small { display: block; color: var(--ink2); font-size: 13px; margin-top: 3px; }
    .tile .bubble { width: 40px; height: 40px; background: color-mix(in srgb, var(--card) 70%, transparent); }

    /* Path to a psychiatrist: a gentle timeline */
    .path { position: relative; margin-top: 8px; }
    .path button { position: relative; display: flex; gap: 14px; width: 100%; text-align: left; border: 0; background: none; padding: 10px 0; cursor: pointer; color: var(--ink); font: inherit; }
    .path button::before { content: ""; position: absolute; left: 15px; top: 40px; bottom: -10px; width: 2px; background: var(--line2); }
    .path button:last-child::before { display: none; }
    .path .dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line2); background: var(--card); flex: none; display: grid; place-items: center; color: #fff; transition: all .3s var(--spring); position: relative; z-index: 1; }
    .path .done .dot { background: var(--teal); border-color: var(--teal); } .path .done::before { background: var(--teal); }
    .path b { display: block; font-weight: 650; font-size: 15.5px; } .path span.d { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.45; margin-top: 2px; }
    .path .done b { color: var(--ink2); }
    .meter { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; margin-top: 10px; } .meter i { display: block; height: 100%; background: var(--teal); border-radius: 8px; transition: width .6s var(--ease); }

    /* Reading */
    .prose p { font-size: 17.5px; line-height: 1.72; color: var(--ink); margin: 0 0 1em; }
    .key { position: relative; background: var(--teal-soft); border-radius: 22px; padding: 18px 20px 18px 52px; margin: 18px 0; font: 600 17px/1.5 var(--display); font-variation-settings: "SOFT" 100; color: var(--teal2); }
    .key::before { content: "\201C"; position: absolute; left: 16px; top: 4px; font: 700 48px var(--display); color: var(--teal); opacity: .5; }
    .warn { background: var(--rose); color: var(--ink); border-radius: 18px; padding: 13px 16px; margin: 14px 0; font-size: 15px; }
    .avoid { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; font-size: 15.5px; color: var(--ink2); }
    .avoid .x { width: 26px; height: 26px; border-radius: 50%; background: var(--coral-soft); color: var(--coral); display: grid; place-items: center; flex: none; margin-top: 1px; } .avoid .x svg { width: 14px; height: 14px; stroke-width: 2.6; }
    .say { position: relative; background: var(--teal-soft); border-radius: 22px 22px 22px 6px; padding: 14px 18px; margin: 10px 26px 10px 0; font: italic 450 17.5px/1.5 var(--display); color: var(--ink); }
    .say + .say { margin-top: 10px; }
    ul.tight { margin: 6px 0; padding-left: 20px; } ul.tight li { margin: 7px 0; line-height: 1.5; } ul.tight li::marker { color: var(--teal); }
    .steps-big .card h3 { margin-top: 2px; } .num { font: 700 12px var(--sans); letter-spacing: .1em; color: var(--teal); }
    .opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; border: 2px solid transparent; background: var(--card); color: var(--ink); border-radius: 20px; padding: 14px 16px; margin-top: 10px;
           font: 15.5px/1.5 var(--sans); cursor: pointer; box-shadow: var(--shadow); transition: transform .2s var(--spring); }
    .opt:active { transform: scale(.98); } .opt .mark { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line2); flex: none; display: grid; place-items: center; color: #fff; }
    .opt.good { border-color: var(--teal); } .opt.good .mark { background: var(--teal); border-color: var(--teal); } .opt.bad { border-color: var(--coral); opacity: .8; } .opt.bad .mark { background: var(--coral); border-color: var(--coral); }
    .opt .mark svg { width: 14px; height: 14px; stroke-width: 2.8; }
    .fb { margin-top: 14px; font-size: 15.5px; color: var(--ink2); line-height: 1.55; }
    .dots { display: flex; gap: 6px; justify-content: center; margin: 4px 0 14px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); } .dots i.on { background: var(--teal); width: 22px; border-radius: 6px; }

    /* Forms */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 0; background: var(--bg); color: var(--ink2); border-radius: 999px; padding: 8px 14px; font: 600 13.5px var(--sans); cursor: pointer; transition: all .2s var(--ease); box-shadow: inset 0 0 0 1px var(--line2); }
    .chip.on { background: var(--teal); color: #fff; box-shadow: none; }
    @media (prefers-color-scheme: dark) { .chip.on { color: #0f1a18; } }
    textarea, input[type=text], input[type=tel], input[type=time] { width: 100%; border: 0; background: var(--bg); color: var(--ink); border-radius: 16px; padding: 13px 15px; font: 16px var(--sans); outline: 0; box-shadow: inset 0 0 0 1px var(--line2); }
    textarea { resize: vertical; min-height: 96px; line-height: 1.5; } textarea:focus, input:focus { box-shadow: inset 0 0 0 2px var(--teal); }
    input[type=time] { font: 600 26px var(--sans); text-align: center; padding: 14px 8px; }
    label.f { display: block; margin-top: 12px; } label.f > span { display: block; font: 650 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 4px 6px; }
    .note { padding: 14px 0; border-top: 1px solid var(--line); } .note:first-child { border-top: 0; } .note .d { font: 600 12.5px var(--sans); color: var(--muted); }

    /* Crisis */
    .crisis { background: linear-gradient(160deg, var(--rose), var(--card) 85%); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
    .crisis h3 { color: var(--red); }
    .crisis a.call { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
    .crisis a.call:first-of-type { border-top: 0; margin-top: 6px; }
    .crisis a.call .bubble { width: 38px; height: 38px; border-radius: 50%; background: var(--red); color: #fff; } .crisis a.call .bubble svg { width: 18px; height: 18px; }
    .crisis a.call b { display: block; font: 650 17px var(--sans); letter-spacing: .01em; } .crisis a.call span.l { display: block; font-size: 13px; color: var(--muted); }

    /* His space */
    .ringcard { display: flex; align-items: center; gap: 18px; }
    .ring { width: 92px; height: 92px; flex: none; position: relative; } .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .track { stroke: var(--line2); } .ring .val { stroke: var(--teal); transition: stroke-dashoffset .8s var(--spring); }
    .ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 600 26px var(--display); font-variation-settings: "SOFT" 100; }
    .thing { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border-radius: 20px; background: var(--card); border: 0; cursor: pointer; text-align: left; color: var(--ink);
             font: 600 16.5px var(--sans); box-shadow: var(--shadow); transition: transform .2s var(--spring); }
    .thing:active { transform: scale(.98); } .thing + .thing { margin-top: 10px; }
    .tick { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line2); flex: none; display: grid; place-items: center; color: #fff; transition: all .35s var(--spring); }
    .tick svg { width: 16px; height: 16px; stroke-width: 3; opacity: 0; transform: scale(.4); transition: all .35s var(--spring); }
    .thing.done .tick { background: var(--teal); border-color: var(--teal); } .thing.done .tick svg { opacity: 1; transform: none; }
    .thing.done span.grow { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line2); }
    .moods { display: flex; justify-content: space-between; gap: 8px; }
    .moods button { flex: 1; aspect-ratio: 1; max-width: 64px; border-radius: 50%; border: 0; background: none; padding: 0; cursor: pointer; transition: transform .25s var(--spring); opacity: .55; filter: saturate(.6); }
    .moods button svg { width: 100%; height: 100%; } .moods button.on { opacity: 1; filter: none; transform: scale(1.12); } .moods button:active { transform: scale(.92); }
    .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 96px; margin-top: 12px; }
    .bars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 6px; }
    .bars i { width: 100%; max-width: 30px; border-radius: 10px; background: linear-gradient(180deg, var(--teal2), var(--teal)); min-height: 6px; transition: height .6s var(--ease); }
    .bars i.zero { background: var(--line2); } .bars i.warm { background: linear-gradient(180deg, #f1a483, var(--coral)); }
    .bars span { font: 650 11px var(--sans); color: var(--muted); } .bars div.today span { color: var(--teal); }
    .timer-ring { width: 220px; height: 220px; margin: 6px auto 10px; position: relative; } .timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer-ring .track { stroke: var(--line); } .timer-ring .val { stroke: var(--coral); transition: stroke-dashoffset .3s linear; }
    .timer { position: absolute; inset: 0; display: grid; place-items: center; font: 400 54px var(--display); font-variation-settings: "SOFT" 100; font-variant-numeric: tabular-nums; }
    .idea { font: italic 450 19px/1.5 var(--display); margin: 8px 0 0; }
    .breath { width: 220px; height: 220px; margin: 18px auto; border-radius: 50%; display: grid; place-items: center; text-align: center; font: 600 17px var(--sans); color: var(--teal2);
              background: radial-gradient(circle at 35% 30%, #ffffffaa, transparent 45%), radial-gradient(circle, color-mix(in srgb, var(--teal) 32%, transparent), color-mix(in srgb, var(--teal) 12%, transparent) 70%);
              box-shadow: 0 0 0 14px color-mix(in srgb, var(--teal) 8%, transparent), 0 0 0 30px color-mix(in srgb, var(--teal) 4%, transparent); transform: scale(.72); transition: transform 4s ease-in-out; }
    .breath.in { transform: scale(1); transition-duration: 4s; } .breath.out { transform: scale(.72); transition-duration: 6s; }
    .ground li { font-size: 17.5px; margin: 10px 0; } .ground b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); margin-right: 8px; font-size: 14px; }

    nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 14px); z-index: 20; width: min(440px, calc(100% - 24px)); padding: 7px; border-radius: 30px;

    const since = Date.now() - 60 * DAY, ns = db.notes.filter(n => n.at >= since).sort((a, b) => a.at - b.at), counts = {};
    ns.forEach(n => n.tags.forEach(t => counts[t] = (counts[t] || 0) + 1));
    return `PARA SA DOKTOR · ${db.names.him || "(pangalan)"}\n\nMga napansin sa nakaraang 60 araw (${ns.length} na tala):\n${Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([t, c]) => `- ${t}: ${c}x`).join("\n") || "- (wala pang tala)"}\n\nMga detalye:\n${ns.map(n => `- ${dstr(n.at)}: ${[n.tags.join(", "), n.text].filter(Boolean).join(" — ")}`).join("\n") || "-"}\n\nMga gustong itanong:\n- Ano ang posibleng diagnosis, at ano ang ibig sabihin nito?\n- Anong gamot ang irerekomenda, ano ang mga side effect, at gaano katagal bago gumana?\n- Ano ang mga senyales na lumalala, at ano ang gagawin namin?\n- Paano kami makakatulong sa bahay?\n- Kailan ang susunod na check-up, at sino ang tatawagan kapag may emergency?\n- May therapy ba o grupo para sa kanya at para sa pamilya?\n\nIbang mahalagang sabihin sa doktor: kailan nagsimula ang mga pagbabago, kung may kamag-anak na may ganitong kondisyon, kung gumagamit siya ng droga o alak, at kung may gamot siyang iniinom.`;
  }
  function careTrend() { const w = db.care.filter(c => c.at > Date.now() - 7 * DAY), a = w.reduce((s, c) => s + c.v, 0) / (w.length || 1); return a >= 3.5 ? "medyo okay ka. Ituloy ang pag-aalaga sa sarili." : a >= 2.5 ? "halo-halo. Maglaan ng oras para sa sarili mo ngayong linggo." : "mabigat. Mangyaring kausapin ang isang taong mapagkakatiwalaan, o tumawag sa NCMH 1553."; }
  function sleepHours(e) { if (!e?.bed || !e?.wake) return null; const [bh, bm] = e.bed.split(":").map(Number), [wh, wm] = e.wake.split(":").map(Number); let m = wh * 60 + wm - (bh * 60 + bm); if (m <= 0) m += 1440; return m / 60; }
  const mt = { len: 600, left: 600, run: false, t0: 0, iv: 0 };
  const fmtT = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  function musicStop(done) {
    clearInterval(mt.iv); const played = mt.run ? (Date.now() - mt.t0) / 60000 : 0; mt.run = false; mt.left = mt.len;
    if (played >= .5) { db.music.push({ at: Date.now(), min: Math.round(played * 10) / 10 }); save(); haptic([10, 40, 10]); toast(done ? "Tapos. Salamat sa pagtugtog ngayon." : `${Math.max(1, Math.round(played))} minuto. Binilang.`); }
    if (route().v === "music") render();
  }
  /* ---------- Install: one tap on Android Chrome; step-by-step for iPhone; open in a real browser first
     when the link was opened inside Messenger, Viber, Facebook or Instagram (they can't install apps). ---------- */
  let deferredInstall = null;
  const UA = navigator.userAgent;
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(UA);
  const inApp = /FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Viber|Line\/|MicroMessenger|Snapchat|TikTok|; wv\)/i.test(UA);
  const iosOtherBrowser = isIOS && /CriOS|FxiOS|EdgiOS|OPiOS/i.test(UA);
  const SNOOZE = "kasama-install-snooze";
  const snoozed = () => { try { return Date.now() < +(localStorage.getItem(SNOOZE) || 0); } catch (e) { return false; } };
  const IC = { share: `<span class="ios-ic"><svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M6 11v9h12v-9"/></svg></span>`,
    plus: `<span class="ios-ic"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>`,
    dots: `<span class="ios-ic" style="color:var(--ink)"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></span>`,
    vdots: `<span class="ios-ic" style="color:var(--ink)"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></span>` };
  function installBody() {
    if (deferredInstall) return `<button class="btn teal block" data-act="install" style="min-height:52px">I-install ang Kasama</button>`;
    if (inApp && isIOS) return `<p class="small" style="margin:0 0 4px"><b>Nakabukas ito sa loob ng ibang app</b> (Messenger, Viber o Facebook). Hindi puwedeng mag-install mula dito. Buksan muna sa Safari:</p>
      <ol class="steps"><li><span>I-tap ang ${IC.dots} o ang <b>Share</b> ${IC.share} sa itaas o ibaba ng screen.</span></li><li><span>Piliin ang <b>Open in Safari</b> (o <b>Open in browser</b>).</span></li><li><span>Pagbukas sa Safari, babalik ang gabay na ito para sa susunod na hakbang.</span></li></ol>
      <button class="btn block" data-act="copylink" style="margin-top:4px">O kopyahin ang link at i-paste sa Safari</button>`;
    if (inApp) return `<p class="small" style="margin:0 0 4px"><b>Nakabukas ito sa loob ng ibang app</b> (Messenger, Viber o Facebook). Hindi puwedeng mag-install mula dito. Buksan muna sa Chrome:</p>
      <ol class="steps"><li><span>I-tap ang ${IC.vdots} sa kanang itaas.</span></li><li><span>Piliin ang <b>Open in Chrome</b> (o <b>Open in browser</b>).</span></li><li><span>Pagbukas sa Chrome, i-tap ang <b>I-install</b> dito.</span></li></ol>
      <button class="btn block" data-act="copylink" style="margin-top:4px">O kopyahin ang link at i-paste sa Chrome</button>`;
    if (isIOS) return `<ol class="steps"><li><span>${iosOtherBrowser ? "Pinakamadali sa <b>Safari</b>. Sa ibang browser, hanapin ang" : "I-tap ang"} <b>Share</b> ${IC.share} ${iosOtherBrowser ? "sa address bar o menu." : "sa ibaba ng screen (sa iPad, nasa itaas)."}</span></li>
      <li><span>Mag-scroll pababa at i-tap ang <b>Add to Home Screen</b> ${IC.plus}.</span></li><li><span>I-tap ang <b>Add</b> sa kanang itaas.</span></li>
      <li><span>Buksan ang Kasama mula sa home screen, hindi sa Safari, para gumana bilang app at offline.</span></li></ol>
      <p class="small muted" style="margin:4px 0 0">Kung walang “Add to Home Screen”, i-update ang iPhone o subukan sa Safari.</p>`;
    if (isAndroid) return `<ol class="steps"><li><span>I-tap ang ${IC.vdots} sa kanang itaas ng Chrome.</span></li><li><span>I-tap ang <b>Install app</b> o <b>Add to Home screen</b>.</span></li><li><span>I-tap ang <b>Install</b>.</span></li></ol>`;
    return `<ol class="steps"><li><span>I-click ang <b>install</b> icon sa kanan ng address bar,</span></li><li><span>o piliin ang <b>Install Kasama</b> sa menu ng browser.</span></li></ol>`;
  }
  function showInstall(force) {
    if (isStandalone() || $(".sheet-back") || (!force && snoozed())) return;
    const back = document.createElement("div"); back.className = "sheet-back";
    back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>
      <div class="row" style="gap:14px"><img src="icons/icon-192.png" alt="" width="58" height="58" style="border-radius:14px;box-shadow:var(--e1)">
        <div><div class="eyebrow">Libre · gumagana kahit offline · pribado</div><h2>Ilagay sa home screen</h2></div></div>
      <p class="muted small" style="margin:12px 0 10px">Para isang pindot lang ang pagbukas, parang ibang app. Nasa phone lang ang lahat ng isusulat mo.</p>
      <div id="install-body">${installBody()}</div>
      <button class="btn ghost block" data-act="installlater" style="margin-top:6px">Hindi muna</button></div>`;
    back.addEventListener("click", e => { if (e.target === back) closeInstall(true); });
    document.body.appendChild(back);
  }
  function closeInstall(later) { $(".sheet-back")?.remove(); if (later) try { localStorage.setItem(SNOOZE, String(Date.now() + 3 * DAY)); } catch (e) {} }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; const b = $("#install-body"); if (b) b.innerHTML = installBody(); });
  addEventListener("appinstalled", () => { deferredInstall = null; closeInstall(false); toast("Na-install na. Buksan mula sa home screen."); });

  /* ---------- Actions ---------- */
  let breathT = 0;
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const a = el.dataset.act, v = el.dataset.v; if (el.tagName === "BUTTON") haptic(6);
    if (a === "space") { db.space = v; save(); location.hash = "#/intro/0"; render(); }
    else if (a === "installsheet") showInstall(true);
    else if (a === "sleeptip") { sleepTip++; render(); }
    else if (a === "zoom") { db.zoom = +v; save(); render(); }
    else if (a === "sharefam") shareText("Tungkol sa kanya", $("#fammsg").value);
    else if (a === "shareplan") shareText("Plano kung lumala", planText());
    else if (a === "psign") { const p = plan(), x = v; p.signs.includes(x) ? p.signs.splice(p.signs.indexOf(x), 1) : p.signs.push(x); el.classList.toggle("on"); save(); }
    else if (a === "installlater") closeInstall(true);
    else if (a === "install" && deferredInstall) { const ev = deferredInstall; deferredInstall = null; ev.prompt(); ev.userChoice.then(() => closeInstall(false)).catch(() => {}); }
    else if (a === "copylink") { const u = location.href.split("#")[0]; navigator.clipboard?.writeText(u).then(() => toast("Nakopya ang link. I-paste sa browser."), () => prompt("Kopyahin ang link:", u)); }
    else if (a === "switch") { if (!confirm("Palitan ang space ng phone na ito? Mananatili ang mga naisulat.")) return; db.space = db.space === "family" ? "him" : "family"; save(); location.hash = "#/"; render(); }
    else if (a === "step") { db.steps[v] = !db.steps[v]; save(); render(); }
    else if (a === "lessondone") { db.lessons[v] = Date.now(); if (v && Object.keys(db.lessons).length >= 3) db.steps.learn = true; save(); location.hash = el.dataset.next ? "#/lesson/" + el.dataset.next + "/0" : "#/learn"; }
    else if (a === "pick") { const i = pq % PRACTICE.length; db.practice[i] = +v; save(); render(); }
    else if (a === "pqnext") { pq++; render(); scrollTo(0, 0); }
    else if (a === "pqreset") { db.practice = {}; pq = 0; save(); render(); }
    else if (a === "ntag") { const t = v; ntags.includes(t) ? ntags.splice(ntags.indexOf(t), 1) : ntags.push(t); el.classList.toggle("on"); }
    else if (a === "addnote") { const text = $("#ntext").value.trim(); if (!text && !ntags.length) { toast("Pumili ng tag o magsulat ng kaunti"); return; } db.notes.push({ id: uid(), at: Date.now(), tags: [...ntags], text }); db.steps.notes = true; save(); toast("Nai-save"); render(); }
    else if (a === "delnote") { if (!confirm("Burahin ang talang ito?")) return; db.notes = db.notes.filter(n => n.id !== v); save(); render(); }
    else if (a === "shareprep") shareText("Para sa doktor", $("#prep").value);
    else if (a === "sharecrisis") shareText("Crisis numbers", `Kung may panganib sa buhay: 911.\nNCMH Crisis Hotline (libre, 24/7): 1553 (landline) · 1800-1888-1553 · Smart/TNT 0919-057-1553 · Globe/TM 0917-899-8727 / 0966-351-4518.\nPara rin sa pamilya ang NCMH line.`);
    else if (a === "care") { db.care.push({ at: Date.now(), v: +v }); save(); render(); }
    else if (a === "thing") { const k = dayKey(Date.now()); db.today[k] ||= {}; db.today[k][v] = !db.today[k][v]; save(); if (db.today[k][v]) haptic([8, 30, 12]); render(); }
    else if (a === "mood") { db.moods[dayKey(Date.now())] = +v; save(); render(); }
    else if (a === "sq") { const k = dayKey(Date.now()); db.sleep[k] = { ...(db.sleep[k] || {}), q: +v }; save(); render(); }
    else if (a === "newidea") { const p = el.previousElementSibling; p.textContent = MUSIC_IDEAS[Math.floor(Math.random() * MUSIC_IDEAS.length)]; }
    else if (a === "mlen") { if (mt.run) return; mt.len = mt.left = +v * 60; render(); }
    else if (a === "mstart") {
      if (mt.run) { musicStop(false); return; }
      mt.run = true; mt.t0 = Date.now(); mt.left = mt.len; el.textContent = "Tapusin";
      mt.iv = setInterval(() => { mt.left = Math.max(0, mt.len - (Date.now() - mt.t0) / 1000); const t = $("#mtime"); if (t) t.textContent = fmtT(mt.left); if (mt.left <= 0) musicStop(true); }, 250);
    }
    else if (a === "breath") {
      const b = $("#breath"), btn = $("#bbtn"); if (breathT) { clearTimeout(breathT); breathT = 0; b.className = "breath"; b.textContent = "Simulan"; btn.textContent = "Simulan · 2 minuto"; return; }
      btn.textContent = "Itigil"; const end = Date.now() + 120000;
      const cycle = () => { if (Date.now() > end) { b.className = "breath"; b.textContent = "Tapos"; btn.textContent = "Ulitin"; breathT = 0; return; }
        b.className = "breath in"; b.textContent = "Hinga papasok"; breathT = setTimeout(() => { b.className = "breath out"; b.textContent = "Dahan-dahang palabas"; breathT = setTimeout(cycle, 6000); }, 4000); };
      cycle();
    }
    else if (a === "sharewk") {
      const days = [...Array(7)].map((_, i) => dayKey(Date.now() - (6 - i) * DAY)), sl = days.map(k => sleepHours(db.sleep[k])).filter(x => x != null);
      const done = days.reduce((s, k) => s + Object.values(db.today[k] || {}).filter(Boolean).length, 0), mus = db.music.filter(m => m.at > Date.now() - 7 * DAY);
      shareText("Ang linggo ko", `Ang linggo ko:\n- Tulog: ${sl.length ? `average ${(sl.reduce((a, b) => a + b, 0) / sl.length).toFixed(1)} oras` : "hindi naitala"}\n- Maliliit na nagawa: ${done}\n- Pagtugtog: ${mus.length} beses, ${Math.round(mus.reduce((a, m) => a + m.min, 0))} minuto`);
    }
  });
  document.addEventListener("input", e => {
    const el = e.target;
    if (el.id === "nm") { db.names.him = el.value.trim(); save(); }
    if (el.dataset.plan) { plan()[el.dataset.plan] = el.value; db.steps.plan = true; save(); }
    if (el.dataset.goal) { db.goal ||= {}; db.goal[el.dataset.goal] = el.value; save(); }
    if (el.dataset.c) { const i = +el.dataset.i; db.contacts[i] ||= { name: "", tel: "" }; db.contacts[i][el.dataset.c] = el.value.trim(); save(); }
    if (el.dataset.t != null) { const t = [...things()]; t[+el.dataset.t] = el.value; db.things = t.map(x => x.trim()).filter(Boolean).length ? t : null; save(); }
    if (el.id === "bed" || el.id === "wake") { const k = dayKey(Date.now()); db.sleep[k] = { ...(db.sleep[k] || {}), [el.id]: el.value }; save(); }
  });
  document.addEventListener("change", e => { if (e.target.id === "bed" || e.target.id === "wake") render(); });

  render();
  if (db.space) setTimeout(() => showInstall(false), 4000);
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!had || $(".update")) return; const u = document.createElement("button"); u.className = "update"; u.textContent = "May bagong version · I-reload"; u.onclick = () => location.reload(); document.body.appendChild(u); });
  }
  </script>
</body>
</html>
