<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#16130f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ashes and Gold">
  <meta name="description" content="A wordless story about a man's journey, from boyhood to elderhood, told through small interactions.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Ashes and Gold</title>
  <style>
    :root { --ink: #efe6d6; --muted: rgba(239,230,214,.55); --gold: #e6b65c; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #16130f; color: var(--ink); overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px;
               transition: opacity 1.2s ease; z-index: 5; }
    .overlay.hide { opacity: 0; pointer-events: none; }
    #title { background: radial-gradient(70% 45% at 50% 42%, rgba(230,182,92,.22), transparent 70%), #16130f; }
    #title h1 { font: 400 46px/1.05 var(--serif); letter-spacing: .01em; margin: 0; }
    #title h1 em { color: var(--gold); font-style: italic; }
    #title p { font: 15px/1.5 var(--serif); font-style: italic; color: var(--muted); margin: 14px 0 0; max-width: 300px; }
    .begin { margin-top: 42px; border: 1px solid rgba(239,230,214,.35); background: none; color: var(--ink); border-radius: 999px; padding: 13px 34px; font: 500 15px var(--sans); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
    .chapters { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; max-width: 300px; }
    .chapters button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(239,230,214,.25); background: none; color: var(--muted); font: 15px var(--serif); cursor: pointer; }
    .chapters button.open { color: var(--ink); border-color: rgba(239,230,214,.55); }
    .chapters button:disabled { opacity: .3; }
    .hp { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 26px); font: 12px var(--sans); letter-spacing: .08em; color: var(--muted); }
    #card { pointer-events: none; }
    #card .n { font: 400 15px var(--serif); letter-spacing: .4em; color: var(--gold); }
    #card .t { font: italic 400 34px/1.2 var(--serif); margin-top: 12px; }
    #end em { font-style: italic; }
    #end { background: #16130f; }
    #end p { font: italic 17px/1.6 var(--serif); color: var(--muted); max-width: 300px; }
    #mute { position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 14px; z-index: 6; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0,0,0,.18);
            color: rgba(239,230,214,.7); cursor: pointer; display: grid; place-items: center; }
    #mute svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    #home { position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 14px; z-index: 6; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0,0,0,.18);
            color: rgba(239,230,214,.7); cursor: pointer; display: grid; place-items: center; font: 20px var(--serif); }
    .ver { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 8px); font: 11px var(--sans); color: rgba(239,230,214,.3); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <button id="home" aria-label="Back to the title" class="hide" style="display:none">‹</button>
  <button id="mute" aria-label="Sound on or off"></button>
  <div id="title" class="overlay">
    <h1>Ashes<br>and <em>Gold</em></h1>
    <p>A man’s journey, from boyhood to elderhood, told without words.</p>
    <button class="begin" id="begin">Begin</button>
    <div class="chapters" id="chapters"></div>
    <div class="hp">Best with sound · about 30 minutes</div>
    <div class="ver" id="ver"></div>
  </div>
  <div id="card" class="overlay hide"><div class="n" id="cardn"></div><div class="t" id="cardt"></div></div>
  <div id="end" class="overlay hide">
    <div style="font:400 40px/1.1 var(--serif)">Ashes<br>and <em style="color:var(--gold)">Gold</em></div>
    <p style="margin-top:18px">The end.</p>
    <button class="begin" id="again">Back to the beginning</button>
  </div>
  <script>
  "use strict";
  /* Ashes and Gold. An original wordless story. Its spine is the Grimms' public-domain tale of the
     Wild Man in the cage (Iron John): a boy takes the key from under his mother's pillow and frees
     the wild man, who becomes his guide. All characters, scenes, images and sounds here are original. */
  const APP_VERSION = "3";
  const $ = s => document.querySelector(s);
  const cv = $("#c"), ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() { DPR = Math.min(2.5, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); scene?.layout?.(); }
  addEventListener("resize", resize);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
  const haptic = p => { try { navigator.vibrate?.(p); } catch (e) {} };
  const save = {}; try { Object.assign(save, JSON.parse(localStorage.getItem("ashes-and-gold") || "{}")); } catch (e) {}
  const store = () => { try { localStorage.setItem("ashes-and-gold", JSON.stringify(save)); } catch (e) {} };
  save.reached ||= 1; save.muted ??= false;

  /* ---------- Sound: soft generated tones, no recordings ---------- */
  let AC = null, master = null, noiseG = null, noiseF = null, droneO = null, droneG = null;
  function audio() {
    if (!AC) {
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      master = AC.createGain(); master.gain.value = save.muted ? 0 : .9; master.connect(AC.destination);
      const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      noiseF = AC.createBiquadFilter(); noiseF.type = "lowpass"; noiseF.frequency.value = 400; noiseG = AC.createGain(); noiseG.gain.value = 0;
      src.connect(noiseF).connect(noiseG).connect(master); src.start();
      droneO = AC.createOscillator(); droneO.type = "sine"; droneO.frequency.value = 55; droneG = AC.createGain(); droneG.gain.value = 0; droneO.connect(droneG).connect(master); droneO.start();
    }
    if (AC.state === "suspended") AC.resume();
  }
  function note(f, { dur = 2.2, vol = .14, delay = 0, type = "sine" } = {}) {
    if (!AC) return; const t = AC.currentTime + delay;
    [[1, vol, type], [2, vol * .22, "sine"], [3, vol * .06, "sine"]].forEach(([m, v, ty]) => {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = ty; o.frequency.value = f * m;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur / m);
      o.connect(g).connect(master); o.start(t); o.stop(t + dur + .1); });
  }
  function thud(vol = .5) { if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(38, t + .4);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .7); o.connect(g).connect(master); o.start(t); o.stop(t + .8); }
  function ambience(level, cutoff, drone = 0, droneHz = 55) {
    if (!AC) return; const t = AC.currentTime;
    noiseG.gain.setTargetAtTime(level, t, .8); noiseF.frequency.setTargetAtTime(cutoff, t, .8);
    droneG.gain.setTargetAtTime(drone, t, 1); droneO.frequency.setTargetAtTime(droneHz, t, 1);
  }
  const N = { D3: 146.83, F3: 174.61, A3: 220, C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, A4: 440, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880 };
  function setMuteIcon() { $("#mute").innerHTML = save.muted ? `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>` : `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/></svg>`; }
  $("#mute").onclick = e => { e.stopPropagation(); save.muted = !save.muted; store(); setMuteIcon(); if (master) master.gain.value = save.muted ? 0 : .9; };

  /* ---------- Figures: simple, flat, original ---------- */
  function person(x, footY, h, color, o = {}) {
    const ph = o.phase || 0, swing = o.walk ? Math.sin(ph) * .38 : 0, sit = o.sit || 0;
    const headR = h * .105, legH = h * .44 * (1 - sit * .55), hipY = footY - legH, bodyH = h * .4, bw = h * (o.coat ? .3 : .24);
    const x0 = x; ctx.save(); if (o.flip) { ctx.translate(2 * x, 0); ctx.scale(-1, 1); }
    ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineCap = "round";
    /* legs */
    ctx.lineWidth = h * .085;
    if (sit) { ctx.beginPath(); ctx.moveTo(x - bw * .2, hipY); ctx.lineTo(x + h * .2 * sit, hipY + h * .02); ctx.lineTo(x + h * .22 * sit, footY); ctx.moveTo(x + bw * .2, hipY); ctx.lineTo(x + h * .24 * sit, hipY); ctx.lineTo(x + h * .26 * sit, footY); ctx.stroke(); }
    else { for (const s of [1, -1]) { ctx.beginPath(); ctx.moveTo(x + s * bw * .18, hipY); ctx.lineTo(x + s * bw * .18 + Math.sin(swing * s) * legH * .9, footY - (1 - Math.cos(swing)) * legH * .3); ctx.stroke(); } }
    /* body */
    const top = hipY - bodyH; ctx.beginPath(); ctx.roundRect(x - bw / 2, top, bw, bodyH + (o.coat ? h * .1 : h * .02), bw * .35); ctx.fill();
    /* arms: hanging, swinging when walking, or one reaching forward */
    ctx.lineWidth = h * .065;
    const L = h * .3; let hand = null;
    for (const s of [1, -1]) {
      const sx = x + s * bw * .42, sy = top + h * .05;
      const a = s === 1 && o.reach ? 1.25 * o.reach : (o.walk ? -Math.sin(ph) * .3 * s : 0) + (o.armsOut || 0) * s;
      const ex = sx + Math.sin(a) * L, ey = sy + Math.cos(a) * L;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      if (s === 1) hand = [ex, ey];
    }
    /* head */
    ctx.beginPath(); ctx.arc(x + (o.tilt || 0) * headR * .5, top - headR * 1.08, headR, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return { headX: x0, headY: top - headR * 1.08, handX: o.flip ? 2 * x0 - hand[0] : hand[0], handY: hand[1], chestY: top + bodyH * .35 };
  }
  function glowDot(x, y, r, color, a = 1) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color.replace("A", a)); g.addColorStop(1, color.replace("A", 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  /* a soft pulsing hint, never words */
  function hint(x, y, t, a = 1) { const p = (t % 1.8) / 1.8; ctx.save(); ctx.globalAlpha = a * (1 - p) * .8; ctx.strokeStyle = "#efe6d6"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 10 + p * 22, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = a * .9; ctx.fillStyle = "#efe6d6"; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }

  /* ---------- A jointed figure, seen side-on ----------
     Hips, knees, shoulders and elbows with a real walk cycle; the body bobs because the lowest foot
     always rests on the ground. Optional coat with a hem that swings behind the motion. */
  function fig(x, gy, h, o = {}) {
    const dir = o.dir || 1, sp = o.speed || 0, ph = o.phase || 0, sit = o.sit || 0, reach = o.reach || 0, slump = o.slump || 0;
    const thigh = h * .25, shin = h * .25, torso = h * .3, headR = h * .088, upper = h * .165, fore = h * .15, lw = h * .072;
    const amp = Math.min(1, sp) * .42 + Math.max(0, sp - 1) * .22, on = Math.min(1, sp);
    const leg = i => { const a = ph + i * Math.PI;
      let tA = amp * Math.sin(a), sA = tA - (.08 + .95 * Math.max(0, Math.sin(a - 1.9)) * on);
      tA = lerp(tA, Math.PI / 2 - .05, sit); sA = lerp(sA, .08, sit);
      const k = [Math.sin(tA) * thigh, Math.cos(tA) * thigh]; return { k, f: [k[0] + Math.sin(sA) * shin, k[1] + Math.cos(sA) * shin] }; };
    const L = [leg(0), leg(1)];
    const hipWalk = gy - Math.max(L[0].f[1], L[1].f[1]), hipY = lerp(hipWalk, gy - shin * 1.02, sit);
    const lean = .05 + Math.max(0, sp - 1) * .12 + slump * .3 + sit * .12;
    const sh = [Math.sin(lean) * torso, -Math.cos(lean) * torso];
    const hd = [sh[0] + Math.sin(lean + slump * .4) * (headR * 1.25), sh[1] - Math.cos(lean + slump * .4) * (headR * 1.25)];
    const W2 = (fx, fy) => [x + dir * fx, hipY + fy];
    const arm = i => { const a = ph + i * Math.PI;
      let aA = -amp * .95 * Math.sin(a), eB = .25 + .5 * Math.max(0, Math.sin(a + .6)) * on;
      if (i === 0) { aA = lerp(aA, 1.5, reach); eB = lerp(eB, .12, reach); }
      aA = lerp(aA, .42, sit); eB = lerp(eB, 1.05, sit);
      const e = [sh[0] + Math.sin(aA) * upper, sh[1] + Math.cos(aA) * upper];
      return { e, hnd: [e[0] + Math.sin(aA + eB) * fore, e[1] + Math.cos(aA + eB) * fore] }; };
    const A = [arm(0), arm(1)];
    ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    const limb = (pts, w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); pts.forEach((p, k) => { const q = W2(...p); k ? ctx.lineTo(...q) : ctx.moveTo(...q); }); ctx.stroke(); };
    const far = o.far || o.color, c = o.color;
    limb([[0, 0], L[1].k, L[1].f], lw, far); limb([sh, A[1].e, A[1].hnd], lw * .85, far);
    /* torso, or a coat with a swinging hem */
    if (o.coat) { const hem = o.hem || 0, tw = h * .085;
      ctx.fillStyle = c; ctx.beginPath(); const p = [[sh[0] - tw, sh[1] + h * .02], [sh[0] + tw * .9, sh[1] + h * .02], [tw * 1.15 + hem * .4, h * .14], [-tw * 1.35 + hem, h * .16]];
      p.forEach((q, k) => { const w = W2(...q); k ? ctx.lineTo(...w) : ctx.moveTo(...w); }); ctx.closePath(); ctx.fill(); limb([[0, -h * .02], sh], h * .15, c); }
    else limb([[0, -h * .02], sh], h * .15, c);
    /* head and a small nose: it turns as the head turns */
    const hp = W2(...hd); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(hp[0], hp[1], headR, 0, Math.PI * 2); ctx.fill();
    const face = Math.cos(Math.PI * (o.turn || 0)), nx = hp[0] + dir * face * headR * .95, ny = hp[1] + headR * .12;
    if (Math.abs(face) > .15) { ctx.beginPath(); ctx.moveTo(nx - dir * face * headR * .3, ny - headR * .28); ctx.lineTo(nx + dir * face * headR * .18, ny + headR * .02); ctx.lineTo(nx - dir * face * headR * .3, ny + headR * .18); ctx.fill(); }
    limb([[0, 0], L[0].k, L[0].f], lw, c); limb([sh, A[0].e, A[0].hnd], lw * .85, c);
    ctx.restore();
    const hw = W2(...A[0].hnd); return { headX: hp[0], headY: hp[1], handX: hw[0], handY: hw[1], hipY };
  }
  /* rim light: the figure drawn once in light, offset toward the sun, then in shadow on top */
  function figLit(x, gy, h, o, rim, off = 1.6) { fig(x + off, gy - off * .6, h, { ...o, color: rim, far: rim }); return fig(x, gy, h, o); }
  const hash1 = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  /* paper grain and vignette, rendered once per screen size and laid over as one image */
  let finish = null;
  function finishLayer() {
    if (finish && finish.w === W && finish.h === H) return finish.c;
    const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d"), im = g.createImageData(W, H);
    for (let i = 0; i < im.data.length; i += 4) { const light = Math.random() < .5; im.data[i] = im.data[i + 1] = im.data[i + 2] = light ? 255 : 0; im.data[i + 3] = Math.random() * 22; }
    g.putImageData(im, 0, 0);
    const v = g.createRadialGradient(W / 2, H * .5, Math.min(W, H) * .35, W / 2, H * .5, Math.max(W, H) * .75); v.addColorStop(0, "rgba(10,12,16,0)"); v.addColorStop(1, "rgba(10,12,16,.32)");
    g.fillStyle = v; g.fillRect(0, 0, W, H); finish = { c, w: W, h: H }; return c;
  }
  function grainAndVignette() { ctx.drawImage(finishLayer(), 0, 0, W, H); }
  /* a small painted tree, made once per variant */
  const treeSprites = {};
  function treeSprite(v, color, shade) {
    const key = v + color; if (treeSprites[key]) return treeSprites[key];
    const c = document.createElement("canvas"), S = 2; c.width = 120 * S; c.height = 170 * S; const g = c.getContext("2d"); g.scale(S, S);
    g.fillStyle = color; g.strokeStyle = color; g.lineCap = "round";
    g.lineWidth = 5; g.beginPath(); g.moveTo(60, 170); g.quadraticCurveTo(58 + (v - 1.5) * 3, 120, 60, 80); g.stroke();
    g.lineWidth = 2.5; g.beginPath(); g.moveTo(60, 115); g.lineTo(42, 92); g.moveTo(60, 102); g.lineTo(78, 82); g.stroke();
    const blobs = 9 + v * 2; for (let i = 0; i < blobs; i++) { const a = hash1(v * 31 + i) * Math.PI * 2, r = 14 + hash1(v * 7 + i * 3) * 30, bx = 60 + Math.cos(a) * r * .9, by = 64 + Math.sin(a) * r * .75 - 6, br = 13 + hash1(i * 5 + v) * 12;
      g.fillStyle = i % 3 === 0 ? shade : color; g.beginPath(); g.arc(bx, by, br, 0, Math.PI * 2); g.fill(); }
    return treeSprites[key] = c;
  }
  function ridge(cam, factor, base, amp, seed, color) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
    for (let i = 0; i <= 48; i++) { const sx = i / 48 * W, wx = sx + cam * factor;
      const y = base - amp * (.55 * Math.sin(wx * .0042 + seed) + .3 * Math.sin(wx * .011 + seed * 2.1) + .15 * Math.sin(wx * .027 + seed * 3.3)); ctx.lineTo(sx, y); }
    ctx.lineTo(W, H); ctx.fill();
  }

  /* ---------- Chapter I · Ahead ----------
     A father walks ahead and never turns. The boy can call (tap) or run (hold); the gap only grows. */
  const ch1 = {
    num: "I", name: "Ahead",
    start() { this.t = 0; this.cam = 0; this.gap = 120; this.calls = 0; this.stam = 1; this.ph = 0; this.fph = 0; this.ripples = []; this.turn = 0; this.tiltT = -9;
      this.gone = false; this.goneT = 0; this.sit = 0; this.slump = 0; this.lamp = 0; this.litLamp = null; this.litT = 0; this.arriveT = 0; this.stopW = 0; this.done = false; this.leaves = []; this.held = false; this.bv = 40; this.fv = 46; this.hem = 0; this.reach = 0;
      this.clouds = Array.from({ length: 5 }, (_, i) => ({ x: hash1(i) * W * 1.4, y: H * (.08 + hash1(i + 9) * .25), w: 140 + hash1(i + 3) * 200, s: 3 + hash1(i + 5) * 5 }));
      ambience(.05, 520, 0); },
    down() { this.held = true; this.downT = this.t; },
    up() { this.held = false; if (this.t - this.downT < .28) this.call(); },
    call() {
      if (this.done) return next(); if (this.gone) return;
      this.calls++; this.ripples.push({ t: 0 }); haptic(12);
      note(N.A4, { vol: .12 }); note(N.D5, { vol: .1, delay: .18 });
      if (this.calls === 3) { this.tiltT = this.t; setTimeout(() => note(N.F4, { vol: .09, dur: 3 }), 600); }
    },
    update(dt) {
      this.t += dt;
      const running = this.held && this.t - this.downT > .28 && this.stam > 0 && !this.gone;
      if (running) this.stam -= dt * .7; else this.stam = Math.min(1, this.stam + dt * .25);
      const tired = this.stam <= .05 && !running;
      const rem = this.gone ? this.stopW - (this.cam + W * .3) : 0;
      const bTarget = this.gone ? clamp(rem * 1.1, 0, 40) : running ? 100 : tired ? 26 : 40;
      const dtl = this.t - this.tiltT, pausing = dtl > 0 && dtl < 1.5;
      const fTarget = pausing ? 0 : 46;

      const sk = ctx.createLinearGradient(0, 0, 0, gy); sk.addColorStop(0, `rgb(${lerp(140, 196, warm) | 0},${lerp(155, 160, warm) | 0},${lerp(171, 140, warm) | 0})`); sk.addColorStop(1, `rgb(${lerp(216, 245, warm) | 0},${lerp(211, 214, warm) | 0},${lerp(202, 160, warm) | 0})`); ctx.fillStyle = sk; ctx.fillRect(0, 0, W, gy);
      ctx.fillStyle = "#a9b0b6"; ctx.beginPath(); ctx.moveTo(0, gy); for (let i = 0; i <= 20; i++) { const xx = i / 20 * W; ctx.lineTo(xx, gy - 60 - Math.sin((xx + this.x * .15) * .012) * 22 - Math.sin((xx + this.x * .15) * .031) * 10); } ctx.lineTo(W, gy); ctx.fill();
      ctx.fillStyle = "#7d8790"; for (let i = -1; i < 7; i++) { const sp = 150, xx = ((i * sp - this.x * .6) % (sp * 7) + sp * 7) % (sp * 7) - sp; ctx.fillRect(xx, gy - 120, 7, 120); ctx.beginPath(); ctx.arc(xx + 3.5, gy - 128, 26, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = "#5d646a"; ctx.fillRect(0, gy, W, H - gy);
      if (warm) glowDot(W * .8, gy - 40, W, "rgba(245,190,110,A)", .35 * warm);
      const bx = W * .3, mx = this.manX(), fh = Math.min(H * .3, 230), bh = fh * .5;
      const turned = this.phase !== "walk";
      const m = person(mx, gy, fh, "#2b3138", { coat: 1, walk: this.phase === "walk" || this.phase === "together", phase: this.ph, flip: turned && this.phase !== "together", sit: this.kneel * .55, reach: this.phase === "run" || this.phase === "wait" ? .7 : this.phase === "together" ? .2 : 0, tilt: turned ? -.4 * this.turn : 0 });
      const b = person(bx + (this.phase === "together" ? 0 : 0), gy, bh, "#4c5864", { walk: this.phase !== "wait", phase: this.bph, reach: this.phase === "wait" || this.phase === "together" ? 1.2 : 0 });
      if (this.phase === "wait") { this.handX = (m.handX + b.handX) / 2; this.handY = (m.handY + b.handY) / 2; glowDot(this.handX, this.handY, 30, "rgba(240,200,110,A)", .25 + this.hold * .5);
        if (this.hold > 0) { ctx.strokeStyle = "rgba(240,200,110,.85)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(this.handX, this.handY, 26, -Math.PI / 2, -Math.PI / 2 + this.hold * Math.PI * 2); ctx.stroke(); } else hint(this.handX, this.handY, t); }
      this.ripples.forEach(r => { ctx.strokeStyle = `rgba(250,246,238,${.7 * (1 - r.t / 1.6)})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(b.headX + 6, b.headY, 8 + r.t * 70, -.9, .9); ctx.stroke(); });
      if (this.phase === "walk" && t > 3) hint(mx, gy - fh * .55, t);
      if (this.done) hint(W / 2, H * .86, t);
    },
  };

  /* ---------- Chapter IX · Coda ----------
     One long held touch. Every chapter's colour, in turn, then the gold. */
  const ch9 = {
    num: "IX", name: "Ashes and Gold",
    start() { this.t = 0; this.p = 0; this.rings = []; this.lastRing = -1; this.held = false; this.done = false; this.cx = W / 2; this.cy = H * .55; this.final = 0; ambience(.015, 300, .02, 55); },
    down(x, y) { if (this.done) return next(); this.held = true; if (this.p < .02) { this.cx = x; this.cy = y; } },
    up() { this.held = false; },
    COL: ["#8d9bab", "#c58a4e", "#1f3a30", "#8a847d", "#e6b65c", "#a0503a", "#3a4a8a", "#5a8a8c", "#e8b45c", "#e3c9a8", "#f0c070"],
    CH: [N.D4, N.F4, N.A4, N.C5, N.D5, N.A4, N.F4, N.G4, N.A4, N.D5, N.D4],
    update(dt) {
      this.t += dt;
      if (this.held && this.p < 1) { this.p = Math.min(1, this.p + dt / 15);
        const k = Math.floor(this.p * this.COL.length); if (k > this.lastRing && k < this.COL.length) { this.lastRing = k; this.rings.push({ c: this.COL[k], r: 0 }); note(this.CH[k], { vol: .07, dur: 4 }); note(this.CH[k] / 2, { vol: .04, dur: 4 }); haptic(6); }
        if (this.p >= 1) { haptic([12, 60, 24]); note(N.D3, { vol: .1, dur: 8 }); note(N.A3, { vol: .08, dur: 8, delay: .2 }); note(N.F4, { vol: .07, dur: 8, delay: .4 }); note(N.D5, { vol: .06, dur: 8, delay: .6 }); } }
      this.rings.forEach(r => r.r += dt * (this.held || this.p >= 1 ? 90 : 12));
      if (this.p >= 1) { this.final = Math.min(1, this.final + dt * .25); if (this.final >= 1 && !this.done) { this.done = true; } }
    },
    draw() {
      const t = this.t; ctx.fillStyle = "#1a1714"; ctx.fillRect(0, 0, W, H);
      this.rings.forEach(r => { ctx.fillStyle = r.c; ctx.globalAlpha = .9; ctx.beginPath(); ctx.arc(this.cx, this.cy, r.r, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1;
      if (this.final) { /* the last image: a man on the ash, facing the gold */
        ctx.globalAlpha = this.final; const gy = H * .64;
        const sk = ctx.createLinearGradient(0, 0, 0, gy); sk.addColorStop(0, "#6b4a2c"); sk.addColorStop(1, "#e2b066"); ctx.fillStyle = sk; ctx.fillRect(0, 0, W, gy);
        glowDot(W / 2, gy - H * .1, W * .7, "rgba(255,210,120,A)", .6); ctx.fillStyle = "#f1c56c"; ctx.beginPath(); ctx.arc(W / 2, gy - H * .1, Math.min(W, H) * .16, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#3b3936"; ctx.fillRect(0, gy, W, H - gy); ctx.fillStyle = "#5e8a52"; for (let i = 0; i < 18; i++) { const xx = (i * 97) % W, hh = 6 + (i * 13) % 10; ctx.fillRect(xx, gy - hh * .2, 2, hh); }
        person(W / 2, gy, Math.min(H * .28, 220), "#141210", {}); ctx.globalAlpha = 1; }
      if (!this.held && this.p < .02) hint(W / 2, H * .55, t);
      if (this.p > 0 && this.p < 1) { ctx.strokeStyle = "rgba(239,230,214,.5)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(this.cx, this.cy, 30, -Math.PI / 2, -Math.PI / 2 + this.p * Math.PI * 2); ctx.stroke(); }
      if (this.done) hint(W / 2, H * .9, t);
    },
  };

  /* ---------- Flow ---------- */
  const CHAPTERS = [ch1, ch2, ch3, ch4, ch5, ch6, ch7, ch8, ch9];
  let scene = null, ci = -1, fadeA = 0, fadeDir = 0, onFaded = null;
  const roman = n => ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX"][n];
  function play(i) {
    ci = i; audio(); $("#title").classList.add("hide"); $("#end").classList.add("hide"); $("#home").style.display = "grid";
    $("#cardn").textContent = roman(i); $("#cardt").textContent = CHAPTERS[i].name; $("#card").classList.remove("hide"); scene = null;
    scene?.leave?.(); note([N.D4, N.F4, N.A4, N.C5, N.D5, N.A4, N.F4, N.G4, N.D4][i] || N.D4, { vol: .06, dur: 4 });
    setTimeout(() => { $("#card").classList.add("hide"); scene = CHAPTERS[i]; scene.start(); fadeA = 1; fadeDir = -1; }, 2600);
  }
  function next() {
    if (fadeDir) return; fadeDir = 1; onFaded = () => {
      save.reached = Math.max(save.reached, ci + 2); store();
      scene?.leave?.(); if (ci + 1 < CHAPTERS.length) play(ci + 1); else { scene = null; ambience(0, 300, 0); $("#end").classList.remove("hide"); }
    };
  }
  function toTitle() { scene?.leave?.(); scene = null; ci = -1; ambience(0, 300, 0); $("#end").classList.add("hide"); $("#card").classList.add("hide"); $("#home").style.display = "none"; renderTitle(); $("#title").classList.remove("hide"); }
  function renderTitle() {
    $("#begin").textContent = save.reached > 1 && save.reached <= CHAPTERS.length ? "Continue" : "Begin";
    $("#chapters").innerHTML = CHAPTERS.map((c, i) => `<button class="${i < save.reached ? "open" : ""}" ${i < save.reached ? "" : "disabled"} data-ch="${i}" aria-label="Chapter ${roman(i)}, ${c.name}">${roman(i)}</button>`).join("");
    $("#ver").textContent = `version ${APP_VERSION}`;
  }
  $("#begin").onclick = () => play(save.reached > 1 && save.reached <= CHAPTERS.length ? save.reached - 1 : 0);
  $("#chapters").onclick = e => { const b = e.target.closest("[data-ch]"); if (b) play(+b.dataset.ch); };
  $("#again").onclick = () => toTitle();
  $("#home").onclick = e => { e.stopPropagation(); toTitle(); };

  /* input */
  const pt = e => [e.clientX, e.clientY];
  cv.addEventListener("pointerdown", e => { if (!scene) return; cv.setPointerCapture?.(e.pointerId); scene.down?.(...pt(e)); });
  cv.addEventListener("pointermove", e => { if (scene) scene.move?.(...pt(e)); });
  cv.addEventListener("pointerup", e => { if (scene) scene.up?.(...pt(e)); });
  cv.addEventListener("pointercancel", e => { if (scene) scene.up?.(...pt(e)); });

  /* loop */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    ctx.fillStyle = "#16130f"; ctx.fillRect(0, 0, W, H);
    if (scene) { scene.update(dt); scene.draw(); }
    if (fadeDir) { fadeA = clamp(fadeA + fadeDir * dt * .8, 0, 1); if (fadeDir > 0 && fadeA >= 1) { fadeDir = 0; const f = onFaded; onFaded = null; f?.(); } else if (fadeDir < 0 && fadeA <= 0) fadeDir = 0; }
    if (fadeA > 0) { ctx.fillStyle = `rgba(22,19,15,${fadeA})`; ctx.fillRect(0, 0, W, H); }
    requestAnimationFrame(frame);
  }
  resize(); setMuteIcon(); renderTitle(); requestAnimationFrame(frame);
  window.__ag = { get scene() { return scene; }, play, next, CHAPTERS };
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
