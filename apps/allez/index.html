<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Allez</title>
  <meta name="description" content="Speak and understand French, fast: an accurate level diagnosis, then 25 minutes a day of listening and speaking.">
  <meta name="theme-color" content="#f6f1e8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Allez">
  <style>
    @font-face { font-family: "Fraunces"; src: url(fonts/fraunces-latin-soft-normal.woff2) format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
    @font-face { font-family: "Inter"; src: url(fonts/inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
    :root {
      --bg: #f6f1e8; --card: #fffdf8; --card2: #f0eadf; --ink: #1a2142; --ink2: #4a5175; --muted: #8b8fa6;
      --line: rgba(26,33,66,.09); --line2: rgba(26,33,66,.16);
      --blue: #2a4fd0; --blue2: #e3e9fb; --red: #e5484f; --red2: #fbe4e4; --gold: #d9952a; --gold2: #fbefd9; --green: #1f9a67; --green2: #dcf3e8;
      --display: "Fraunces", Georgia, serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --spring: cubic-bezier(.2,.9,.25,1.15);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); min-height: 100vh; overscroll-behavior-y: none; }
    main { max-width: 620px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px); }
    h1 { font: 600 32px/1.12 var(--display); letter-spacing: -.01em; margin: 6px 2px 6px; }
    h2 { font: 600 22px/1.2 var(--display); margin: 0 0 6px; }
    h3 { font: 650 16px/1.3 var(--sans); margin: 0 0 4px; }
    p { margin: 0 0 10px; }
    a { color: var(--blue); }
    .muted { color: var(--muted); } .ink2 { color: var(--ink2); } .small { font-size: 13.5px; } .center { text-align: center; }
    .eyebrow { font: 700 11px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 4px; }
    .back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink2); text-decoration: none; font-weight: 600; padding: 8px 6px 8px 0; background: none; border: 0; font-size: 15px; cursor: pointer; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin-top: 12px; box-shadow: 0 1px 0 rgba(26,33,66,.03), 0 8px 24px -18px rgba(26,33,66,.25); }
    .card.blue { background: var(--blue); color: #fff; border: 0; } .card.blue .muted, .card.blue .eyebrow { color: rgba(255,255,255,.72); }
    .row { display: flex; align-items: center; gap: 12px; } .between { justify-content: space-between; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); font: 650 15px var(--sans); padding: 12px 18px; border-radius: 999px; cursor: pointer; text-decoration: none; min-height: 46px; transition: transform .15s; }
    .btn:active { transform: scale(.97); }
    .btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.red { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.white { background: #fff; color: var(--blue); border-color: #fff; }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--ink2); }
    .btn.sm { padding: 7px 13px; min-height: 36px; font-size: 14px; }
    .btn.block { display: flex; width: 100%; }
    .btn[disabled] { opacity: .45; pointer-events: none; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
    .iconbtn svg, .btn svg { width: 20px; height: 20px; }
    svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .item { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); margin-top: 8px; color: inherit; text-decoration: none; width: 100%; text-align: left; font: inherit; cursor: pointer; }
    .item .t { font-weight: 650; } .item .m { color: var(--muted); font-size: 13.5px; line-height: 1.35; }
    .item.done .t { color: var(--muted); }
    .pill { display: inline-flex; align-items: center; gap: 4px; font: 700 11.5px var(--sans); padding: 3px 9px; border-radius: 999px; background: var(--card2); color: var(--ink2); white-space: nowrap; }
    .pill.blue { background: var(--blue2); color: var(--blue); } .pill.red { background: var(--red2); color: var(--red); } .pill.gold { background: var(--gold2); color: #a86a0c; } .pill.green { background: var(--green2); color: var(--green); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .chip { border: 1px solid var(--line2); background: var(--card); color: var(--ink2); padding: 6px 12px; border-radius: 999px; font: 600 13.5px var(--sans); cursor: pointer; }
    .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .sec { margin-top: 26px; } .sec > .eyebrow { margin: 0 4px 2px; }
    .fr { font: 500 23px/1.35 var(--display); } .fr.big { font-size: 27px; }
    .en { color: var(--ink2); }
    .w-ok { color: var(--green); } .w-miss { color: var(--red); text-decoration: underline wavy rgba(229,72,79,.5); text-underline-offset: 4px; }
    .bar { height: 10px; background: var(--card2); border-radius: 10px; overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--blue); border-radius: 10px; transition: width .5s var(--spring); }
    .prog { height: 5px; background: var(--card2); border-radius: 5px; overflow: hidden; margin: 6px 0 14px; } .prog > i { display: block; height: 100%; background: var(--blue); transition: width .4s; }
    input[type=text], input[type=search], textarea, select { width: 100%; font: 17px var(--sans); padding: 13px 15px; border-radius: 16px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); outline: none; }
    input:focus, textarea:focus { border-color: var(--blue); }
    textarea { min-height: 84px; resize: vertical; }
    .mic { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--red); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 24px -10px rgba(229,72,79,.7); margin: 0 auto; transition: transform .2s; }
    .mic svg { width: 34px; height: 34px; }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(229,72,79,.5); } 100% { box-shadow: 0 0 0 22px rgba(229,72,79,0); } }
    .answer { margin-top: 16px; text-align: center; }
    .live { min-height: 26px; margin-top: 10px; color: var(--ink2); font-style: italic; }
    .linkbtn { background: none; border: 0; padding: 0; color: var(--ink2); text-decoration: underline; font: inherit; cursor: pointer; }
    .opt { display: block; width: 100%; text-align: left; padding: 13px 15px; border-radius: 16px; border: 1px solid var(--line2); background: var(--card); margin-top: 8px; font: 500 16px var(--sans); color: var(--ink); cursor: pointer; }
    .opt.ok { background: var(--green2); border-color: var(--green); } .opt.bad { background: var(--red2); border-color: var(--red); } .opt.pick { border-color: var(--blue); background: var(--blue2); }
    .bub { max-width: 86%; padding: 11px 15px; border-radius: 20px; margin-top: 8px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
    .bub.me { margin-left: auto; background: var(--blue); color: #fff; border-color: var(--blue); }

    .bub .tr { color: var(--muted); font-size: 14px; margin-top: 3px; }

    .grade button.sug { border: 2px solid var(--blue); background: var(--blue2); }
    .grade button small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); background: rgba(246,241,232,.92); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
    nav.tabs .in { display: flex; width: min(600px,100%); justify-content: space-around; }
    nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 12px; border-radius: 16px; color: var(--muted); text-decoration: none; font: 650 11.5px var(--sans); min-width: 62px; }
    nav.tabs a svg { width: 23px; height: 23px; }
    nav.tabs a.on { color: var(--blue); background: var(--blue2); }
    .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font: 650 14px var(--sans); animation: rise .3s var(--spring) both; max-width: calc(100% - 40px); text-align: center; }
    .sheet-back { position: fixed; inset: 0; z-index: 70; background: rgba(10,14,30,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .25s both; }
    .sheet { width: min(560px, 100%); max-height: 90vh; overflow-y: auto; background: var(--card); border-radius: 28px 28px 0 0; padding: 12px 20px calc(env(safe-area-inset-bottom) + 18px); animation: sheetup .45s var(--spring) both; }
    .sheet .grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line2); margin: 0 auto 18px; }
    ol.steps { padding-left: 20px; margin: 6px 0; } ol.steps li { margin: 5px 0; }
    .lvlbig { font: 600 54px/1 var(--display); color: var(--blue); }
    .scale { display: grid; grid-template-columns: repeat(5,1fr); gap: 3px; margin-top: 8px; }
    .scale span { height: 8px; border-radius: 4px; background: var(--card2); position: relative; }
    .scale span.on { background: var(--blue); } .scale span.half { background: linear-gradient(90deg, var(--blue) 50%, var(--card2) 50%); }
    .scalel { display: grid; grid-template-columns: repeat(5,1fr); font: 700 10.5px var(--sans); color: var(--muted); margin-top: 3px; text-align: center; }
    .step { display: flex; gap: 12px; align-items: center; }
    .step .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); font: 700 13px var(--sans); color: var(--ink2); flex: none; }
    .step.done .n { background: var(--green); color: #fff; }
    .step.next .n { background: var(--blue); color: #fff; }
    .chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; margin-top: 10px; }
    .chart div { flex: 1; background: var(--blue2); border-radius: 6px 6px 3px 3px; position: relative; min-height: 3px; }
    .chart div.today { background: var(--blue); }
    .chart-l { display: flex; gap: 6px; font: 600 10.5px var(--sans); color: var(--muted); margin-top: 4px; } .chart-l span { flex: 1; text-align: center; }
    .note { background: var(--gold2); border-radius: 16px; padding: 12px 14px; font-size: 14.5px; margin-top: 12px; }
    details { margin-top: 10px; } summary { cursor: pointer; font-weight: 650; color: var(--ink2); }
    .view { animation: rise .35s var(--spring) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes sheetup { from { transform: translateY(100%); } }
    .cando label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); margin-top: 6px; cursor: pointer; }
    .cando input { width: 22px; height: 22px; accent-color: var(--blue); flex: none; margin-top: 1px; }
    .ver { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
  </style>
</head>

<main id="app"></main>
<nav class="tabs" id="tabs"><div class="in">
  <a href="#/" data-tab="today"><svg class="i" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20h-5v-5H9v5H4z"/></svg>Today</a>

  <a href="#/speak" data-tab="speak"><svg class="i" viewBox="0 0 24 24"><path d="M4.5 5.5h15v10h-9l-4 3.5v-3.5h-2z"/></svg>Speak</a>

  <a href="#/me" data-tab="me"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</a>
</div></nav>
<script>
(() => {
  "use strict";
  const KEY = "allez", VER = "1";
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const DAY = 864e5, now = () => Date.now();
  const pad = n => String(n).padStart(2, "0");
  const dayKey = (t = now()) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return +d; };
  const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const toast = (m, ms = 2300) => { $$(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms); };
  const IC = {
    play: '<path d="M8 5.5v13l10.5-6.5z"/>', slow: '<path d="M3 15c0-3.5 3-6.5 7-6.5s7 3 7 6.5H3z"/><path d="M17 13h2.5a1.5 1.5 0 0 0 0-3H18M6 15v3M14 15v3"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>', back: '<path d="M15 5l-7 7 7 7"/>', chev: '<path d="M9 5l7 7-7 7"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
    eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>', bolt: '<path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/>',
    tv: '<rect x="3" y="5.5" width="18" height="12" rx="2"/><path d="M8 20.5h8"/>', num: '<path d="M9 4 7 20M17 4l-2 16M4.5 9h16M3.5 15h16"/>', pen: '<path d="M4 20l4-1 11-11-3-3L5 16z"/>',
    target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>', ear: '<path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-5.5 1.5"/><path d="M10 9.5a2 2 0 0 1 4 0"/>',
    chat: '<path d="M4.5 5.5h15v10h-9l-4 3.5v-3.5h-2z"/>', book: '<path d="M5 4.5h10.5a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"/>', timer: '<circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/>',
    download: '<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/>', upload: '<path d="M12 20V9M7.5 13.5 12 9l4.5 4.5M5 4.5h14"/>', star: '<path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/>'
  };
  const ic = n => `<svg class="i" viewBox="0 0 24 24">${IC[n] || ""}</svg>`;
  const backLink = (h, t = "Back") => `<a class="back" href="${h}">${ic("back")}${esc(t)}</a>`;

  /* ---------- Data ---------- */
  const DEF = () => ({ v: 1, diag: null, diags: [], srs: {}, mine: [], pri: [], dlg: {}, scen: {}, les: {}, talks: [], log: {}, sess: {}, newLog: {}, drills: [],
    set: { rate: 1, vA: "", vB: "", newPerDay: 10, mode: "voice", goals: ["daily", "social", "dating", "media"] }, created: now() });
  let db;
  try { db = Object.assign(DEF(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { db = DEF(); }
  db.set = Object.assign(DEF().set, db.set || {});
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { toast("Storage is full"); } };
  let C = null;

  const LV = ["A1", "A2", "B1", "B2", "C1"];
  const lvlNum = l => LV.indexOf(l) + 1;
  const lvlName = t => t == null ? "?" : t < 1 ? "Pre-A1" : t >= 5 ? "C1" : LV[Math.floor(t) - 1] + (t % 1 >= .6 ? "+" : "");
  const lvlInt = t => Math.max(1, Math.min(5, Math.floor(t ?? 2)));
  const th = k => db.diag ? db.diag.theta[k] : null;
  const targetLvl = t => LV[Math.max(0, Math.min(4, Math.round(t ?? 2) - 1))]; /* i+1: from the upper half of a level, aim at the next */

  /* ---------- Text matching ---------- */
  const U = ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize"];
  const T = ["", "dix", "vingt", "trente", "quarante", "cinquante", "soixante"];
  function b100(n) {
    if (n < 17) return U[n]; if (n < 20) return "dix-" + U[n - 10];
    if (n < 70) { const t = Math.floor(n / 10), u = n % 10; return T[t] + (u === 0 ? "" : u === 1 ? " et un" : "-" + U[u]); }
    if (n < 80) return n === 71 ? "soixante et onze" : "soixante-" + b100(n - 60);
    if (n === 80) return "quatre-vingts"; return "quatre-vingt-" + b100(n - 80);
  }
  function b1000(n) { if (n < 100) return b100(n); const h = Math.floor(n / 100), r = n % 100; return (h === 1 ? "cent" : U[h] + " cent" + (r === 0 ? "s" : "")) + (r ? " " + b100(r) : ""); }
  function numFr(n) {
    n = Math.floor(Math.abs(n)); if (n < 1000) return b1000(n);
    if (n < 1e6) { const t = Math.floor(n / 1000), r = n % 1000; return (t === 1 ? "mille" : b1000(t).replace(/cents$/, "cent").replace(/vingts$/, "vingt") + " mille") + (r ? " " + b1000(r) : ""); }
    return String(n);
  }
  const norm = s => " " + String(s || "").toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/(\d+)[,.](\d+)/g, "$1 virgule $2").replace(/\d+/g, m => " " + numFr(+m).normalize("NFD").replace(/[̀-ͯ]/g, "") + " ")
    .replace(/[’'`\-]/g, " ").replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim() + " ";
  const toks = s => norm(s).trim().split(" ").filter(Boolean);
  function align(target, hyp) {
    const words = String(target).split(/\s+/).filter(Boolean), tt = []; words.forEach((w, i) => toks(w).forEach(t => tt.push([t, i])));
    const h = toks(hyp), n = tt.length, m = h.length;
    const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = tt[i][0] === h[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);

  function buildQueue() {

    const firsts = cands.filter(c => pri.has(c.id)).map(c => ({ id: c.id, mode: "intro" })), news = cands.filter(c => !pri.has(c.id)).slice(0, room).map(c => ({ id: c.id, mode: "intro" }));

  }

      return head + `<div class="card"><p class="fr big">${P.res ? marked(P.res) : esc(c.fr)}</p><p class="en">${esc(c.en)}</p>${inf}
        <div class="btns"><button class="btn sm" data-act="sayc">${ic("play")} Listen</button><button class="btn sm" data-act="sayslow">${ic("slow")} Slowly</button></div>${meta}</div>
        <p class="center small muted" style="margin:16px 0 0">${P.res ? (P.res.score >= .85 ? "Très bien. Once more, faster?" : "Listen again and copy the music, then try again.") : "Listen, then say it out loud: copy the rhythm, not just the words."}</p>${answerBox()}
        <button class="btn ${P.res ? "pri" : ""} block" data-act="pnext" style="margin-top:12px">${P.res ? "Got it" : "Next"}</button>`;
    }
    if (P.stage === "ask") {
      later(() => setAnswer(res => { const r = [c.fr, c.inf].filter(Boolean).map(t => bestAlign(t, res.alts)).sort((a, b) => b.score - a.score)[0]; P.res = r; P.heard = res.best; P.stage = "show"; P.tried++; if (r.score >= .8) P.right++; render(); }));
      return head + `<div class="card center"><div class="eyebrow">Say it in French</div><p class="fr big" style="margin-top:10px;font-family:var(--sans);font-weight:600;font-size:23px">${esc(c.en)}</p>${c.topic ? `<div class="small muted">${esc(c.topic)}</div>` : ""}</div>${answerBox()}
        <div class="btns" style="justify-content:center"><button class="btn sm" data-act="hint">Hint</button><button class="btn sm ghost" data-act="pshow">Show me</button></div><div id="hintbox" class="center fr" style="margin-top:8px;font-size:20px"></div>`;
    }
    later(() => say(c.fr));
    const s = P.res ? P.res.score : 0, sug = !P.res ? 0 : s >= .95 ? 3 : s >= .8 ? 2 : s >= .55 ? 1 : 0, cc = db.srs[c.id] || { ivl: 0, ease: 2.5 };
    const nx = g => g === 0 ? "10 min" : (() => { let i = cc.ivl === 0 ? (g === 3 ? 3 : 1) : cc.ivl === 1 && g >= 2 ? (g === 3 ? 4 : 3) : Math.max(cc.ivl + 1, Math.round(cc.ivl * (g === 1 ? 1.2 : g === 2 ? cc.ease : cc.ease * 1.3))); return i < 30 ? i + "d" : Math.round(i / 30) + "mo"; })();
    return head + `<div class="card"><div class="small muted">${esc(c.en)}</div><p class="fr big" style="margin-top:6px">${P.res ? marked(P.res) : esc(c.fr)}</p>${P.heard ? `<p class="small muted">Heard: “${esc(P.heard)}”</p>` : ""}${inf}
      <div class="btns"><button class="btn sm" data-act="sayc">${ic("play")} Listen</button><button class="btn sm" data-act="sayslow">${ic("slow")} Slowly</button></div>${meta}</div>
      <p class="center small muted" style="margin:14px 0 0">How well did you know it?${P.res ? " My suggestion is highlighted." : ""}</p>
      <div class="grade">${["Again", "Hard", "Good", "Easy"].map((n, g) => `<button class="${g === sug ? "sug" : ""}" data-act="pgrade" data-v="${g}">${n}<small>${nx(g)}</small></button>`).join("")}</div>`;
  }

  /* Library */
  let lib = { theme: "", lvl: "", q: "" };
  function viewLibrary() {
    const L = allChunks().filter(c => (!lib.theme || c.theme === lib.theme) && (!lib.lvl || c.lvl === lib.lvl) && (!lib.q || norm(c.fr + " " + c.inf + " " + c.en).includes(norm(lib.q).trim())));
    const counts = { learning: 0, growing: 0, known: 0 }; Object.keys(db.srs).forEach(id => counts[status(id)] !== undefined && counts[status(id)]++);
    return `<div class="top"><h1 style="margin:0">Phrases</h1><button class="btn sm" data-act="addmine">${ic("plus")} My phrase</button></div>
      <div class="row" style="gap:6px;margin:6px 2px 0"><span class="pill gold">${counts.learning} learning</span><span class="pill blue">${counts.growing} growing</span><span class="pill green">${counts.known} known</span></div>
      <a class="btn pri block" href="#/phrases" style="margin-top:14px">${ic("bolt")} Practise now · ${dueList().length} due</a>
      <input type="search" id="libq" placeholder="Search French or English" value="${esc(lib.q)}" style="margin-top:14px">
      <div class="chips">${["", ...Object.keys(THEMES)].map(t => `<button class="chip ${lib.theme === t ? "on" : ""}" data-act="libtheme" data-v="${t}">${t ? THEMES[t] : "All"}</button>`).join("")}</div>
      <div class="chips">${["", ...LV.slice(0, 4)].map(t => `<button class="chip ${lib.lvl === t ? "on" : ""}" data-act="liblvl" data-v="${t}">${t || "Any level"}</button>`).join("")}</div>
      <div id="liblist" style="margin-top:6px">${libRows(L)}</div>`;
  }
  const libRows = L => L.length ? L.slice(0, 150).map(c => { const st = status(c.id); return `<div class="item" data-act="libsay" data-v="${c.id}"><div class="grow"><div class="t" style="font-weight:600">${esc(c.fr)}</div><div class="m">${esc(c.en)}${c.inf && c.inf !== c.fr ? ` · <i>${esc(c.inf)}</i>` : ""}</div></div>${st === "new" ? ((db.pri || []).includes(c.id) ? `<span class="pill gold">Next</span>` : `<button class="iconbtn" data-act="libpri" data-v="${c.id}" aria-label="Learn next">${ic("plus")}</button>`) : `<span class="pill ${st === "known" ? "green" : st === "growing" ? "blue" : "gold"}">${st}</span>`}</div>`; }).join("") + (L.length > 150 ? `<p class="small muted center">Showing 150 of ${L.length}. Search to narrow down.</p>` : "") : `<p class="muted center" style="margin-top:24px">No phrases found.</p>`;

  /* Listen tab */
  function viewListen() {
    const tl = targetLvl(th("listen"));
    return `<h1 style="margin-top:10px">Listen</h1><p class="ink2" style="margin:0 2px">Understanding comes first: you can only say what you can hear.</p>
      <div class="sec"><div class="eyebrow">Train your ear</div>
        <a class="item" href="#/numbers">${circ("num", "var(--blue)")}<div class="grow"><div class="t">Numbers at speed</div><div class="m">Prices, times, years, phone numbers: 70 to 99 trip everyone up</div></div>${ic("chev")}</a>
        <a class="item" href="#/dictee">${circ("pen", "var(--green)")}<div class="grow"><div class="t">Dictation</div><div class="m">Type what you hear: catches the words your ear skips</div></div>${ic("chev")}</a>
        ${C.lessons.filter(l => l.kind === "sound").map(l => `<a class="item" href="#/lesson/${l.id}">${circ("ear", "var(--gold)")}<div class="grow"><div class="t">${esc(l.title)}</div><div class="m">Sound training · ${(l.pairs || []).length} pairs${db.les[l.id] ? " · done " + db.les[l.id].n + "×" : ""}</div></div>${ic("chev")}</a>`).join("")}
        <a class="item" href="#/media">${circ("tv", "var(--red)")}<div class="grow"><div class="t">Films, series and podcasts</div><div class="m">How to learn from real French media</div></div>${ic("chev")}</a></div>
      ${LV.map(L => { const D = C.dialogues.filter(d => d.lvl === L); return D.length ? `<div class="sec"><div class="eyebrow">Conversations · ${L}${L === tl ? " · your level" : ""}</div>${D.map(d => `<a class="item ${db.dlg[d.id] ? "done" : ""}" href="#/d/${d.id}">${circ(d.theme === "media" ? "tv" : d.theme === "dating" ? "star" : "chat", d.theme === "dating" ? "var(--red)" : d.theme === "media" ? "var(--gold)" : "var(--blue)")}<div class="grow"><div class="t">${esc(d.title)}</div><div class="m">${esc(d.setting)}</div></div>${db.dlg[d.id] ? `<span class="pill green">${db.dlg[d.id].q}/3</span>` : ""}</a>`).join("")}</div>` : ""; }).join("")}`;
  }

  /* Dialogue */
  let dv = null;
  async function playLines(lines, rate, tok) {
    for (let i = 0; i < lines.length; i++) { if (dv?.tok !== tok) return; $$(".bub").forEach(b => b.classList.toggle("speaking", +b.dataset.i === i)); const ok = await say(lines[i].t, { g: lines[i].g, rate }); if (!ok || dv?.tok !== tok) return; await new Promise(r => setTimeout(r, 280)); }
    $$(".bub").forEach(b => b.classList.remove("speaking"));
  }
  function viewDialogue(id) {
    const d = dlg(id); if (!d) return `<p>Not found.</p>`;
    if (!dv || dv.id !== id) { const mid = d.lines.map((l, i) => [i, l.t.split(" ").length]).filter(x => x[1] >= 4 && x[1] <= 14); const sh = shuffle(mid).slice(0, 3).map(x => x[0]); dv = { id, st: 0, ans: {}, tok: 0, sh: sh.slice(0, 2), dic: sh[2] ?? sh[0], shRes: {}, show: {} }; }
    const st = dv.st, top = `${stepTop()}<div class="eyebrow">${d.lvl} · ${esc(THEMES[d.theme] || d.theme)}</div><h1 style="font-size:27px">${esc(d.title)}</h1><p class="ink2 small" style="margin:0 2px">${esc(d.setting)}</p>`;
    const stages = ["Listen", "Questions", "Read along", "Shadow", "Dictation"], prog = `<div class="row" style="gap:4px;margin:12px 0">${stages.map((s, i) => `<span class="pill ${i < st ? "green" : i === st ? "blue" : ""}">${s}</span>`).join("")}</div>`;
    const bubs = (hide) => d.lines.map((l, i) => `<div class="bub ${l.s === "B" ? "" : ""}" data-i="${i}" data-act="dline" data-v="${i}" style="${l.s === "B" ? "margin-left:auto" : l.s === "C" ? "margin-left:7%" : ""}"><div class="who">${esc(l.s)}</div><div class="${hide ? "hidden-t" : ""}">${esc(l.t)}</div>${!hide && dv.show[i] ? `<div class="tr">${esc(l.en)}</div>` : ""}</div>`).join("");
    if (st === 0) return top + prog + `<div class="card"><p class="ink2" style="margin:0">Listen first without reading. Get the gist: who, where, what's going on? It plays a little slower the first time.</p><div class="btns"><button class="btn pri" data-act="dplay" data-v=".85">${ic("play")} Play slower</button><button class="btn" data-act="dplay" data-v="1">${ic("play")} Natural speed</button></div></div>${bubs(true)}<button class="btn pri block" data-act="dst" data-v="1" style="margin-top:16px">I've listened: questions</button>`;
    if (st === 1) { const all = d.qs.every((_, i) => dv.ans[i] != null);
      return top + prog + `<div class="btns" style="margin-top:0"><button class="btn sm" data-act="dplay" data-v="1">${ic("play")} Play again</button></div>` + d.qs.map((q, qi) => `<div class="card"><h3>${esc(q.q)}</h3>${q.options.map((o, i) => `<button class="opt ${dv.ans[qi] != null ? (i === q.answer ? "ok" : i === dv.ans[qi] ? "bad" : "") : ""}" data-act="dq" data-v="${qi}:${i}" ${dv.ans[qi] != null ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>`).join("") + (all ? `<button class="btn pri block" data-act="dst" data-v="2" style="margin-top:16px">Read along</button>` : ""); }
    if (st === 2) return top + prog + `<div class="card"><p class="ink2" style="margin:0">Now with the words. Tap a line to hear it again and see the English.</p><div class="btns"><button class="btn pri" data-act="dplay" data-v="1">${ic("play")} Play all</button><button class="btn" data-act="dplay" data-v=".8">${ic("slow")} Slower</button></div></div>${bubs(false)}
      ${(d.notice || []).length ? `<div class="sec"><div class="eyebrow">Notice</div>${d.notice.map(n => `<div class="card" style="padding:14px"><div style="font-weight:650">${esc(n.fr)}</div><div class="small ink2">${esc(n.en)}</div></div>`).join("")}</div>` : ""}<button class="btn pri block" data-act="dst" data-v="3" style="margin-top:16px">Shadow two lines</button>`;
    if (st === 3) { const idx = dv.sh.find(i => !dv.shRes[i]) ?? null;
      if (idx == null) return top + prog + `<div class="card center"><h2>Nice shadowing</h2><p class="ink2">Average match: ${Math.round(dv.sh.reduce((a, i) => a + dv.shRes[i].score, 0) / dv.sh.length * 100)}%.</p><button class="btn pri block" data-act="dst" data-v="4">Last step: dictation</button></div>`;
      const l = d.lines[idx]; later(() => { say(l.t, { g: l.g }); setAnswer(res => { dv.shRes[idx] = bestAlign(l.t, res.alts); render(); }); });
      return top + prog + `<div class="card"><p class="small muted" style="margin:0">Shadowing: copy the line out loud, with the same speed and melody. Play it as often as you like.</p><p class="fr" style="margin-top:10px">${esc(l.t)}</p><p class="en small">${esc(l.en)}</p><div class="btns"><button class="btn sm" data-act="dsay" data-v="${idx}">${ic("play")} Play</button><button class="btn sm" data-act="dsay" data-v="${idx}" data-rate=".75">${ic("slow")} Slowly</button></div></div>${answerBox()}<button class="linkbtn small" data-act="dshskip" data-v="${idx}" style="display:block;margin:10px auto">Skip</button>`; }
    if (st === 4) { const l = d.lines[dv.dic];
      if (dv.dres) { const r = dv.dres; if (!db.dlg[id] || db.dlg[id].at < now() - 1000 * 60) { db.dlg[id] = { at: now(), q: d.qs.filter((q, i) => dv.ans[i] === q.answer).length, dict: Math.round(r.score * 100) }; save(); stepDone(); }
        return top + prog + `<div class="card"><p class="fr">${marked(r)}</p><p class="small muted">You typed: ${esc(dv.typed)}</p><p class="ink2">${r.score >= .95 ? "Perfect." : r.score >= .75 ? "Close. The red words are the ones your ear smoothed over: say them aloud a few times." : "Hard one. Play it slowly, find the words you missed, and say the line aloud three times."}</p><div class="btns"><button class="btn sm" data-act="dsay" data-v="${dv.dic}">${ic("play")} Play</button><button class="btn sm" data-act="dsay" data-v="${dv.dic}" data-rate=".75">${ic("slow")} Slowly</button></div></div>
          <div class="card"><h3>Done</h3><p class="ink2" style="margin:0">Questions ${db.dlg[id].q}/3 · dictation ${db.dlg[id].dict}%.</p>${nextStepBtn()}</div>`; }
      return top + prog + `<div class="card"><p class="ink2" style="margin:0">Type the line you hear.</p><div class="btns"><button class="btn pri sm" data-act="dsay" data-v="${dv.dic}">${ic("play")} Play</button><button class="btn sm" data-act="dsay" data-v="${dv.dic}" data-rate=".75">${ic("slow")} Slowly</button></div><textarea id="ddict" placeholder="Type what you hear" spellcheck="false" style="margin-top:12px"></textarea><button class="btn pri block" data-act="ddict" style="margin-top:8px">Check</button></div>`; }
    return "";
  }

  /* Speak tab */
  function viewSpeak() {
    const ts = targetLvl(th("speak")), kinds = [["strategy", "Survival strategies"], ["spoken", "How French people really talk"], ["grammar", "Grammar for speaking"]];
    const talks = (db.talks || []).slice(-8);
    return `<h1 style="margin-top:10px">Speak</h1><p class="ink2" style="margin:0 2px">The only way to speak fast is to speak a lot. Out loud, every day.</p>
      <a class="item" href="#/talk" style="margin-top:14px">${circ("timer", "var(--red)")}<div class="grow"><div class="t">Talk for one minute</div><div class="m">${talks.length ? `Last: ${talks[talks.length - 1].wpm} words a minute` : "Answer a question non-stop, track your fluency"}</div></div>${ic("chev")}</a>
      <div class="sec"><div class="eyebrow">Role plays · your level ${ts}</div>${["daily", "social", "dating"].map(t => C.scenarios.filter(s => s.theme === t).sort((a, b) => lvlNum(a.lvl) - lvlNum(b.lvl)).map(s => `<a class="item ${db.scen[s.id] ? "done" : ""}" href="#/sc/${s.id}">${circ(t === "dating" ? "star" : t === "social" ? "chat" : "bolt", t === "dating" ? "var(--red)" : t === "social" ? "var(--blue)" : "var(--green)")}<div class="grow"><div class="t">${esc(s.title)}</div><div class="m">${s.lvl} · ${esc(THEMES[t])}</div></div>${db.scen[s.id] ? `<span class="pill green">${db.scen[s.id].best}/${s.turns.length}</span>` : ""}</a>`).join("")).join("")}</div>
      ${kinds.map(([k, n]) => `<div class="sec"><div class="eyebrow">${n}</div>${C.lessons.filter(l => l.kind === k).sort((a, b) => lvlNum(a.lvl) - lvlNum(b.lvl)).map(l => `<a class="item ${db.les[l.id] ? "done" : ""}" href="#/lesson/${l.id}">${circ("book", "var(--gold)")}<div class="grow"><div class="t">${esc(l.title)}</div><div class="m">${l.lvl}${(db.diag?.weak || []).some(t => (l.focus || []).includes(t)) ? " · <b style='color:var(--red)'>your weak spot</b>" : ""}</div></div>${db.les[l.id] ? `<span class="pill green">${ic("check")}</span>` : ""}</a>`).join("")}</div>`).join("")}`;
  }

  /* Scenario */
  let sv = null;
  function viewScenario(id) {
    const s = scen(id); if (!s) return `<p>Not found.</p>`;
    if (!sv || sv.id !== id) sv = { id, i: 0, tries: 0, log: [], pass: 0, phase: "intro", show: {} };
    const top = `${stepTop()}<div class="eyebrow">${s.lvl} · ${esc(THEMES[s.theme])} · role play</div><h1 style="font-size:27px">${esc(s.title)}</h1>`;
    if (sv.phase === "intro") return top + `<div class="card"><p class="ink2" style="margin:0">${esc(s.setup)}</p><p class="small muted" style="margin:10px 0 0">You're talking with ${esc(s.partner.name)}, ${esc(s.partner.role[0].toLowerCase() + s.partner.role.slice(1))}. You'll see what to say in English; say it your own way in French. Any natural answer works.</p></div><button class="btn pri block" data-act="scstart" style="margin-top:14px">Start the conversation</button>`;
    const chat = sv.log.map((m, k) => m.me ? `<div class="bub me">${esc(m.t)}</div>` : `<div class="bub" data-act="scshow" data-v="${k}"><div class="who">${esc(s.partner.name)}</div><div>${esc(m.t)}</div>${sv.show[k] ? `<div class="tr">${esc(m.en || "")}</div>` : ""}</div>`).join("");
    if (sv.phase === "end") {
      if (!sv.saved) { sv.saved = 1; db.scen[id] = { at: now(), best: Math.max(db.scen[id]?.best || 0, sv.pass) }; save(); stepDone(); }
      return top + chat + `<div class="card"><h2>${sv.pass === s.turns.length ? "Parfait." : sv.pass >= s.turns.length * .6 ? "Bien joué." : "Good effort."}</h2><p class="ink2">You got ${sv.pass} of ${s.turns.length} across on your own.</p><p class="ink2" style="margin:0">${esc(s.debrief)}</p>${nextStepBtn()}<button class="btn ghost block" data-act="scagain">Do it again</button></div>`;
    }
    const t = s.turns[sv.i];
    if (sv.phase === "model") return top + chat + `<div class="card"><div class="eyebrow">You could say</div>${t.model.map((m, k) => `<div class="row" style="margin-top:8px"><p class="fr grow" style="margin:0;font-size:19px">${esc(m)}</p><button class="iconbtn" data-act="scsay" data-v="${k}">${ic("play")}</button></div>`).join("")}<p class="small muted" style="margin-top:10px">Say one of them out loud now, then carry on.</p><button class="btn pri block" data-act="scnext">Continue</button></div>`;
    later(() => setAnswer(res => scAnswer(s, t, res)));
    return top + chat + `<div class="card" style="border-color:var(--blue)"><div class="eyebrow">Your turn</div><p style="margin:6px 0 0;font-weight:600">${esc(t.task)}</p>${sv.tries ? `<p class="small" style="color:var(--red);margin:6px 0 0">${esc(sv.msg || "")}</p>` : ""}</div>${answerBox()}<div class="btns" style="justify-content:center"><button class="btn sm" data-act="screplay">${ic("play")} Hear ${esc(s.partner.name)} again</button><button class="btn sm ghost" data-act="schelp">Help</button></div>`;
  }
  function scAnswer(s, t, res) {
    const hits = keyHits(t.keys, res.best).map((h, k) => h || keyHits([t.keys[k]], res.alts.join(" ")).some(Boolean));
    const n = hits.filter(Boolean).length;
    if (n >= (t.need || 1)) { sv.log.push({ me: 1, t: res.best }); sv.pass += sv.tries ? 0 : 1; sv.tries = 0; advanceScenario(s, t); }
    else { sv.tries++; if (sv.tries >= 2) { sv.log.push({ me: 1, t: res.best }); sv.phase = "model"; render(); }
      else { const miss = t.keys.find((g, k) => !hits[k]); sv.msg = `I heard “${res.best}”. Not quite: try again${miss ? `, maybe with “${miss[0]}”` : ""}.`; render(); } }
  }
  async function advanceScenario(s, t) {
    if (t.react) sv.log.push({ t: t.react, en: "" });
    sv.i++; sv.phase = sv.i >= s.turns.length ? "end" : "turn";
    if (sv.phase === "turn") sv.log.push({ t: s.turns[sv.i].say, en: s.turns[sv.i].en });
    render(); const tok = speakTok;
    if (t.react) { await say(t.react, { g: s.partner.g }); if (tok + 1 !== speakTok) return; }
    if (sv.phase === "turn") say(s.turns[sv.i].say, { g: s.partner.g });
  }

  /* Lesson */
  let lv = null;
  function viewLesson(id, earOnly) {
    const l = les(id); if (!l) return `<p>Not found.</p>`;
    if (!lv || lv.id !== id) lv = { id, card: earOnly ? (l.cards || []).length : 0, d: 0, res: null, trials: null, tr: 0, ok: 0, said: {}, phase: "cards" };
    const top = `${stepTop()}<div class="eyebrow">${l.lvl} · ${{ sound: "Sound", spoken: "Spoken French", grammar: "Grammar for speaking", strategy: "Strategy" }[l.kind]}</div><h1 style="font-size:27px">${esc(l.title)}</h1>`;
    const cards = l.cards || [];
    if (lv.card < cards.length) return top + `<div class="prog"><i style="width:${lv.card / cards.length * 100}%"></i></div><div class="card" style="min-height:180px"><p style="font-size:17px;margin:0">${fmtCard(cards[lv.card])}</p></div><div class="btns" style="justify-content:space-between">${lv.card ? `<button class="btn" data-act="lprev">${ic("back")}</button>` : "<span></span>"}<button class="btn pri" data-act="lnext">${lv.card === cards.length - 1 ? ((l.pairs || []).length ? "Train your ear" : "Practise") : "Next"} ${ic("chev")}</button></div>`;
    const finish = () => { db.les[id] = { at: now(), n: (db.les[id]?.n || 0) + 1 }; if (lv.ok != null) db.les[id].score = lv.ok; save(); stepDone(); };

  fetch("data/content.json").then(r => r.json()).then(d => { C = d; lastV = route().v + "/" + route().a; render();
    try { const sn = +localStorage.getItem("allez-install-snooze") || 0; if (db.diag && !isStandalone() && now() - sn > 7 * DAY && Object.keys(db.log).length >= 2) setTimeout(showInstall, 1500); } catch {} })
    .catch(() => { $("#app").innerHTML = `<p class="center" style="margin-top:40vh">Couldn't load. Check your connection and reload.</p>`; });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.__allez = { scoreRespond, db: () => db, dg: () => dg, plan: () => plan(), norm, align, numFr, estimate, keyHits };
})();
