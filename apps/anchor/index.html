      ...(((n, last) => wd === 0 || wd === 6 || n.getDate() > last - 7)(new Date(), new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate()) ? R.monthly : []).filter(x => !(db.monthLog?.[mk] || {})[x.id]).map(x => ({ ...x, kind: "monthly", key: mk }))];
  }
  const isDone = it => it.kind === "monthly" ? !!(db.monthLog?.[it.key] || {})[it.id] : !!(db.ritualLog[it.key] || {})[it.id];
  let C = null;
  const byMod = m => C.lessons.filter(l => l.module === m);

  /* ---------- PIN lock: a privacy curtain, not encryption ---------- */
  const pinHash = pin => String([..."anchor:" + pin].reduce((a, c) => (Math.imul(31, a) + c.charCodeAt(0)) | 0, 7));
  let unlocked = false, pinBuf = "", pinFirst = "", hiddenAt = 0;
  const locked = () => !!db.pin && !unlocked;
  addEventListener("visibilitychange", () => { if (document.hidden) hiddenAt = Date.now(); else if (db.pin && unlocked && Date.now() - hiddenAt > 60000) { unlocked = false; pinBuf = ""; render(); } });
  const keypad = (msg, sub) => `<div class="lock"><div class="eyebrow">Anchor</div><h1 style="margin-top:8px">${msg}</h1><p class="muted" style="margin:6px 0 0">${sub}</p>
    <div class="pindots">${[0, 1, 2, 3].map(i => `<i class="${i < pinBuf.length ? "on" : ""}"></i>`).join("")}</div>
    <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "del"].map(k => k === "" ? "<span></span>" : `<button data-act="pinkey" data-v="${k}" aria-label="${k === "del" ? "Delete" : k}">${k === "del" ? ic("back") : k}</button>`).join("")}</div></div>`;
  function viewLock() { return keypad("Enter PIN", "") + `<div class="center" style="margin-top:20px"><button class="linkbtn small" data-act="pinforgot">Forgot the PIN?</button></div>`; }
  function viewPinSet() {
    const first = !db.pinAsked;
    return `${first ? "" : `<div class="top">${backLink("#/settings", "Settings")}</div>`}` + keypad(pinFirst ? "Repeat the PIN" : "Choose a 4-digit PIN", pinFirst ? "To be sure." : "The app will ask for it each time it opens, and after a minute away.")
      + (first ? `<div class="center" style="margin-top:18px"><button class="linkbtn small" data-act="pinskip">Skip for now</button></div>` : "");
  }
  function pinKey(k) {
    if (k === "del") pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 4) pinBuf += k;
    if (pinBuf.length < 4) return render();
    const e = pinBuf; pinBuf = "";
    if (locked()) { if (pinHash(e) === db.pin) unlocked = true; else toast("Wrong PIN"); return render(); }
    if (!pinFirst) { pinFirst = e; return render(); }
    if (e !== pinFirst) { pinFirst = ""; toast("They didn’t match. Try again."); return render(); }
    db.pin = pinHash(e); db.pinAsked = true; pinFirst = ""; unlocked = true; save(); toast("PIN set"); location.hash = "#/"; render();
  }

  /* ---------- Routing ---------- */
  let lastHash = "";
  const route = () => { const p = (location.hash || "#/").slice(2).split("/"); return { v: p[0] || "today", a: p[1], b: p[2] }; };
  const backLink = (href, label) => `<a class="back" href="${href}">${ic("back")}${label}</a>`;
  function render() {
    if (!C) return;
    const { v, a, b } = route(), h = location.hash || "#/", nav = h !== lastHash;
    let html;
    if (locked()) html = viewLock(); else if (!db.pinAsked || v === "pin") html = viewPinSet();
    else if (v === "learn") html = a ? viewModule(a) : viewLearn(); else if (v === "l") html = viewLesson(a, +b || 0);
    else if (v === "her") html = viewHer(a); else if (v === "scene") html = viewScene(a); else if (v === "before") html = viewBefore();
    else if (v === "journal") html = viewJournal(); else if (v === "g") html = viewGuide(a); else if (v === "start") html = viewStart(); else if (v === "words") html = viewWords(); else if (v === "debrief") html = viewDebrief(a); else if (v === "settings") html = viewSettings();
    else html = viewToday();
    $("#main").innerHTML = `<div class="view${nav ? " enter" : ""}">${html}</div>`;
    const t = $("#tabs"); t.hidden = locked() || !db.pinAsked || v === "pin";
    const cur = { l: "learn", g: "learn", start: "today", words: "learn", scene: "her", before: "her", debrief: "journal", settings: "today" }[v] || v;
    t.innerHTML = [["today", "anchor", "Today"], ["learn", "book", "Learn"], ["her", "heart", "Her"], ["journal", "pen", "Journal"]].map(([k, i, l]) => `<a href="#/${k === "today" ? "" : k}" class="${cur === k ? "on" : ""}">${ic(i)}${l}</a>`).join("");
    if (nav) scrollTo(0, 0); lastHash = h;
  }
  addEventListener("hashchange", render);

  /* ---------- Beginner how-tos ---------- */
  const howPrompt = t => (C.howto?.prompts || []).find(h => h.text === t);
  const howPractice = id => (C.howto?.practice || []).find(h => h.lesson === id);
  const guide = id => (C.guides || []).find(g => g.id === id);
  const howBox = (h, open) => !h ? "" : `<details class="how"${open ? " open" : ""}><summary>${ic("list")} How to do this</summary><ol>${h.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
    ${h.say ? `<p class="sayline">${esc(h.say)}</p>` : ""}${h.guide && guide(h.guide) ? `<a class="btn sm" href="#/g/${h.guide}">Full guide: ${esc(guide(h.guide).title)} ${ic("chev")}</a>` : ""}</details>`;
  const pathDone = () => PATH.flatMap(([, ids]) => ids).filter(id => db.guides?.[id]).length;
  const pathTotal = () => PATH.flatMap(([, ids]) => ids).filter(id => guide(id)).length;
  function viewStart() {
    const d = pathDone(), t = pathTotal();
    return `<div class="top">${backLink("#/", "Today")}</div><h1 style="margin:6px 2px 6px">Start here</h1>
      <p class="muted" style="margin:0 2px 14px">A four-week path for a new dominant. One or two guides a few times a week. Do each one for real with her, then tick it. ${d} of ${t} done.</p>
      ${PATH.map(([wk, ids]) => `<div class="sec"><div class="eyebrow">${wk}</div>${ids.filter(guide).map(id => { const g = guide(id); return `<a class="item" href="#/g/${id}"><span class="dot${db.guides?.[id] ? " on" : ""}">${db.guides?.[id] ? ic("check") : ""}</span><div class="grow"><div class="t">${esc(g.title)}</div><div class="m">${esc(g.time || "")}${g.time ? " · " : ""}${esc(g.why)}</div></div>${ic("chev")}</a>`; }).join("")}</div>`).join("")}
      <a class="btn block" href="#/words" style="margin-top:20px">${ic("book")} Words you’ll hear: the glossary</a>`;
  }
  function viewGuide(id) {

    return `<div class="top">${backLink("#/start", "Start here")}<span class="small muted">${esc(g.time || "")}</span></div><h1 style="margin:6px 2px 8px;font-size:29px">${esc(g.title)}</h1>

      <div class="card" style="border-color:rgba(127,207,154,.35)"><div class="eyebrow" style="color:var(--green)">How you know it went well</div><p style="margin:8px 0 0">${esc(g.good)}</p></div>
      <button class="btn gold block" data-act="guidedone" data-v="${g.id}" style="margin-top:16px">${ic("check")} ${db.guides?.[g.id] ? "Done" : "I did this"}</button>`;
  }
  function viewWords() {
    const G = [...(C.glossary || [])].sort((a, b) => a.t.localeCompare(b.t));

      <input type="text" id="gq" placeholder="Search a word" autocomplete="off"><div class="card" style="margin-top:12px;padding:4px 18px" id="glist">${G.map(x => `<div class="note gw"><b>${esc(x.t)}</b><div class="small" style="margin-top:3px;color:var(--ink2)">${esc(x.d)}</div></div>`).join("")}</div>`;
  }

  /* ---------- Today ---------- */
  function viewToday() {
    const d = Math.floor(Date.now() / DAY), prompt = C.prompts[d % C.prompts.length];
    const next = C.lessons.find(l => !db.lessons[l.id]) || C.lessons[d % C.lessons.length];
    
    const recent = db.scenes.filter(s => s.at && s.at > Date.now() - 3 * DAY && !s.followed);
    const neg = db.negotiated ? Math.floor((Date.now() - db.negotiated) / DAY) : null;
    const yes = Object.values(db.limits).filter(x => x === "y").length;
    return `<div class="top"><div class="eyebrow">Anchor</div><a class="iconbtn" href="#/settings" aria-label="Settings">${ic("gear")}</a></div>
      <div class="card" style="margin-top:6px;background:radial-gradient(120% 140% at 100% 0%, rgba(217,178,111,.18), transparent 55%), linear-gradient(180deg, var(--card2), var(--card))"><div class="eyebrow" style="color:var(--gold)">From the old hand</div><p class="prompt" style="margin:10px 0 0">${esc(prompt)}</p>${howBox(howPrompt(prompt))}</div>
      ${(C.guides || []).length && pathDone() < pathTotal() ? `<a class="item" href="#/start" style="margin-top:12px;border-color:rgba(217,178,111,.4)">${modIc("foundations")}<div class="grow"><div class="t">Start here: your first four weeks</div><div class="m">${pathDone()} of ${pathTotal()} steps · step by step, with words to say</div></div>${ic("chev")}</a>` : ""}
      ${recent.map(s => `<div class="card" style="border-color:rgba(127,207,154,.4)"><div class="eyebrow" style="color:var(--green)">Aftercare window</div><p style="margin:8px 0 10px">Your scene “${esc(s.title || "untitled")}” ${(h => h < 1 ? "ended just now" : h < 48 ? `was ${h} hour${h === 1 ? "" : "s"} ago` : `was ${Math.round(h / 24)} days ago`)(Math.round((Date.now() - s.at) / 36e5))}. Drop can come a day or two later. Check in with her today, gently.</p>
        <div class="row" style="gap:8px"><button class="btn sm gold" data-act="followed" data-v="${s.id}">${ic("check")} I checked in</button><a class="btn sm" href="#/debrief/${s.id}">Debrief</a></div></div>`).join("")}
      ${(() => { const D = dueToday(); if (!D.length) return `<a class="item" href="#/her/rhythm" style="margin-top:12px">${modIc("care")}<div class="grow"><div class="t">Set up your rhythm</div><div class="m">Daily, weekly and monthly. A beginner template is ready.</div></div>${ic("chev")}</a>`;
        const n = D.filter(isDone).length; return `<div class="sec"><div class="row between" style="margin:0 4px 10px"><div class="eyebrow">Today’s rhythm</div><a class="small" href="#/her/rhythm" style="color:var(--muted);text-decoration:none">${n}/${D.length} · edit</a></div><div class="card" style="padding:6px 18px">${D.map(it => `<div class="row"><button class="check${isDone(it) ? " on" : ""}" data-act="rdone" data-v="${it.id}" data-k="${it.kind}" data-key="${it.key}" style="flex:1"><span class="box">${isDone(it) ? ic("check") : ""}</span><span class="lbl grow">${esc(it.text)}${it.kind !== "daily" ? ` <span class="tag ${it.kind === "weekly" ? "y" : "m"}">${it.kind}</span>` : ""}</span></button>${it.guide && guide(it.guide) ? `<a class="iconbtn" href="#/g/${it.guide}" aria-label="How to">${ic("list")}</a>` : ""}</div>`).join("")}</div></div>`; })()}
      <div class="sec"><div class="eyebrow">Learn today</div><a class="item" href="#/l/${next.id}/0">${modIc(next.module)}<div class="grow"><div class="t">${esc(next.title)}</div><div class="m">${esc(next.hook)}</div></div>${ic("chev")}</a></div>
      <div class="sec"><div class="eyebrow">The dynamic</div>
        <a class="item" href="#/before">${modIc("scenes")}<div class="grow"><div class="t">Before a scene</div><div class="m">The two-minute check</div></div>${ic("chev")}</a>
        <a class="item" href="#/her/limits">${modIc("negotiation")}<div class="grow"><div class="t">Her yes / maybe / no</div><div class="m">${yes ? `${yes} yeses` : "Not filled in yet"}${neg != null ? ` · negotiated ${neg} days ago` : ""}</div></div>${ic("chev")}</a>
        ${neg != null && neg > 90 ? `<div class="warnbox" style="margin-top:10px">It has been ${neg} days since you last went through her list together. People change; renegotiate.</div>` : ""}</div>
      ${isStandalone() ? "" : `<button class="item" data-act="installsheet" style="margin-top:22px">${modIc("self")}<div class="grow"><div class="t">Install on your phone</div><div class="m">Opens in one tap, behind your PIN.</div></div></button>`}`;
  }

  /* ---------- Learn ---------- */
  function viewLearn() {
    const r = C.lessons.filter(l => db.lessons[l.id]).length;
    return `<h1 style="margin:8px 2px 6px">Learn</h1><p class="muted" style="margin:0 2px 16px">${r} of ${C.lessons.length} lessons. Short, practical, from someone who has made the mistakes so you don’t have to.</p>
      ${(C.guides || []).length ? `<div class="row" style="gap:10px;margin-bottom:14px"><a class="btn gold" href="#/start" style="flex:1">${ic("list")} Step-by-step guides</a><a class="btn" href="#/words">${ic("book")} Glossary</a></div>` : ""}
      <div class="mods">${Object.entries(MODS).map(([k, [n, i, col, sub]]) => { const ls = byMod(k), d = ls.filter(l => db.lessons[l.id]).length;
        return `<a class="mod" href="#/learn/${k}" style="background:linear-gradient(160deg, ${col}24, var(--card) 60%);color:${col}">${ic(i)}<div><b style="color:var(--ink)">${n}</b><br><small>${sub}</small></div><small style="color:var(--muted)">${d}/${ls.length}</small><span class="bar" style="width:${ls.length ? d / ls.length * 100 : 0}%"></span></a>`; }).join("")}</div>`;
  }
  function viewModule(m) {
    const [n, , , sub] = MODS[m] || []; if (!n) { location.hash = "#/learn"; return ""; }
    return `<div class="top">${backLink("#/learn", "Learn")}</div><div class="row" style="gap:14px;margin:6px 2px 18px">${modIc(m, 54)}<div><h1 style="font-size:29px">${n}</h1><div class="muted small">${sub}</div></div></div>
      ${byMod(m).map(l => `<a class="item" href="#/l/${l.id}/0"><span class="dot${db.lessons[l.id] ? " on" : ""}">${db.lessons[l.id] ? ic("check") : ""}</span><div class="grow"><div class="t">${esc(l.title)}</div><div class="m">${esc(l.hook)}</div></div>${ic("chev")}</a>`).join("")}`;
  }
  function viewLesson(id, i) {
    const l = C.lessons.find(x => x.id === id); if (!l) { location.hash = "#/learn"; return ""; }
    const n = l.cards.length, base = `#/l/${l.id}`;
    const head = `<div class="top">${backLink(`#/learn/${l.module}`, MODS[l.module][0])}</div><h2 style="margin:4px 2px 0">${esc(l.title)}</h2><div class="pips">${[...l.cards, 0].map((_, j) => `<i class="${j <= i ? "on" : ""}"></i>`).join("")}</div>`;
    if (i < n) return head + `<div class="card lesson-card"><p>${esc(l.cards[i])}</p></div><div class="row" style="gap:10px;margin-top:14px">${i ? `<a class="btn" href="${base}/${i - 1}">${ic("back")}</a>` : ""}<a class="btn gold" href="${base}/${i + 1}" style="flex:1">Next ${ic("chev")}</a></div>`;

  /* ---------- Her: limits, safewords, aftercare, little space, rules, rituals, rewards, consequences, scenes ---------- */
  const listEditor = (key, title, ph, why) => `<div class="card">${db[key].length ? db[key].map(r => `<div class="rule"><div class="grow"><div>${esc(r.text)}</div>${r.why ? `<div class="w">${esc(r.why)}</div>` : ""}${r.agreed === false ? `<div class="w" style="color:var(--amber)">Not yet agreed with her</div>` : ""}</div><button class="iconbtn" data-act="del" data-k="${key}" data-v="${r.id}" aria-label="Delete">${ic("x")}</button></div>`).join("") : `<p class="muted small" style="margin:0">None yet.</p>`}
    <input type="text" id="new-${key}" placeholder="${esc(ph)}" style="margin-top:12px">${why ? `<input type="text" id="why-${key}" placeholder="${esc(why)}" style="margin-top:8px">` : ""}
    <button class="btn block" data-act="add" data-k="${key}" style="margin-top:10px">${ic("plus")} Add</button></div>`;
  function viewHer(sec) {
    const nav = (href, icn, mod, t, m) => `<a class="item" href="${href}">${modIc(mod)}<div class="grow"><div class="t">${t}</div><div class="m">${m}</div></div>${ic("chev")}</a>`;
    if (!sec) { const yes = Object.values(db.limits).filter(x => x === "y").length, no = Object.values(db.limits).filter(x => x === "n").length;
      return `<h1 style="margin:8px 2px 6px">Her</h1><p class="muted" style="margin:0 2px 16px">What you have agreed together, in one place. Fill it in with her, not about her.</p>
        ${nav("#/her/limits", "scale", "negotiation", "Yes / maybe / no", `${yes} yes · ${no} no`)}${nav("#/her/safe", "shield", "negotiation", "Safewords and signals", `${esc(db.safe.stop)} stops everything`)}
        ${nav("#/her/after", "blanket", "aftercare", "Aftercare she needs", db.aftercare.length ? db.aftercare.slice(0, 3).join(", ") : "Not set")}${nav("#/her/little", "heart", "care", "Her little space", "Comforts, bedtime, signs")}
        ${nav("#/her/rules", "list", "care", "Rules", `${db.rules.length} rule${db.rules.length === 1 ? "" : "s"}`)}${nav("#/her/rhythm", "moon", "care", "Rhythm", `${rh().daily.length} daily · ${rh().weekly.length} weekly · ${rh().monthly.length} monthly`)}
        ${nav("#/her/rewards", "star", "care", "Rewards and consequences", `${db.rewards.length} rewards · ${db.conseq.length} consequences`)}
        ${nav("#/scene/new", "star", "scenes", "Plan a scene", `${db.scenes.length} planned`)}${nav("#/her/checkin", "chat", "foundations", "Check-in questions", "Weekly, ten minutes")}`; }
    const head = (t, sub) => `<div class="top">${backLink("#/her", "Her")}</div><h1 style="margin:6px 2px 6px;font-size:29px">${t}</h1>${sub ? `<p class="muted" style="margin:0 2px 14px">${sub}</p>` : ""}`;
    const gl = id => guide(id) ? `<a class="btn sm" href="#/g/${id}" style="margin:0 2px 14px">${ic("list")} How to do this: ${esc(guide(id).title)}</a>` : "";
    if (sec === "limits") return head("Yes / maybe / no", "Go through it together. Maybe means talk first, never “maybe in the moment”. Anything unmarked is a no until discussed.")
      + gl("the-list") + `${ACTS.map(([cat, items]) => `<div class="sec"><div class="eyebrow">${cat}</div><div class="card" style="padding:4px 16px">${items.map(it => { const v = db.limits[it] || (cat.startsWith("Firm no") ? "n" : "");
          return `<div class="limit"><span class="grow">${esc(it)}</span>${cat.startsWith("Firm no") ? `<span class="tag n">No</span>` : `<span class="ymn">${["y", "m", "n"].map(x => `<button class="${x}${v === x ? " on" : ""}" data-act="lim" data-v="${esc(it)}" data-x="${x}">${x === "y" ? "Yes" : x === "m" ? "?" : "No"}</button>`).join("")}</span>`}</div>`; }).join("")}</div></div>`).join("")}
        <label class="f"><span>Notes from the conversation</span><textarea data-f="limitNote" placeholder="Details, conditions, things to revisit.">${esc(db.limitNote || "")}</textarea></label>
        <button class="btn gold block" data-act="negotiated" style="margin-top:14px">${ic("check")} We went through this together today</button>
        ${db.negotiated ? `<p class="small muted center" style="margin-top:8px">Last negotiated ${dstr(db.negotiated)}</p>` : ""}`;
    if (sec === "safe") return head("Safewords and signals", "Agree them out loud, and use them in a low-stakes moment so they feel normal. Honour them instantly, without sulking.")
      + gl("safewords") + `<div class="card">${[["stop", "Stop everything"], ["slow", "Slow down / check in"], ["go", "All good, more"], ["signal", "Non-verbal signal (when she can’t speak)"]].map(([k, l]) => `<label class="f" style="margin-top:${k === "stop" ? 0 : 14}px"><span>${l}</span><input type="text" data-safe="${k}" value="${esc(db.safe[k])}"></label>`).join("")}</div>
        <div class="warnbox" style="margin-top:12px">A safeword is never a failure. Thank her for using it, then care for her first and talk later.</div>`;
    if (sec === "after") return head("Aftercare she needs", "Ask her, then watch what actually helps. Needs change with the scene and the day.")
      + gl("aftercare-first") + `<div class="card"><div class="chips">${AFTER.map(a => `<button class="chip${db.aftercare.includes(a) ? " on" : ""}" data-act="ac" data-v="${esc(a)}">${a}</button>`).join("")}</div>
        <label class="f"><span>Details</span><textarea data-f="aftercareNote" placeholder="e.g. likes to be wrapped up and talked to softly; needs a text the next afternoon.">${esc(db.aftercareNote)}</textarea></label></div>

  /* ---------- Scenes: built only from her yes list ---------- */
  let sdraft = null, wday = new Date().getDay();
  function viewScene(id) {

  /* ---------- Install ---------- */

  function installBody() {
    if (deferredInstall) return `<button class="btn gold block" data-act="install">Install Anchor</button>`;
    if (inApp) return `<p class="small">Open this link in ${isIOS ? "Safari" : "Chrome"} first, from the menu; apps like Messenger cannot install.</p>`;
    if (isIOS) return `<ol class="steps"><li>Tap <b>Share</b> in Safari.</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>`;

    else if (a === "pinoff") { if (!confirm("Remove the PIN?")) return; db.pin = null; save(); render(); }
    else if (a === "lessondone") { db.lessons[v] = Date.now(); save(); const l = C.lessons.find(x => x.id === v); toast("Noted."); location.hash = `#/learn/${l.module}`; }
    else if (a === "lim") { const x = el.dataset.x; db.limits[v] = db.limits[v] === x ? "" : x; save(); el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.x === db.limits[v])); }
    else if (a === "negotiated") { db.negotiated = Date.now(); save(); toast("Saved. Renegotiate every few months."); render(); }
    else if (a === "ac") { const i = db.aftercare.indexOf(v); i < 0 ? db.aftercare.push(v) : db.aftercare.splice(i, 1); save(); el.classList.toggle("on"); }

    else if (a === "del") { const k = el.dataset.k; if (!confirm("Delete this?")) return; db[k] = db[k].filter(x => x.id !== v); save(); render(); }

    else if (a === "rdone") { const k = el.dataset.k, key = el.dataset.key; if (k === "monthly") { db.monthLog ||= {}; db.monthLog[key] ||= {}; db.monthLog[key][v] = !db.monthLog[key][v]; } else { db.ritualLog[key] ||= {}; db.ritualLog[key][v] = !db.ritualLog[key][v]; } save(); render(); }

    else if (a === "radd") { const k = el.dataset.k, inp = $(`#rh-${k}`), t = inp.value.trim(); if (!t) return toast("Write it first"); rh()[k].push({ id: uid(), text: t, ...(k === "weekly" ? { day: wday } : {}) }); save(); render(); }
    else if (a === "rwd") { wday = +v; el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === el)); }
    else if (a === "rdel") { if (!confirm("Remove this from your rhythm?")) return; const R = rh(); R[el.dataset.k] = R[el.dataset.k].filter(x => x.id !== v); save(); render(); }
    else if (a === "ritual") { const k = dayKey(); db.ritualLog[k] ||= {}; db.ritualLog[k][v] = !db.ritualLog[k][v]; save(); render(); }

    else if (a === "sact") { const i = sdraft.acts.indexOf(v); i < 0 ? sdraft.acts.push(v) : sdraft.acts.splice(i, 1); render(); }
    else if (a === "skit") { const i = sdraft.kit.indexOf(v); i < 0 ? sdraft.kit.push(v) : sdraft.kit.splice(i, 1); render(); }

    else if (a === "scenedone") { const s = db.scenes.find(x => x.id === v); s.at = Date.now(); s.followed = false; save(); sdraft = null; toast("Aftercare window open. Today will remind you."); location.hash = "#/"; }
    else if (a === "delscene") { if (!confirm("Delete this plan?")) return; db.scenes = db.scenes.filter(x => x.id !== v); sdraft = null; save(); location.hash = "#/her"; }
    else if (a === "followed") { const s = db.scenes.find(x => x.id === v); if (s) s.followed = true; save(); toast("Good. That is the job."); render(); }
    else if (a === "savedeb") { const s = db.scenes.find(x => x.id === v); db.debriefs.push({ id: uid(), at: Date.now(), title: s?.title || "", good: $("#dgood").value.trim(), change: $("#dchange").value.trim(), hers: $("#dhers").value.trim(), me: $("#dme").value.trim() }); if (s) s.followed = true; save(); location.hash = "#/journal"; }
    else if (a === "deldeb") { if (!confirm("Delete this entry?")) return; db.debriefs = db.debriefs.filter(x => x.id !== v); save(); render(); }
    else if (a === "tog") { el.classList.toggle("on"); el.querySelector(".box").innerHTML = el.classList.contains("on") ? ic("check") : ""; }
    else if (a === "export") { const t = JSON.stringify(db); navigator.clipboard?.writeText(t).then(() => toast("Backup copied. Keep it private."), () => prompt("Copy:", t)); }
    else if (a === "wipe") { if (!confirm("Erase everything in Anchor on this phone?")) return; localStorage.removeItem(KEY); location.hash = "#/"; location.reload(); }
    else if (a === "installsheet") showInstall();
    else if (a === "closesheet") $(".sheet-back")?.remove();
    else if (a === "install" && deferredInstall) { const ev = deferredInstall; deferredInstall = null; ev.prompt(); ev.userChoice.finally(() => $(".sheet-back")?.remove()); }
  });
  document.addEventListener("input", e => {
    const el = e.target;
    if (el.id === "gq") { const q = el.value.toLowerCase(); document.querySelectorAll(".gw").forEach(n => n.hidden = !n.textContent.toLowerCase().includes(q)); return; }
    if (el.dataset.f) { db[el.dataset.f] = el.value; save(); }
    if (el.dataset.safe) { db.safe[el.dataset.safe] = el.value; save(); }
    if (el.dataset.little) { db.little[el.dataset.little] = el.value; save(); }
    if (el.dataset.s && sdraft) sdraft[el.dataset.s] = el.value;
  });

  fetch("data/content.json").then(r => r.json()).then(d => { C = d; render(); })
    .catch(() => { $("#main").innerHTML = `<div class="loading">Could not load. Check your connection and reload.</div>`; });
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
</html>
