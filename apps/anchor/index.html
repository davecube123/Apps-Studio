  /* ---------- Learn ---------- */

      ${(C.guides || []).length ? `<div class="row" style="gap:10px;margin-bottom:14px"><a class="btn gold" href="#/start" style="flex:1">${ic("list")} Step-by-step guides</a><a class="btn" href="#/words">${ic("book")} Glossary</a></div>` : ""}
      <div class="mods">${Object.entries(MODS).map(([k, [n, i, col, sub]]) => { const ls = byMod(k), d = ls.filter(l => db.lessons[l.id]).length;
        return `<a class="mod" href="#/learn/${k}" style="background:linear-gradient(160deg, ${col}24, var(--card) 60%);color:${col}">${ic(i)}<div><b style="color:var(--ink)">${n}</b><br><small>${sub}</small></div><small style="color:var(--muted)">${d}/${ls.length}</small><span class="bar" style="width:${ls.length ? d / ls.length * 100 : 0}%"></span></a>`; }).join("")}</div>`;

      ${byMod(m).map(l => `<a class="item" href="#/l/${l.id}/0"><span class="dot${db.lessons[l.id] ? " on" : ""}">${db.lessons[l.id] ? ic("check") : ""}</span><div class="grow"><div class="t">${esc(l.title)}</div><div class="m">${esc(l.hook)}</div></div>${ic("chev")}</a>`).join("")}`;
  }
  function viewLesson(id, i) {
    const l = C.lessons.find(x => x.id === id); if (!l) { location.hash = "#/learn"; return ""; }
    const n = l.cards.length, base = `#/l/${l.id}`;

    if (i < n) return head + `<div class="card lesson-card"><p>${esc(l.cards[i])}</p></div><div class="row" style="gap:10px;margin-top:14px">${i ? `<a class="btn" href="${base}/${i - 1}">${ic("back")}</a>` : ""}<a class="btn gold" href="${base}/${i + 1}" style="flex:1">Next ${ic("chev")}</a></div>`;
    return head + `<div class="card keep">“${esc(l.remember)}”</div>
      <div class="card"><div class="eyebrow" style="color:var(--gold)">This week</div><p style="margin:8px 0 0;font-weight:600">${esc(l.practice)}</p>${howBox(howPractice(l.id), true)}</div>
      <div class="card"><div class="eyebrow">Ask</div><p style="margin:8px 0 0;font:italic 500 17px/1.5 var(--display)">${esc(l.ask)}</p></div>
      <button class="btn gold block" data-act="lessondone" data-v="${l.id}" style="margin-top:16px">${ic("check")} ${db.lessons[l.id] ? "Done" : "Understood"}</button>`;
  }

  /* ---------- Her: limits, safewords, aftercare, little space, rules, rituals, rewards, consequences, scenes ---------- */
  const listEditor = (key, title, ph, why) => `<div class="card">${db[key].length ? db[key].map(r => `<div class="rule"><div class="grow"><div>${esc(r.text)}</div>${r.why ? `<div class="w">${esc(r.why)}</div>` : ""}${r.agreed === false ? `<div class="w" style="color:var(--amber)">Not yet agreed with her</div>` : ""}</div><button class="iconbtn" data-act="del" data-k="${key}" data-v="${r.id}" aria-label="Delete">${ic("x")}</button></div>`).join("") : `<p class="muted small" style="margin:0">None yet.</p>`}
    <input type="text" id="new-${key}" placeholder="${esc(ph)}" style="margin-top:12px">${why ? `<input type="text" id="why-${key}" placeholder="${esc(why)}" style="margin-top:8px">` : ""}
    <button class="btn block" data-act="add" data-k="${key}" style="margin-top:10px">${ic("plus")} Add</button></div>`;
  function viewHer(sec) {
    const nav = (href, icn, mod, t, m) => `<a class="item" href="${href}">${modIc(mod)}<div class="grow"><div class="t">${t}</div><div class="m">${m}</div></div>${ic("chev")}</a>`;
    if (!sec) { const yes = Object.values(db.limits).filter(x => x === "y").length, no = Object.values(db.limits).filter(x => x === "n").length;

        ${nav("#/her/after", "blanket", "aftercare", "Aftercare she needs", db.aftercare.length ? db.aftercare.slice(0, 3).join(", ") : "Not set")}${nav("#/her/little", "heart", "care", "Her little space", "Comforts, bedtime, signs")}
        ${nav("#/her/rules", "list", "care", "Rules", `${db.rules.length} rule${db.rules.length === 1 ? "" : "s"}`)}${nav("#/her/rhythm", "moon", "care", "Rhythm", `${rh().daily.length} daily · ${rh().weekly.length} weekly · ${rh().monthly.length} monthly`)}

        ${nav("#/her/rewards", "star", "care", "Rewards and consequences", `${db.rewards.length} rewards · ${db.conseq.length} consequences`)}
        ${nav("#/scene/new", "star", "scenes", "Plan a scene", `${db.scenes.length} planned`)}${nav("#/her/checkin", "chat", "foundations", "Check-in questions", "Weekly, ten minutes")}`; }
    const head = (t, sub) => `<div class="top">${backLink("#/her", "Her")}</div><h1 style="margin:6px 2px 6px;font-size:29px">${t}</h1>${sub ? `<p class="muted" style="margin:0 2px 14px">${sub}</p>` : ""}`;
    const gl = id => guide(id) ? `<a class="btn sm" href="#/g/${id}" style="margin:0 2px 14px">${ic("list")} How to do this: ${esc(guide(id).title)}</a>` : "";
    if (sec === "limits") return head("Yes / maybe / no", "Go through it together. Maybe means talk first, never “maybe in the moment”. Anything unmarked is a no until discussed.")
      + gl("the-list") + `${ACTS.map(([cat, items]) => `<div class="sec"><div class="eyebrow">${cat}</div><div class="card" style="padding:4px 16px">${items.map(it => { const v = db.limits[it] || (cat.startsWith("Firm no") ? "n" : "");
          return `<div class="limit"><span class="grow">${esc(it)}</span>${cat.startsWith("Firm no") ? `<span class="tag n">No</span>` : `<span class="ymn">${["y", "m", "n"].map(x => `<button class="${x}${v === x ? " on" : ""}" data-act="lim" data-v="${esc(it)}" data-x="${x}">${x === "y" ? "Yes" : x === "m" ? "?" : "No"}</button>`).join("")}</span>`}</div>`; }).join("")}</div></div>`).join("")}
        <label class="f"><span>Notes from the conversation</span><textarea data-f="limitNote" placeholder="Details, conditions, things to revisit.">${esc(db.limitNote || "")}</textarea></label>
        <button class="btn gold block" data-act="negotiated" style="margin-top:14px">${ic("check")} We went through this together today</button>
        ${db.negotiated ? `<p class="small muted center" style="margin-top:8px">Last negotiated ${dstr(db.negotiated)}</p>` : ""}`;
    if (sec === "safe") return head("Safewords and signals", "Agree them out loud, and use them in a low-stakes moment so they feel normal. Honour them instantly, without sulking.")
      + gl("safewords") + `<div class="card">${[["stop", "Stop everything"], ["slow", "Slow down / check in"], ["go", "All good, more"], ["signal", "Non-verbal signal (when she can’t speak)"]].map(([k, l]) => `<label class="f" style="margin-top:${k === "stop" ? 0 : 14}px"><span>${l}</span><input type="text" data-safe="${k}" value="${esc(db.safe[k])}"></label>`).join("")}</div>
        <div class="warnbox" style="margin-top:12px">A safeword is never a failure. Thank her for using it, then care for her first and talk later.</div>`;
    if (sec === "after") return head("Aftercare she needs", "Ask her, then watch what actually helps. Needs change with the scene and the day.")
      + gl("aftercare-first") + `<div class="card"><div class="chips">${AFTER.map(a => `<button class="chip${db.aftercare.includes(a) ? " on" : ""}" data-act="ac" data-v="${esc(a)}">${a}</button>`).join("")}</div>
        <label class="f"><span>Details</span><textarea data-f="aftercareNote" placeholder="e.g. likes to be wrapped up and talked to softly; needs a text the next afternoon.">${esc(db.aftercareNote)}</textarea></label></div>
        <label class="f"><span>What you need afterwards (your own aftercare)</span><textarea data-f="mine" placeholder="Quiet, a walk, to hear that she’s okay, to write it down.">${esc(db.mine)}</textarea></label>`;
    if (sec === "little") return head("Her little space", "Little space here is rest, play and being looked after. Keep it non-sexual, and keep adult play for when she is fully herself.")
      + gl("little-evening") + `<div class="card">${[["comfort", "Comforts", "Her stuffie’s name, a blanket, a cartoon, colouring"], ["favourites", "Favourite things", "Snacks, songs, games"], ["bedtime", "Bedtime routine", "e.g. brush teeth, story, stuffie, lights at 11"], ["signs", "Signs she’s slipping into little space", "Voice changes, wants to be held, gets giggly"], ["out", "What pulls her out (and how to bring her back gently)", "Work calls, stress, being rushed"]].map(([k, l, ph], i) => `<label class="f" style="${i ? "" : "margin-top:0"}"><span>${l}</span><textarea data-little="${k}" placeholder="${ph}" style="min-height:64px">${esc(db.little[k])}</textarea></label>`).join("")}</div>`;
    if (sec === "rules") return head("Rules", "Few, clear, and each with a reason that serves her. Five good rules beat twenty you can’t keep track of.")
      + gl("first-rules") + (db.rules.length > 6 ? `<div class="warnbox" style="margin-bottom:12px">${db.rules.length} rules. Can you hold all of them consistently? An unenforced rule teaches that rules don’t matter.</div>` : "")
      + listEditor("rules", "Rules", "e.g. Water bottle finished by 6 pm", "Why it helps her (e.g. she forgets to drink and gets headaches)");
    if (sec === "rituals") { location.hash = "#/her/rhythm"; return ""; }
    if (sec === "rhythm") { const R = rh(), empty = !R.daily.length && !R.weekly.length && !R.monthly.length;
      const days = [...Array(14)].map((_, i) => { const t = Date.now() - (13 - i) * DAY, k = dayKey(t), wd = new Date(t).getDay(); const due = R.daily.length + R.weekly.filter(x => +x.day === wd).length; const d = Object.values(db.ritualLog[k] || {}).filter(Boolean).length; return [due ? Math.min(1, d / due) : null, WD[wd][0]]; });
      const chain = x => { const cells = [...Array(14)].map((_, i) => { const t = Date.now() - (13 - i) * DAY, k = dayKey(t); return [k, !!(db.ritualLog[k] || {})[x.id], WD[new Date(t).getDay()][0]]; });
        let st = 0; for (let i = 13; i >= 0; i--) { if (cells[i][1]) st++; else if (i === 13) continue; else break; }
        return `<div class="chain">${cells.map(([k, on, l], i) => `<button class="cc${on ? " on" : ""}${on && cells[i - 1]?.[1] ? " jl" : ""}${on && cells[i + 1]?.[1] ? " jr" : ""}" data-act="cell" data-v="${x.id}" data-key="${k}" aria-label="${k}: ${on ? "done" : "not done"}"><i></i><span>${l}</span></button>`).join("")}</div>${st > 1 ? `<div class="w" style="color:var(--gold)">${st} days in a row</div>` : ""}`; };
      const row = (kind, x) => `<div class="rule"><div class="grow"><div>${esc(x.text)}</div>${kind === "daily" ? chain(x) : ""}<div class="w">${kind === "weekly" ? `Every ${WD[+x.day]}` : kind === "monthly" ? "Once a month" : "Every day"}${x.guide && guide(x.guide) ? ` · <a href="#/g/${x.guide}">how to</a>` : ""}</div></div><button class="iconbtn" data-act="rdel" data-k="${kind}" data-v="${x.id}" aria-label="Delete">${ic("x")}</button></div>`;
      return head("Rhythm", "The small things you do reliably are the dynamic. Few and steady beats many and patchy. Her bad days always come first.")
      + (empty ? `<div class="card" style="border-color:rgba(217,178,111,.4)"><div class="eyebrow" style="color:var(--gold)">Beginner template</div><p class="small" style="margin:8px 0 10px">Daily: good-morning message, a midday check-in text, the bedtime ritual, two minutes of reflection for you. Weekly: a check-in conversation (Sun), a little-space evening (Wed), a connection night (Fri), planning the week (Sun). Monthly: her list again, a review of rules and rituals, something for you.</p>
          <button class="btn gold block" data-act="template">${ic("check")} Use this template</button><p class="small muted" style="margin:8px 0 0">Change anything afterwards. Agree the daily ones with her first.</p></div>`
        : `<div class="card"><div class="eyebrow">Last 14 days</div><div class="cons">${days.map(([f, l]) => `<div><i style="opacity:${f == null ? .12 : .25 + f * .75};background:${f == null ? "var(--line2)" : "var(--gold)"};height:${f == null ? 6 : 8 + f * 26}px"></i><span>${l}</span></div>`).join("")}</div><p class="small muted" style="margin:8px 0 0">Brighter means more of the day’s rhythm kept. Missed days are information, not failure.</p></div>`)
      + `<div class="sec"><div class="eyebrow">Daily</div><div class="card">${R.daily.map(x => row("daily", x)).join("") || `<p class="muted small" style="margin:0">None yet.</p>`}
          <div class="row" style="gap:8px;margin-top:12px"><input type="text" id="rh-daily" placeholder="e.g. Good-night text at 10:30"><button class="btn sm" data-act="radd" data-k="daily">${ic("plus")}</button></div></div></div>
        <div class="sec"><div class="eyebrow">Weekly</div><div class="card">${R.weekly.map(x => row("weekly", x)).join("") || `<p class="muted small" style="margin:0">None yet.</p>`}
          <input type="text" id="rh-weekly" placeholder="e.g. Pancake breakfast together" style="margin-top:12px"><div class="chips" style="margin-top:8px">${WD.map((d, i) => `<button class="chip${wday === i ? " on" : ""}" data-act="rwd" data-v="${i}">${d}</button>`).join("")}</div>
          <button class="btn sm block" data-act="radd" data-k="weekly" style="margin-top:10px">${ic("plus")} Add weekly</button></div></div>
        <div class="sec"><div class="eyebrow">Monthly</div><div class="card">${R.monthly.map(x => row("monthly", x)).join("") || `<p class="muted small" style="margin:0">None yet.</p>`}
          <div class="row" style="gap:8px;margin-top:12px"><input type="text" id="rh-monthly" placeholder="e.g. A whole day out together"><button class="btn sm" data-act="radd" data-k="monthly">${ic("plus")}</button></div></div></div>
        <div class="card small" style="margin-top:16px"><b>How rhythm works for beginners.</b> Start with two daily items for the first two weeks, then add a third. Agree each one with her, out of role. If one keeps slipping, make it smaller rather than scolding yourself or her. On her bad days, drop everything except care.</div>`; }
    if (sec === "stars") { const S = db.stars ||= { n: 0, goal: 10, reward: "", log: [], earned: [] }, full = S.n >= S.goal;
      const quick = [...db.rules.map(r => r.text), ...rh().daily.map(r => r.text)].slice(0, 8);
      return head("Star chart", "Catch her doing well and say so. A star is praise she can see. Stars are never taken away: correction lives elsewhere.")
        + gl("reward-chart") + `<div class="card center"><div class="stars">${[...Array(S.goal)].map((_, i) => `<span class="${i < S.n ? "on" : ""}">★</span>`).join("")}</div>
          <div style="font:600 30px var(--display);margin-top:10px">${S.n} of ${S.goal}</div><div class="small muted">${S.reward ? `Reward: ${esc(S.reward)}` : "Choose the reward below, together."}</div>
          ${full ? `<button class="btn gold block" data-act="starredeem" style="margin-top:14px">${ic("check")} She earned it: ${esc(S.reward || "her reward")}</button>` : ""}</div>
        <div class="card"><div class="eyebrow">Give a star</div><input type="text" id="starwhy" placeholder="What for? Be specific: “went to bed on time without a reminder”" style="margin-top:10px">
          ${quick.length ? `<div class="chips" style="margin-top:8px">${quick.map(q => `<button class="chip" data-act="starwhy" data-v="${esc(q)}">${esc(q.length > 34 ? q.slice(0, 33) + "…" : q)}</button>`).join("")}</div>` : ""}
          <button class="btn gold block" data-act="stargive" style="margin-top:10px">★ Give her a star</button><p class="small muted" style="margin:8px 0 0">Tell her too, in words, the moment it happens. The star is the reminder; your praise is the reward.</p></div>
        <div class="card"><div class="eyebrow">Goal and reward</div><div class="row" style="gap:8px;margin-top:10px"><label class="small muted">Stars</label>${[5, 7, 10, 15, 20].map(g => `<button class="chip${S.goal === g ? " on" : ""}" data-act="stargoal" data-v="${g}">${g}</button>`).join("")}</div>
          <input type="text" data-f="stars.reward" value="${esc(S.reward)}" placeholder="e.g. A day out of her choosing" style="margin-top:10px">
          ${db.rewards.length ? `<div class="chips" style="margin-top:8px">${db.rewards.map(r => `<button class="chip" data-act="starrew" data-v="${esc(r.text)}">${esc(r.text)}</button>`).join("")}</div>` : `<p class="small muted" style="margin:8px 0 0">Add rewards to your <a href="#/her/rewards">reward list</a> and pick one here.</p>`}
          ${db.rewards.length ? `<button class="btn sm" data-act="starsurprise" style="margin-top:12px">🎁 Suggest a surprise reward</button><p class="small muted" style="margin:6px 0 0">Now and then, give a small unexpected reward. Surprises keep it alive longer than a fixed prize.</p>` : ""}</div>
        ${S.log.length ? `<div class="sec"><div class="eyebrow">Recent stars</div><div class="card" style="padding:6px 16px">${S.log.slice(-12).reverse().map(l => `<div class="note"><span style="color:var(--gold)">★</span> ${esc(l.why || "A star")} <span class="small muted">· ${dstr(l.at)}</span></div>`).join("")}</div><button class="linkbtn small" data-act="starundo" style="margin:8px 4px">Undo the last star (a mistake, not a punishment)</button></div>` : ""}
        ${S.earned.length ? `<div class="sec"><div class="eyebrow">Rewards earned</div>${S.earned.slice(-6).reverse().map(e => `<div class="item"><div class="grow"><div class="t">${esc(e.reward || "Reward")}</div><div class="m">${dstr(e.at)}</div></div></div>`).join("")}</div>` : ""}`; }

        ${listEditor("conseq", "Consequences", "e.g. Early bedtime, a short written reflection, phone off for the evening", "")}
        <p class="small muted" style="margin-top:8px">New consequences are marked “not yet agreed” until you tick them with her.</p>
        ${db.conseq.filter(c => c.agreed === false).map(c => `<button class="btn sm" data-act="agree" data-v="${c.id}" style="margin:6px 6px 0 0">${ic("check")} She agreed: ${esc(c.text)}</button>`).join("")}</div>`;

  /* ---------- Scenes: built only from her yes list ---------- */
  let sdraft = null, wday = new Date().getDay();
  function viewScene(id) {

    if (id === "new") history.replaceState(null, "", `#/scene/${sdraft.id}`);
    const all = ACTS.flatMap(([, it]) => it).filter(it => !it.startsWith("Breath"));
    const KIT = ["Safety shears", "Water", "Blanket", "Snack", "Her stuffie for after", "Phone off", "Lube and condoms if relevant", "First-aid basics"];
    const saved = db.scenes.some(s => s.id === sdraft.id);
    return `<div class="top">${backLink("#/her", "Her")}</div><h1 style="margin:6px 2px 6px;font-size:29px">${saved ? "Scene" : "Plan a scene"}</h1><p class="muted" style="margin:0 2px 14px">Only what she said yes to. Maybe means ask her first, before the day.</p>${guide("first-scene") ? `<a class="btn sm" href="#/g/first-scene" style="margin:0 2px 14px">${ic("list")} New to this? Your first simple scene, step by step</a>` : ""}

    else if (a === "pinforgot") { if (!confirm("The PIN cannot be recovered. To get back in, everything in this app on this phone must be erased. Erase?")) return; localStorage.removeItem(KEY); location.hash = "#/"; location.reload(); }
    else if (a === "pinoff") { if (!confirm("Remove the PIN?")) return; db.pin = null; save(); render(); }
    else if (a === "lessondone") { db.lessons[v] = Date.now(); save(); const l = C.lessons.find(x => x.id === v); toast("Noted."); location.hash = `#/learn/${l.module}`; }
    else if (a === "lim") { const x = el.dataset.x; db.limits[v] = db.limits[v] === x ? "" : x; save(); el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.x === db.limits[v])); }
    else if (a === "negotiated") { db.negotiated = Date.now(); save(); toast("Saved. Renegotiate every few months."); render(); }
    else if (a === "ac") { const i = db.aftercare.indexOf(v); i < 0 ? db.aftercare.push(v) : db.aftercare.splice(i, 1); save(); el.classList.toggle("on"); }
    else if (a === "add") { const k = el.dataset.k, t = $(`#new-${k}`).value.trim(); if (!t) return toast("Write it first"); const w = $(`#why-${k}`)?.value.trim() || ""; db[k].push({ id: uid(), text: t, why: w, ...(k === "conseq" ? { agreed: false } : {}) }); save(); render(); }
    else if (a === "del") { const k = el.dataset.k; if (!confirm("Delete this?")) return; db[k] = db[k].filter(x => x.id !== v); save(); render(); }
    else if (a === "stargive") { const S = db.stars; S.n = Math.min(S.goal, S.n + 1); S.log.push({ at: Date.now(), why: $("#starwhy").value.trim() }); save(); toast(S.n >= S.goal ? "Chart full. Time for her reward." : "★ Now tell her why, out loud."); render(); }
    else if (a === "starwhy") { $("#starwhy").value = v; }
    else if (a === "stargoal") { db.stars.goal = +v; save(); render(); }
    else if (a === "starrew") { db.stars.reward = v; save(); render(); }
    else if (a === "starsurprise") { const r = db.rewards[Math.floor(Math.random() * db.rewards.length)]; toast("Surprise idea: " + r.text, 3500); }
    else if (a === "starredeem") { const S = db.stars; S.earned.push({ at: Date.now(), reward: S.reward }); S.n = 0; save(); toast("Enjoy it together. A new chart starts now."); render(); }
    else if (a === "starundo") { const S = db.stars; if (S.log.length && confirm("Remove the last star? Only for a mistake.")) { S.log.pop(); S.n = Math.max(0, S.n - 1); save(); render(); } }
    else if (a === "agree") { const c = db.conseq.find(x => x.id === v); if (c) c.agreed = true; save(); render(); }
    else if (a === "rdone") { const k = el.dataset.k, key = el.dataset.key; if (k === "monthly") { db.monthLog ||= {}; db.monthLog[key] ||= {}; db.monthLog[key][v] = !db.monthLog[key][v]; } else { db.ritualLog[key] ||= {}; db.ritualLog[key][v] = !db.ritualLog[key][v]; } save(); render(); }
    else if (a === "calm") { calM += +v; calDay = null; render(); }
    else if (a === "calday") { calDay = calDay === v ? null : v; render(); }
    else if (a === "tplsheet") tplSheet();
    else if (a === "newnote") newNote(v);
    else if (a === "deltpl") { if (!confirm("Delete this template?")) return; db.tpls = userTpls().filter(t => t.id !== v); save(); $(".sheet-back")?.remove(); tplSheet(); }
    else if (a === "savetpl") { noteSave(); db.tpls ||= []; db.tpls.push({ id: uid(), title: nedit.title || "My template", html: nedit.html, tag: nedit.tag }); save(); toast("Saved as a template. Find it under New note."); }
    else if (a === "restore") { const n = db.notes.find(x => x.id === v); if (n) delete n.trashed; save(); toast("Restored"); render(); }
    else if (a === "emptytrash") { if (!confirm("Delete the notes in Trash for good?")) return; db.notes = db.notes.filter(n => !n.trashed); save(); render(); }
    else if (a === "cell") { const k = el.dataset.key; db.ritualLog[k] ||= {}; db.ritualLog[k][v] = !db.ritualLog[k][v]; save(); render(); }
    else if (a === "template") { const R = rh(); TEMPLATE.daily.forEach(([t, g]) => R.daily.push({ id: uid(), text: t, guide: g })); TEMPLATE.weekly.forEach(([t, d, g]) => R.weekly.push({ id: uid(), text: t, day: d, guide: g })); TEMPLATE.monthly.forEach(([t, g]) => R.monthly.push({ id: uid(), text: t, guide: g })); save(); toast("Template added. Agree the daily ones with her."); render(); }
    else if (a === "radd") { const k = el.dataset.k, inp = $(`#rh-${k}`), t = inp.value.trim(); if (!t) return toast("Write it first"); rh()[k].push({ id: uid(), text: t, ...(k === "weekly" ? { day: wday } : {}) }); save(); render(); }
    else if (a === "rwd") { wday = +v; el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === el)); }
    else if (a === "rdel") { if (!confirm("Remove this from your rhythm?")) return; const R = rh(); R[el.dataset.k] = R[el.dataset.k].filter(x => x.id !== v); save(); render(); }
    else if (a === "ritual") { const k = dayKey(); db.ritualLog[k] ||= {}; db.ritualLog[k][v] = !db.ritualLog[k][v]; save(); render(); }
    else if (a === "savecheckin") { const t = $("#cin").value.trim(); if (!t) return toast("Write what she said"); db.checkins.push({ at: Date.now(), text: t }); save(); toast("Saved"); render(); }
    else if (a === "sact") { const i = sdraft.acts.indexOf(v); i < 0 ? sdraft.acts.push(v) : sdraft.acts.splice(i, 1); render(); }
    else if (a === "skit") { const i = sdraft.kit.indexOf(v); i < 0 ? sdraft.kit.push(v) : sdraft.kit.splice(i, 1); render(); }
    else if (a === "savescene") { const i = db.scenes.findIndex(s => s.id === sdraft.id); i < 0 ? db.scenes.push({ ...sdraft }) : (db.scenes[i] = { ...db.scenes[i], ...sdraft }); save(); toast("Plan saved"); render(); }
    else if (a === "scenedone") { const s = db.scenes.find(x => x.id === v); s.at = Date.now(); s.followed = false; save(); sdraft = null; toast("Aftercare window open. Today will remind you."); location.hash = "#/"; }
    else if (a === "delscene") { if (!confirm("Delete this plan?")) return; db.scenes = db.scenes.filter(x => x.id !== v); sdraft = null; save(); location.hash = "#/her"; }
    else if (a === "followed") { const s = db.scenes.find(x => x.id === v); if (s) s.followed = true; save(); toast("Good. That is the job."); render(); }
    else if (a === "savedeb") { const s = db.scenes.find(x => x.id === v); db.debriefs.push({ id: uid(), at: Date.now(), title: s?.title || "", good: $("#dgood").value.trim(), change: $("#dchange").value.trim(), hers: $("#dhers").value.trim(), me: $("#dme").value.trim() }); if (s) s.followed = true; save(); location.hash = "#/journal"; }
    else if (a === "deldeb") { if (!confirm("Delete this entry?")) return; db.debriefs = db.debriefs.filter(x => x.id !== v); save(); render(); }
    else if (a === "tog") { el.classList.toggle("on"); el.querySelector(".box").innerHTML = el.classList.contains("on") ? ic("check") : ""; }
    else if (a === "backupfile") { db.lastBackup = Date.now(); save(); download(`anchor-backup-${dayKey()}.json`, JSON.stringify(db, null, 1), "application/json"); toast("Backup downloaded. Keep it somewhere private."); render(); }
    else if (a === "mdexport") { const N = (db.notes || []).filter(n => !n.trashed).sort((x, y) => y.at - x.at); if (!N.length) return toast("No notes yet"); download(`anchor-notes-${dayKey()}.md`, N.map(n => `# ${n.title || "Untitled"}

${n.tag ? `Tag: ${n.tag} · ` : ""}${dstr(n.at)}

${toMd(n.html)}`).join("\n\n---\n\n"), "text/markdown"); toast("Notes exported"); }
    else if (a === "export") { const t = JSON.stringify(db); navigator.clipboard?.writeText(t).then(() => toast("Backup copied. Keep it private."), () => prompt("Copy:", t)); }
    else if (a === "wipe") { if (!confirm("Erase everything in Anchor on this phone?")) return; localStorage.removeItem(KEY); location.hash = "#/"; location.reload(); }
    else if (a === "installsheet") showInstall();
    else if (a === "closesheet") $(".sheet-back")?.remove();
    else if (a === "install" && deferredInstall) { const ev = deferredInstall; deferredInstall = null; ev.prompt(); ev.userChoice.finally(() => $(".sheet-back")?.remove()); }
  });
  /* Editor events (as in Almanac) */
  let savedRange = null;
  document.addEventListener("pointerdown", e => { if (!e.target.closest(".toolbar [data-cmd]")) return; e.preventDefault(); const x = getSelection(), ed = $("#ned"); savedRange = ed && x.rangeCount && ed.contains(x.anchorNode) ? x.getRangeAt(0).cloneRange() : null; });
  document.addEventListener("click", e => {
    const b = e.target.closest(".toolbar [data-cmd]"), ed = $("#ned"); if (!ed) return;
    if (b) { if (savedRange && !ed.contains(getSelection().anchorNode)) { ed.focus(); const x = getSelection(); x.removeAllRanges(); x.addRange(savedRange); } else if (!ed.contains(getSelection().anchorNode)) { ed.focus(); placeCaretIn(ed); }
      runCmd(ed, b.dataset.cmd); normalizeEd(ed); updateToolbar(ed); saveSoon(); return; }
    const li = e.target.closest("#ned ul.checklist > li");
    if (li && e.clientX - li.getBoundingClientRect().left < 30) { e.preventDefault(); const on = li.classList.toggle("checked"); if (on) li.querySelectorAll("ul.checklist > li").forEach(c => c.classList.add("checked")); noteSave(); }
  });
  document.addEventListener("selectionchange", () => { const ed = $("#ned"); if (ed && ed.contains(getSelection().anchorNode)) updateToolbar(ed); });
  document.addEventListener("keydown", e => {
    const ed = $("#ned"); if (!ed || e.target !== ed) return;
    if (e.key === "Tab") { const li = closestIn(ed, "li"); if (li) { e.preventDefault(); (e.shiftKey ? outdentItem(li, ed) : indentItem(li)) && saveSoon(); } }
    if (e.key === "Enter" && !e.shiftKey) {
      const li = closestIn(ed, "li");
      if (li && !li.textContent.trim() && !subListOf(li) && isNested(li, ed)) { e.preventDefault(); outdentItem(li, ed); saveSoon(); return; }
      setTimeout(() => { const nli = closestIn(ed, "ul.checklist > li"); if (nli && !nli.textContent.trim()) nli.classList.remove("checked"); });
      const bq = closestIn(ed, "blockquote, h1, h2, h3"); if (bq && !bq.textContent.trim()) { e.preventDefault(); retag(bq, "p"); placeCaretIn(topBlock(ed, caretNode()) || ed); }
    }
    if (e.key === "Backspace") { const x = getSelection(), nli = closestIn(ed, "li");
      if (nli && x.isCollapsed && isNested(nli, ed)) { const r = x.getRangeAt(0).cloneRange(); r.setStart(nli, 0); if (!r.toString().length) { e.preventDefault(); outdentItem(nli, ed); saveSoon(); return; } }
      const blk = topBlock(ed, caretNode()); if (blk && /^(H1|H2|H3|BLOCKQUOTE|PRE)$/.test(blk.tagName) && x.isCollapsed) { const r = x.getRangeAt(0).cloneRange(); r.setStart(blk, 0); if (!r.toString().length) { e.preventDefault(); placeCaretIn(retag(blk, "p"), false); saveSoon(); } } }
  });
  document.addEventListener("change", e => {
    if (!e.target.matches("[data-import]")) return; const f = e.target.files[0]; if (!f) return;
    f.text().then(t => { const d = JSON.parse(t); if (!d || typeof d !== "object" || !("lessons" in d || "limits" in d)) throw 0;
      if (!confirm("Restore this backup? Notes, debriefs, scenes and check-ins are merged; settings and lists are replaced by the backup’s.")) return;
      const merge = (k, key = "id") => { const have = new Set((db[k] || []).map(x => x[key])); db[k] = [...(db[k] || []), ...(d[k] || []).filter(x => !have.has(x[key]))]; };
      merge("notes"); merge("debriefs"); merge("scenes"); merge("checkins", "at"); merge("tpls");
      ["limits", "limitNote", "negotiated", "safe", "aftercare", "aftercareNote", "mine", "little", "rules", "rewards", "stars", "conseq", "rhythm", "ritualLog", "monthLog", "lessons", "guides", "lockMin"].forEach(k => { if (k in d) db[k] = d[k]; });
      save(); toast("Backup restored"); render(); }).catch(() => toast("That file isn’t an Anchor backup"));
    e.target.value = "";
  });
  document.addEventListener("paste", e => { const ed = $("#ned"); if (!ed || !ed.contains(e.target)) return; const h = e.clipboardData.getData("text/html"), t = e.clipboardData.getData("text/plain"); e.preventDefault(); if (h) document.execCommand("insertHTML", false, sanitize(h)); else document.execCommand("insertText", false, t); });
  document.addEventListener("input", e => {
    const el = e.target;
    if (el.id === "ned") { if (e.inputType === "insertText" && e.data === " ") tryShortcut(el); saveSoon(); return; }
    if (el.id === "ntitle") { saveSoon(); return; }
    if (el.id === "gsq") { gq = el.value; $("#gsr").innerHTML = resultsHTML(gq); return; }
    if (el.id === "nq") { nq = el.value; const L = $("#nlist"); const h = viewJournal(); const d = document.createElement("div"); d.innerHTML = h; L.innerHTML = d.querySelector("#nlist").innerHTML; return; }
    if (el.id === "gq") { const q = el.value.toLowerCase(); document.querySelectorAll(".gw").forEach(n => n.hidden = !n.textContent.toLowerCase().includes(q)); return; }
    if (el.dataset.f) { const [k1, k2] = el.dataset.f.split("."); if (k2) (db[k1] ||= {})[k2] = el.value; else db[k1] = el.value; save(); }
    if (el.dataset.safe) { db.safe[el.dataset.safe] = el.value; save(); }
    if (el.dataset.little) { db.little[el.dataset.little] = el.value; save(); }
    if (el.dataset.s && sdraft) sdraft[el.dataset.s] = el.value;
  });

  fetch("data/content.json").then(r => r.json()).then(d => { C = d; render(); })
    .catch(() => { $("#main").innerHTML = `<div class="loading">Could not load. Check your connection and reload.</div>`; });
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
