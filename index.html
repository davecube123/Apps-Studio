<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apps Studio</title>
  <meta name="theme-color" content="#16151a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Apps Studio">
  <style>
    :root { --bg: #fdf8f0; --fg: #222; --card: #fff; --accent: #ff5e5b; --muted: #777; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16151a; --fg: #eee; --card: #222128; --accent: #ff7b78; --muted: #999; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--fg);
           font-family: system-ui, sans-serif; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 2.5rem; margin: 0 0 .25rem; }
    p.tag { color: var(--muted); margin: 0 0 2rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    a.card { display: block; padding: 1.25rem; border-radius: 14px; background: var(--card);
             color: inherit; text-decoration: none; border: 2px solid transparent;
             transition: transform .15s, border-color .15s; }
    a.card:hover { transform: rotate(-1deg) scale(1.02); border-color: var(--accent); }
    .emoji { font-size: 2rem; }
    .card h2 { font-size: 1.1rem; margin: .5rem 0 .25rem; }
    .card p { margin: 0; color: var(--muted); font-size: .9rem; }
    .card { position: relative; }
    .card .off { position: absolute; top: 12px; right: 14px; font-size: .75rem; color: #3fb37f; font-weight: 600; }
    .offline { background: var(--card); border-radius: 14px; padding: 1rem 1.25rem; margin: 0 0 1.5rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .offline .t { flex: 1; min-width: 220px; color: var(--muted); font-size: .95rem; }
    .offline .t b { color: var(--fg); }
    .offline button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: .7rem 1rem; background: var(--accent); color: #fff; cursor: pointer; }
    .offline button:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>🧪 Apps Studio</h1>
    <p class="tag">Random, quirky, and probably unnecessary apps.</p>
    <div class="offline" id="offline" hidden><div class="t" id="offt"></div><button id="offb">Save all apps for offline</button></div>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    // Add new apps here.
    const APPS = [
      { name: "Excuse Generator", path: "apps/excuse-generator/", emoji: "🙈",
        blurb: "A fresh, highly specific excuse for whatever you didn't do." },
      { name: "Tao Reader", path: "apps/tao-reader/", emoji: "☯️",
        blurb: "The Tao Te Ching in an old-paper style: Chinese original, Wilhelm, and your own copies of Le Guin, Feng & English, Heider and more." },
      { name: "Little Pages", path: "apps/little-pages/", emoji: "📖",
        blurb: "A reader for your own books that helps you build a daily reading habit." },
      { name: "My I Ching", path: "apps/i-ching-book/", emoji: "䷀",
        blurb: "Master the 64 hexagrams by writing your own Book of Changes, one reading at a time." },
      { name: "Daily Way", path: "apps/daily-way/", emoji: "◯",
        blurb: "Twenty minutes a day with the Tao Te Ching, I Ching, Golden Flower and Chuang Tzu, built on proven learning methods." },
      { name: "Commonplace", path: "apps/commonplace/", emoji: "❝",
        blurb: "Read your own books, quote passages with tags and notes, and jump back to any quote's exact page." },
      { name: "Book of Changes", path: "apps/book-of-changes/", emoji: "䷾",
        blurb: "The I Ching in plain modern language: cast with yarrow stalks, or study any of the 64 hexagrams." },
      { name: "Noticing", path: "apps/noticing/", emoji: "👁️",
        blurb: "Two minutes a day to see more: a daily mission, look-and-recall drills, and a journal that checks your deductions." },
      { name: "Ashes and Gold", path: "apps/ashes-and-gold/", emoji: "🗝️",
        blurb: "A wordless story game about a man's journey from boyhood to elderhood, told through small interactions." },
      { name: "Living Window", path: "apps/living-window/", emoji: "🪟",
        blurb: "A quiet window that follows your real day and weather, with a soft generated soundscape." },
      { name: "Song of Songs", path: "apps/song-of-songs/", emoji: "🌺",
        blurb: "The Song of Songs in a fresh modern translation, with a full commentary: the Hebrew, how it has been read, and what it asks of you." },
      { name: "Woodshed", path: "apps/woodshed/", emoji: "🎸",
        blurb: "A practice recorder for guitar and voice: takes per song, level meter, count-in, lyrics and chords, tuner, and slow listening." },
      { name: "Kasama", path: "apps/kasama/", emoji: "🤝",
        blurb: "For the girlfriend of a friend with psychosis: being close, how to talk, getting help in El Nido and Palawan, and caring for herself." },
      { name: "Kalinga", path: "apps/kalinga/", emoji: "🏡",
        blurb: "For the family caring at home for a friend with psychosis: what is really happening, what to say instead of scolding, and help in El Nido and Palawan." },
      { name: "Sixty-Four Tales", path: "apps/sixty-four-tales/", emoji: "🔥",
        blurb: "A tale from somewhere in the world for each of the 64 hexagrams of the I Ching, retold to be told aloud, with notes on telling it and practice to learn them by heart." },
      { name: "Allez", path: "apps/allez/", emoji: "🥐",
        blurb: "Speak and understand French fast: an adaptive level diagnosis, then 25 minutes a day of listening, shadowing, role plays by voice and one-minute talks." },
      { name: "Ember", path: "apps/ember/", emoji: "🔥",
        blurb: "Track your cigarettes in one tap and smoke a little less each week, gently, until you stop: a craving timer, your triggers, a budget that steps down, and money saved." },
      { name: "Roam", path: "apps/roam/", emoji: "🧭",
        blurb: "A minimal travel companion starting with Thailand: an interactive photo map, 17 hand-picked places with tips, and your trip route." },
      { name: "Sunzi", path: "apps/sunzi/", emoji: "⚔️",
        blurb: "The Art of War in an original poetic rendering, with tales that bring each principle to life and reflections for skilful living." },
      { name: "Stride", path: "apps/stride/", emoji: "🏃",
        blurb: "A GPS running tracker with a workout designer (warm up, intervals, cool down) and an Android app that works with the screen locked: live speed and pace, distance, splits every kilometre, voice cues, auto-pause, your route on a map coloured by speed, and run history with GPX export." },
      { name: "Attune", path: "apps/attune/", emoji: "🫶",
        blurb: "Thirty principles of genuine empathy (attention, listening, other eyes, kindness in action, the close ones, the deep practice), each taught through two true tales, with a note page for every principle." },
      { name: "Plenty", path: "apps/plenty/", emoji: "🌱",
        blurb: "Thirty principles of wealth and abundance (mind, earning, keeping, growing, giving, true wealth), each taught through two tales, with a note page for every principle." },
      { name: "Keel", path: "apps/keel/", emoji: "⛵",
        blurb: "Thirty principles of self-reliance (mind, hands, money, heart, people, spirit) for a life of equanimity and fullness, each taught through two tales, with a note page for every principle." },
      { name: "Lifeline", path: "apps/lifeline/", emoji: "⛑️",
        blurb: "First aid you can rely on: big step-by-step emergency cards with a call button, a CPR beat, timers, 51 lessons, practice scenarios and a kit checklist. Works offline." },
      { name: "Merchant", path: "apps/merchant/", emoji: "⚖️",
        blurb: "Thirty deep principles of selling, each taught through two tales from history, with a note page for every principle." },
      { name: "Astra", path: "apps/astra/", emoji: "✨",
        blurb: "Your real birth chart and today's sky, read for power, abundance, love and sex: daily readings, best hours and days, your blueprint, the sky ahead and love matches." },
    ];

    const grid = document.getElementById("grid");
    for (const app of APPS) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = app.path;
      a.innerHTML = `<span class="off" hidden>✓ Offline</span><div class="emoji"></div><h2></h2><p></p>`;
      a.querySelector(".emoji").textContent = app.emoji;
      a.querySelector("h2").textContent = app.name;
      a.querySelector("p").textContent = app.blurb;
      grid.appendChild(a);
    }

    // Offline: the hub keeps itself cached, and can install every app's own service worker in one go,
    // so each app opens without a connection even if it was never opened here before.
    if ("serviceWorker" in navigator) {
      const box = document.getElementById("offline"), txt = document.getElementById("offt"), btn = document.getElementById("offb");
      const scopeOf = p => new URL(p, location.href).href;
      async function savedCount() {
        let n = 0;
        for (const app of APPS) {
          const reg = await navigator.serviceWorker.getRegistration(app.path).catch(() => null);
          const ok = !!(reg && reg.scope === scopeOf(app.path) && (reg.active || reg.waiting || reg.installing));
          const card = [...grid.children].find(c => c.getAttribute("href") === app.path);
          if (card) card.querySelector(".off").hidden = !ok;
          if (ok) n++;
        }
        return n;
      }
      async function show() {
        const n = await savedCount(); box.hidden = false;
        if (n === APPS.length) { txt.innerHTML = `<b>All ${n} apps are saved for offline.</b> They open without a connection and update themselves when you're online.`; btn.textContent = "Check for updates"; }
        else { txt.innerHTML = `<b>${n} of ${APPS.length} apps are saved for offline.</b> Save them all (about 15 MB) so every app opens without a connection.`; btn.textContent = "Save all apps for offline"; }
        btn.disabled = !navigator.onLine;
        if (!navigator.onLine) txt.innerHTML += " Connect to the internet to save or update.";
      }
      const ready = reg => new Promise(res => {
        const w = reg.installing || reg.waiting; if (!w) return res();
        const t = setTimeout(res, 30000);
        w.addEventListener("statechange", () => { if (w.state === "activated" || w.state === "redundant") { clearTimeout(t); res(); } });
      });
      async function saveAll(quiet) {
        btn.disabled = true; let i = 0, failed = 0;
        for (const app of APPS) {
          i++; if (!quiet) txt.innerHTML = `<b>Saving ${i} of ${APPS.length}:</b> ${app.name}…`;
          try { const reg = await navigator.serviceWorker.register(app.path + "sw.js", { scope: app.path }); await reg.update().catch(() => {}); await ready(reg); }
          catch { failed++; }
        }
        try { localStorage.setItem("hub-offline", "1"); } catch {}
        await show();
        if (failed && !quiet) txt.innerHTML += ` (${failed} couldn't be saved; try again later.)`;
      }
      btn.addEventListener("click", () => saveAll(false));
      addEventListener("online", show); addEventListener("offline", show);
      navigator.serviceWorker.register("sw.js").catch(() => {});
      show().then(() => {
        // Once saved, keep every app fresh in the background on each visit.
        let on = false; try { on = localStorage.getItem("hub-offline") === "1"; } catch {}
        if (on && navigator.onLine) setTimeout(() => saveAll(true), 3000);
      });
    }
  </script>
</body>
</html>
